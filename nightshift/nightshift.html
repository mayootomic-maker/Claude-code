          if (s.typed.length < 5) {
            s.typed += digit;
            NS.audio.play('taskStep');
            g.setProgress(s.typed.length / 5);
            if (s.typed.length === 5) {
              if (s.typed === s.code) g.finish(); else { g.fail(); s.typed = ''; g.setProgress(0); }
            }
          }
          return;
        }
      },
      draw(g, ctx) {
        const s = g.state;
        plate(ctx, 12, 12, g.W - 24, g.H - 24, '#151d2c');
        mono(ctx, s.code, g.W / 2, 52, 30, VITAL, 'center');
        ctx.fillStyle = '#0a0f1a';
        rr(ctx, 32, 108, 76, 178, 8); ctx.fill();
        mono(ctx, s.typed.padEnd(5, '-'), 70, 196, 18, FLARE, 'center');
        const faces = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'CLR', '0', 'OK'];
        for (let i = 0; i < 12; i++) {
          const bx = 128 + (i % 3) * 74, by = 108 + Math.floor(i / 3) * 46;
          ctx.fillStyle = i === 11 ? 'rgba(52,224,184,0.2)' : (i === 9 ? 'rgba(255,63,91,0.18)' : STEEL);
          rr(ctx, bx, by, 66, 40, 6); ctx.fill();
          mono(ctx, faces[i], bx + 33, by + 21, i > 8 && i !== 10 ? 13 : 18,
               i === 11 ? VITAL : (i === 9 ? BLOOD : INK), 'center');
        }
      },
    },

    tuneFix: {
      title: 'Restore Comms', hint: 'Tune both dials until the signal is clean.',
      w: 460, h: 300,
      init(g) {
        g.state = { a: Math.random(), b: Math.random(), ta: 0.25 + Math.random() * 0.5, tb: 0.25 + Math.random() * 0.5, grab: null, held: 0 };
      },
      down(g, x, y) {
        if (hit(x, y, 40, 168, g.W - 80, 40)) g.state.grab = 'a';
        else if (hit(x, y, 40, 222, g.W - 80, 40)) g.state.grab = 'b';
      },
      move(g, x) {
        const s = g.state;
        if (!s.grab || !g.pointer.down) return;
        s[s.grab] = U.clamp((x - 50) / (g.W - 100), 0, 1);
      },
      up(g) { g.state.grab = null; },
      update(g, dt) {
        const s = g.state;
        const ok = Math.abs(s.a - s.ta) < 0.04 && Math.abs(s.b - s.tb) < 0.04;
        s.held = ok ? s.held + dt : Math.max(0, s.held - dt * 2);
        g.setProgress(s.held / 1.2);
        if (s.held >= 1.2) g.finish();
      },
      draw(g, ctx) {
        const s = g.state;
        plate(ctx, 12, 12, g.W - 24, g.H - 24, '#151d2c');
        const err = Math.abs(s.a - s.ta) + Math.abs(s.b - s.tb);
        ctx.strokeStyle = err < 0.09 ? VITAL : '#4a5570';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let x = 44; x < g.W - 44; x += 3) {
          const noise = err * 34 * (Math.random() - 0.5);
          const y = 106 + Math.sin(x * 0.09 + g.t * 4) * (26 - err * 12) + noise;
          if (x === 44) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        [['a', 168], ['b', 222]].forEach(([key, y]) => {
          ctx.fillStyle = '#101827';
          rr(ctx, 40, y, g.W - 80, 40, 20); ctx.fill();
          const target = key === 'a' ? s.ta : s.tb;
          ctx.fillStyle = 'rgba(52,224,184,0.35)';
          ctx.fillRect(50 + target * (g.W - 100) - 8, y + 4, 16, 32);
          ctx.fillStyle = FLARE;
          ctx.beginPath(); ctx.arc(50 + s[key] * (g.W - 100), y + 20, 16, 0, Math.PI * 2); ctx.fill();
        });
      },
    },

    padFix: {
      title: 'Reactor Hand Scanner', hint: 'Hold. Somebody has to hold the other one.',
      w: 460, h: 300,
      init(g) { g.state = { on: false }; },
      down(g, x, y) {
        if (hit(x, y, g.W / 2 - 90, 66, 180, 178)) {
          g.state.on = true;
          if (g.spec.onHold) g.spec.onHold(true);
        }
      },
      up(g) {
        if (g.state.on && g.spec.onHold) g.spec.onHold(false);
        g.state.on = false;
      },
      update(g) {
        const active = NS.world.state.sabotage;
        if (!active || active.kind !== 'reactor') { g.finish(); }
      },
      draw(g, ctx) {
        const s = g.state;
        plate(ctx, 12, 12, g.W - 24, g.H - 24, '#170f14');
        const active = NS.world.state.sabotage;
        const holds = (active && active.holds) || [];
        const other = holds.length > (s.on ? 1 : 0);
        ctx.fillStyle = s.on ? 'rgba(255,176,58,0.22)' : 'rgba(255,255,255,0.04)';
        rr(ctx, g.W / 2 - 90, 66, 180, 178, 16); ctx.fill();
        ctx.strokeStyle = s.on ? FLARE : '#4a5570';
        ctx.lineWidth = 3;
        rr(ctx, g.W / 2 - 90, 66, 180, 178, 16); ctx.stroke();
        /* A hand. Four fingers, a thumb, a palm. */
        const cx = g.W / 2, cy = 168;
        ctx.fillStyle = s.on ? FLARE : '#5a6580';
        rr(ctx, cx - 42, cy - 6, 84, 66, 22); ctx.fill();
        for (let i = 0; i < 4; i++) { rr(ctx, cx - 38 + i * 21, cy - 62, 16, 62, 8); ctx.fill(); }
        rr(ctx, cx + 34, cy - 12, 16, 44, 8); ctx.fill();
        label(ctx, s.on ? 'HOLDING' : 'PLACE YOUR HAND', g.W / 2, 268, 13, s.on ? FLARE : DIM, 'center');
        label(ctx, other ? 'OTHER PAD IS HELD' : 'WAITING FOR THE OTHER PAD',
              g.W / 2, 42, 12, other ? VITAL : BLOOD, 'center');
      },
    },
  };

  /* Kinds that reuse the lever, differing in how long they take and what the
     panel says -- fuelling an engine and dropping a bin are the same gesture
     and it would be dishonest to pretend otherwise with a fake new mechanic. */
  const HOLDS = {
    fuel: { title: 'Fuel Engines', hint: 'Hold until the tank is full.', seconds: 5, tint: '#e8563f' },
    garbage: { title: 'Empty Garbage', hint: 'Hold the lever down.', seconds: 4, tint: '#8d97ad' },
    chute: { title: 'Empty Chute', hint: 'Hold until the chute is clear.', seconds: 5.5, tint: '#8d97ad' },
    scan: { title: 'Submit Scan', hint: 'Stand still on the pad.', seconds: 8, tint: VITAL },
  };

  function specFor(kind, station, step) {
    if (HOLDS[kind]) return Object.assign({}, GAMES.hold, HOLDS[kind]);
    const base = GAMES[kind];
    if (!base) return null;
    const spec = Object.assign({}, base);
    if (station && station.arg) spec.arg = station.arg;
    if (station && station.steps) {
      spec.step = 'Step ' + (step + 1) + ' of ' + station.steps.length
        + ' - ' + station.steps[step].verb;
    }
    return spec;
  }

  function start(kind, opts) {
    const o = opts || {};
    const spec = specFor(kind, o.station, o.step || 0);
    if (!spec) return null;
    if (o.title) spec.title = o.title;
    if (o.onHold) spec.onHold = o.onHold;
    return panel(spec, o);
  }

  NS.minigames = {
    start, close, GAMES,
    get open() { return open; },
    isOpen: () => !!open,
  };
})(window.NS);

</script>
<script>
/* The meeting.

   Everything else in the game is a warm-up for this screen. It is also the
   part most likely to be played on a phone in a classroom with the sound off,
   so it is built around typing rather than talking: the chat is not a side
   panel you can miss, it is half the screen, and quick phrases are one tap
   because "where" and "with who" are ninety per cent of what anybody says.

   Two rules the layout exists to enforce. You cannot see who voted for whom
   until the vote closes -- only that somebody has voted -- because watching
   the tally build turns a vote into a stampede. And the dead can read
   everything and say nothing to the living, which is what stops a death from
   being the end of somebody's involvement. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const el = U.el;
  const W = NS.world;

  let root = null;
  let grid = null;
  let log = null;
  let timerNode = null;
  let stageNode = null;
  let headline = null;
  let composer = null;
  let myVote = null;
  let rows = new Map();
  let lastStage = '';
  let unread = 0;
  const history = [];

  let send = function () {};

  function init(opts) { send = opts.send; }

  /* ---- chat -------------------------------------------------------------- */

  const QUICK = [
    'Where?', 'With who?', 'I was doing tasks', 'Nothing to report',
    'Saw them vent', 'Body in ', 'It is not me', 'Skip',
  ];

  function addMessage(msg) {
    history.push(msg);
    if (history.length > 120) history.shift();
    if (log) appendRow(msg);
  }

  function appendRow(msg) {
    const dead = msg.ghost;
    const row = el('div', { class: 'chat-row' + (dead ? ' is-ghost' : '') });
    const who = el('span', { class: 'chat-who', text: msg.name });
    who.style.color = dead ? '#9d8cff' : (C.COLORS[msg.colorIdx] || C.COLORS[0]).rim;
    row.appendChild(who);
    row.appendChild(el('span', { class: 'chat-text', text: msg.text }));
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  function systemMessage(text) {
    if (!log) return;
    log.appendChild(el('div', { class: 'chat-row is-system', text }));
    log.scrollTop = log.scrollHeight;
  }

  /* ---- building ---------------------------------------------------------- */

  function build() {
    root = el('div', { class: 'meeting', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Meeting' });

    headline = el('h2', { class: 'meeting-head', text: '' });
    stageNode = el('p', { class: 'meeting-stage', text: '' });
    timerNode = el('div', { class: 'meeting-timer', 'aria-live': 'off' }, [
      el('span', { class: 'meeting-timer-value', text: '0' }),
    ]);

    grid = el('div', { class: 'vote-grid' });
    log = el('div', { class: 'chat-log', 'aria-live': 'polite', 'aria-label': 'Meeting chat' });

    const input = el('input', {
      class: 'chat-input', type: 'text', maxlength: String(C.CHAT_MAX),
      placeholder: 'Say something', autocomplete: 'off',
      'aria-label': 'Message',
    });
    const form = el('form', {
      class: 'chat-form',
      onsubmit: (e) => {
        e.preventDefault();
        const text = U.cleanName(input.value, C.CHAT_MAX);
        if (!text) return;
        send('chat', { t: 'msg', text });
        input.value = '';
      },
    }, [input, el('button', { class: 'btn btn--primary chat-send', type: 'submit', text: 'Send' })]);

    const quick = el('div', { class: 'chat-quick' });
    for (const phrase of QUICK) {
      quick.appendChild(el('button', {
        class: 'chip', type: 'button', text: phrase,
        onclick: () => {
          if (phrase === 'Body in ' || phrase === 'Where?') { input.value = phrase; input.focus(); return; }
          send('chat', { t: 'msg', text: phrase });
        },
      }));
    }

    composer = el('div', { class: 'chat-compose' }, [quick, form]);

    const tabs = el('div', { class: 'meeting-tabs' }, [
      el('button', { class: 'tab is-on', type: 'button', text: 'Crew', onclick: () => setTab('crew') }),
      el('button', { class: 'tab', type: 'button', text: 'Chat', onclick: () => setTab('chat') }),
    ]);

    const left = el('section', { class: 'meeting-left' }, [grid]);
    const right = el('section', { class: 'meeting-right' }, [log, composer]);

    root.appendChild(el('header', { class: 'meeting-bar' }, [
      el('div', {}, [headline, stageNode]),
      timerNode,
    ]));
    root.appendChild(tabs);
    root.appendChild(el('div', { class: 'meeting-body' }, [left, right]));
    document.body.appendChild(root);
    root.dataset.tab = 'crew';
    return root;
  }

  function setTab(which) {
    if (!root) return;
    root.dataset.tab = which;
    U.$$('.meeting-tabs .tab', root).forEach((t, i) => {
      t.classList.toggle('is-on', (i === 0) === (which === 'crew'));
    });
    if (which === 'chat') {
      unread = 0;
      U.$$('.meeting-tabs .tab')[1].textContent = 'Chat';
      log.scrollTop = log.scrollHeight;
    }
  }

  /* ---- the roster -------------------------------------------------------- */

  function rebuildGrid(state) {
    grid.textContent = '';
    rows.clear();
    const players = Array.from(W.players.values())
      .filter((p) => p.connected)
      .sort((a, b) => (a.alive === b.alive ? a.name.localeCompare(b.name) : (a.alive ? -1 : 1)));

    for (const p of players) {
      const row = el('div', { class: 'vote-row' + (p.alive ? '' : ' is-dead') });
      row.appendChild(NS.bits.avatar(p.shiftIdx >= 0 ? p.shiftIdx : p.colorIdx, p.hatIdx, 52,
        { ghost: !p.alive }));
      const name = el('div', { class: 'vote-name' }, [
        el('strong', { text: p.name }),
        el('span', { class: 'vote-sub', text: p.isMe ? 'You' : (p.alive ? '' : 'Dead') }),
      ]);
      row.appendChild(name);
      const tokens = el('div', { class: 'vote-tokens' });
      row.appendChild(tokens);
      const button = el('button', {
        class: 'vote-btn', type: 'button', 'aria-label': 'Vote for ' + p.name,
        disabled: true, onclick: () => castVote(p.id),
      }, [NS.bits.icon('close', 18)]);
      row.appendChild(button);
      grid.appendChild(row);
      rows.set(p.id, { row, tokens, button, player: p });
    }

    const skipRow = el('div', { class: 'vote-row vote-row--skip' });
    skipRow.appendChild(el('div', { class: 'skip-mark', text: 'S' }));
    skipRow.appendChild(el('div', { class: 'vote-name' }, [
      el('strong', { text: 'Skip vote' }),
      el('span', { class: 'vote-sub', text: 'Nobody is ejected' }),
    ]));
    const skipTokens = el('div', { class: 'vote-tokens' });
    skipRow.appendChild(skipTokens);
    const skipButton = el('button', {
      class: 'vote-btn', type: 'button', 'aria-label': 'Skip the vote',
      disabled: true, onclick: () => castVote('skip'),
    }, [NS.bits.icon('close', 18)]);
    skipRow.appendChild(skipButton);
    grid.appendChild(skipRow);
    rows.set('skip', { row: skipRow, tokens: skipTokens, button: skipButton });
  }

  /* A vote is sealed to the host so nobody watching the wire can read the
     room before the room can. */
  function castVote(target) {
    if (myVote) return;
    const state = W.state;
    if (!state.meeting || state.meeting.stage !== 'vote') return;
    if (!W.me || !W.me.alive || W.me.ghost) return;
    myVote = target;
    NS.audio.play('vote');
    for (const [id, row] of rows) {
      row.button.disabled = true;
      row.row.classList.toggle('is-mine', id === target);
    }
    NS.secrets.sealTo(W.hostKey, { target }).then((sealed) => {
      if (sealed) send('act', { t: 'vote', s: sealed });
      else send('act', { t: 'vote', target });
    });
  }

  /* ---- per-frame --------------------------------------------------------- */

  function update() {
    const state = W.state;
    const meeting = state.meeting;
    if (!root || !meeting) return;

    if (meeting.stage !== lastStage) {
      lastStage = meeting.stage;
      stageNode.textContent = meeting.stage === 'discuss'
        ? 'Discussion. Voting opens when the clock runs out.'
        : 'Vote now. You cannot change it.';
      root.dataset.stage = meeting.stage;
      if (meeting.stage === 'vote') NS.audio.play('alarm');
    }

    timerNode.firstChild.textContent = U.clock(meeting.time);
    timerNode.classList.toggle('is-urgent', meeting.time <= 10);

    const voted = meeting.voted || [];
    for (const [id, row] of rows) {
      if (id === 'skip') continue;
      row.row.classList.toggle('has-voted', voted.indexOf(id) >= 0);
    }

    /* A vote button that can be pressed and does nothing is worse than one
       that is plainly off, so they stay disabled until voting actually opens
       and after you have used yours. */
    const meAlive = !!(W.me && W.me.alive && !W.me.ghost);
    const open = meeting.stage === 'vote' && meAlive && !myVote;
    for (const [id, row] of rows) {
      const target = row.player;
      row.button.disabled = !open || (target && !target.alive);
    }

    const counter = U.$('.meeting-waiting', root);
    if (counter) {
      if (meeting.stage !== 'vote') {
        counter.textContent = meAlive
          ? 'Say where you were. Voting opens in ' + U.clock(meeting.time) + '.'
          : 'You are dead. You can read this, but they cannot hear you.';
      } else {
        const waiting = W.alivePlayers().filter((p) => voted.indexOf(p.id) < 0).length;
        counter.textContent = myVote
          ? 'Vote cast. ' + waiting + ' still to vote.'
          : waiting + ' still to vote.';
      }
    }
  }

  function show(state) {
    if (!root) build();
    root.hidden = false;
    document.body.classList.add('in-meeting');
    myVote = null;
    lastStage = '';
    unread = 0;
    rebuildGrid(state);

    const meeting = state.meeting;
    const by = W.players.get(meeting.by);
    if (meeting.reason === 'body') {
      const dead = meeting.bodyId ? W.players.get(meeting.bodyId) : null;
      headline.textContent = 'Dead body reported';
      systemMessage((by ? by.name : 'Someone') + ' found ' + (dead ? dead.name : 'a body') + '.');
    } else {
      headline.textContent = 'Emergency meeting';
      systemMessage((by ? by.name : 'Someone') + ' called it.');
    }
    if (!U.$('.meeting-waiting', root)) {
      root.querySelector('.meeting-left').appendChild(el('p', { class: 'meeting-waiting', text: '' }));
    }
    root.dataset.stage = state.meeting.stage;
    /* Ghosts can read but not write to the living. Disabling the box rather
       than hiding it is deliberate: you can see the conversation you are
       locked out of, which is most of what being dead is. */
    const dead = W.me && (!W.me.alive || W.me.ghost);
    composer.classList.toggle('is-locked', dead);
    const input = U.$('.chat-input', root);
    if (input) {
      input.disabled = dead;
      input.placeholder = dead ? 'The living cannot hear you' : 'Say something';
    }
    U.$$('.chat-quick .chip', root).forEach((c) => { c.disabled = dead; });
    update();
  }

  function hide() {
    if (!root) return;
    root.hidden = true;
    document.body.classList.remove('in-meeting');
  }

  function onChat(msg) {
    addMessage(msg);
    if (root && !root.hidden && root.dataset.tab !== 'chat' && window.matchMedia('(max-width: 860px)').matches) {
      unread++;
      const tab = U.$$('.meeting-tabs .tab', root)[1];
      if (tab) tab.textContent = 'Chat (' + unread + ')';
    }
    NS.audio.play('chat');
  }

  function clear() {
    history.length = 0;
    if (log) log.textContent = '';
  }

  NS.meeting = { init, show, hide, update, onChat, clear, systemMessage, setTab };
})(window.NS);

</script>
<script>
/* Everything drawn over the station.

   Two constraints shaped all of it. It is played on phones, so the controls
   live in the bottom corners where thumbs already are and nothing important
   sits under a notch. And it is played by people who have never seen it
   before, at a table, being talked over -- so every button says what it does
   in words rather than relying on an icon anyone has to learn. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;
  const W = NS.world;
  const el = U.el;

  let send = function () {};
  let onLeave = function () {};

  const nodes = {};
  const cooldown = { kill: 0, ability: 0, sabotage: 0, emergency: 0 };
  let emergenciesLeft = 0;
  let abilitySpent = false;
  let overlay = null;

  function init(opts) {
    send = opts.send;
    onLeave = opts.onLeave || function () {};
    build();
  }

  /* ---- structure --------------------------------------------------------- */

  function actionButton(id, label, kind) {
    const btn = el('button', {
      class: 'act act--' + kind, type: 'button', id: 'act-' + id, hidden: true,
    }, [
      el('span', { class: 'act-ring' }),
      el('span', { class: 'act-label', text: label }),
    ]);
    nodes[id] = btn;
    return btn;
  }

  function build() {
    const host = el('div', { class: 'hud' });

    nodes.taskbar = el('div', { class: 'taskbar' }, [
      el('div', { class: 'taskbar-track' }, [el('i')]),
      el('span', { class: 'taskbar-label', text: 'Tasks' }),
    ]);

    nodes.alert = el('div', { class: 'alert', hidden: true }, [
      el('strong', { class: 'alert-title', text: '' }),
      el('span', { class: 'alert-body', text: '' }),
      el('span', { class: 'alert-clock', text: '' }),
    ]);

    nodes.topRight = el('div', { class: 'hud-tools' }, [
      toolButton('tasks', 'Tasks', () => showTasks()),
      toolButton('map', 'Map', () => showMap(false)),
      toolButton('sound', NS.audio.muted ? 'Sound off' : 'Sound on', toggleSound),
      toolButton('close', 'Leave', async () => {
        if (await NS.bits.confirm({
          title: 'Leave the round?',
          body: 'You will not be able to rejoin until the next one starts.',
          confirm: 'Leave', danger: true,
        })) onLeave();
      }),
    ]);

    nodes.actions = el('div', { class: 'actions' }, [
      actionButton('sabotage', 'Sabotage', 'small'),
      actionButton('vent', 'Vent', 'small'),
      actionButton('ability', 'Ability', 'small'),
      actionButton('report', 'Report', 'report'),
      actionButton('kill', 'Kill', 'kill'),
      actionButton('use', 'Use', 'use'),
    ]);

    nodes.stick = el('div', { class: 'stick', hidden: true }, [
      el('span', { class: 'stick-base' }),
      el('span', { class: 'stick-knob' }),
    ]);

    nodes.roleTag = el('div', { class: 'role-tag', hidden: true }, [
      el('span', { class: 'role-tag-name', text: '' }),
      el('span', { class: 'role-tag-team', text: '' }),
    ]);

    host.appendChild(nodes.taskbar);
    host.appendChild(nodes.alert);
    host.appendChild(nodes.topRight);
    host.appendChild(nodes.roleTag);
    host.appendChild(nodes.actions);
    host.appendChild(nodes.stick);
    document.body.appendChild(host);
    nodes.host = host;

    for (const id of ['use', 'report', 'kill', 'vent', 'sabotage', 'ability']) {
      nodes[id].addEventListener('click', () => press(id));
    }
  }

  function toolButton(icon, label, fn) {
    const btn = el('button', { class: 'tool', type: 'button', 'aria-label': label, title: label, onclick: fn });
    btn.appendChild(NS.bits.icon(icon, 20));
    nodes['tool_' + icon] = btn;
    return btn;
  }

  function toggleSound() {
    NS.audio.wake();
    NS.audio.setMuted(!NS.audio.muted);
    const btn = nodes.tool_sound;
    btn.textContent = '';
    btn.appendChild(NS.bits.icon(NS.audio.muted ? 'mute' : 'sound', 20));
    btn.setAttribute('aria-label', NS.audio.muted ? 'Sound off' : 'Sound on');
  }

  /* ---- pressing things --------------------------------------------------- */

  const context = () => W.context();

  function press(id) {
    NS.audio.wake();
    const ctx = context();
    if (id === 'use') {
      if (ctx.sabotageFix) return openFix(ctx.sabotageFix);
      if (ctx.use && ctx.use.kind === 'task') return openTask(ctx.use);
      if (ctx.emergency) return callEmergency();
      return;
    }
    if (id === 'report' && ctx.report) {
      send('act', { t: 'report', body: ctx.report.id });
      NS.audio.play('report');
      return;
    }
    if (id === 'kill' && ctx.kill && cooldown.kill <= 0) {
      send('act', { t: 'kill', target: ctx.kill.id });
      /* Predicted locally from the same rule the host uses. If the host
         refuses, no kill event comes back and the button is still live -- the
         cooldown only really starts when the kill is confirmed. */
      return;
    }
    if (id === 'vent' && ctx.vent) {
      if (ctx.vent.kind === 'enter') {
        W.me.inVent = true;
        W.me.x = W.me.tx = ctx.vent.x;
        W.me.y = W.me.ty = ctx.vent.y;
        W.me.ventGroup = ctx.vent.group;
        W.me.ventIndex = ctx.vent.index;
        send('act', { t: 'vent', a: 'in', g: ctx.vent.group, i: ctx.vent.index });
        NS.fx.vent(ctx.vent.x, ctx.vent.y);
        NS.audio.play('vent');
      } else {
        W.me.inVent = false;
        send('act', { t: 'vent', a: 'out', g: W.me.ventGroup, i: W.me.ventIndex });
        NS.fx.vent(W.me.x, W.me.y);
        NS.audio.play('vent');
      }
      return;
    }
    if (id === 'sabotage') return showMap(true);
    if (id === 'ability') return useAbility();
  }

  function callEmergency() {
    NS.bits.confirm({
      title: 'Call everyone in?',
      body: emergenciesLeft + ' left for the whole round.',
      confirm: 'Call the meeting',
    }).then((yes) => {
      if (yes) { send('act', { t: 'emergency' }); NS.audio.play('report'); }
    });
  }

  function openTask(use) {
    W.frozen = true;
    NS.minigames.start(use.station.kind, {
      station: use.station,
      step: use.task.step,
      onDone() {
        W.frozen = false;
        send('act', { t: 'task', sid: use.task.sid, step: use.task.step });
        NS.fx.task(W.me.x, W.me.y);
        NS.fx.say(W.me.x, W.me.y - 46, 'Done', '#34e0b8');
      },
      onClose() { W.frozen = false; },
    });
  }

  function openFix(fix) {
    const kind = fix.def.fix;
    W.frozen = true;
    const spec = kind === 'switches' ? 'lightsFix'
      : kind === 'code' ? 'codeFix'
      : kind === 'tune' ? 'tuneFix' : 'padFix';
    NS.minigames.start(spec, {
      title: fix.def.name,
      onHold: kind === 'hold' ? (on) => send('act', { t: 'fix', i: fix.index, on: on }) : null,
      onDone() {
        W.frozen = false;
        if (kind !== 'hold') send('act', { t: 'fix', i: fix.index, on: true });
      },
      onClose() {
        W.frozen = false;
        if (kind === 'hold') send('act', { t: 'fix', i: fix.index, on: false });
      },
    });
  }

  /* ---- role abilities ---------------------------------------------------- */

  function abilityInfo() {
    const role = C.ROLES[W.myRole || 'crewmate'];
    if (!role.ability) return null;
    const map = {
      shoot: { label: 'Shoot', needsTarget: true },
      shield: { label: 'Shield', needsTarget: true, once: true },
      vitals: { label: 'Vitals', needsTarget: false },
      trail: { label: 'Read trail', needsTarget: false },
      vanish: { label: 'Vanish', needsTarget: false },
      shift: { label: 'Shapeshift', needsTarget: true },
      vent: null,
    };
    const info = map[role.ability];
    return info ? Object.assign({ kind: role.ability }, info) : null;
  }

  function nearestLiving(range) {
    const me = W.me;
    let best = null, bestD = (range || 130) * (range || 130);
    for (const p of W.players.values()) {
      if (p.isMe || !p.alive || p.ghost || p.inVent || !p.connected) continue;
      const d = U.dist2(me.x, me.y, p.x, p.y);
      if (d < bestD && NS.los.clear(me.x, me.y, p.x, p.y)) { bestD = d; best = p; }
    }
    return best;
  }

  function useAbility() {
    const info = abilityInfo();
    if (!info) return;
    if (info.kind === 'vitals') return showVitals();
    if (info.kind === 'trail') return readTrail();
    if (cooldown.ability > 0) return;
    if (info.kind === 'shoot') {
      const target = nearestLiving(C.KILL_RANGE.Long);
      if (!target) { NS.bits.toast('Nobody in your sights.', 'warn'); return; }
      NS.bits.confirm({
        title: 'Shoot ' + target.name + '?',
        body: 'If they are not an impostor, you die instead.',
        confirm: 'Shoot', danger: true,
      }).then((yes) => { if (yes) send('act', { t: 'shoot' }); });
      return;
    }
    if (info.kind === 'shield') {
      if (abilitySpent) return;
      const target = nearestLiving(140);
      if (!target) { NS.bits.toast('Stand closer to whoever you want to protect.', 'warn'); return; }
      NS.bits.confirm({
        title: 'Shield ' + target.name + '?',
        body: 'One player, once, for the whole round.',
        confirm: 'Shield them',
      }).then((yes) => { if (yes) send('act', { t: 'shield', target: target.id }); });
      return;
    }
    if (info.kind === 'vanish') { send('act', { t: 'ability', k: 'vanish' }); return; }
    if (info.kind === 'shift') {
      const target = nearestLiving(140);
      if (!target) { NS.bits.toast('Get closer to whoever you want to become.', 'warn'); return; }
      send('act', { t: 'ability', k: 'shift', target: target.id });
    }
  }

  function readTrail() {
    const body = W.nearestBody();
    if (!body) { NS.bits.toast('Stand over a body to read the trail.', 'warn'); return; }
    const room = M.roomAt(body.x, body.y);
    const dir = body.facing > 0 ? 'east' : body.facing < 0 ? 'west' : 'nowhere obvious';
    NS.bits.toast('The trail leaves ' + (room ? room.name : 'here') + ' heading ' + dir + '.', 'info', 6);
  }

  /* ---- overlays ---------------------------------------------------------- */

  function closeOverlay() {
    if (overlay) { overlay.remove(); overlay = null; W.frozen = false; }
  }

  function shell(title, sub) {
    closeOverlay();
    const root = el('div', { class: 'sheet sheet--panel', role: 'dialog', 'aria-modal': 'true' });
    const box = el('div', { class: 'sheet-box sheet-box--wide' });
    box.appendChild(el('header', { class: 'sheet-head' }, [
      el('div', {}, [el('h3', { text: title }), sub ? el('p', { text: sub }) : null]),
      el('button', { class: 'tool', type: 'button', 'aria-label': 'Close', onclick: closeOverlay },
        [NS.bits.icon('close', 20)]),
    ]));
    root.appendChild(box);
    root.addEventListener('click', (e) => { if (e.target === root) closeOverlay(); });
    document.body.appendChild(root);
    overlay = root;
    W.frozen = true;
    return box;
  }

  function showTasks() {
    if (NS.sabotage.commsDown()) {
      NS.bits.toast('Comms are down. No task list until they are fixed.', 'warn');
      return;
    }
    const box = shell('Your tasks', W.myTasks.length + ' in total');
    const list = el('ul', { class: 'task-list' });
    for (const task of W.myTasks) {
      const station = NS.rules.stationById[task.sid];
      const spot = station.steps ? station.steps[Math.min(task.step, station.steps.length - 1)] : station;
      const room = M.roomById[spot.room];
      const item = el('li', { class: 'task-item' + (task.done ? ' is-done' : '') }, [
        el('span', { class: 'task-tick' }),
        el('div', {}, [
          el('strong', { text: station.name }),
          el('span', { class: 'task-where', text: room ? room.name : '' }),
        ]),
        station.steps ? el('span', { class: 'task-steps', text: task.step + '/' + task.steps }) : null,
      ]);
      list.appendChild(item);
    }
    if (!W.myTasks.length) {
      list.appendChild(el('li', { class: 'task-item', text: 'Nothing yet. Tasks are dealt when the round starts.' }));
    }
    box.appendChild(list);
  }

  function showVitals() {
    const box = shell('Vitals', 'Read from the medical bay sensors');
    const list = el('div', { class: 'vitals' });
    const players = Array.from(W.players.values()).filter((p) => p.connected);
    players.sort((a, b) => a.name.localeCompare(b.name));
    for (const p of players) {
      list.appendChild(el('div', { class: 'vital' + (p.alive ? '' : ' is-dead') }, [
        NS.bits.avatar(p.colorIdx, p.hatIdx, 40, { ghost: !p.alive }),
        el('strong', { text: p.name }),
        el('span', { class: 'vital-state', text: p.alive ? 'Alive' : 'Dead' }),
      ]));
    }
    box.appendChild(list);
  }

  /* The map is also the sabotage console, which is how Among Us does it and
     is right: the impostor picks a room to break by pointing at the room. */
  function showMap(sabotageMode) {
    const impostor = W.myRole && C.ROLES[W.myRole].kill;
    if (sabotageMode && !impostor) return;
    const box = shell(sabotageMode ? 'Sabotage' : 'Aurora-7',
      sabotageMode ? 'Pick a system, or a room to seal.' : 'You are the amber marker.');

    if (sabotageMode) {
      const row = el('div', { class: 'sab-row' });
      for (const kind of NS.sabotage.MENU) {
        const def = NS.sabotage.SABOTAGES[kind];
        const disabled = cooldown.sabotage > 0 || !!W.state.sabotage;
        row.appendChild(el('button', {
          class: 'btn btn--danger sab-btn', type: 'button', disabled,
          onclick: () => { send('act', { t: 'sabotage', k: kind }); closeOverlay(); },
        }, [el('strong', { text: def.short }), el('span', { text: def.name })]));
      }
      box.appendChild(row);
    }

    const wrap = el('div', { class: 'map-wrap' });
    const canvas = el('canvas', { class: 'map-canvas' });
    wrap.appendChild(canvas);
    box.appendChild(wrap);

    const ctx = canvas.getContext('2d');
    const pad = 10;
    function paint() {
      const rect = wrap.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const scale = Math.min((rect.width - pad * 2) / M.pixelWidth, (rect.height - pad * 2) / M.pixelHeight);
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      const ox = (rect.width - M.pixelWidth * scale) / 2;
      const oy = (rect.height - M.pixelHeight * scale) / 2;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.scale(scale, scale);

      for (const hall of M.HALLS) {
        ctx.fillStyle = 'rgba(44,54,72,0.55)';
        ctx.fillRect(hall.x * M.TILE, hall.y * M.TILE, hall.w * M.TILE, hall.h * M.TILE);
      }
      for (const room of M.ROOMS) {
        const sealed = (W.state.closedRooms || []).indexOf(room.id) >= 0;
        ctx.fillStyle = sealed ? 'rgba(192,82,63,0.4)' : 'rgba(44,54,72,0.85)';
        ctx.fillRect(room.x * M.TILE, room.y * M.TILE, room.w * M.TILE, room.h * M.TILE);
        ctx.strokeStyle = sealed ? '#ff3f5b' : '#3a4761';
        ctx.lineWidth = 4;
        ctx.strokeRect(room.x * M.TILE, room.y * M.TILE, room.w * M.TILE, room.h * M.TILE);
        ctx.fillStyle = 'rgba(207,217,232,0.72)';
        ctx.font = '700 34px Archivo, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(room.name, room.cx, room.cy);
      }
      if (!sabotageMode && !NS.sabotage.commsDown()) {
        for (const task of W.myTasks) {
          if (task.done) continue;
          const spot = W.taskSpot(task);
          if (!spot) continue;
          ctx.fillStyle = '#ffb03a';
          ctx.beginPath(); ctx.arc(spot.x, spot.y, 17, 0, Math.PI * 2); ctx.fill();
        }
      }
      const active = W.state.sabotage;
      if (active) {
        for (const spot of NS.sabotage.activeSpots()) {
          if (spot.done) continue;
          ctx.fillStyle = '#ff3f5b';
          ctx.beginPath(); ctx.arc(spot.x, spot.y, 20, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (W.me) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(W.me.x, W.me.y, 22, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = (C.COLORS[W.me.colorIdx] || C.COLORS[0]).body;
        ctx.beginPath(); ctx.arc(W.me.x, W.me.y, 16, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      wrap.__place = { ox, oy, scale };
    }
    paint();
    const repaint = () => { if (overlay) paint(); };
    window.addEventListener('resize', repaint);
    const stop = new MutationObserver(() => {
      if (!document.body.contains(canvas)) { window.removeEventListener('resize', repaint); stop.disconnect(); }
    });
    stop.observe(document.body, { childList: true });

    if (sabotageMode) {
      canvas.addEventListener('click', (e) => {
        const place = wrap.__place;
        if (!place) return;
        const rect = canvas.getBoundingClientRect();
        const wx = (e.clientX - rect.left - place.ox) / place.scale;
        const wy = (e.clientY - rect.top - place.oy) / place.scale;
        const room = M.roomAt(wx, wy);
        if (!room || M.SEALABLE.indexOf(room.id) < 0) return;
        send('act', { t: 'sabotage', k: 'doors', room: room.id });
        closeOverlay();
      });
      box.appendChild(el('p', { class: 'sheet-note', text: 'Tap a room to seal its doors for twelve seconds.' }));
    }
  }

  /* ---- role card and ejection -------------------------------------------- */

  function showRole(role, mates) {
    const def = C.ROLES[role] || C.ROLES.crewmate;
    const card = el('div', { class: 'reveal reveal--' + def.team });
    const inner = el('div', { class: 'reveal-inner' });
    inner.appendChild(NS.bits.avatar(W.me.colorIdx, W.me.hatIdx, 148));
    inner.appendChild(el('p', { class: 'reveal-eyebrow', text: def.team === 'impostor' ? 'Impostor' : def.team === 'jester' ? 'Neutral' : 'Crew' }));
    inner.appendChild(el('h2', { class: 'reveal-role', text: def.name }));
    inner.appendChild(el('p', { class: 'reveal-blurb', text: def.blurb }));
    if (mates && mates.length) {
      const row = el('div', { class: 'reveal-mates' });
      row.appendChild(el('span', { text: mates.length === 1 ? 'With you:' : 'With you:' }));
      for (const m of mates) {
        row.appendChild(el('span', { class: 'reveal-mate' }, [
          NS.bits.avatar(m.colorIdx, m.hatIdx, 44), el('em', { text: m.name }),
        ]));
      }
      inner.appendChild(row);
    }
    card.appendChild(inner);
    document.body.appendChild(card);
    nodes.reveal = card;
    requestAnimationFrame(() => card.classList.add('is-in'));
    NS.audio.play(def.team === 'impostor' ? 'sabotage' : 'taskDone');
  }

  function hideRole() {
    if (!nodes.reveal) return;
    nodes.reveal.classList.remove('is-in');
    const node = nodes.reveal;
    nodes.reveal = null;
    setTimeout(() => node.remove(), 400);
  }

  function showEject(ejected) {
    hideEject();
    const wrap = el('div', { class: 'eject' });
    const stage = el('div', { class: 'eject-stage' });
    if (ejected.id) {
      const body = el('div', { class: 'eject-body' });
      body.appendChild(NS.bits.avatar(ejected.colorIdx, ejected.hatIdx, 120, { ghost: true }));
      stage.appendChild(body);
    }
    const line = ejected.id
      ? ejected.name + ' was ' + (W.state.settings.confirmEjects
        ? (ejected.impostor ? 'an impostor.' : 'not an impostor.')
        : 'ejected.')
      : (ejected.tie ? 'Nobody was ejected. The vote tied.' : 'Nobody was ejected. The crew skipped.');
    stage.appendChild(el('p', { class: 'eject-line', text: line }));
    if (ejected.id && W.state.settings.confirmEjects) {
      stage.appendChild(el('p', {
        class: 'eject-sub',
        text: ejected.remaining === 1 ? '1 impostor remains.' : ejected.remaining + ' impostors remain.',
      }));
    }
    wrap.appendChild(stage);
    document.body.appendChild(wrap);
    nodes.eject = wrap;
    requestAnimationFrame(() => wrap.classList.add('is-in'));
    NS.audio.play('eject');
  }

  function hideEject() {
    if (!nodes.eject) return;
    nodes.eject.remove();
    nodes.eject = null;
  }

  /* ---- per frame --------------------------------------------------------- */

  function setCooldown(which, seconds) { cooldown[which] = Math.max(cooldown[which], seconds); }
  function forceCooldown(which, seconds) { cooldown[which] = seconds; }

  function update(dt) {
    for (const key in cooldown) if (cooldown[key] > 0) cooldown[key] = Math.max(0, cooldown[key] - dt);

    const state = W.state;
    const playing = state.phase === 'play';
    const me = W.me;
    nodes.host.hidden = !(playing || state.phase === 'reveal');
    if (!me) return;

    const mode = state.settings.taskBar;
    const showBar = mode === 'Always' || (mode === 'Meetings' && state.phase === 'meeting');
    nodes.taskbar.hidden = !showBar || state.tasksTotal === 0;
    if (!nodes.taskbar.hidden) {
      const ratio = state.tasksTotal ? state.tasksDone / state.tasksTotal : 0;
      nodes.taskbar.querySelector('i').style.transform = 'scaleX(' + ratio.toFixed(3) + ')';
      nodes.taskbar.querySelector('.taskbar-label').textContent =
        'Tasks ' + state.tasksDone + ' / ' + state.tasksTotal;
    }

    const sab = state.sabotage;
    nodes.alert.hidden = !sab;
    if (sab) {
      const def = NS.sabotage.SABOTAGES[sab.kind];
      nodes.alert.querySelector('.alert-title').textContent = def.name;
      nodes.alert.querySelector('.alert-body').textContent = def.warn;
      const clockNode = nodes.alert.querySelector('.alert-clock');
      clockNode.textContent = def.critical ? U.clock(sab.remaining) : '';
      nodes.alert.classList.toggle('is-critical', !!def.critical);
    }

    const role = C.ROLES[W.myRole || 'crewmate'];
    nodes.roleTag.hidden = !W.myRole || state.phase !== 'play';
    if (!nodes.roleTag.hidden) {
      nodes.roleTag.querySelector('.role-tag-name').textContent = role.name;
      nodes.roleTag.querySelector('.role-tag-team').textContent =
        me.ghost ? 'Ghost' : (role.team === 'impostor' ? 'Impostor' : role.team === 'jester' ? 'Neutral' : 'Crew');
      nodes.roleTag.dataset.team = me.ghost ? 'ghost' : role.team;
    }

    const ctx = playing ? context() : {};
    const ghost = me.ghost;

    /* A button you own stays on screen greyed out rather than vanishing. A HUD
       that empties itself as you walk teaches nobody what they can do, and on
       a phone the buttons moving under your thumb is worse than useless. */
    const use = ctx.sabotageFix || ctx.use || ctx.emergency;
    show(nodes.use, playing);
    nodes.use.querySelector('.act-label').textContent =
      ctx.sabotageFix ? 'Fix' : ctx.use ? 'Use' : ctx.emergency ? 'Meeting' : 'Use';
    nodes.use.disabled = !use || !!(ctx.emergency && !ctx.use && !ctx.sabotageFix
      && (emergenciesLeft <= 0 || cooldown.emergency > 0));

    show(nodes.report, playing && !ghost);
    nodes.report.disabled = !ctx.report;

    show(nodes.kill, playing && !ghost && !!(W.myRole && role.kill));
    if (!nodes.kill.hidden) {
      nodes.kill.disabled = !ctx.kill || cooldown.kill > 0;
      ring(nodes.kill, cooldown.kill, state.settings.killCooldown);
      nodes.kill.querySelector('.act-label').textContent =
        cooldown.kill > 0 ? Math.ceil(cooldown.kill) + '' : 'Kill';
    }

    const canVent = W.myRole && (role.kill || role.ability === 'vent');
    show(nodes.vent, playing && !ghost && !!canVent);
    if (!nodes.vent.hidden) {
      nodes.vent.disabled = !ctx.vent;
      nodes.vent.querySelector('.act-label').textContent =
        ctx.vent && ctx.vent.kind === 'exit' ? 'Climb out' : 'Vent';
    }

    show(nodes.sabotage, playing && !ghost && !!(W.myRole && role.kill));
    if (!nodes.sabotage.hidden) {
      nodes.sabotage.disabled = cooldown.sabotage > 0;
      ring(nodes.sabotage, cooldown.sabotage, 25);
    }

    const ability = abilityInfo();
    show(nodes.ability, playing && !!ability && (!ghost || ability.kind === 'vitals'));
    if (ability && !nodes.ability.hidden) {
      const spent = ability.once && abilitySpent;
      nodes.ability.disabled = spent || (cooldown.ability > 0 && ability.kind !== 'vitals' && ability.kind !== 'trail');
      nodes.ability.querySelector('.act-label').textContent =
        spent ? 'Used' : (cooldown.ability > 0 && ability.kind !== 'vitals' && ability.kind !== 'trail'
          ? Math.ceil(cooldown.ability) + '' : ability.label);
      ring(nodes.ability, cooldown.ability, 30);
    }
  }

  function show(node, on) { node.hidden = !on; }

  function ring(node, left, total) {
    const p = total > 0 ? U.clamp(1 - left / total, 0, 1) : 1;
    node.style.setProperty('--cool', p.toFixed(3));
    node.classList.toggle('is-cooling', left > 0.05);
  }

  function setEmergencies(n) { emergenciesLeft = n; }
  function setAbilitySpent(v) { abilitySpent = !!v; }

  NS.hud = {
    init, update, showRole, hideRole, showEject, hideEject, showMap, showTasks,
    setCooldown, forceCooldown, setEmergencies, setAbilitySpent, closeOverlay,
    cooldown,
    get stick() { return nodes.stick; },
  };
})(window.NS);

</script>
<script>
/* Walking, from a keyboard or a thumb.

   The stick is not drawn in a fixed corner waiting to be found. It appears
   under the thumb wherever the thumb lands in the left half of the screen and
   follows it from there, which is the difference between a control you have
   to look at and one you can use while watching the game. The right half is
   left alone for the action buttons, and a touch that starts on a button is
   never a stick.

   Keys are WASD or the arrows, with the same actions on the keyboard as on
   the buttons so a laptop is not a second-class way to play. */

(function (NS) {
  'use strict';

  const U = NS.util;

  const keys = Object.create(null);
  const vector = { x: 0, y: 0 };
  const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
  const MAX = 54;

  let node = null;
  let onAction = function () {};
  let enabled = true;

  const KEY_MOVE = {
    KeyW: [0, -1], ArrowUp: [0, -1],
    KeyS: [0, 1], ArrowDown: [0, 1],
    KeyA: [-1, 0], ArrowLeft: [-1, 0],
    KeyD: [1, 0], ArrowRight: [1, 0],
  };
  const KEY_ACTION = {
    KeyE: 'use', Space: 'use', Enter: 'use',
    KeyR: 'report', KeyQ: 'kill', KeyV: 'vent',
    KeyF: 'ability', KeyZ: 'sabotage', KeyM: 'map', KeyT: 'tasks',
  };

  function init(opts) {
    node = opts.stick;
    onAction = opts.onAction || function () {};

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const target = e.target;
      /* Never eat a key somebody is typing into the chat box. */
      if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) return;
      if (KEY_MOVE[e.code]) { keys[e.code] = true; e.preventDefault(); return; }
      const action = KEY_ACTION[e.code];
      if (action) {
        e.preventDefault();
        if (enabled) onAction(action);
      }
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

    const surface = opts.surface || document.body;
    surface.addEventListener('pointerdown', (e) => {
      if (!enabled || stick.active) return;
      if (e.pointerType === 'mouse') return;
      /* Anything with its own job -- a button, the HUD, an open panel --
         handles its own touches. */
      if (e.target.closest('button, .sheet, .mg, .meeting, .screen, input, a')) return;
      if (e.clientX > window.innerWidth * 0.58) return;
      stick.active = true;
      stick.id = e.pointerId;
      stick.ox = e.clientX;
      stick.oy = e.clientY;
      stick.x = 0; stick.y = 0;
      place();
      node.hidden = false;
      surface.setPointerCapture(e.pointerId);
    });
    surface.addEventListener('pointermove', (e) => {
      if (!stick.active || e.pointerId !== stick.id) return;
      const dx = e.clientX - stick.ox;
      const dy = e.clientY - stick.oy;
      const len = Math.hypot(dx, dy);
      const clamped = Math.min(len, MAX);
      const a = Math.atan2(dy, dx);
      stick.x = len < 1 ? 0 : Math.cos(a) * clamped;
      stick.y = len < 1 ? 0 : Math.sin(a) * clamped;
      place();
    });
    const drop = (e) => {
      if (!stick.active || (e.pointerId != null && e.pointerId !== stick.id)) return;
      stick.active = false;
      stick.id = null;
      stick.x = 0; stick.y = 0;
      node.hidden = true;
    };
    surface.addEventListener('pointerup', drop);
    surface.addEventListener('pointercancel', drop);
  }

  function place() {
    if (!node) return;
    node.style.left = stick.ox + 'px';
    node.style.top = stick.oy + 'px';
    node.querySelector('.stick-knob').style.transform =
      'translate(' + (stick.x - 50) + '%, ' + (stick.y - 50) + '%)';
  }

  /* One vector, whichever way it was asked for. Keyboard input is normalised
     the same way the stick is, so diagonals are not faster. */
  function read() {
    let x = 0, y = 0;
    for (const code in KEY_MOVE) {
      if (!keys[code]) continue;
      x += KEY_MOVE[code][0];
      y += KEY_MOVE[code][1];
    }
    if (stick.active && (stick.x || stick.y)) {
      const len = Math.hypot(stick.x, stick.y);
      const dead = 9;
      if (len > dead) {
        const power = Math.min(1, (len - dead) / (MAX - dead));
        x = (stick.x / len) * power;
        y = (stick.y / len) * power;
      } else { x = 0; y = 0; }
    }
    vector.x = U.clamp(x, -1, 1);
    vector.y = U.clamp(y, -1, 1);
    return vector;
  }

  function setEnabled(v) {
    enabled = !!v;
    if (!enabled) {
      stick.active = false;
      stick.x = stick.y = 0;
      for (const k in keys) keys[k] = false;
      if (node) node.hidden = true;
    }
  }

  NS.input = { init, read, setEnabled, get vector() { return vector; } };
})(window.NS);

</script>
<script>
/* The screens either side of a round: the way in, the lobby, and the way it
   ended.

   The way in is the part that decides whether a class actually plays. Three
   buttons, no account, no install, and a four-letter code somebody reads out
   loud. Practice against bots is first on the list rather than hidden at the
   bottom, because the person opening this link is on their own and one player
   staring at an empty lobby is how a game gets closed. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;
  const W = NS.world;
  const el = U.el;

  let hooks = {};
  let current = null;
  let backdrop = null;
  let backdropStop = null;

  const profile = {
    name: U.cleanName(U.store.get('name', ''), C.NAME_MAX),
    colorIdx: U.clamp(U.store.get('colour', Math.floor(Math.random() * C.COLORS.length)) | 0, 0, C.COLORS.length - 1),
    hatIdx: U.clamp(U.store.get('hat', 0) | 0, 0, C.HATS.length - 1),
  };

  function saveProfile() {
    U.store.set('name', profile.name);
    U.store.set('colour', profile.colorIdx);
    U.store.set('hat', profile.hatIdx);
  }

  function init(opts) { hooks = opts; }

  /* ---- the station, drifting behind everything --------------------------- */

  /* The title sits over the real map, panned slowly. It costs one blit a
     frame and it means the first thing anybody sees is the place they are
     about to be in, rather than a logo on a gradient. */
  function startBackdrop(host) {
    const canvas = el('canvas', { class: 'backdrop', 'aria-hidden': 'true' });
    host.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let t = 0;
    let running = true;
    function frame() {
      if (!running) return;
      const rect = host.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      if (canvas.width !== Math.round(rect.width * dpr) || canvas.height !== Math.round(rect.height * dpr)) {
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#05070d';
      ctx.fillRect(0, 0, rect.width, rect.height);
      const station = NS.station.canvas;
      if (station) {
        t += 0.00022;
        const scale = Math.max(rect.width / 1500, 0.55);
        const px = (Math.sin(t) * 0.5 + 0.5) * Math.max(0, M.pixelWidth - rect.width / scale);
        const py = (Math.cos(t * 0.7) * 0.5 + 0.5) * Math.max(0, M.pixelHeight - rect.height / scale);
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.scale(scale, scale);
        ctx.drawImage(station, px, py, rect.width / scale, rect.height / scale, 0, 0, rect.width / scale, rect.height / scale);
        ctx.restore();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    return () => { running = false; canvas.remove(); };
  }

  /* ---- shared chrome ----------------------------------------------------- */

  function screen(name) {
    hideAll();
    const root = el('section', { class: 'screen screen--' + name });
    document.body.appendChild(root);
    current = root;
    return root;
  }

  function hideAll() {
    if (backdropStop) { backdropStop(); backdropStop = null; }
    if (current) { current.remove(); current = null; }
  }

  /* The character you are about to be, with the pickers under it. Changing a
     colour redraws the same drawing the world uses, so what you choose here
     is exactly what everybody sees out there. */
  function dresser(onChange) {
    const wrap = el('div', { class: 'dresser' });
    const stageBox = el('div', { class: 'dresser-stage' });
    function repaint() {
      stageBox.textContent = '';
      stageBox.appendChild(NS.bits.avatar(profile.colorIdx, profile.hatIdx, 168));
    }
    repaint();

    const colours = el('div', { class: 'swatches', role: 'group', 'aria-label': 'Colour' });
    C.COLORS.forEach((colour, i) => {
      const btn = el('button', {
        class: 'swatch', type: 'button', 'aria-label': colour.name, title: colour.name,
        'aria-pressed': String(i === profile.colorIdx),
        onclick: () => {
          profile.colorIdx = i;
          saveProfile();
          U.$$('.swatch', colours).forEach((n, k) => n.setAttribute('aria-pressed', String(k === i)));
          repaint();
          NS.audio.play('click');
          if (onChange) onChange();
        },
      });
      btn.style.setProperty('--swatch', colour.body);
      colours.appendChild(btn);
    });

    const hats = el('div', { class: 'hats', role: 'group', 'aria-label': 'Hat' });
    C.HATS.forEach((hat, i) => {
      const btn = el('button', {
        class: 'hat-btn', type: 'button', title: hat.name, 'aria-label': hat.name,
        'aria-pressed': String(i === profile.hatIdx),
        onclick: () => {
          profile.hatIdx = i;
          saveProfile();
          U.$$('.hat-btn', hats).forEach((n, k) => n.setAttribute('aria-pressed', String(k === i)));
          repaint();
          NS.audio.play('click');
          if (onChange) onChange();
        },
      });
      btn.appendChild(NS.bits.avatar(profile.colorIdx, i, 44, { class: 'hat-preview' }));
      hats.appendChild(btn);
    });

    wrap.appendChild(stageBox);
    wrap.appendChild(colours);
    wrap.appendChild(el('p', { class: 'dresser-label', text: 'Hat' }));
    wrap.appendChild(hats);
    wrap.__repaint = repaint;
    return wrap;
  }

  /* ---- title ------------------------------------------------------------- */

  function showTitle(message) {
    const root = screen('title');
    backdropStop = startBackdrop(root);

    const nameInput = el('input', {
      class: 'field', type: 'text', maxlength: String(C.NAME_MAX),
      placeholder: 'Your name', value: profile.name, 'aria-label': 'Your name',
      autocomplete: 'nickname', autocapitalize: 'words',
      oninput: (e) => { profile.name = U.cleanName(e.target.value, C.NAME_MAX); saveProfile(); },
    });

    const codeInput = el('input', {
      class: 'field field--code', type: 'text', maxlength: '4',
      placeholder: 'CODE', 'aria-label': 'Room code',
      autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false',
      oninput: (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); },
    });

    function needName() {
      if (profile.name) return false;
      nameInput.focus();
      nameInput.classList.add('is-wrong');
      setTimeout(() => nameInput.classList.remove('is-wrong'), 500);
      NS.bits.toast('Put a name in first, so people know who you are.', 'warn');
      return true;
    }

    const online = NS.link.roomAvailable() || NS.link.mqttAvailable();

    const actions = el('div', { class: 'title-actions' }, [
      el('button', {
        class: 'btn btn--primary btn--big', type: 'button',
        onclick: () => { if (!needName()) hooks.onHost(profile); },
        disabled: !online,
      }, [el('strong', { text: 'Start a game' }), el('span', { text: 'You get a code to read out' })]),
      el('div', { class: 'join-row' }, [
        codeInput,
        el('button', {
          class: 'btn btn--ghost', type: 'button', text: 'Join',
          disabled: !online,
          onclick: () => {
            if (needName()) return;
            const code = codeInput.value.trim().toUpperCase();
            if (code.length !== 4) {
              codeInput.classList.add('is-wrong');
              setTimeout(() => codeInput.classList.remove('is-wrong'), 500);
              NS.bits.toast('A code is four characters.', 'warn');
              return;
            }
            hooks.onJoin(profile, code);
          },
        }),
      ]),
      el('button', {
        class: 'btn btn--quiet', type: 'button',
        onclick: () => { if (!needName()) hooks.onSolo(profile); },
      }, [el('strong', { text: 'Practice with bots' }), el('span', { text: 'On your own, right now' })]),
    ]);

    const left = el('div', { class: 'title-left' }, [
      el('p', { class: 'eyebrow', text: 'Aurora-7 research station' }),
      el('h1', { class: 'wordmark' }, [
        el('span', { text: 'NIGHT' }), el('em', { text: 'SHIFT' }),
      ]),
      el('p', { class: 'tagline', text: 'Fourteen people, a station that is falling apart, and at least one of them wants it to.' }),
      el('div', { class: 'field-row' }, [nameInput]),
      actions,
      el('p', { class: 'title-note', text: transportNote() }),
      el('button', { class: 'link-btn', type: 'button', text: 'How it works', onclick: showHelp }),
    ]);

    root.appendChild(el('div', { class: 'title-grid' }, [left, dresser()]));
    if (message) NS.bits.toast(message, 'warn', 6);
  }

  function transportNote() {
    if (location.hash === '#local') {
      return 'Same-computer mode: this page talks to its own other tabs and nothing else. '
        + 'Open it twice, host in one and join in the other. Drop the #local off the address '
        + 'to play with other devices.';
    }
    if (NS.link.roomAvailable()) {
      return 'Everyone opens this same link and types the code. It works for people signed in to '
        + 'the same organisation as whoever published it; anyone else should use the downloadable file.';
    }
    if (NS.link.mqttAvailable()) {
      return 'Everyone opens this same file and types the code. It goes over a free public message '
        + 'broker, so there is nothing to install and no account -- and nothing on it is private.';
    }
    return 'This browser cannot open a connection, so only practice mode will work.';
  }

  function showHelp() {
    const root = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' });
    const box = el('div', { class: 'sheet-box sheet-box--wide' });
    box.appendChild(el('header', { class: 'sheet-head' }, [
      el('h3', { text: 'How it works' }),
      el('button', { class: 'tool', type: 'button', 'aria-label': 'Close', onclick: () => root.remove() },
        [NS.bits.icon('close', 20)]),
    ]));
    const body = el('div', { class: 'prose' });
    [
      ['The crew', 'Everyone gets a list of jobs around the station. Finish all of them and the crew wins. '
        + 'Your jobs are marked with a ring on the floor and listed under Tasks.'],
      ['The impostors', 'One to three of you are lying. You can kill, climb through the vents, and break '
        + 'the station to move people around. You have a fake task list to stand at.'],
      ['Meetings', 'Find a body and report it, or press the button in the Cafeteria. Everyone argues in '
        + 'the chat, then votes. The most voted is thrown out of the airlock.'],
      ['Being dead', 'You keep playing. Ghosts walk through walls, finish the tasks that still count, '
        + 'and can read everything -- but the living cannot hear you.'],
      ['Controls', 'WASD or the arrows to walk, E to use, Q to kill, R to report, F for your role ability, '
        + 'M for the map. On a phone, touch the left half to walk and use the buttons on the right.'],
    ].forEach(([title, text]) => {
      body.appendChild(el('h4', { text: title }));
      body.appendChild(el('p', { text }));
    });
    box.appendChild(body);
    root.appendChild(box);
    root.addEventListener('click', (e) => { if (e.target === root) root.remove(); });
    document.body.appendChild(root);
  }

  /* ---- lobby ------------------------------------------------------------- */

  let lobbyNodes = null;

  function showLobby(info) {
    const root = screen('lobby');
    backdropStop = startBackdrop(root);

    const code = el('button', {
      class: 'code', type: 'button', title: 'Copy the code',
      onclick: () => {
        const text = info.code;
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(
          () => NS.bits.toast('Code copied.', 'good'),
          () => NS.bits.toast('Copy did not work -- read it out instead.', 'warn'));
        else NS.bits.toast('Read it out: ' + text, 'info');
      },
    }, [el('span', { class: 'code-label', text: 'Room code' }), el('strong', { text: info.code })]);

    const roster = el('div', { class: 'roster' });
    const status = el('p', { class: 'lobby-status', text: '' });
    const settingsHost = el('div', { class: 'settings' });

    const startBtn = el('button', {
      class: 'btn btn--primary btn--big', type: 'button', text: 'Start the round',
      onclick: () => hooks.onStart(),
    });
    const readyBtn = el('button', {
      class: 'btn btn--primary btn--big', type: 'button', text: 'Ready',
      onclick: () => hooks.onReady(),
    });
    const botRow = el('div', { class: 'bot-row' }, [
      el('span', { class: 'bot-label', text: 'Practice bots' }),
      el('button', { class: 'btn btn--ghost btn--tight', type: 'button', text: '-', 'aria-label': 'One fewer bot', onclick: () => hooks.onBots(-1) }),
      el('strong', { class: 'bot-count', text: '0' }),
      el('button', { class: 'btn btn--ghost btn--tight', type: 'button', text: '+', 'aria-label': 'One more bot', onclick: () => hooks.onBots(1) }),
    ]);

    const leave = el('button', { class: 'link-btn', type: 'button', text: 'Leave', onclick: () => hooks.onLeave() });

    const panel = el('div', { class: 'lobby-panel' }, [
      code,
      el('p', { class: 'lobby-hint', text: 'Everyone opens the same page and types this in.' }),
      status,
      botRow,
      el('div', { class: 'lobby-buttons' }, [startBtn, readyBtn]),
      leave,
    ]);

    root.appendChild(el('div', { class: 'lobby-grid' }, [
      el('div', { class: 'lobby-left' }, [
        el('h2', { class: 'lobby-title', text: 'Lobby' }),
        roster,
      ]),
      panel,
      el('div', { class: 'lobby-settings' }, [
        el('h3', { text: 'Settings' }),
        settingsHost,
      ]),
    ]));

    lobbyNodes = { roster, status, settingsHost, startBtn, readyBtn, botRow, code };
    rosterSignature = '';
    return lobbyNodes;
  }

  let rosterSignature = '';

  function updateLobby(info) {
    if (!lobbyNodes) return;
    const { roster, status, startBtn, readyBtn, botRow } = lobbyNodes;
    const players = info.players || [];

    /* The roster is redrawn only when it actually changed. This runs several
       times a second so the start button can never be left stale, and
       rebuilding fourteen canvas portraits at that rate would flicker. */
    const signature = players.map((p) =>
      p.name + p.colorIdx + p.hatIdx + (p.ready ? 'r' : '') + (p.bot ? 'b' : '') + (p.isHost ? 'h' : '')
    ).join('|');
    if (signature !== rosterSignature) {
      rosterSignature = signature;
      renderRoster(roster, players);
    }

    const real = players.filter((p) => !p.bot).length;
    status.textContent = players.length + ' in the lobby'
      + (players.length - real > 0 ? ' (' + (players.length - real) + ' bots)' : '')
      + (info.connection ? ' - ' + info.connection : '');

    startBtn.hidden = !info.isHost;
    readyBtn.hidden = !!info.isHost;
    botRow.hidden = !info.isHost;
    botRow.querySelector('.bot-count').textContent = String(info.bots || 0);
    if (info.isHost) {
      startBtn.disabled = !!info.blocked;
      startBtn.textContent = info.blocked || 'Start the round';
    } else {
      readyBtn.classList.toggle('is-on', !!info.ready);
      readyBtn.textContent = info.ready ? 'Ready' : 'Ready up';
    }
  }

  function renderRoster(roster, players) {
    roster.textContent = '';
    for (const p of players) {
      const card = el('div', { class: 'roster-card' + (p.ready ? ' is-ready' : '') + (p.bot ? ' is-bot' : '') });
      card.appendChild(NS.bits.avatar(p.colorIdx, p.hatIdx, 76));
      card.appendChild(el('strong', { text: p.name }));
      card.appendChild(el('span', { class: 'roster-tag', text: p.isHost ? 'Host' : (p.bot ? 'Bot' : (p.ready ? 'Ready' : '')) }));
      roster.appendChild(card);
    }
    for (let i = players.length; i < C.MAX_PLAYERS; i++) {
      roster.appendChild(el('div', { class: 'roster-card is-empty' }, [el('span', { text: '' })]));
    }
  }

  /* Settings are generated from the table in core/config.js, so a new dial
     appears here, travels to the guests and is clamped on arrival without
     anybody editing this file. */
  function buildSettings(settings, isHost, onChange) {
    if (!lobbyNodes) return;
    const host = lobbyNodes.settingsHost;
    host.textContent = '';
    for (const spec of C.SETTINGS) {
      const row = el('div', { class: 'setting' });
      row.appendChild(el('label', { class: 'setting-name', text: spec.name }));
      const value = settings[spec.key];
      let control;
      if (spec.kind === 'bool') {
        control = el('button', {
          class: 'toggle' + (value ? ' is-on' : ''), type: 'button',
          role: 'switch', 'aria-checked': String(!!value),
          text: value ? 'On' : 'Off',
          onclick: () => onChange(spec.key, !settings[spec.key]),
        });
      } else if (spec.kind === 'choice') {
        control = el('div', { class: 'segments' });
        for (const option of spec.options) {
          control.appendChild(el('button', {
            class: 'segment' + (option === value ? ' is-on' : ''), type: 'button', text: option,
            onclick: () => onChange(spec.key, option),
          }));
        }
      } else {
        const out = el('output', { class: 'setting-value', text: value + (spec.unit || '') });
        control = el('div', { class: 'slider-row' }, [
          el('input', {
            class: 'slider', type: 'range',
            min: String(spec.min), max: String(spec.max),
            step: String(spec.step || 1), value: String(value),
            'aria-label': spec.name,
            oninput: (e) => {
              out.textContent = e.target.value + (spec.unit || '');
              onChange(spec.key, Number(e.target.value));
            },
          }),
          out,
        ]);
      }
      row.appendChild(control);
      if (spec.hint) row.appendChild(el('p', { class: 'setting-hint', text: spec.hint }));
      if (!isHost) row.classList.add('is-locked');
      U.$$('button, input', row).forEach((n) => { n.disabled = !isHost; });
      host.appendChild(row);
    }

    const roles = el('div', { class: 'roles' });
    roles.appendChild(el('h4', { text: 'Roles' }));
    roles.appendChild(el('p', { class: 'setting-hint', text: 'The chance each one turns up in a round. Off means never.' }));
    for (const key of C.ROLE_SETTINGS) {
      const def = C.ROLES[key];
      const chance = settings.roles[key] || 0;
      const out = el('output', { class: 'setting-value', text: chance ? chance + '%' : 'Off' });
      const row = el('div', { class: 'setting setting--role' }, [
        el('div', { class: 'role-head' }, [
          el('strong', { text: def.name }),
          el('span', { class: 'role-team role-team--' + def.team, text: def.team === 'impostor' ? 'Impostor' : def.team === 'jester' ? 'Neutral' : 'Crew' }),
        ]),
        el('p', { class: 'setting-hint', text: def.blurb }),
        el('div', { class: 'slider-row' }, [
          el('input', {
            class: 'slider', type: 'range', min: '0', max: '100', step: '5', value: String(chance),
            'aria-label': def.name + ' chance',
            oninput: (e) => {
              out.textContent = Number(e.target.value) ? e.target.value + '%' : 'Off';
              onChange('role:' + key, Number(e.target.value));
            },
          }),
          out,
        ]),
      ]);
      if (!isHost) U.$$('input', row).forEach((n) => { n.disabled = true; });
      roles.appendChild(row);
    }
    host.appendChild(roles);
  }

  /* ---- the end ----------------------------------------------------------- */

  function showEnd(result, players, isHost) {
    const root = screen('end');
    backdropStop = startBackdrop(root);
    root.dataset.team = result.team;

    const title = result.team === 'crew' ? 'Crew wins'
      : result.team === 'impostor' ? 'Impostors win' : 'The jester wins';

    const grid = el('div', { class: 'end-roles' });
    for (const p of players) {
      const def = C.ROLES[p.role] || C.ROLES.crewmate;
      grid.appendChild(el('div', { class: 'end-card end-card--' + def.team }, [
        NS.bits.avatar(p.colorIdx, p.hatIdx, 68, { ghost: !p.alive }),
        el('strong', { text: p.name }),
        el('span', { class: 'end-role', text: def.name }),
      ]));
    }

    root.appendChild(el('div', { class: 'end-inner' }, [
      el('p', { class: 'eyebrow', text: 'Round over' }),
      el('h1', { class: 'end-title', text: title }),
      el('p', { class: 'end-reason', text: result.reason }),
      grid,
      el('div', { class: 'end-buttons' }, [
        isHost
          ? el('button', { class: 'btn btn--primary btn--big', type: 'button', text: 'Back to the lobby', onclick: () => hooks.onPlayAgain() })
          : el('p', { class: 'end-wait', text: 'Waiting for the host to start another.' }),
        el('button', { class: 'link-btn', type: 'button', text: 'Leave', onclick: () => hooks.onLeave() }),
      ]),
    ]));
    NS.audio.play(result.team === 'crew' ? 'win' : 'lose');
  }

  NS.screens = {
    init, showTitle, showLobby, updateLobby, buildSettings, showEnd, hideAll, showHelp,
    profile,
    get current() { return current; },
  };
})(window.NS);

</script>
<script>
/* Wiring.

   Everything above this file is a piece that does one thing and knows nothing
   about the others: the map does not know about the network, the renderer
   does not know the rules, the host does not know what a button is. This is
   where they are joined, which makes it the only file where a change can
   break something far away -- so the seams are named rather than implied.

   Three of them matter. Presence carries where people are and is allowed to
   be slightly wrong. Snapshots carry what is true and overwrite anything this
   device believed. Events carry what just happened, once, and are the only
   thing allowed to make a noise. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;
  const W = NS.world;

  const session = {
    link: null, mode: 'solo', code: '', isHost: false,
    myId: null, hostId: null, ready: false, botCount: 3,
    connection: '', settings: C.defaults(), inGame: false,
  };

  let canvas = null;
  let pendingRole = null;
  let pendingRoleSince = 0;
  let lastPhase = 'lobby';

  const send = (kind, data) => { if (session.link) session.link.send(kind, data); };

  /* ---- boot -------------------------------------------------------------- */

  function boot() {
    canvas = U.$('#stage');
    NS.render.attach(canvas);
    NS.secrets.init();
    NS.hud.init({ send, onLeave: leaveToTitle });
    NS.input.init({ stick: NS.hud.stick, onAction: keyAction, surface: document.body });
    NS.meeting.init({ send });
    NS.screens.init({
      onHost: hostGame, onJoin: joinGame, onSolo: soloGame,
      onStart: startRound, onReady: toggleReady, onBots: changeBots,
      onLeave: leaveToTitle, onPlayAgain: backToLobby,
    });
    NS.screens.showTitle();

    /* The station is a thirty megabyte draw. It waits for the fonts so the
       room signage is set in the right face, and for a painted frame so the
       title is on screen before the main thread is busy for a moment. */
    const build = () => requestAnimationFrame(() => { NS.station.build(); });
    if (document.fonts && document.fonts.ready) {
      const timeout = new Promise((r) => setTimeout(r, 1500));
      Promise.race([document.fonts.ready, timeout]).then(build);
    } else build();

    requestAnimationFrame(frame);
    setInterval(beat, 60);
    window.addEventListener('pointerdown', () => NS.audio.wake(), { once: true });
    window.addEventListener('keydown', () => NS.audio.wake(), { once: true });
  }

  function keyAction(action) {
    if (NS.minigames.isOpen()) return;
    if (action === 'map') return NS.hud.showMap(false);
    if (action === 'tasks') return NS.hud.showTasks();
    const button = U.$('#act-' + action);
    if (button && !button.hidden && !button.disabled) button.click();
  }

  /* ---- sessions ---------------------------------------------------------- */

  function openLink(mode, code, asHost) {
    closeLink();
    session.mode = mode;
    session.code = code;
    session.isHost = asHost;
    session.ready = asHost;
    session.connection = '';
    W.reset();
    NS.bots.clear();
    NS.meeting.clear();
    lastPhase = 'lobby';

    session.link = NS.link.open({
      mode, code,
      onStatus(text) { session.connection = text; refreshLobby(); },
      onReady() {
        session.myId = session.link.id;
        W.spawnMe(session.myId, NS.screens.profile);
        if (asHost) {
          session.hostId = session.myId;
          NS.host.begin({ send, settings: session.settings });
          NS.host.addPlayer(session.myId, {
            n: NS.screens.profile.name, c: NS.screens.profile.colorIdx,
            h: NS.screens.profile.hatIdx, k: NS.secrets.publicKey,
          });
          if (mode === 'solo') NS.bots.fill(session.botCount, NS.host);
        } else {
          send('act', {
            t: 'hello', n: NS.screens.profile.name, c: NS.screens.profile.colorIdx,
            h: NS.screens.profile.hatIdx, k: NS.secrets.publicKey,
          });
        }
        showLobby();
      },
      onError(text) {
        NS.bits.toast(text, 'bad', 8);
        if (!session.link || !session.link.ready) leaveToTitle(text);
      },
      onMessage,
      onPeers() { refreshLobby(); },
    });
  }

  function closeLink() {
    if (session.link) { session.link.close(); session.link = null; }
    NS.host.stop();
    session.isHost = false;
    session.hostId = null;
    session.inGame = false;
  }

  /* `#local` puts the game on a BroadcastChannel between tabs of this browser:
     two people on one laptop, and the only way to try the join flow before a
     class without a second device. Otherwise the artifact room where there is
     one, and a public broker everywhere else. */
  function transport() {
    if (location.hash === '#local' && NS.link.localAvailable()) return 'local';
    return NS.link.roomAvailable() ? 'room' : 'mqtt';
  }

  const hostGame = () => openLink(transport(), U.roomCode(4), true);
  const joinGame = (profile, code) => openLink(transport(), code, false);
  const soloGame = () => openLink('solo', 'SOLO', true);

  function leaveToTitle(why) {
    closeLink();
    NS.minigames.close(true);
    NS.hud.closeOverlay();
    NS.hud.hideRole();
    NS.hud.hideEject();
    NS.meeting.hide();
    W.reset();
    NS.bots.clear();
    NS.fx.clear();
    NS.screens.showTitle(typeof why === 'string' ? why : null);
  }

  /* Two people in the same colour is a game where nobody can say who they saw,
     and everybody shares a browser profile often enough -- two tabs, a shared
     laptop, a saved default -- that it happens on the first try.

     Resolved by a rule rather than by asking: the lower peer id keeps the
     colour and everybody else moves. That is decided the same way on every
     device, so exactly one of a clashing pair moves and the two do not swap
     back and forth. It runs on a timer rather than once on arrival, because
     the person you clash with may not have arrived yet. */
  let clashCheck = 0;
  let lobbyTick = 0;
  function avoidColourClash() {
    if (!session.link || W.state.phase !== 'lobby') return;
    const taken = {};
    for (const peer of session.link.peers()) {
      if (peer.isMe || !peer.presence) continue;
      if (peer.id < session.myId) taken[peer.presence.c] = true;
    }
    const mine = NS.screens.profile.colorIdx;
    if (!taken[mine]) return;
    /* Anything anyone here is wearing is off the table, not just the colours
       of the people who outrank us -- otherwise we move onto a third person. */
    for (const peer of session.link.peers()) {
      if (peer.isMe || !peer.presence) continue;
      taken[peer.presence.c] = true;
    }
    for (let i = 0; i < C.COLORS.length; i++) {
      if (taken[i]) continue;
      NS.screens.profile.colorIdx = i;
      if (W.me) W.me.colorIdx = i;
      U.store.set('colour', i);
      send('act', { t: 'profile', c: i });
      NS.bits.toast('Somebody already had that colour. You are ' + C.COLORS[i].name + '.', 'info', 5);
      return;
    }
    NS.bits.toast('Every colour is taken.', 'warn', 5);
  }

  /* ---- lobby ------------------------------------------------------------- */

  function showLobby() {
    session.inGame = false;
    NS.screens.showLobby({ code: session.code });
    NS.screens.buildSettings(session.settings, session.isHost, changeSetting);
    refreshLobby();
  }

  function changeSetting(key, value) {
    if (!session.isHost) return;
    if (key.indexOf('role:') === 0) session.settings.roles[key.slice(5)] = value;
    else session.settings[key] = value;
    session.settings = C.sanitise(session.settings);
    NS.host.setSettings(session.settings);
    refreshLobby();
  }

  function changeBots(delta) {
    if (!session.isHost) return;
    const room = C.MAX_PLAYERS - NS.host.list().filter((id) => !NS.host.H.players[id].bot).length;
    session.botCount = U.clamp(session.botCount + delta, 0, Math.max(0, room));
    NS.bots.fill(session.botCount, NS.host);
    refreshLobby();
  }

  function toggleReady() {
    session.ready = !session.ready;
    send('act', { t: 'ready', v: session.ready });
    refreshLobby();
  }

  function refreshLobby() {
    if (session.inGame || !NS.screens.current || !NS.screens.current.classList.contains('screen--lobby')) return;
    const players = [];
    for (const p of W.players.values()) {
      if (!p.connected) continue;
      players.push({
        name: p.name, colorIdx: p.colorIdx, hatIdx: p.hatIdx, bot: p.bot,
        ready: p.ready, isHost: p.id === session.hostId,
      });
    }
    players.sort((a, b) => (b.isHost ? 1 : 0) - (a.isHost ? 1 : 0));
    NS.screens.updateLobby({
      code: session.code, isHost: session.isHost, players,
      bots: NS.bots.count(), ready: session.ready,
      connection: session.connection,
      blocked: session.isHost ? NS.host.canStart() : null,
    });
  }

  function startRound() {
    if (!session.isHost) return;
    NS.audio.wake();
    NS.host.start();
  }

  function backToLobby() {
    if (!session.isHost) return;
    NS.host.H.phase = 'lobby';
    NS.host.H.winner = null;
    NS.host.H.ejected = null;
    NS.host.H.bodies = [];
    for (const id of NS.host.list()) {
      NS.host.H.players[id].alive = true;
      NS.host.H.players[id].ghost = false;
      NS.host.H.players[id].ready = false;
    }
    NS.bots.resetForRound();
    NS.host.snapshot(true);
  }

  /* ---- incoming ---------------------------------------------------------- */

  function onMessage(msg) {
    if (!msg) return;
    if (msg.kind === 'act') {
      if (session.isHost) NS.host.handle(msg.from, msg.data);
      return;
    }
    if (msg.kind === 'sys') {
      /* Only the host speaks on this channel. Before the first snapshot the
         host is whoever sent one, and after that nobody else can. */
      if (!session.hostId) session.hostId = msg.from;
      if (msg.from !== session.hostId) return;
      applySys(msg.data);
      return;
    }
    if (msg.kind === 'chat') onChat(msg.from, msg.data);
  }

  function applySys(data) {
    if (!data || typeof data !== 'object') return;
    if (data.t === 'S') return applySnapshot(data);
    if (data.t === 'R') return takeRole(data);
    if (data.t === 'E') return onEvent(data);
  }

  function takeRole(data) {
    if (data.to !== session.myId) return;
    if (data.plain) return setRole(data.plain, !!data.clear);
    pendingRole = data;
    pendingRoleSince = U.now();
    tryPendingRole();
  }

  function tryPendingRole() {
