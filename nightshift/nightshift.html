    return roles;
  }

  /* Tasks. Everybody gets the same common tasks -- that is what makes them
     useful, since you can stand next to somebody and watch them do it -- and
     their own draw of short and long ones. */
  function dealTasks(playerIds, settings, rand) {
    const byType = { common: [], short: [], long: [] };
    for (const s of STATIONS) byType[s.type].push(s);

    const common = U.shuffle(byType.common, rand).slice(0, settings.commonTasks);
    const out = {};
    for (const id of playerIds) {
      const shorts = U.shuffle(byType.short, rand).slice(0, settings.shortTasks);
      const longs = U.shuffle(byType.long, rand).slice(0, settings.longTasks);
      out[id] = common.concat(shorts, longs).map((s) => ({
        sid: s.id, step: 0, steps: stepsOf(s), done: false,
      }));
    }
    return out;
  }

  /* The bar counts crew work only. An impostor's list is real enough to walk
     to and stand at -- that is the point of faking -- but finishing it moves
     nothing, and a jester finishing theirs would be helping the people they
     are trying to lose to. */
  function countable(roles) {
    return Object.keys(roles).filter((id) => C.ROLES[roles[id]].team === 'crew');
  }

  function taskTotals(tasks, roles) {
    let total = 0, done = 0;
    for (const id of countable(roles)) {
      for (const t of (tasks[id] || [])) {
        total += t.steps;
        done += Math.min(t.step, t.steps);
      }
    }
    return { total, done };
  }

  /* Called after every death, ejection and completed task. Returns null while
     the round is still live. */
  function winner(state) {
    const alive = [];
    for (const id in state.players) {
      const p = state.players[id];
      if (p.alive && p.connected) alive.push(id);
    }
    const team = (id) => C.ROLES[state.roles[id] || 'crewmate'].team;
    const impostors = alive.filter((id) => team(id) === 'impostor');
    const others = alive.filter((id) => team(id) !== 'impostor');

    if (!impostors.length) return { team: 'crew', reason: 'Every impostor is gone.' };

    const totals = taskTotals(state.tasks, state.roles);
    if (totals.total > 0 && totals.done >= totals.total) {
      return { team: 'crew', reason: 'The crew finished every task.' };
    }
    if (impostors.length >= others.length) {
      return { team: 'impostor', reason: 'The impostors outnumber the crew.' };
    }
    return null;
  }

  NS.rules = {
    stationById, stepsOf, impostorCap, dealRoles, dealTasks, taskTotals, winner, countable,
  };
})(window.NS);

</script>
<script>
/* Breaking the station on purpose.

   Sabotage is the impostor's real weapon and the kill is the finish. Its job
   is to move people: a reactor meltdown drags two of them across the map and
   leaves everywhere else empty, lights shrink what the crew can see without
   touching what the impostor can, and doors buy the ten seconds it takes to
   walk out of a room you should not have been in.

   Two of them are critical -- they end the round if they run out. The other
   two have no timer at all, which is what makes them insidious: nobody is
   forced to deal with them, so they get left, and a crew playing in the dark
   with no cameras is a crew that cannot prove anything. */

(function (NS) {
  'use strict';

  const M = NS.map;
  const U = NS.util;
  const SPOTS = M.SABOTAGE_SPOTS;

  const SABOTAGES = {
    reactor: {
      id: 'reactor', name: 'Reactor Meltdown', short: 'Reactor', critical: true, seconds: 45,
      room: 'reactor', fix: 'hold', spots: ['reactorLeft', 'reactorRight'],
      warn: 'Reactor meltdown. Two people, both pads, at the same time.',
      lose: 'The reactor melted down.',
    },
    oxygen: {
      id: 'oxygen', name: 'Oxygen Depleted', short: 'O2', critical: true, seconds: 45,
      room: 'o2', fix: 'code', spots: ['o2Left', 'o2Right'],
      warn: 'Oxygen is venting. Both keypads need the code.',
      lose: 'The station ran out of air.',
    },
    lights: {
      id: 'lights', name: 'Lights Out', short: 'Lights', critical: false, seconds: 0,
      room: 'electrical', fix: 'switches', spots: ['lights'],
      warn: 'The lights are out. The breakers are in Electrical.',
    },
    comms: {
      id: 'comms', name: 'Comms Sabotaged', short: 'Comms', critical: false, seconds: 0,
      room: 'comms', fix: 'tune', spots: ['comms'],
      warn: 'Communications are down. No task list, no cameras, no vitals.',
    },
    doors: {
      id: 'doors', name: 'Doors Sealed', short: 'Doors', critical: false, seconds: 12,
      room: null, fix: null, spots: [],
      warn: 'Doors sealed.',
    },
  };

  /* The order the sabotage menu is drawn in, and the only ones an impostor may
     ask for. Doors are picked by room instead, so they are not in this list. */
  const MENU = ['reactor', 'oxygen', 'lights', 'comms'];

  const REACH = 74;

  /* Which fix point, if any, you are standing at -- for the live sabotage
     only. Standing on the reactor pad when the reactor is fine does nothing,
     and the Use button should not claim otherwise. */
  function fixAt(x, y) {
    const active = NS.world.state.sabotage;
    if (!active) return null;
    const def = SABOTAGES[active.kind];
    if (!def || !def.fix) return null;
    for (let i = 0; i < def.spots.length; i++) {
      if (active.done && active.done[i]) continue;
      const spot = SPOTS[def.spots[i]];
      const w = M.toWorld(spot);
      if (U.dist2(x, y, w.x, w.y) < REACH * REACH) {
        return { kind: active.kind, def, index: i, x: w.x, y: w.y, spot };
      }
    }
    return null;
  }

  /* Every fix point on the map for the live sabotage, so the HUD can point at
     the one you are not standing on. */
  function activeSpots() {
    const active = NS.world.state.sabotage;
    if (!active) return [];
    const def = SABOTAGES[active.kind];
    if (!def) return [];
    return def.spots.map((key, i) => {
      const w = M.toWorld(SPOTS[key]);
      return { x: w.x, y: w.y, index: i, done: !!(active.done && active.done[i]) };
    });
  }

  /* Vision multiplier the lights sabotage applies. Impostors are untouched --
     that asymmetry is the entire point of the sabotage, and a crew that does
     not know about it thinks the impostor got lucky. */
  function visionScale(isImpostor) {
    const active = NS.world.state.sabotage;
    if (!active || active.kind !== 'lights') return 1;
    return isImpostor ? 1 : 0.42;
  }

  const commsDown = () => {
    const a = NS.world.state.sabotage;
    return !!(a && a.kind === 'comms');
  };

  NS.sabotage = { SABOTAGES, MENU, fixAt, activeSpots, visionScale, commsDown, REACH };
})(window.NS);

</script>
<script>
/* Everything this device believes about the station right now.

   Split by who owns what, because getting that wrong is what makes a
   multiplayer game feel broken:

     - **You own your own position.** You walk locally at full frame rate and
       tell everyone where you ended up. Nothing round-trips before you move,
       so the game feels the same on a slow school wifi as on a wire.
     - **The host owns everything that can be argued about.** Who is alive,
       whose task counted, who is on trial. Those arrive as snapshots and this
       file only ever mirrors them -- it never decides one for itself.

   The seam matters: a client that decided locally that its kill landed would
   show a body that the rest of the room does not have. So a kill here is a
   request, and the body appears when the host says it did. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;

  const BASE_SPEED = 168;        // px per second at speed 1.0
  const GHOST_BONUS = 1.18;

  const world = {
    me: null,
    players: new Map(),          // id -> entity, real and bot alike
    bodies: [],
    state: {
      phase: 'lobby', seq: 0, settings: C.defaults(),
      tasksDone: 0, tasksTotal: 0, sabotage: null, meeting: null,
      ejected: null, winner: null, closedRooms: [],
    },
    myRole: null,
    myTasks: [],
    hostId: null,
    localAlive: true,
    /* Set while a minigame, the map or a meeting is up: you stop walking but
       the world does not stop moving around you. */
    frozen: false,
  };

  function entity(id, opts) {
    return Object.assign({
      id, name: 'Someone', colorIdx: 0, hatIdx: 0,
      x: 0, y: 0, tx: 0, ty: 0, dir: 1, moving: false, bob: 0, walk: 0,
      alive: true, ghost: false, inVent: false, invisible: false,
      shiftIdx: -1, shielded: false, connected: true, bot: false, isMe: false,
      lastSeen: 0, trail: [],
    }, opts || {});
  }

  function reset() {
    world.players.clear();
    world.bodies.length = 0;
    world.me = null;
    world.myRole = null;
    world.myTasks = [];
    world.state.phase = 'lobby';
    world.state.winner = null;
    world.state.sabotage = null;
    world.state.meeting = null;
    world.state.ejected = null;
    M.clearDoors();
  }

  function spawnMe(id, profile) {
    const spot = M.toWorld(M.SPAWN);
    world.me = entity(id, {
      isMe: true,
      name: profile.name,
      colorIdx: profile.colorIdx,
      hatIdx: profile.hatIdx,
      x: spot.x, y: spot.y, tx: spot.x, ty: spot.y,
    });
    world.players.set(id, world.me);
    return world.me;
  }

  /* Everyone stands in a ring around the emergency table at the start of a
     round and after every meeting. Ordering by id rather than by join order
     means every device puts the same person in the same place, so a screenshot
     of the drop matches on all fourteen screens. */
  function placeAtSpawn(ids) {
    const order = ids.slice().sort();
    const centre = M.toWorld(M.SPAWN);
    order.forEach((id, i) => {
      const p = world.players.get(id);
      if (!p) return;
      const a = (i / Math.max(1, order.length)) * Math.PI * 2 - Math.PI / 2;
      const r = M.SPAWN.radius * M.TILE;
      p.x = p.tx = centre.x + Math.cos(a) * r;
      p.y = p.ty = centre.y + Math.sin(a) * r * 0.72;
      p.dir = Math.cos(a) >= 0 ? 1 : -1;
      p.trail.length = 0;
    });
  }

  /* ---- presence: the compact form of a player ---------------------------- */

  function encode(me) {
    return {
      n: me.name, c: me.colorIdx, h: me.hatIdx,
      x: Math.round(me.x), y: Math.round(me.y),
      d: me.dir, m: me.moving ? 1 : 0,
      v: me.inVent ? 1 : 0, i: me.invisible ? 1 : 0,
      s: me.shiftIdx,
    };
  }

  /* Presence arrives from strangers on a public bus. Every field is clamped
     to something drawable here rather than trusted -- an x of NaN would take
     the camera with it, and a name of ten thousand characters would take the
     frame rate. */
  function adopt(id, raw, isMe) {
    if (!raw || typeof raw !== 'object') return null;
    let p = world.players.get(id);
    if (!p) {
      p = entity(id, { isMe: !!isMe });
      const spot = M.toWorld(M.SPAWN);
      p.x = p.tx = spot.x; p.y = p.ty = spot.y;
      world.players.set(id, p);
    }
    if (p.isMe) return p;        // never let the wire move you
    p.name = U.cleanName(raw.n, C.NAME_MAX) || 'Someone';
    p.colorIdx = U.clamp(raw.c | 0, 0, C.COLORS.length - 1);
    p.hatIdx = U.clamp(raw.h | 0, 0, C.HATS.length - 1);
    const nx = Number(raw.x), ny = Number(raw.y);
    if (Number.isFinite(nx) && Number.isFinite(ny)) {
      p.tx = U.clamp(nx, 0, M.pixelWidth);
      p.ty = U.clamp(ny, 0, M.pixelHeight);
    }
    p.dir = raw.d < 0 ? -1 : 1;
    p.moving = !!raw.m;
    p.inVent = !!raw.v;
    p.invisible = !!raw.i;
    p.shiftIdx = Number.isFinite(raw.s) ? U.clamp(raw.s | 0, -1, C.COLORS.length - 1) : -1;
    p.lastSeen = U.now();
    return p;
  }

  /* Bots ride in the host's own presence rather than in the snapshot: the
     snapshot goes out twice a second, which is fine for who is alive and
     terrible for where somebody is standing. Four numbers each, so a full
     lobby of bots costs about the same as one more player. */
  function encodeBots(bots) {
    return bots.map((b) => [Math.round(b.x), Math.round(b.y), b.dir, b.moving ? 1 : 0]);
  }
  function adoptBots(raw) {
    if (!Array.isArray(raw)) return;
    for (let i = 0; i < raw.length; i++) {
      const row = raw[i];
      if (!Array.isArray(row)) continue;
      const p = world.players.get('bot' + i);
      if (!p || p.isMe) continue;
      const nx = Number(row[0]), ny = Number(row[1]);
      if (Number.isFinite(nx) && Number.isFinite(ny)) {
        p.tx = U.clamp(nx, 0, M.pixelWidth);
        p.ty = U.clamp(ny, 0, M.pixelHeight);
      }
      p.dir = row[2] < 0 ? -1 : 1;
      p.moving = !!row[3];
      p.lastSeen = U.now();
    }
  }

  /* ---- walking ----------------------------------------------------------- */

  function speedFor(p) {
    const s = world.state.settings.playerSpeed * BASE_SPEED;
    return p.ghost ? s * GHOST_BONUS : s;
  }

  function canWalk() {
    const st = world.state;
    if (world.frozen) return false;
    if (st.phase === 'meeting' || st.phase === 'end' || st.phase === 'reveal') return false;
    if (!world.me) return false;
    if (world.me.inVent) return false;
    return true;
  }

  function step(dt, input) {
    const me = world.me;
    if (!me) return;

    if (canWalk() && (input.x || input.y)) {
      const len = Math.hypot(input.x, input.y) || 1;
      const speed = speedFor(me) * dt;
      const dx = (input.x / len) * speed;
      const dy = (input.y / len) * speed;
      /* Ghosts walk through the station; that is the whole compensation for
         being dead, and it is what makes finishing tasks as a ghost bearable. */
      if (me.ghost) {
        me.x = U.clamp(me.x + dx, 8, M.pixelWidth - 8);
        me.y = U.clamp(me.y + dy, 8, M.pixelHeight - 8);
      } else {
        const moved = M.move(me.x, me.y, dx, dy);
        me.x = moved.x;
        me.y = moved.y;
      }
      me.moving = true;
      if (dx > 0.02) me.dir = 1;
      else if (dx < -0.02) me.dir = -1;
      if (!me.ghost && !me.inVent) NS.audio.play('step');
    } else {
      me.moving = false;
    }
    me.tx = me.x; me.ty = me.y;

    /* Everyone else is drawn where they were last heard from, eased rather
       than snapped. Fourteen at ten updates a second is a stutter without
       this, and a rubber band with too much of it. */
    const ease = Math.min(1, dt * 15);
    for (const p of world.players.values()) {
      if (p.isMe) continue;
      const far = U.dist2(p.x, p.y, p.tx, p.ty);
      if (far > 240 * 240) { p.x = p.tx; p.y = p.ty; p.trail.length = 0; }  // vented, ejected, or a meeting
      else { p.x += (p.tx - p.x) * ease; p.y += (p.ty - p.y) * ease; }
    }

    for (const p of world.players.values()) {
      p.walk += (p.moving ? dt * 9 : 0);
      p.bob = p.moving ? Math.sin(p.walk) * 1.6 : 0;
    }
  }

  /* ---- what is within reach --------------------------------------------- */

  const USE_RANGE = 62;

  function myTask(sid) {
    return world.myTasks.find((t) => t.sid === sid && !t.done) || null;
  }

  /* The step of a task you are on decides where it wants you next, so a
     two-stop task shows its console only at the stop you owe. */
  function taskSpot(task) {
    const station = NS.rules.stationById[task.sid];
    if (!station) return null;
    const spot = station.steps ? station.steps[Math.min(task.step, station.steps.length - 1)] : station;
    return M.toWorld(spot);
  }

  function nearestVent() {
    if (!world.me) return null;
    let best = null, bestD = USE_RANGE * USE_RANGE;
    NS.map.VENT_GROUPS.forEach((group, gi) => {
      group.forEach((v, vi) => {
        const w = M.toWorld(v);
        const d = U.dist2(world.me.x, world.me.y, w.x, w.y);
        if (d < bestD) { bestD = d; best = { group: gi, index: vi, x: w.x, y: w.y }; }
      });
    });
    return best;
  }

  function nearestBody() {
    if (!world.me) return null;
    let best = null, bestD = (USE_RANGE + 20) * (USE_RANGE + 20);
    for (const b of world.bodies) {
      const d = U.dist2(world.me.x, world.me.y, b.x, b.y);
      if (d < bestD) { bestD = d; best = b; }
    }
    return best;
  }

  function killTarget() {
    const me = world.me;
    if (!me || !world.myRole || !C.ROLES[world.myRole].kill) return null;
    if (!me.alive || me.invisible) return null;
    const range = C.KILL_RANGE[world.state.settings.killRange] || C.KILL_RANGE.Normal;
    let best = null, bestD = range * range;
    for (const p of world.players.values()) {
      if (p.isMe || !p.alive || p.ghost || p.inVent) continue;
      if (world.teamOf(p.id) === 'impostor') continue;
      const d = U.dist2(me.x, me.y, p.x, p.y);
      if (d < bestD && NS.los.clear(me.x, me.y, p.x, p.y)) { bestD = d; best = p; }
    }
    return best;
  }

  world.teamOf = function (id) {
    if (world.state.roles && world.state.roles[id]) return C.ROLES[world.state.roles[id]].team;
    if (id === (world.me && world.me.id)) return C.ROLES[world.myRole || 'crewmate'].team;
    return null;
  };

  /* The one contextual action, resolved every frame. Among Us has a fixed set
     of buttons and greys out the ones that do not apply; the same idea, but
     the Use button also has to say what it is about to do, because on a phone
     there is no hover to explain it. */
  function context() {
    const me = world.me;
    const out = { use: null, report: null, kill: null, vent: null, emergency: null, sabotageFix: null };
    if (!me) return out;
    const st = world.state;
    const playing = st.phase === 'play';
    if (!playing) return out;

    if (!me.inVent) {
      for (const task of world.myTasks) {
        if (task.done) continue;
        const spot = taskSpot(task);
        if (!spot) continue;
        if (U.dist2(me.x, me.y, spot.x, spot.y) < USE_RANGE * USE_RANGE) {
          out.use = { kind: 'task', task, station: NS.rules.stationById[task.sid], x: spot.x, y: spot.y };
          break;
        }
      }
      if (!out.use && !me.ghost) {
        const button = M.toWorld(M.EMERGENCY);
        if (U.dist2(me.x, me.y, button.x, button.y) < (USE_RANGE + 16) * (USE_RANGE + 16)) {
          out.emergency = { x: button.x, y: button.y };
        }
      }
      if (!me.ghost) {
        const fix = NS.sabotage.fixAt(me.x, me.y);
        if (fix) out.sabotageFix = fix;
      }
    }

    if (me.alive && !me.ghost) {
      const canVent = world.myRole && (C.ROLES[world.myRole].kill || C.ROLES[world.myRole].ability === 'vent');
      if (canVent) {
        if (me.inVent) out.vent = { kind: 'exit' };
        else {
          const v = nearestVent();
          if (v) out.vent = Object.assign({ kind: 'enter' }, v);
        }
      }
      if (!me.inVent) {
        out.report = nearestBody();
        out.kill = killTarget();
      }
    }
    return out;
  }

  Object.assign(world, {
    entity, reset, spawnMe, placeAtSpawn, encode, adopt, encodeBots, adoptBots,
    step, context, nearestVent, nearestBody, killTarget, myTask, taskSpot,
    speedFor, canWalk, USE_RANGE, BASE_SPEED,
    alivePlayers() {
      const out = [];
      for (const p of world.players.values()) if (p.alive && p.connected) out.push(p);
      return out;
    },
  });

  NS.world = world;
})(window.NS);

</script>
<script>
/* Drawing a person.

   Everything is drawn with paths rather than sprites, which is what lets a
   colour, a hat and a walk cycle combine freely -- fourteen colours by twelve
   hats is a spritesheet nobody wants to maintain, and the shading has to
   change with the colour anyway or the dark suits read as holes in the floor.

   The silhouette is the readable thing at the size these are on screen, so it
   is the part that got the attention: a wide flat base, a high shoulder, and a
   visor that sits proud of the head. You should be able to tell who is who
   from the shape alone at the edge of the light, before the colour resolves. */

(function (NS) {
  'use strict';

  const C = NS.config;

  /* Rounded rectangles by hand: ctx.roundRect is recent enough that a school
     iPad might not have it, and this is four lines. */
  function rr(ctx, x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  const BODY_W = 27;
  const BODY_H = 34;
  const LEG_H = 8;

  /* The bean. Drawn facing right and mirrored for the other direction, so
     there is one shape to get right rather than two to keep matching. */
  function beanPath(ctx, w, h) {
    const halfW = w / 2;
    ctx.beginPath();
    ctx.moveTo(-halfW, 0);
    ctx.lineTo(-halfW, -h * 0.42);
    ctx.bezierCurveTo(-halfW, -h * 0.86, -halfW * 0.72, -h, 0, -h);
    ctx.bezierCurveTo(halfW * 0.86, -h, halfW, -h * 0.82, halfW, -h * 0.44);
    ctx.lineTo(halfW, 0);
    ctx.closePath();
  }

  function shade(ctx, colour, h) {
    const g = ctx.createLinearGradient(0, -h, 0, 0);
    g.addColorStop(0, colour.rim);
    g.addColorStop(0.34, colour.body);
    g.addColorStop(1, colour.dark);
    return g;
  }

  /* ---- hats -------------------------------------------------------------- */

  /* Each hat is drawn at the top of the head, in a space where (0,0) is the
     crown and x grows the way the player faces. */
  const HAT_ART = {
    none() {},
    hardhat(ctx) {
      ctx.fillStyle = '#f2b134';
      ctx.beginPath();
      ctx.ellipse(0, 1, 15, 5, 0, Math.PI, 0);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(0, 1, 11, 10, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#d1941f';
      ctx.fillRect(-1.6, -9, 3.2, 10);
    },
    beanie(ctx) {
      ctx.fillStyle = '#c0523f';
      ctx.beginPath();
      ctx.ellipse(0, 1, 12, 11, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#e8e2d4';
      rr(ctx, -12.5, -1, 25, 5, 2.5); ctx.fill();
      ctx.fillStyle = '#e8e2d4';
      ctx.beginPath(); ctx.arc(0, -12, 4, 0, Math.PI * 2); ctx.fill();
    },
    headset(ctx) {
      ctx.strokeStyle = '#2b3348'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 2, 12, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
      ctx.fillStyle = '#39435c';
      rr(ctx, -14.5, 0, 6, 10, 3); ctx.fill();
      rr(ctx, 8.5, 0, 6, 10, 3); ctx.fill();
      ctx.strokeStyle = '#39435c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(11, 9); ctx.quadraticCurveTo(15, 15, 9, 17); ctx.stroke();
      ctx.fillStyle = '#34e0b8';
      ctx.beginPath(); ctx.arc(8, 17.5, 2.2, 0, Math.PI * 2); ctx.fill();
    },
    antenna(ctx) {
      ctx.strokeStyle = '#8d97ad'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 2); ctx.quadraticCurveTo(4, -8, 1, -16); ctx.stroke();
      ctx.fillStyle = '#ff3f5b';
      ctx.beginPath(); ctx.arc(1, -18, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,63,91,0.35)';
      ctx.beginPath(); ctx.arc(1, -18, 6.5, 0, Math.PI * 2); ctx.fill();
    },
    crown(ctx) {
      ctx.fillStyle = '#f0c04a';
      ctx.beginPath();
      ctx.moveTo(-11, 2); ctx.lineTo(-11, -7); ctx.lineTo(-5.5, -2); ctx.lineTo(0, -10);
      ctx.lineTo(5.5, -2); ctx.lineTo(11, -7); ctx.lineTo(11, 2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff3f5b';
      ctx.beginPath(); ctx.arc(0, -1, 2, 0, Math.PI * 2); ctx.fill();
    },
    flower(ctx) {
      ctx.strokeStyle = '#4ca85c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-6, 3); ctx.quadraticCurveTo(-9, -4, -7, -9); ctx.stroke();
      ctx.fillStyle = '#f18fb0';
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        ctx.beginPath(); ctx.ellipse(-7 + Math.cos(a) * 4, -10 + Math.sin(a) * 4, 3.4, 3.4, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#f0c04a';
      ctx.beginPath(); ctx.arc(-7, -10, 2.6, 0, Math.PI * 2); ctx.fill();
    },
    cap(ctx) {
      ctx.fillStyle = '#3d6fe0';
      ctx.beginPath(); ctx.ellipse(0, 2, 12, 10, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#2b52ab';
      rr(ctx, -17, -1, 8, 4.5, 2); ctx.fill();
      ctx.fillStyle = '#e8e2d4';
      ctx.beginPath(); ctx.arc(2, -6, 2, 0, Math.PI * 2); ctx.fill();
    },
    halo(ctx) {
      ctx.strokeStyle = '#ffd77a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0, -10, 11, 3.6, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,215,122,0.28)'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.ellipse(0, -10, 11, 3.6, 0, 0, Math.PI * 2); ctx.stroke();
    },
    cone(ctx) {
      ctx.fillStyle = '#ff7a3d';
      ctx.beginPath(); ctx.moveTo(-9, 2); ctx.lineTo(0, -17); ctx.lineTo(9, 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8e2d4';
      ctx.beginPath(); ctx.moveTo(-6.2, -5); ctx.lineTo(-4.4, -9); ctx.lineTo(4.4, -9); ctx.lineTo(6.2, -5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#d1541f';
      rr(ctx, -11, 0, 22, 4, 1.5); ctx.fill();
    },
    plant(ctx) {
      ctx.fillStyle = '#a3603c';
      ctx.beginPath(); ctx.moveTo(-8, 3); ctx.lineTo(-6, -6); ctx.lineTo(6, -6); ctx.lineTo(8, 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#4ca85c';
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.ellipse(i * 5, -12 - Math.abs(i) * -2, 3.6, 8, i * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    },
    band(ctx) {
      ctx.fillStyle = '#ff3f5b';
      rr(ctx, -13, -1, 26, 5.5, 2.5); ctx.fill();
      ctx.strokeStyle = '#ff3f5b'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-12, 2); ctx.quadraticCurveTo(-19, 5, -16, 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-12, 3); ctx.quadraticCurveTo(-21, 9, -14, 15); ctx.stroke();
    },
  };

  function drawHat(ctx, hatIdx, dir) {
    const hat = C.HATS[hatIdx];
    if (!hat || hat.id === 'none') return;
    const art = HAT_ART[hat.id];
    if (!art) return;
    ctx.save();
    ctx.scale(dir, 1);
    art(ctx);
    ctx.restore();
  }

  /* ---- the player -------------------------------------------------------- */

  /* `p` is a world entity. `opts.alpha` dims a peer standing in your light's
     falloff; `opts.outline` is the teammate glow an impostor sees on another
     impostor, and the only information the renderer adds that the game did
     not already know. */
  function drawPlayer(ctx, p, opts) {
    const o = opts || {};
    const colour = C.colorById((C.COLORS[p.shiftIdx >= 0 ? p.shiftIdx : p.colorIdx] || C.COLORS[0]).id);
    const scale = o.scale || 1;
    const ghost = p.ghost;
    const alpha = o.alpha == null ? 1 : o.alpha;
    if (alpha <= 0.02) return;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha * (ghost ? 0.46 : (p.invisible ? 0.16 : 1));

    const walk = p.walk || 0;
    const bob = ghost ? Math.sin(walk * 0.35 + p.x * 0.01) * 2.6 : (p.bob || 0);

    if (!ghost) {
      ctx.fillStyle = 'rgba(0,0,0,0.42)';
      ctx.beginPath();
      ctx.ellipse(0, 2, BODY_W * 0.52, 5.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.translate(0, bob);

    if (o.outline) {
      ctx.save();
      ctx.strokeStyle = o.outline;
      ctx.lineWidth = 5;
      ctx.globalAlpha = alpha * 0.55;
      ctx.scale(p.dir, 1);
      beanPath(ctx, BODY_W, BODY_H);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.scale(p.dir, 1);

    if (!ghost) {
      /* Legs first, so the body overlaps them at the hip. */
      const swing = p.moving ? Math.sin(walk) * 3.4 : 0;
      ctx.fillStyle = colour.dark;
      rr(ctx, -9.5, -LEG_H + swing * 0.2, 8, LEG_H + 2 + swing, 3.4); ctx.fill();
      rr(ctx, 1.5, -LEG_H - swing * 0.2, 8, LEG_H + 2 - swing, 3.4); ctx.fill();
    }

    /* Backpack, behind the body and on the side away from the face. */
    ctx.fillStyle = colour.dark;
    rr(ctx, -BODY_W / 2 - 6.5, -BODY_H * 0.76, 8, BODY_H * 0.46, 4);
    ctx.fill();

    if (ghost) {
      /* A tail instead of legs: three scallops that drift with the bob. */
      ctx.fillStyle = shade(ctx, colour, BODY_H);
      ctx.beginPath();
      ctx.moveTo(-BODY_W / 2, -BODY_H * 0.42);
      ctx.bezierCurveTo(-BODY_W / 2, -BODY_H * 0.86, -BODY_W * 0.36, -BODY_H, 0, -BODY_H);
      ctx.bezierCurveTo(BODY_W * 0.43, -BODY_H, BODY_W / 2, -BODY_H * 0.82, BODY_W / 2, -BODY_H * 0.44);
      ctx.lineTo(BODY_W / 2, -2);
      for (let i = 0; i < 3; i++) {
        const x0 = BODY_W / 2 - (i * BODY_W) / 3;
        ctx.quadraticCurveTo(x0 - BODY_W / 6, 5 + Math.sin(walk * 0.5 + i) * 2.4, x0 - BODY_W / 3, -2);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = shade(ctx, colour, BODY_H);
      beanPath(ctx, BODY_W, BODY_H);
      ctx.fill();
      /* A rim on the lit side keeps Ink and Slate off the floor colour. */
      ctx.strokeStyle = colour.rim;
      ctx.globalAlpha *= 0.5;
      ctx.lineWidth = 1.6;
      ctx.save();
      ctx.clip();
      beanPath(ctx, BODY_W, BODY_H);
      ctx.translate(1.6, -1.6);
      ctx.stroke();
      ctx.restore();
      ctx.globalAlpha /= 0.5;
    }

    /* Visor. The glint is a fixed highlight rather than a reflection of
       anything -- it reads as glass and costs one arc. */
    const vx = 4.2, vy = -BODY_H + 12.5;
    const vg = ctx.createLinearGradient(vx - 8, vy - 7, vx + 8, vy + 7);
    vg.addColorStop(0, '#cfe4f5');
    vg.addColorStop(0.5, '#8fb4d4');
    vg.addColorStop(1, '#5d7f9e');
    ctx.fillStyle = vg;
    ctx.beginPath();
    ctx.ellipse(vx, vy, 11.5, 8, -0.06, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(11,16,26,0.5)';
    ctx.beginPath();
    ctx.ellipse(vx, vy, 11.5, 8, -0.06, Math.PI * 0.15, Math.PI * 0.72);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.ellipse(vx - 3.6, vy - 2.8, 3.6, 2.4, -0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    ctx.save();
    ctx.translate(0, -BODY_H - 1);
    drawHat(ctx, p.hatIdx, p.dir);
    ctx.restore();

    if (p.shielded) {
      ctx.strokeStyle = 'rgba(52,224,184,0.75)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, -BODY_H * 0.5, BODY_W * 0.82, BODY_H * 0.72, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  /* A body reads as a person who fell, not as a prop: same bean, tipped, with
     the visor still catching light. The stain is small on purpose -- this gets
     played in classrooms. */
  function drawBody(ctx, body) {
    const colour = C.COLORS[body.colorIdx] || C.COLORS[0];
    ctx.save();
    ctx.translate(body.x, body.y);

    ctx.fillStyle = 'rgba(120,18,32,0.42)';
    ctx.beginPath();
    ctx.ellipse(0, 3, 26, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(160,26,44,0.5)';
    ctx.beginPath();
    ctx.ellipse(-9, 5, 11, 4.5, 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.scale(body.facing < 0 ? -1 : 1, 1);
    ctx.rotate(-Math.PI / 2);
    ctx.translate(0, 9);

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 2, BODY_W * 0.5, 5, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = colour.dark;
    rr(ctx, -BODY_W / 2 - 6, -BODY_H * 0.7, 7.5, BODY_H * 0.42, 3.6); ctx.fill();
    ctx.fillStyle = shade(ctx, colour, BODY_H);
    beanPath(ctx, BODY_W, BODY_H * 0.82);
    ctx.fill();

    ctx.fillStyle = '#7e9ab5';
    ctx.beginPath();
    ctx.ellipse(4, -BODY_H * 0.82 + 11, 10, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(11,16,26,0.55)';
    ctx.beginPath();
    ctx.ellipse(4, -BODY_H * 0.82 + 11, 10, 7, 0, Math.PI * 0.1, Math.PI * 0.8);
    ctx.fill();

    ctx.restore();
  }

  /* The lobby, the meeting grid and the role card all need a portrait. Same
     drawing, standing still, centred in a box of `size`. */
  /* The drawing's origin is the feet, and a hat reaches about 22 above the
     head, so the content runs from -(BODY_H + 22) to +6. Centring on the body
     alone -- which is what this did at first -- crops every hat against the
     top of the box. */
  const AVATAR_TOP = BODY_H + 24;
  const AVATAR_BOTTOM = 7;
  function drawAvatar(ctx, colorIdx, hatIdx, size, opts) {
    const o = opts || {};
    const scale = size / (AVATAR_TOP + AVATAR_BOTTOM);
    ctx.save();
    ctx.translate(0, ((AVATAR_TOP - AVATAR_BOTTOM) / 2) * scale);
    drawPlayer(ctx, {
      x: 0, y: 0, dir: 1, colorIdx, hatIdx, shiftIdx: -1,
      moving: false, walk: 0, bob: 0, ghost: !!o.ghost, alive: !o.ghost,
    }, { scale, alpha: o.alpha == null ? 1 : o.alpha, outline: o.outline });
    ctx.restore();
  }

  NS.characters = { drawPlayer, drawBody, drawAvatar, drawHat, rr, BODY_W, BODY_H, beanPath };
})(window.NS);

</script>
<script>
/* Painting Aurora-7, once.

   The map never changes during a round, so it is drawn a single time into an
   offscreen canvas the size of the whole station and blitted from every frame
   after that. Three and a half thousand by two thousand pixels is about thirty
   megabytes: one large allocation at load, against redrawing two and a half
   thousand floor tiles sixty times a second on a phone. Only what actually
   moves -- players, doors, particles, the dark -- is drawn live.

   The room styling is not decoration. Every room has to be recognisable from
   a two-second glimpse at the edge of somebody's light, because that glimpse
   is the entire evidence base of an argument two minutes later. So floors
   differ by wing, each room has one silhouette nothing else has, and the
   labels are set large enough to read at a glance and faint enough to stay
   out of the way. */

(function (NS) {
  'use strict';

  const M = NS.map;
  const T = M.TILE;
  const U = NS.util;
  const rr = NS.characters.rr;

  const HULL = '#1b2436';
  const HULL_EDGE = '#2c3648';
  const KEYLINE = '#3a4761';

  const TONES = {
    clean: { floor: '#232d40', accent: '#37e0c8' },
    plain: { floor: '#1e2739', accent: '#8d97ad' },
    cold:  { floor: '#1c2a3d', accent: '#4d9fd6' },
    hot:   { floor: '#2a2634', accent: '#ffb03a' },
    hall:  { floor: '#171f2e', accent: '#8d97ad' },
  };

  let canvas = null;
  let ctx = null;
  let built = false;

  const px = (t) => t * T;

  /* ---- small parts, reused by the rooms ---------------------------------- */

  function panel(x, y, w, h, fill) {
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    rr(ctx, x - 2, y + 5, w + 4, h, 5); ctx.fill();
    ctx.fillStyle = fill || '#2c3648';
    rr(ctx, x, y, w, h, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    rr(ctx, x + 2, y + 2, w - 4, 4, 2); ctx.fill();
  }

  function screen(x, y, w, h, accent, style) {
    panel(x, y, w, h);
    ctx.fillStyle = '#0d1320';
    rr(ctx, x + 4, y + 4, w - 8, h - 12, 3); ctx.fill();
    ctx.save();
    rr(ctx, x + 4, y + 4, w - 8, h - 12, 3); ctx.clip();
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.8;
    if (style === 'bars') {
      const n = Math.max(3, Math.floor((w - 12) / 11));
      for (let i = 0; i < n; i++) {
        const bh = (h - 20) * (0.25 + ((i * 47) % 13) / 17);
        ctx.fillRect(x + 8 + i * ((w - 16) / n), y + h - 12 - bh, (w - 16) / n - 3, bh);
      }
    } else if (style === 'wave') {
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = accent; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= w - 12; i += 3) {
        const yy = y + (h - 12) / 2 + Math.sin(i * 0.14) * (h - 22) * 0.3;
        if (i === 0) ctx.moveTo(x + 6 + i, yy); else ctx.lineTo(x + 6 + i, yy);
      }
      ctx.stroke();
    } else {
      for (let i = 0; i < 4; i++) {
        const lw = (w - 16) * [0.9, 0.55, 0.75, 0.4][i];
        if (y + 9 + i * 7 > y + h - 14) break;
        ctx.fillRect(x + 8, y + 9 + i * 7, lw, 2.6);
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.1;
    rr(ctx, x + 4, y + 4, w - 8, h - 12, 3); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function crate(x, y, size, tint) {
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    rr(ctx, x - 2, y + 5, size + 4, size, 3); ctx.fill();
    ctx.fillStyle = tint || '#3a4560';
    rr(ctx, x, y, size, size, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.32)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 5, y + size / 2); ctx.lineTo(x + size - 5, y + size / 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(x + 4, y + 4, size - 8, 3);
  }

  function pipe(x, y, len, vertical, tint) {
    ctx.strokeStyle = tint || '#39435c';
    ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(vertical ? x : x + len, vertical ? y + len : y);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(vertical ? x - 2.6 : x, vertical ? y : y - 2.6);
    ctx.lineTo(vertical ? x - 2.6 : x + len, vertical ? y + len : y - 2.6);
    ctx.stroke();
    ctx.fillStyle = '#4a5570';
    const steps = Math.max(1, Math.floor(len / 70));
    for (let i = 1; i <= steps; i++) {
      const cx = vertical ? x : x + (len / (steps + 1)) * i;
      const cy = vertical ? y + (len / (steps + 1)) * i : y;
      rr(ctx, cx - 7.5, cy - 5.5, 15, 11, 2); ctx.fill();
    }
  }

  /* A window onto the outside. The only warm thing in the game is a planet
     nobody on board is going to reach. */
  function viewport(x, y, w, h, rand) {
    ctx.fillStyle = '#05070d';
    rr(ctx, x, y, w, h, 6); ctx.fill();
    ctx.save();
    rr(ctx, x, y, w, h, 6); ctx.clip();
    for (let i = 0; i < w * h / 900; i++) {
      const sx = x + rand() * w, sy = y + rand() * h, r = rand();
      ctx.fillStyle = r > 0.9 ? 'rgba(230,240,255,0.9)' : 'rgba(160,185,220,0.45)';
      ctx.fillRect(sx, sy, r > 0.9 ? 2 : 1.3, r > 0.9 ? 2 : 1.3);
    }
    const g = ctx.createRadialGradient(x + w * 0.78, y + h * 1.25, 8, x + w * 0.78, y + h * 1.25, h * 1.5);
    g.addColorStop(0, 'rgba(255,176,58,0.5)');
    g.addColorStop(0.45, 'rgba(190,90,60,0.28)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x + w * 0.78, y + h * 1.25, h * 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#3a4761'; ctx.lineWidth = 5;
    rr(ctx, x, y, w, h, 6); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1.5;
    rr(ctx, x + 3, y + 3, w - 6, h - 6, 4); ctx.stroke();
  }

  function hazardStripe(x, y, w, h) {
    ctx.save();
    rr(ctx, x, y, w, h, 2); ctx.clip();
    ctx.fillStyle = '#3a3320';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,176,58,0.55)';
    for (let i = -h; i < w; i += 22) {
      ctx.beginPath();
      ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y);
      ctx.lineTo(x + i + h + 11, y); ctx.lineTo(x + i + 11, y + h);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function floorGlyph(cx, cy, r, accent, alpha) {
    ctx.strokeStyle = accent;
    ctx.globalAlpha = alpha == null ? 0.16 : alpha;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.62, 0.4, Math.PI * 1.4); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* ---- the rooms --------------------------------------------------------- */

  /* Each takes the room's pixel rectangle. Everything is positioned from the
     room's own edges so a layout tweak in world/map.js does not leave the
     furniture behind in empty space. */
  const ROOM_ART = {
    reactor(r, rand) {
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      const g = ctx.createRadialGradient(cx, cy, 6, cx, cy, 118);
      g.addColorStop(0, 'rgba(255,176,58,0.5)');
      g.addColorStop(0.5, 'rgba(255,110,50,0.16)');
      g.addColorStop(1, 'rgba(255,110,50,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - 130, cy - 130, 260, 260);
      ctx.fillStyle = '#2c3648';
      ctx.beginPath(); ctx.arc(cx, cy, 62, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a2130';
      ctx.beginPath(); ctx.arc(cx, cy, 52, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffb03a';
      ctx.beginPath(); ctx.arc(cx, cy, 34, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe0a8';
      ctx.beginPath(); ctx.arc(cx, cy, 19, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#3a4761'; ctx.lineWidth = 7;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + 0.4;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * 60, cy + Math.sin(a) * 60);
        ctx.lineTo(cx + Math.cos(a) * 92, cy + Math.sin(a) * 92);
        ctx.stroke();
      }
      pipe(r.x + 22, r.y + 28, r.h - 56, true);
      pipe(r.x + r.w - 22, r.y + 28, r.h - 56, true);
      hazardStripe(r.x + 12, r.y + r.h - 26, r.w - 24, 14);
    },

    upperEngine(r) { engine(r, 1); },
    lowerEngine(r) { engine(r, -1); },

    security(r) {
      const wallY = r.y + 22;
      for (let i = 0; i < 6; i++) {
        screen(r.x + 24 + i * 44, wallY, 38, 34, '#4d9fd6', i % 2 ? 'bars' : 'wave');
      }
      panel(r.x + 24, wallY + 48, 232, 22);
      ctx.fillStyle = '#39435c';
      rr(ctx, r.x + 120, wallY + 78, 44, 40, 8); ctx.fill();
    },

    medbay(r) {
      for (let i = 0; i < 3; i++) {
        const bx = r.x + 26 + i * 74, by = r.y + 32;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        rr(ctx, bx - 2, by + 5, 54, 92, 8); ctx.fill();
        ctx.fillStyle = '#e2e8f2';
        rr(ctx, bx, by, 52, 90, 8); ctx.fill();
        ctx.fillStyle = '#9fb2cc';
        rr(ctx, bx + 6, by + 8, 40, 26, 5); ctx.fill();
        ctx.fillStyle = '#4d9fd6';
        rr(ctx, bx + 6, by + 42, 40, 40, 4); ctx.fill();
      }
      const sx = r.x + r.w / 2 + 40, sy = r.y + r.h - 62;
      floorGlyph(sx, sy, 34, '#37e0c8', 0.3);
      ctx.fillStyle = 'rgba(55,224,200,0.1)';
      ctx.beginPath(); ctx.arc(sx, sy, 30, 0, Math.PI * 2); ctx.fill();
    },

    electrical(r) {
      for (let i = 0; i < 5; i++) {
        screen(r.x + r.w - 56, r.y + 26 + i * 44, 44, 34, '#ffb03a', 'bars');
      }
      ctx.strokeStyle = '#c0523f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        ctx.strokeStyle = ['#c0523f', '#f0a63c', '#4ca85c', '#3d6fe0'][i];
        ctx.beginPath();
        ctx.moveTo(r.x + 20, r.y + 40 + i * 16);
        ctx.bezierCurveTo(r.x + 90, r.y + 20 + i * 30, r.x + 130, r.y + 120, r.x + 76, r.y + r.h - 34);
        ctx.stroke();
      }
      ctx.fillStyle = '#141b2a';
      rr(ctx, r.x + 18, r.y + r.h - 74, 90, 56, 4); ctx.fill();
      ctx.strokeStyle = '#39435c'; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.moveTo(r.x + 22 + i * 15, r.y + r.h - 70); ctx.lineTo(r.x + 22 + i * 15, r.y + r.h - 22);
        ctx.stroke();
      }
      hazardStripe(r.x + 12, r.y + 14, r.w - 24, 12);
    },

    cafeteria(r, rand) {
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      /* The table everyone spawns around, with the button on it. */
      ctx.fillStyle = 'rgba(0,0,0,0.34)';
      ctx.beginPath(); ctx.ellipse(cx, cy + 10, 96, 62, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#37455f';
      ctx.beginPath(); ctx.ellipse(cx, cy, 94, 58, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2b3648';
      ctx.beginPath(); ctx.ellipse(cx, cy - 4, 82, 48, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1c2434';
      ctx.beginPath(); ctx.ellipse(cx, cy - 4, 40, 24, 0, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
        const tx = cx + Math.cos(a) * 200, ty = cy + Math.sin(a) * 128;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.ellipse(tx, ty + 7, 44, 30, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#33405a';
        ctx.beginPath(); ctx.ellipse(tx, ty, 42, 27, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3d4c6b';
        ctx.beginPath(); ctx.ellipse(tx, ty - 3, 34, 21, 0, 0, Math.PI * 2); ctx.fill();
      }
      viewport(r.x + 22, r.y + 16, 128, 58, rand);
      panel(r.x + r.w - 132, r.y + r.h - 58, 108, 40);
    },

    storage(r) {
      const tints = ['#3a4560', '#44507a', '#3f4a5f'];
      for (let i = 0; i < 5; i++) crate(r.x + 26 + (i % 3) * 52, r.y + 34 + Math.floor(i / 3) * 52, 44, tints[i % 3]);
      for (let i = 0; i < 3; i++) crate(r.x + r.w - 82, r.y + 130 + i * 46, 40, tints[(i + 1) % 3]);
      /* Fuel cans, which is where the long task starts. */
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = '#c0523f';
        rr(ctx, r.x + r.w - 76 + i * 22, r.y + 42, 17, 26, 3); ctx.fill();
        ctx.fillStyle = '#8e3a2c';
        rr(ctx, r.x + r.w - 73 + i * 22, r.y + 36, 11, 8, 2); ctx.fill();
      }
      hazardStripe(r.x + 16, r.y + r.h - 40, r.w - 32, 13);
    },

    admin(r) {
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2 + 6;
      ctx.fillStyle = 'rgba(0,0,0,0.32)';
      rr(ctx, cx - 88, cy - 40, 176, 84, 10); ctx.fill();
      ctx.fillStyle = '#33405a';
      rr(ctx, cx - 90, cy - 46, 180, 84, 10); ctx.fill();
      ctx.fillStyle = '#0f1626';
      rr(ctx, cx - 80, cy - 38, 160, 68, 6); ctx.fill();
      /* The station's own floor plan, drawn from the real map. */
      ctx.save();
      rr(ctx, cx - 80, cy - 38, 160, 68, 6); ctx.clip();
      const sx = 150 / M.pixelWidth, sy = 60 / M.pixelHeight;
      ctx.fillStyle = 'rgba(55,224,200,0.5)';
      for (const room of M.ROOMS) {
        ctx.fillRect(cx - 75 + room.x * T * sx, cy - 33 + room.y * T * sy,
                     Math.max(2, room.w * T * sx), Math.max(2, room.h * T * sy));
      }
      ctx.restore();
      screen(r.x + 18, r.y + 22, 46, 36, '#4d9fd6');
    },

    weapons(r, rand) {
      viewport(r.x + 30, r.y + 18, r.w - 60, 62, rand);
      const cx = r.x + r.w / 2, cy = r.y + r.h - 62;
      ctx.fillStyle = '#33405a';
      rr(ctx, cx - 46, cy - 26, 92, 56, 10); ctx.fill();
      ctx.fillStyle = '#1c2434';
      rr(ctx, cx - 34, cy - 18, 68, 34, 6); ctx.fill();
      ctx.fillStyle = '#ff3f5b';
      ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,63,91,0.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI * 2); ctx.stroke();
    },

    o2(r) {
      for (let i = 0; i < 2; i++) {
        const tx = r.x + 32 + i * 64, ty = r.y + 30;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        rr(ctx, tx - 2, ty + 6, 44, 104, 20); ctx.fill();
        ctx.fillStyle = '#2c3648';
        rr(ctx, tx, ty, 42, 102, 20); ctx.fill();
        ctx.fillStyle = 'rgba(55,224,200,0.22)';
        rr(ctx, tx + 7, ty + 12, 28, 80, 14); ctx.fill();
        ctx.fillStyle = '#4ca85c';
        for (let k = 0; k < 5; k++) {
          ctx.beginPath();
          ctx.ellipse(tx + 21 + (k - 2) * 6, ty + 66 - Math.abs(k - 2) * 9, 4.5, 13, (k - 2) * 0.35, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      pipe(r.x + 18, r.y + r.h - 30, r.w - 36, false);
    },

    navigation(r, rand) {
      viewport(r.x + 22, r.y + 20, r.w - 44, 84, rand);
      screen(r.x + 24, r.y + r.h - 74, 74, 46, '#4d9fd6', 'wave');
      screen(r.x + r.w - 98, r.y + r.h - 74, 74, 46, '#37e0c8', 'bars');
      ctx.fillStyle = '#33405a';
      rr(ctx, r.x + r.w / 2 - 26, r.y + r.h - 66, 52, 30, 6); ctx.fill();
    },

    shields(r) {
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2 + 4;
      for (let ring = 0; ring < 7; ring++) {
        const a = (ring / 7) * Math.PI * 2;
        const hx = ring === 6 ? cx : cx + Math.cos(a) * 62;
        const hy = ring === 6 ? cy : cy + Math.sin(a) * 46;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const ha = (i / 6) * Math.PI * 2 + Math.PI / 6;
          const vx = hx + Math.cos(ha) * 26, vy = hy + Math.sin(ha) * 26;
          if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(77,159,214,0.13)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(77,159,214,0.42)';
        ctx.lineWidth = 2.4;
        ctx.stroke();
      }
      panel(r.x + 20, r.y + r.h - 50, 78, 32);
    },

    comms(r) {
      for (let i = 0; i < 4; i++) {
        const bx = r.x + 24 + i * 40;
        panel(bx, r.y + 26, 32, 96);
        ctx.fillStyle = '#37e0c8';
        ctx.globalAlpha = 0.55;
        for (let k = 0; k < 6; k++) ctx.fillRect(bx + 6, r.y + 34 + k * 14, 20 * (0.4 + ((i + k) % 3) / 3), 3);
        ctx.globalAlpha = 1;
      }
      const dx = r.x + r.w - 74, dy = r.y + 54;
      ctx.strokeStyle = '#8d97ad'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(dx, dy, 30, Math.PI * 0.75, Math.PI * 2.25); ctx.stroke();
      ctx.fillStyle = 'rgba(141,151,173,0.16)';
      ctx.beginPath(); ctx.arc(dx, dy, 30, Math.PI * 0.75, Math.PI * 2.25); ctx.fill();
      ctx.strokeStyle = '#8d97ad'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(dx + 4, dy + 34); ctx.stroke();
    },
  };

  function engine(r, facing) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    rr(ctx, r.x + 24, cy - 52 + 6, r.w - 48, 104, 26); ctx.fill();
    ctx.fillStyle = '#2c3648';
    rr(ctx, r.x + 24, cy - 52, r.w - 48, 104, 26); ctx.fill();
    ctx.fillStyle = '#212a3c';
    rr(ctx, r.x + 40, cy - 36, r.w - 80, 72, 18); ctx.fill();
    const g = ctx.createLinearGradient(r.x + 40, 0, r.x + r.w - 40, 0);
    g.addColorStop(0, 'rgba(255,176,58,0.05)');
    g.addColorStop(0.5, 'rgba(255,176,58,0.42)');
    g.addColorStop(1, 'rgba(255,176,58,0.05)');
    ctx.fillStyle = g;
    rr(ctx, r.x + 48, cy - 18, r.w - 96, 36, 12); ctx.fill();
    ctx.strokeStyle = '#39435c'; ctx.lineWidth = 5;
    for (let i = 0; i < 4; i++) {
      const lx = r.x + 46 + i * ((r.w - 92) / 3);
      ctx.beginPath(); ctx.moveTo(lx, cy - 50); ctx.lineTo(lx, cy + 50); ctx.stroke();
    }
    pipe(r.x + 18, cy + facing * 62, r.w - 36, false);
    hazardStripe(r.x + 20, cy - facing * 66, r.w - 40, 12);
  }

  /* ---- fixtures ---------------------------------------------------------- */

  function taskConsole(spot, accent) {
    const w = M.toWorld(spot);
    panel(w.x - 21, w.y - 26, 42, 40);
    ctx.fillStyle = '#0d1320';
    rr(ctx, w.x - 16, w.y - 21, 32, 24, 3); ctx.fill();
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.75;
    ctx.fillRect(w.x - 11, w.y - 16, 22, 3);
    ctx.fillRect(w.x - 11, w.y - 10, 14, 3);
    ctx.fillRect(w.x - 11, w.y - 4, 18, 3);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(w.x, w.y + 16, 22, 7, 0, 0, Math.PI * 2); ctx.fill();
  }

  function ventCover(spot) {
    const w = M.toWorld(spot);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    rr(ctx, w.x - 20, w.y - 12, 40, 30, 4); ctx.fill();
    ctx.fillStyle = '#39435c';
    rr(ctx, w.x - 21, w.y - 15, 42, 30, 4); ctx.fill();
    ctx.fillStyle = '#161d2c';
    rr(ctx, w.x - 16, w.y - 11, 32, 22, 3); ctx.fill();
    ctx.strokeStyle = '#4a5570'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(w.x - 12, w.y - 6 + i * 5); ctx.lineTo(w.x + 12, w.y - 6 + i * 5);
      ctx.stroke();
    }
  }

  function emergencyButton() {
    const w = M.toWorld(M.EMERGENCY);
    ctx.fillStyle = '#2c3648';
    rr(ctx, w.x - 22, w.y - 18, 44, 34, 8); ctx.fill();
    ctx.fillStyle = '#ff3f5b';
    ctx.beginPath(); ctx.arc(w.x, w.y - 4, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(w.x - 4, w.y - 8, 5, 3.4, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,63,91,0.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(w.x, w.y - 4, 19, 0, Math.PI * 2); ctx.stroke();
  }

  function sabotagePad(spot, accent) {
    const w = M.toWorld(spot);
    ctx.fillStyle = 'rgba(255,176,58,0.1)';
    rr(ctx, w.x - 26, w.y - 18, 52, 36, 6); ctx.fill();
    ctx.strokeStyle = accent; ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.55;
    rr(ctx, w.x - 26, w.y - 18, 52, 36, 6); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.ellipse(w.x, w.y, 12, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* ---- labels ------------------------------------------------------------ */

  /* Letter spacing by hand: ctx.letterSpacing is too new to rely on, and
     these labels are wide-tracked on purpose -- it is what makes them read as
     signage painted on the floor rather than as a caption. */
  function tracked(text, cx, cy, size, spacing, colour, alpha) {
    ctx.font = '800 ' + size + 'px Archivo, "Archivo Black", system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    const widths = [];
    let total = 0;
    for (const ch of text) {
      const w = ctx.measureText(ch).width;
      widths.push(w);
      total += w + spacing;
    }
    total -= spacing;
    let x = cx - total / 2;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = colour;
    let i = 0;
    for (const ch of text) {
      ctx.fillText(ch, x, cy);
      x += widths[i++] + spacing;
    }
    ctx.globalAlpha = 1;
  }

  /* ---- build ------------------------------------------------------------- */

  function build() {
    if (built) return canvas;
    canvas = document.createElement('canvas');
    canvas.width = M.pixelWidth;
    canvas.height = M.pixelHeight;
    ctx = canvas.getContext('2d');
    const rand = U.mulberry32(0x4a1b7);

    ctx.fillStyle = '#05070d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    /* Stars first, so the hull covers the ones that would show through. */
    for (let i = 0; i < 1700; i++) {
      const x = rand() * canvas.width, y = rand() * canvas.height, v = rand();
      ctx.fillStyle = v > 0.94 ? 'rgba(215,228,245,0.85)'
        : v > 0.72 ? 'rgba(150,172,205,0.45)' : 'rgba(110,130,168,0.28)';
      const s = v > 0.94 ? 2 : 1.2;
      ctx.fillRect(x, y, s, s);
    }

    /* Hull: one solid tile around everything walkable. */
    ctx.fillStyle = HULL;
    for (let ty = 0; ty < M.H; ty++) {
      for (let tx = 0; tx < M.W; tx++) {
        if (M.FLOOR[M.at(tx, ty)]) continue;
        let touches = false;
        for (let dy = -1; dy <= 1 && !touches; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if ((!dx && !dy) || tx + dx < 0 || ty + dy < 0 || tx + dx >= M.W || ty + dy >= M.H) continue;
            if (M.FLOOR[M.at(tx + dx, ty + dy)]) { touches = true; break; }
          }
        }
        if (touches) ctx.fillRect(px(tx), px(ty), T, T);
      }
    }

    /* Floors. */
    for (let ty = 0; ty < M.H; ty++) {
      for (let tx = 0; tx < M.W; tx++) {
        if (!M.FLOOR[M.at(tx, ty)]) continue;
        const room = M.roomAt(px(tx) + T / 2, px(ty) + T / 2);
        const tone = room ? TONES[room.tone] : TONES.hall;
        ctx.fillStyle = tone.floor;
        ctx.fillRect(px(tx), px(ty), T, T);
        const v = rand();
        if (v > 0.88) { ctx.fillStyle = 'rgba(255,255,255,0.016)'; ctx.fillRect(px(tx), px(ty), T, T); }
        else if (v < 0.09) { ctx.fillStyle = 'rgba(0,0,0,0.11)'; ctx.fillRect(px(tx), px(ty), T, T); }
      }
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.032)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let ty = 0; ty < M.H; ty++) {
      for (let tx = 0; tx < M.W; tx++) {
        if (!M.FLOOR[M.at(tx, ty)]) continue;
        if (M.FLOOR[M.at(tx + 1, ty)]) { ctx.moveTo(px(tx + 1) + 0.5, px(ty)); ctx.lineTo(px(tx + 1) + 0.5, px(ty + 1)); }
        if (M.FLOOR[M.at(tx, ty + 1)]) { ctx.moveTo(px(tx), px(ty + 1) + 0.5); ctx.lineTo(px(tx + 1), px(ty + 1) + 0.5); }
      }
    }
    ctx.stroke();

    /* Room labels sit under the furniture so a console never has type on it. */
    for (const room of ROOMS_WITH_LABELS()) {
      tracked(room.name.toUpperCase(), room.cx, room.cy, room.w > 12 ? 30 : 22,
              room.w > 12 ? 11 : 7, TONES[room.tone].accent, 0.11);
    }

    for (const room of M.ROOMS) {
      const art = ROOM_ART[room.id];
      if (!art) continue;
      ctx.save();
      art({ x: px(room.x), y: px(room.y), w: px(room.w), h: px(room.h) }, rand);
      ctx.restore();
    }

    /* Wall faces last, over the furniture, so nothing bleeds into a corridor. */
    for (let ty = 0; ty < M.H; ty++) {
      for (let tx = 0; tx < M.W; tx++) {
        if (!M.FLOOR[M.at(tx, ty)]) continue;
        const x = px(tx), y = px(ty);
        if (!M.FLOOR[M.at(tx, ty - 1)]) {
          const g = ctx.createLinearGradient(0, y, 0, y + 14);
          g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(x, y, T, 14);
          ctx.fillStyle = KEYLINE; ctx.fillRect(x, y - 3, T, 4);
        }
        if (!M.FLOOR[M.at(tx, ty + 1)]) {
          const g = ctx.createLinearGradient(0, y + T, 0, y + T - 11);
          g.addColorStop(0, 'rgba(0,0,0,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(x, y + T - 11, T, 11);
          ctx.fillStyle = '#121a28'; ctx.fillRect(x, y + T - 1, T, 4);
        }
        if (!M.FLOOR[M.at(tx - 1, ty)]) {
          const g = ctx.createLinearGradient(x, 0, x + 12, 0);
          g.addColorStop(0, 'rgba(0,0,0,0.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(x, y, 12, T);
          ctx.fillStyle = HULL_EDGE; ctx.fillRect(x - 3, y, 4, T);
        }
        if (!M.FLOOR[M.at(tx + 1, ty)]) {
          const g = ctx.createLinearGradient(x + T, 0, x + T - 12, 0);
          g.addColorStop(0, 'rgba(0,0,0,0.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(x + T - 12, y, 12, T);
          ctx.fillStyle = HULL_EDGE; ctx.fillRect(x + T - 1, y, 4, T);
        }
      }
    }

    for (const station of M.STATIONS) {
      const spots = station.steps || [station];
      for (const spot of spots) taskConsole(spot, TONES[M.roomById[spot.room].tone].accent);
    }
    for (const group of M.VENT_GROUPS) for (const v of group) ventCover(v);
    for (const key in M.SABOTAGE_SPOTS) {
      sabotagePad(M.SABOTAGE_SPOTS[key], key.indexOf('reactor') === 0 ? '#ffb03a' : '#37e0c8');
    }
    emergencyButton();

    built = true;
    return canvas;
  }

  function ROOMS_WITH_LABELS() { return M.ROOMS; }

  NS.station = {
    build,
    rebuild() { built = false; canvas = null; return build(); },
    get canvas() { return canvas; },
    TONES,
  };
})(window.NS);

</script>
<script>
/* Dust, sparks, splashes and the words that float up off a finished task.

   One flat pool, no allocation once it is warm, and everything is drawn with
   the same four fields. Effects are the cheapest way to make an action feel
   like it landed -- a vent that puffs is a vent you believe somebody went
   into -- so the budget goes on having them at all rather than on making any
   one of them elaborate. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const MAX = 320;
  const pool = [];
  for (let i = 0; i < MAX; i++) {
    pool.push({ live: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 3, colour: '#fff', kind: 'dot', spin: 0 });
  }
  let cursor = 0;
  const floaters = [];

  function take() {
    for (let i = 0; i < MAX; i++) {
      cursor = (cursor + 1) % MAX;
      if (!pool[cursor].live) return pool[cursor];
    }
    return pool[cursor];
  }

  function spawn(o) {
    const p = take();
    p.live = true;
    p.x = o.x; p.y = o.y;
    p.vx = o.vx || 0; p.vy = o.vy || 0;
    p.max = p.life = o.life || 0.6;
    p.size = o.size || 3;
    p.colour = o.colour || '#cfd9e8';
    p.kind = o.kind || 'dot';
    p.drag = o.drag == null ? 0.9 : o.drag;
    p.gravity = o.gravity || 0;
    p.spin = Math.random() * Math.PI * 2;
    return p;
  }

  const burst = (x, y, n, opts) => {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = (opts.speed || 90) * (0.35 + Math.random() * 0.65);
      spawn({
        x: x + (Math.random() - 0.5) * (opts.spread || 8),
        y: y + (Math.random() - 0.5) * (opts.spread || 8),
        vx: Math.cos(a) * speed, vy: Math.sin(a) * speed * 0.6,
        life: (opts.life || 0.6) * (0.6 + Math.random() * 0.6),
        size: (opts.size || 3) * (0.6 + Math.random() * 0.8),
        colour: opts.colour, kind: opts.kind || 'dot',
        gravity: opts.gravity || 0, drag: opts.drag,
      });
    }
  };

  const FX = {
    vent(x, y) {
      burst(x, y, 14, { colour: '#8d97ad', speed: 130, life: 0.5, size: 5, kind: 'puff' });
      burst(x, y, 6, { colour: '#4a5570', speed: 60, life: 0.75, size: 8, kind: 'puff' });
    },
    kill(x, y) {
      burst(x, y, 18, { colour: '#c0243c', speed: 200, life: 0.65, size: 4, gravity: 260, drag: 0.86 });
      burst(x, y, 8, { colour: '#ff3f5b', speed: 90, life: 0.9, size: 6 });
    },
    shot(x, y) {
      burst(x, y, 12, { colour: '#ffb03a', speed: 240, life: 0.35, size: 3 });
    },
    shield(x, y) {
      burst(x, y, 16, { colour: '#34e0b8', speed: 150, life: 0.7, size: 4 });
    },
    vanish(x, y) {
      burst(x, y, 20, { colour: '#9d8cff', speed: 110, life: 0.8, size: 4, kind: 'puff' });
    },
    task(x, y) {
      burst(x, y - 18, 12, { colour: '#34e0b8', speed: 80, life: 0.8, size: 3, gravity: -60 });
    },
    spark(x, y) {
      burst(x, y, 6, { colour: '#ffb03a', speed: 160, life: 0.4, size: 2.5, gravity: 300 });
    },
    step(x, y) {
      spawn({ x, y: y + 2, vx: (Math.random() - 0.5) * 18, vy: -6, life: 0.45, size: 4, colour: '#3a4560', kind: 'puff' });
    },
  };

  function say(x, y, text, colour) {
    floaters.push({ x, y, text, colour: colour || '#cfd9e8', life: 1.5, max: 1.5 });
    if (floaters.length > 12) floaters.shift();
  }

  function step(dt) {
    for (let i = 0; i < MAX; i++) {
      const p = pool[i];
      if (!p.live) continue;
      p.life -= dt;
      if (p.life <= 0) { p.live = false; continue; }
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const k = Math.pow(p.drag, dt * 60);
      p.vx *= k; p.vy *= k;
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt;
      f.y -= dt * 34;
      if (f.life <= 0) floaters.splice(i, 1);
    }
  }

  function draw(ctx) {
    for (let i = 0; i < MAX; i++) {
      const p = pool[i];
      if (!p.live) continue;
      const t = p.life / p.max;
      ctx.globalAlpha = p.kind === 'puff' ? t * 0.55 : t;
      ctx.fillStyle = p.colour;
      if (p.kind === 'puff') {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1.6 - t * 0.7), 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters(ctx) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const f of floaters) {
      const t = f.life / f.max;
      ctx.globalAlpha = Math.min(1, t * 2.2);
      ctx.font = '700 15px Archivo, system-ui, sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(5,7,13,0.85)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.colour;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function clear() {
    for (let i = 0; i < MAX; i++) pool[i].live = false;
    floaters.length = 0;
  }

  NS.fx = Object.assign({ spawn, burst, step, draw, drawFloaters, say, clear }, FX);
})(window.NS);

<script>
/* One frame.

   Order matters more than anything else in this file, because the darkness is
   not an effect painted over a finished picture -- it is what decides who is
   in the picture at all. The station is drawn, then the dark is laid over it,
   and only then are people drawn back in, clipped to what you can actually
   see. Drawing them first and dimming them afterwards would leave a smudge
   where somebody is standing in the next room, and a smudge is enough to win
   an argument you should have lost. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;
  const W = NS.world;

  const BASE_VISION = 215;
  const GROUND = '#05070d';
  /* Not fully opaque: three per cent of the station bleeds through the dark,
     which is enough to keep the walls readable as a memory of the map and far
     too little to make out a person. */
  const DARK_ALPHA = 0.968;

  let canvas = null, ctx = null;
  let dark = null, darkCtx = null;
  let cssW = 0, cssH = 0, dpr = 1;
  let scale = 1;
  const camera = { x: 0, y: 0, shake: 0, flash: 0, flashColour: '#ff3f5b' };

  function attach(node) {
    canvas = node;
    ctx = canvas.getContext('2d');
    dark = document.createElement('canvas');
    darkCtx = dark.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  }

  function resize() {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    cssW = Math.max(1, Math.round(rect.width));
    cssH = Math.max(1, Math.round(rect.height));
    /* Capped at 2: past that the extra pixels are invisible on a phone and
       the fill rate is not. */
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    dark.width = canvas.width;
    dark.height = canvas.height;

    /* How much station fits on screen. Held between 420 and 900 world pixels
       across so a phone is not playing a different game from a laptop: the
       laptop gets a wider view, but the people on it are the same size. */
    const visible = U.clamp(cssW * 0.62, 400, 780);
    scale = cssW / visible;
    const minHeight = 330;
    if (cssH / scale < minHeight) scale = cssH / minHeight;
  }

  function centreOn(x, y, snap) {
    if (snap) { camera.x = x; camera.y = y; return; }
    camera.x = x; camera.y = y;
  }

  function follow(target, dt) {
    if (!target) return;
    const k = Math.min(1, dt * 7);
    camera.x += (target.x - camera.x) * k;
    camera.y += (target.y - camera.y) * k;
  }

  const worldToScreen = (x, y) => ({
    x: (x - camera.x) * scale + cssW / 2,
    y: (y - camera.y) * scale + cssH / 2,
  });

  function visionRadius() {
    const me = W.me;
    if (!me) return BASE_VISION;
    const impostor = W.myRole && C.ROLES[W.myRole].team === 'impostor';
    const setting = impostor ? W.state.settings.impostorVision : W.state.settings.crewVision;
    return BASE_VISION * setting * NS.sabotage.visionScale(impostor);
  }

  function shake(amount) { camera.shake = Math.min(18, camera.shake + amount); }
  function flash(colour, amount) { camera.flash = amount; camera.flashColour = colour; }

  /* ---- pieces ------------------------------------------------------------ */

  function drawDoors(now) {
    const closed = W.state.closedRooms || [];
    if (!closed.length) return;
    for (const roomId of closed) {
      const doors = M.DOORS[roomId];
      if (!doors) continue;
      for (const d of doors) {
        const x = d.x * M.TILE, y = d.y * M.TILE, w = d.w * M.TILE, h = d.h * M.TILE;
        ctx.fillStyle = '#c0523f';
        NS.characters.rr(ctx, x + 1, y + 1, w - 2, h - 2, 4);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        for (let i = 0; i < Math.max(w, h); i += 18) {
          if (w > h) ctx.fillRect(x + i, y, 8, h);
          else ctx.fillRect(x, y + i, w, 8);
        }
        ctx.strokeStyle = '#ffb03a';
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.5 + Math.sin(now * 0.006) * 0.3;
        NS.characters.rr(ctx, x + 1, y + 1, w - 2, h - 2, 4);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  /* A ring under every console you still owe, so a task list is something you
     can follow with your feet rather than something you have to memorise. */
  function drawObjectives(now) {
    if (W.state.phase !== 'play') return;
    if (NS.sabotage.commsDown()) return;
    ctx.save();
    for (const task of W.myTasks) {
      if (task.done) continue;
      const spot = W.taskSpot(task);
      if (!spot) continue;
      const pulse = 0.55 + Math.sin(now * 0.004 + spot.x) * 0.25;
      ctx.strokeStyle = 'rgba(255,176,58,' + pulse.toFixed(3) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(spot.x, spot.y + 14, 26, 11, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,176,58,0.12)';
      ctx.fill();
    }
    const active = W.state.sabotage;
    if (active) {
      for (const spot of NS.sabotage.activeSpots()) {
        if (spot.done) continue;
        ctx.strokeStyle = 'rgba(255,63,91,' + (0.5 + Math.sin(now * 0.008) * 0.3).toFixed(3) + ')';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(spot.x, spot.y + 12, 30, 13, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function nameTag(p, alpha) {
    const label = p.name;
    ctx.font = '700 13px Archivo, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const w = ctx.measureText(label).width + 14;
    const y = p.y - NS.characters.BODY_H - 26;
    ctx.globalAlpha = alpha * 0.72;
    ctx.fillStyle = 'rgba(5,7,13,0.72)';
    NS.characters.rr(ctx, p.x - w / 2, y - 9, w, 18, 9);
    ctx.fill();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.ghost ? '#9d8cff' : '#e6ecf6';
    ctx.fillText(label, p.x, y);
    ctx.globalAlpha = 1;
  }

  /* Who is drawn, and how brightly. A body at the very edge of the light
     fades rather than popping, which is the difference between "somebody is
     there" and "somebody appeared". */
  function alphaFor(x, y, radius, meGhost) {
    if (meGhost) return 1;
    const me = W.me;
    if (!me) return 1;
    const d = U.dist(me.x, me.y, x, y);
    if (d > radius) return 0;
    if (!NS.los.clear(me.x, me.y, x, y)) return 0;
    const fade = radius * 0.72;
    return d <= fade ? 1 : 1 - (d - fade) / (radius - fade);
  }

  function drawScene(now, dt) {
    const me = W.me;
    const meGhost = !!(me && me.ghost);
    const radius = visionRadius();
    const station = NS.station.canvas;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, cssW, cssH);

    let shakeX = 0, shakeY = 0;
    if (camera.shake > 0.1) {
      shakeX = (Math.random() - 0.5) * camera.shake;
      shakeY = (Math.random() - 0.5) * camera.shake;
      camera.shake *= Math.pow(0.0016, dt);
    }

    ctx.save();
    ctx.translate(cssW / 2 + shakeX, cssH / 2 + shakeY);
    ctx.scale(scale, scale);
    ctx.translate(-camera.x, -camera.y);

    /* Only the visible slice of the station is blitted. */
    const halfW = cssW / (2 * scale) + 64;
    const halfH = cssH / (2 * scale) + 64;
    const sx = U.clamp(camera.x - halfW, 0, M.pixelWidth);
    const sy = U.clamp(camera.y - halfH, 0, M.pixelHeight);
    const sw = U.clamp(halfW * 2, 1, M.pixelWidth - sx);
    const sh = U.clamp(halfH * 2, 1, M.pixelHeight - sy);
    if (station) ctx.drawImage(station, sx, sy, sw, sh, sx, sy, sw, sh);

    drawObjectives(now);
    drawDoors(now);

    ctx.restore();

    /* ---- the dark ------------------------------------------------------- */

    if (!meGhost && me && W.state.phase !== 'lobby') {
      darkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      darkCtx.clearRect(0, 0, cssW, cssH);
      darkCtx.fillStyle = 'rgba(5,7,13,' + DARK_ALPHA + ')';
      darkCtx.fillRect(0, 0, cssW, cssH);

      const poly = NS.los.visible(me.x, me.y, radius);
      darkCtx.save();
      darkCtx.translate(cssW / 2 + shakeX, cssH / 2 + shakeY);
      darkCtx.scale(scale, scale);
      darkCtx.translate(-camera.x, -camera.y);
      darkCtx.beginPath();
      darkCtx.moveTo(poly[0], poly[1]);
      for (let i = 1; i < NS.los.RAYS; i++) darkCtx.lineTo(poly[i * 2], poly[i * 2 + 1]);
      darkCtx.closePath();
      darkCtx.clip();
      const g = darkCtx.createRadialGradient(me.x, me.y, radius * 0.2, me.x, me.y, radius);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(0.72, 'rgba(0,0,0,0.98)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      darkCtx.globalCompositeOperation = 'destination-out';
      darkCtx.fillStyle = g;
      darkCtx.fillRect(me.x - radius, me.y - radius, radius * 2, radius * 2);
      darkCtx.restore();
      darkCtx.globalCompositeOperation = 'source-over';

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(dark, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    /* ---- people, back on top, clipped to what is lit -------------------- */

    ctx.save();
    ctx.translate(cssW / 2 + shakeX, cssH / 2 + shakeY);
    ctx.scale(scale, scale);
    ctx.translate(-camera.x, -camera.y);

    const drawable = [];
    for (const body of W.bodies) {
      const a = alphaFor(body.x, body.y, radius, meGhost);
      if (a > 0.02) drawable.push({ y: body.y, body, alpha: a });
    }
    const impostorTeam = W.myRole && C.ROLES[W.myRole].team === 'impostor';
    for (const p of W.players.values()) {
      if (p.inVent) continue;
      /* The dead are a room only the dead are in. */
      if (p.ghost && !meGhost && !p.isMe) continue;
      if (p.isMe) { drawable.push({ y: p.y, player: p, alpha: 1 }); continue; }
      if (!p.connected) continue;
      const a = alphaFor(p.x, p.y, radius, meGhost);
      if (a <= 0.02) continue;
      if (p.invisible && !(impostorTeam || meGhost)) continue;
      drawable.push({ y: p.y, player: p, alpha: a });
    }
    drawable.sort((a, b) => a.y - b.y);

    for (const item of drawable) {
      if (item.body) { ctx.globalAlpha = item.alpha; NS.characters.drawBody(ctx, item.body); ctx.globalAlpha = 1; continue; }
      const p = item.player;
      let outline = null;
      if (impostorTeam && !p.isMe && W.state.roles && C.ROLES[W.state.roles[p.id] || 'crewmate'].team === 'impostor') {
        outline = 'rgba(255,63,91,0.85)';
      }
      NS.characters.drawPlayer(ctx, p, { alpha: item.alpha, outline });
    }
    for (const item of drawable) {
      if (item.player && item.alpha > 0.25) nameTag(item.player, item.alpha);
    }

    NS.fx.draw(ctx);
    NS.fx.drawFloaters(ctx);
    ctx.restore();

    if (camera.flash > 0.01) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalAlpha = Math.min(0.85, camera.flash);
      ctx.fillStyle = camera.flashColour;
      ctx.fillRect(0, 0, cssW, cssH);
      ctx.globalAlpha = 1;
      camera.flash *= Math.pow(0.004, dt);
    }

    drawEdgePointers();
  }

  /* Off-screen things you are meant to walk to: a chevron on the edge of the
     screen for the live sabotage. Only for the sabotage -- doing it for every
     task turns the border into a light show and stops meaning anything. */
  function drawEdgePointers() {
    const active = W.state.sabotage;
    if (!active || !W.me || W.me.ghost) return;
    const def = NS.sabotage.SABOTAGES[active.kind];
    if (!def || !def.fix) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const margin = 34;
    for (const spot of NS.sabotage.activeSpots()) {
      if (spot.done) continue;
      const s = worldToScreen(spot.x, spot.y);
      if (s.x > margin && s.x < cssW - margin && s.y > margin && s.y < cssH - margin) continue;
      const cx = cssW / 2, cy = cssH / 2;
      const a = Math.atan2(s.y - cy, s.x - cx);
      const rx = Math.min(cssW / 2 - margin, cssH / 2 - margin);
      const px = cx + Math.cos(a) * rx;
      const py = cy + Math.sin(a) * rx;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(a);
      ctx.fillStyle = '#ff3f5b';
      ctx.beginPath();
      ctx.moveTo(12, 0); ctx.lineTo(-8, -9); ctx.lineTo(-8, 9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  NS.render = {
    attach, resize, drawScene, follow, centreOn, worldToScreen, shake, flash,
    visionRadius,
    get scale() { return scale; },
    get width() { return cssW; },
    get height() { return cssH; },
    camera,
  };
})(window.NS);

</script>
<script>
/* The one device that decides.

   Somebody has to be right about whether that kill landed, and it cannot be
   the person who threw it. So one player -- whoever opened the lobby -- runs
   this, and every other device asks it for permission and mirrors what comes
   back. The host is also a player with a game to play, so nothing here is
   allowed to be expensive: it runs inside the same frame loop as the
   renderer, on somebody's phone.

   Positions are the deliberate exception. Clients own their own and the host
   reads them out of the same world mirror everybody else has, roughly a tenth
   of a second stale, which is why kill range is checked with a margin. The
   alternative is a server that rewinds time to validate a hit, and that is a
   very long way to go to stop a fourteen-year-old standing slightly too far
   away from somebody they were going to kill anyway. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;
  const R = NS.rules;
  const SAB = NS.sabotage;

  const SNAPSHOT_EVERY = 480;    // ms between full snapshots when nothing changed
  const KILL_GRACE = 1.45;       // how much further than the setting a kill may land
  const EJECT_SECONDS = 5.5;
  const REVEAL_SECONDS = 5;

  const H = {
    active: false, seq: 0, phase: 'lobby',
    settings: C.defaults(),
    players: {}, roles: {}, tasks: {},
    bodies: [], sabotage: null, meeting: null, ejected: null, winner: null,
    killCooldown: {}, abilityCooldown: {}, abilityUsed: {},
    emergenciesUsed: {}, emergencyCooldown: 0, sabotageCooldown: 0,
    shields: {}, invisible: {}, shifted: {},
    closedRooms: {}, revealLeft: 0, ejectLeft: 0,
    lastSnapshot: 0, dirty: true, seed: 1,
  };

  let send = function () {};
  let onLocal = function () {};

  /* ---- lifecycle --------------------------------------------------------- */

  function begin(opts) {
    H.active = true;
    send = opts.send;
    onLocal = opts.onLocal || function () {};
    H.settings = C.sanitise(opts.settings);
    H.phase = 'lobby';
    H.players = {};
    H.seq = 0;
    reset();
    H.dirty = true;
  }

  function reset() {
    H.roles = {}; H.tasks = {}; H.bodies = []; H.sabotage = null;
    H.meeting = null; H.ejected = null; H.winner = null;
    H.killCooldown = {}; H.abilityCooldown = {}; H.abilityUsed = {};
    H.emergenciesUsed = {}; H.emergencyCooldown = 0; H.sabotageCooldown = 0;
    H.shields = {}; H.invisible = {}; H.shifted = {};
    H.closedRooms = {};
    M.clearDoors();
  }

  function stop() { H.active = false; }

  /* People outrank bots for a colour. A bot holding the shade somebody wants
     would otherwise block the round with a message about a clash the player
     cannot do anything about. */
  function freeBotColour(wanted, botId) {
    const taken = {};
    for (const id of list()) if (id !== botId) taken[H.players[id].colorIdx] = true;
    for (let i = 0; i < C.COLORS.length; i++) if (!taken[i]) return i;
    return wanted;
  }

  function yieldColour(wanted, claimant) {
    for (const id of list()) {
      const other = H.players[id];
      if (id === claimant || !other.bot || other.colorIdx !== wanted) continue;
      other.colorIdx = freeBotColour(wanted, id);
      H.dirty = true;
    }
  }

  function addPlayer(id, info) {
    const existing = H.players[id];
    if (existing) {
      existing.connected = true;
      if (info) {
        if (info.n) existing.name = U.cleanName(info.n, C.NAME_MAX) || existing.name;
        if (Number.isFinite(info.c)) {
          existing.colorIdx = U.clamp(info.c | 0, 0, C.COLORS.length - 1);
          if (!existing.bot) yieldColour(existing.colorIdx, id);
        }
        if (Number.isFinite(info.h)) existing.hatIdx = U.clamp(info.h | 0, 0, C.HATS.length - 1);
        if (info.k) existing.key = String(info.k).slice(0, 200);
      }
      H.dirty = true;
      return existing;
    }
    if (Object.keys(H.players).length >= C.MAX_PLAYERS) return null;
    /* Joining mid-round makes you a ghost with nothing to do, so the door is
