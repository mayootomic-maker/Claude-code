<script>
/* Getting fourteen phones to agree on where everybody is.

   Three ways in, one interface above them, because the three places this page
   runs have completely different rules about the network:

     - **A file, or any web host.** A public MQTT broker over a WebSocket.
       Nothing to install and nothing to sign into: somebody reads a four
       letter code out and the class types it in. This is the one that works
       for a class, and it is the one the built file uses.

     - **Inside the claude.ai artifact viewer.** No WebSocket and no WebRTC --
       both are blocked before they open. What there is instead is the `room`
       capability: presence for where everyone is, topics for what they did.
       It only reaches signed-in viewers of the same organisation, which is a
       real limit and is said on the join screen rather than left to be found
       out when half the class cannot connect.

     - **Nobody else at all.** A loopback that hands your own messages back to
       you, so one player and a pile of bots runs the identical code path as
       fourteen people. This is not a stub for the other two: it is how the
       page is playable the second it opens.

   Everything above this file sees the same four things -- `send`, `presence`,
   `peers` and an id -- and cannot tell which one it got. */

(function (NS) {
  'use strict';

  const U = NS.util;

  /* Public brokers, tried in order. Each is somebody else's goodwill and any
     of them can be down, full, or blocked by a school network. */
  const BROKERS = [
    { url: 'wss://broker.emqx.io:8084/mqtt', name: 'EMQX' },
    { url: 'wss://broker.hivemq.com:8884/mqtt', name: 'HiveMQ' },
    { url: 'wss://test.mosquitto.org:8081/mqtt', name: 'Mosquitto' },
  ];
  const ROOT = 'nightshift/v2/';
  const PRESENCE_HZ = 10;
  const KEEPALIVE = 1100;        // say something even when standing still
  /* A backgrounded tab is throttled to roughly one interval a second, so this
     has to be several of those and not two: dropping somebody who alt-tabbed
     is worse than carrying a ghost for a few seconds. */
  const GONE = 9000;

  const roomAvailable = () => !!(window.claude && typeof window.claude.use === 'function');

  /* One place decides which way this page talks, so the join screen and the
     lobby browser can never pick differently. */
  function preferred() {
    if (window.location.hash === '#local' && typeof window.BroadcastChannel === 'function') return 'local';
    return roomAvailable() ? 'room' : 'mqtt';
  }
  const mqttAvailable = () => typeof window.WebSocket === 'function';
  const localAvailable = () => typeof window.BroadcastChannel === 'function';

  const LOBBIES = ROOT + 'lobbies';
  const ANNOUNCE_EVERY = 3000;
  const FORGET_LOBBY = 11000;

  /* ---- browsing ------------------------------------------------------------

     Reading a four-letter code out works and will keep working, but in a room
     of thirty it is four letters mis-heard six times. So a host also puts its
     lobby on a shared channel, and everybody else gets a list to tap.

     Nothing on that list is private: it is a name, a code and a head count on
     a public bus, which is said on the screen that shows it. */

  function browse(opts) {
    const mode = opts.mode;
    if (mode === 'room') return browseRoom(opts);
    if (mode === 'mqtt') return browseMqtt(opts);
    opts.onError('There is no way to look for games from here.');
    return { stop() {} };
  }

  function browseMqtt(opts) {
    const seen = new Map();
    let client = null;
    let index = 0;
    let stopped = false;
    let sweep = null;

    const list = () => Array.from(seen.values())
      .filter((l) => Date.now() - l.at < FORGET_LOBBY)
      .sort((a, b) => b.players - a.players || a.code.localeCompare(b.code));

    function connect() {
      if (stopped) return;
      if (index >= BROKERS.length) {
        opts.onError('No public broker would answer, so there is no list to show. '
          + 'A code still works if somebody reads one out.');
        return;
      }
      const broker = BROKERS[index++];
      opts.onStatus('Looking for games via ' + broker.name + '...');
      client = NS.mqtt.connect({
        url: broker.url,
        clientId: 'nsb' + U.id(8),
        onUp() {
          if (stopped) { client.close(); return; }
          client.subscribe(LOBBIES);
          opts.onStatus('');
          opts.onList(list());
        },
        onDown() { if (!stopped && !seen.size) connect(); },
      });
      if (!client) { connect(); return; }
      client.onMessage((topic, msg) => {
        if (stopped || topic !== LOBBIES || !msg || !msg.c) return;
        const code = String(msg.c).slice(0, 8).toUpperCase();
        if (msg.gone) { seen.delete(code); opts.onList(list()); return; }
        seen.set(code, {
          code,
          host: U.cleanName(msg.h, 12) || 'Somebody',
          players: Math.max(1, Math.min(14, msg.n | 0)),
          at: Date.now(),
        });
        opts.onList(list());
      });
      sweep = setInterval(() => opts.onList(list()), 2000);
    }

    connect();
    return {
      stop() {
        stopped = true;
        clearInterval(sweep);
        if (client) client.close();
      },
    };
  }

  /* In the artifact everybody is already in one room, so the lobbies are just
     the hosts standing in it -- no announcement channel needed. */
  function browseRoom(opts) {
    let room = null;
    let stopped = false;
    let off = null;

    function report() {
      if (!room || stopped) return;
      const found = new Map();
      for (const peer of room.peers()) {
        const pres = peer.presence;
        if (!pres || !pres.H || !pres.lobby) continue;
        const code = String(pres.lobby).toUpperCase();
        const entry = found.get(code) || { code, host: U.cleanName(pres.n, 12) || 'Somebody', players: 0 };
        found.set(code, entry);
      }
      for (const peer of room.peers()) {
        const pres = peer.presence;
        if (!pres || !pres.lobby) continue;
        const entry = found.get(String(pres.lobby).toUpperCase());
        if (entry) entry.players++;
      }
      opts.onList(Array.from(found.values()).sort((a, b) => b.players - a.players));
    }

    opts.onStatus('Looking for games...');
    window.claude.use('room').then((got) => {
      if (stopped) return;
      if (!got) { opts.onError('This view cannot reach the room, so there is no list.'); return; }
      room = got;
      off = room.onPeers(report);
      opts.onStatus('');
      report();
    }).catch(() => { if (!stopped) opts.onError('The room would not load.'); });

    return { stop() { stopped = true; if (off) off(); } };
  }

  /* ---- the shape everything above this file talks to --------------------- */

  function base(opts) {
    return {
      mode: opts.mode,
      code: opts.code || '',
      id: '',
      ready: false,
      send() {},
      presence() {},
      peers() { return []; },
      announce() {},
      close() {},
    };
  }

  /* ---- loopback --------------------------------------------------------- */

  function openSolo(opts) {
    const self = base(opts);
    self.id = 'me';
    self.ready = true;
    let mine = {};
    let closed = false;

    self.send = (kind, data) => {
      if (closed) return;
      /* Delivered on a later turn, exactly as the networked paths deliver it.
         Making a solo game synchronous would let the host logic depend on an
         ordering that never happens once there is a network involved. */
      setTimeout(() => {
        if (!closed) opts.onMessage({ from: self.id, kind, data, mine: true });
      }, 0);
    };
    self.presence = (patch) => {
      for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
    };
    self.peers = () => [{ id: self.id, presence: mine, isMe: true }];
    self.close = () => { closed = true; };

    setTimeout(() => { opts.onStatus('Playing on this device.'); opts.onReady(); }, 0);
    return self;
  }

  /* ---- public broker ---------------------------------------------------- */

  function openMqtt(opts) {
    const self = base(opts);
    self.id = U.id(10);
    const code = String(opts.code || '').toUpperCase();
    const tPresence = ROOT + code + '/p';
    const tEvent = ROOT + code + '/e';

    const table = new Map();       // id -> { id, presence, isMe, seen }
    let mine = {};
    let client = null;
    let brokerIndex = 0;
    let closed = false;
    let dirty = true;
    let lastSent = 0;
    let pump = null;
    let sweep = null;

    table.set(self.id, { id: self.id, presence: mine, isMe: true, seen: Date.now() });

    function publishPresence(force) {
      if (!client || !client.ready) return;
      const t = Date.now();
      if (!force && !dirty && t - lastSent < KEEPALIVE) return;
      if (t - lastSent < 1000 / PRESENCE_HZ) return;
      lastSent = t;
      dirty = false;
      client.publish(tPresence, { i: self.id, p: mine });
    }

    function forget() {
      const t = Date.now();
      let changed = false;
      for (const [id, peer] of table) {
        if (peer.isMe) continue;
        if (t - peer.seen > GONE) { table.delete(id); changed = true; }
      }
      if (changed) opts.onPeers();
    }

    function connect() {
      if (closed) return;
      if (brokerIndex >= BROKERS.length) {
        opts.onError('No public broker would take the connection. This network may block them, '
          + 'or all three may be down. A phone hotspot usually gets around it.');
        return;
      }
      const broker = BROKERS[brokerIndex++];
      opts.onStatus('Connecting via ' + broker.name + '...');
      client = NS.mqtt.connect({
        url: broker.url,
        clientId: 'ns' + self.id + U.id(4),
        onUp() {
          if (closed) { client.close(); return; }
          client.subscribe(tPresence);
          client.subscribe(tEvent);
          opts.onStatus('Connected via ' + broker.name + '.');
          self.ready = true;
          publishPresence(true);
          opts.onReady(broker);
        },
        onDown(why) {
          if (closed) return;
          if (!self.ready) { connect(); return; }   // this one never worked; try the next
          self.ready = false;
          opts.onError('Lost the connection to ' + broker.name + '. ' + (why || ''));
        },
      });
      if (!client) { connect(); return; }

      client.onMessage((topic, msg) => {
        if (closed || !msg) return;
        if (topic === tPresence) {
          const id = String(msg.i || '');
          if (!id || id === self.id) return;
          let peer = table.get(id);
          if (!peer) {
            peer = { id, presence: {}, isMe: false, seen: 0 };
            table.set(id, peer);
            peer.presence = (msg.p && typeof msg.p === 'object') ? msg.p : {};
            peer.seen = Date.now();
            opts.onPeers();
            return;
          }
          peer.presence = (msg.p && typeof msg.p === 'object') ? msg.p : {};
          peer.seen = Date.now();
          return;
        }
        if (topic === tEvent) {
          const from = String(msg.i || '');
          if (!from) return;
          opts.onMessage({ from, kind: String(msg.k || ''), data: msg.d, mine: from === self.id });
        }
      });
    }

    self.send = (kind, data) => {
      if (closed || !client || !client.ready) return;
      client.publish(tEvent, { i: self.id, k: kind, d: data });
    };
    let lastAnnounce = 0;
    self.announce = (info) => {
      if (closed || !client || !client.ready) return;
      const now = Date.now();
      if (info && now - lastAnnounce < ANNOUNCE_EVERY) return;
      lastAnnounce = now;
      if (!info) client.publish(LOBBIES, { c: code, gone: 1 });
      else client.publish(LOBBIES, { c: code, h: info.host, n: info.players });
    };
    self.presence = (patch) => {
      for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
      dirty = true;
    };
    self.peers = () => Array.from(table.values());
    self.close = () => {
      closed = true;
      clearInterval(pump); clearInterval(sweep);
      if (client) {
        try {
          client.publish(tPresence, { i: self.id, gone: 1 });
          client.publish(LOBBIES, { c: code, gone: 1 });
        } catch (e) {}
        client.close();
      }
    };

    pump = setInterval(publishPresence, Math.floor(1000 / PRESENCE_HZ));
    sweep = setInterval(forget, 700);
    connect();
    return self;
  }

  /* ---- two tabs on one computer ----------------------------------------- */

  /* BroadcastChannel reaches every other tab of the same page with no server,
     no broker and no permission. Two people can share a laptop with it, and --
     the reason it exists -- it is the only way to exercise the guest half of
     this game without fourteen devices: the host and the guest run the real
     code, including the sealed role delivery, in two tabs. */
  function openLocal(opts) {
    const self = base(opts);
    self.id = U.id(10);
    const code = String(opts.code || 'MAIN').toUpperCase();
    const table = new Map();
    let mine = {};
    let closed = false;
    let channel = null;
    let beat = null;
    let sweep = null;

    table.set(self.id, { id: self.id, presence: mine, isMe: true, seen: Date.now() });

    try {
      channel = new BroadcastChannel('nightshift-v2-' + code);
    } catch (e) {
      opts.onError('This browser will not open a channel between tabs.');
      return self;
    }

    const post = (msg) => { if (!closed && channel) channel.postMessage(msg); };

    channel.onmessage = (e) => {
      const msg = e.data;
      if (closed || !msg || msg.i === self.id) return;
      if (msg.p) {
        let peer = table.get(msg.i);
        if (!peer) {
          peer = { id: msg.i, presence: {}, isMe: false, seen: 0 };
          table.set(msg.i, peer);
          peer.presence = msg.p;
          peer.seen = Date.now();
          post({ i: self.id, p: mine });          // say hello back at once
          opts.onPeers();
          return;
        }
        peer.presence = msg.p;
        peer.seen = Date.now();
        return;
      }
      if (msg.gone) {
        if (table.delete(msg.i)) opts.onPeers();
        return;
      }
      if (msg.k) opts.onMessage({ from: msg.i, kind: msg.k, data: msg.d, mine: false });
    };

    self.send = (kind, data) => {
      if (closed) return;
      /* Your own messages come back to you on every other transport, so they
         have to here too, or the host would not hear itself. */
      opts.onMessage({ from: self.id, kind, data, mine: true });
      post({ i: self.id, k: kind, d: data });
    };
    self.presence = (patch) => {
      for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
    };
    self.peers = () => Array.from(table.values());
    self.close = () => {
      closed = true;
      clearInterval(beat); clearInterval(sweep);
      if (channel) { post({ i: self.id, gone: 1 }); channel.close(); }
    };

    beat = setInterval(() => post({ i: self.id, p: mine }), Math.floor(1000 / PRESENCE_HZ));
    sweep = setInterval(() => {
      const t = Date.now();
      let changed = false;
      for (const [id, peer] of table) {
        if (peer.isMe) continue;
        if (t - peer.seen > GONE) { table.delete(id); changed = true; }
      }
      if (changed) opts.onPeers();
    }, 700);

    self.ready = true;
    setTimeout(() => {
      if (closed) return;
      post({ i: self.id, p: mine });
      opts.onStatus('Playing across tabs on this computer.');
      opts.onReady();
    }, 0);
    return self;
  }

  /* ---- the artifact room ------------------------------------------------ */

  function openRoom(opts) {
    const self = base(opts);
    const code = String(opts.code || 'MAIN').toUpperCase();
    let room = null;
    let mine = {};
    let closed = false;
    let started = false;
    let waiting = null;
    const unsubs = [];

    /* One topic per direction, all three opened to `interact` at publish time
       so a viewer who can only view the page can still play it. A topic that
       is not opened is admin-only, and the class would be able to walk around
       and do nothing else. */
    const TOPICS = ['act', 'sys', 'chat'];

    /* Everybody viewing the page is in one room, so several games can run in
       it at once and each has to ignore the others. The key is `lobby` and not
       something shorter for a reason: presence already carries `c` for the
       player's colour, and a two-games-at-once filter that silently matched a
       colour index would have made the room look empty to everybody. */
    const LOBBY = 'lobby';

    self.send = (kind, data) => {
      if (closed || !room || TOPICS.indexOf(kind) < 0) return;
      room.emit(kind, { lobby: code, d: data }).catch((e) => {
        if (e && e.code === 'not_permitted') {
          opts.onError('This page was published without the game topics open, so nothing you do '
            + 'can reach the others. Republishing it fixes that.');
        }
      });
    };
    self.presence = (patch) => {
      for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
      if (room && !closed) {
        const out = {};
        for (const k in patch) out[k] = patch[k];
        out[LOBBY] = code;
        room.presence(out).catch(() => {});
      }
    };
    self.peers = () => {
      if (!room) return [{ id: self.id, presence: mine, isMe: true }];
      return room.peers()
        .filter((p) => p.kind === 'viewer' && p.presence && p.presence[LOBBY] === code)
        .map((p) => ({ id: p.peer, presence: p.presence, isMe: !!(p.isMe && p.sameTab) }));
    };
    self.close = () => {
      closed = true;
      clearTimeout(waiting);
      unsubs.forEach((fn) => { try { fn(); } catch (e) {} });
    };

    /* The game cannot start until this view knows its own peer id: every
       player in a snapshot is keyed by it, so starting a moment early would
       give this device an entity nobody else has heard of and a second one
       arriving in the first snapshot. The id comes from the first onPeers,
       not from `use()`, so readiness waits for it. */
    function begin() {
      if (started || closed) return;
      const me = room.peers().find((p) => p.isMe && p.sameTab);
      if (!me) return;
      started = true;
      clearTimeout(waiting);
      self.id = me.peer;
      self.ready = true;
      opts.onStatus('In the room.');
      opts.onReady();
      opts.onPeers();
    }

    opts.onStatus('Looking for the others...');
    window.claude.use('room').then((got) => {
      if (closed) return;
      if (!got) {
        opts.onError('This view cannot reach the room. That usually means you are signed out, '
          + 'or the page was shared outside the organisation that published it. '
          + 'Practice mode works either way.');
        return;
      }
      room = got;
      for (const topic of TOPICS) {
        unsubs.push(room.on(topic, (msg) => {
          if (closed || !msg || !msg.data || msg.data.lobby !== code) return;
          opts.onMessage({
            from: msg.peer, kind: topic, data: msg.data.d,
            mine: !!(msg.isMe && msg.sameTab),
          });
        }, (err) => opts.onError('The room closed: ' + (err && err.message ? err.message : 'unknown'))));
      }
      unsubs.push(room.onPeers(() => {
        if (closed) return;
        if (!started) begin(); else opts.onPeers();
      }));
      self.presence({});
      begin();
      waiting = setTimeout(() => {
        if (!started && !closed) {
          opts.onError('The room never said who this device is, so it cannot join a game here. '
            + 'Practice mode still works.');
        }
      }, 8000);
    }).catch(() => {
      if (!closed) opts.onError('The room capability failed to load. Practice mode still works.');
    });

    return self;
  }

  function open(opts) {
    const wired = {
      mode: opts.mode,
      code: opts.code,
      onStatus: opts.onStatus || function () {},
      onReady: opts.onReady || function () {},
      onError: opts.onError || function () {},
      onMessage: opts.onMessage || function () {},
      onPeers: opts.onPeers || function () {},
    };
    if (opts.mode === 'room') return openRoom(wired);
    if (opts.mode === 'mqtt') return openMqtt(wired);
    if (opts.mode === 'local') return openLocal(wired);
    return openSolo(wired);
  }

  NS.link = { open, browse, preferred, roomAvailable, mqttAvailable, localAvailable, BROKERS };
})(window.NS);

</script>
<script>
/* Who you are, what you have to do, and when it is over.

   Pure functions on purpose. Dealing roles is the one moment a round can be
   ruined without anybody noticing -- two impostors when the lobby said one,
   a crew of six where nobody got the medic that was switched on -- and the
   only way to be sure is to be able to run the deal ten thousand times
   outside the game. Everything here takes a seeded RNG and returns a plain
   object, so tools/deal.mjs can do exactly that. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const STATIONS = NS.map.STATIONS;

  const stationById = {};
  for (const s of STATIONS) stationById[s.id] = s;

  const stepsOf = (station) => (station.steps ? station.steps.length : 1);

  /* How many impostors this many players can actually take. Two impostors
     against three crew is not a game, it is a coin toss, so the lobby's
     number is capped rather than obeyed. */
  function impostorCap(playerCount) {
    if (playerCount >= 9) return 3;
    if (playerCount >= 7) return 2;
    return 1;
  }

  /* One player, one role. Chance settings are per-role percentages: a role at
     0 never appears, at 100 always does if there is somebody to take it. Each
     special role is handed out at most once, because two sheriffs shooting
     each other is a bug report waiting to happen. */
  function dealRoles(playerIds, settings, rand, prefer) {
    let ids = U.shuffle(playerIds, rand);
    const impostorCount = Math.min(
      Math.max(1, settings.impostors),
      impostorCap(ids.length),
      Math.max(1, Math.floor((ids.length - 1) / 2)));

    /* One player may be moved to the side they asked for -- practice against
       bots, and nowhere else; the host decides whether that is allowed and
       this only carries it out. It is a move within the shuffle rather than an
       assignment on top of it: dropped at a random index inside the half it
       belongs to, so a forced crewmate can still be the medic or the jester,
       and everybody else's roles are still dealt by the same deck. */
    if (prefer && ids.indexOf(prefer.id) >= 0) {
      const rest = ids.filter((id) => id !== prefer.id);
      const at = prefer.team === 'impostor'
        ? Math.floor(rand() * impostorCount)
        : impostorCount + Math.floor(rand() * (rest.length + 1 - impostorCount));
      rest.splice(at, 0, prefer.id);
      ids = rest;
    }

    const roles = {};
    const impostors = ids.slice(0, impostorCount);
    const crew = ids.slice(impostorCount);

    for (const id of impostors) roles[id] = 'impostor';
    for (const id of crew) roles[id] = 'crewmate';

    /* The jester is taken out of the crew before the crew roles are handed
       out, so it can never land on the same player as the medic. */
    let pool = crew.slice();
    if (settings.roles.jester > 0 && pool.length > 2 && rand() * 100 < settings.roles.jester) {
      roles[pool[0]] = 'jester';
      pool = pool.slice(1);
    }

    for (const role of C.IMPOSTOR_ROLES) {
      const chance = settings.roles[role] || 0;
      if (chance <= 0) continue;
      const plain = impostors.filter((id) => roles[id] === 'impostor');
      if (!plain.length) break;
      if (rand() * 100 < chance) roles[U.pick(plain, rand)] = role;
    }

    for (const role of C.CREW_ROLES) {
      const chance = settings.roles[role] || 0;
      if (chance <= 0) continue;
      const plain = pool.filter((id) => roles[id] === 'crewmate');
      /* Always leave one plain crewmate. A round where every single crew
         member has a power is a different game, and not this one. */
      if (plain.length <= 1) break;
      if (rand() * 100 < chance) roles[U.pick(plain, rand)] = role;
    }

    return roles;
  }

  /* Tasks. Everybody gets the same common tasks -- that is what makes them
     useful, since you can stand next to somebody and watch them do it -- and
     their own draw of short and long ones. */
  function dealTasks(playerIds, settings, rand) {
    const byType = { common: [], short: [], long: [] };
    for (const s of STATIONS) byType[s.type].push(s);

    const common = U.shuffle(byType.common, rand).slice(0, settings.commonTasks);
    const out = {};
    for (const id of playerIds) {
      const shorts = U.shuffle(byType.short, rand).slice(0, settings.shortTasks);
      const longs = U.shuffle(byType.long, rand).slice(0, settings.longTasks);
      out[id] = common.concat(shorts, longs).map((s) => ({
        sid: s.id, step: 0, steps: stepsOf(s), done: false,
      }));
    }
    return out;
  }

  /* The bar counts crew work only. An impostor's list is real enough to walk
     to and stand at -- that is the point of faking -- but finishing it moves
     nothing, and a jester finishing theirs would be helping the people they
     are trying to lose to. */
  function countable(roles) {
    return Object.keys(roles).filter((id) => C.ROLES[roles[id]].team === 'crew');
  }

  function taskTotals(tasks, roles) {
    let total = 0, done = 0;
    for (const id of countable(roles)) {
      for (const t of (tasks[id] || [])) {
        total += t.steps;
        done += Math.min(t.step, t.steps);
      }
    }
    return { total, done };
  }

  /* Called after every death, ejection and completed task. Returns null while
     the round is still live. */
  function winner(state) {
    const alive = [];
    for (const id in state.players) {
      const p = state.players[id];
      if (p.alive && p.connected) alive.push(id);
    }
    const team = (id) => C.ROLES[state.roles[id] || 'crewmate'].team;
    const impostors = alive.filter((id) => team(id) === 'impostor');
    const others = alive.filter((id) => team(id) !== 'impostor');

    if (!impostors.length) return { team: 'crew', reason: 'Every impostor is gone.' };

    const totals = taskTotals(state.tasks, state.roles);
    if (totals.total > 0 && totals.done >= totals.total) {
      return { team: 'crew', reason: 'The crew finished every task.' };
    }
    if (impostors.length >= others.length) {
      return { team: 'impostor', reason: 'The impostors outnumber the crew.' };
    }
    return null;
  }

  NS.rules = {
    stationById, stepsOf, impostorCap, dealRoles, dealTasks, taskTotals, winner, countable,
  };
})(window.NS);

</script>
<script>
/* Breaking the station on purpose.

   Sabotage is the impostor's real weapon and the kill is the finish. Its job
   is to move people: a reactor meltdown drags two of them across the map and
   leaves everywhere else empty, lights shrink what the crew can see without
   touching what the impostor can, and doors buy the ten seconds it takes to
   walk out of a room you should not have been in.

   Two of them are critical -- they end the round if they run out. The other
   two have no timer at all, which is what makes them insidious: nobody is
   forced to deal with them, so they get left, and a crew playing in the dark
   with no cameras is a crew that cannot prove anything. */

(function (NS) {
  'use strict';

  const M = NS.map;
  const U = NS.util;
  const SPOTS = M.SABOTAGE_SPOTS;

  const SABOTAGES = {
    reactor: {
      id: 'reactor', name: 'Reactor Meltdown', short: 'Reactor', critical: true, seconds: 45,
      room: 'reactor', fix: 'hold', spots: ['reactorLeft', 'reactorRight'],
      warn: 'Reactor meltdown. Two people, both pads, at the same time.',
      lose: 'The reactor melted down.',
    },
    oxygen: {
      id: 'oxygen', name: 'Oxygen Depleted', short: 'O2', critical: true, seconds: 45,
      room: 'o2', fix: 'code', spots: ['o2Left', 'o2Right'],
      warn: 'Oxygen is venting. Both keypads need the code.',
      lose: 'The station ran out of air.',
    },
    lights: {
      id: 'lights', name: 'Lights Out', short: 'Lights', critical: false, seconds: 0,
      room: 'electrical', fix: 'switches', spots: ['lights'],
      warn: 'The lights are out. The breakers are in Electrical.',
    },
    comms: {
      id: 'comms', name: 'Comms Sabotaged', short: 'Comms', critical: false, seconds: 0,
      room: 'comms', fix: 'tune', spots: ['comms'],
      warn: 'Communications are down. No task list, no cameras, no vitals.',
    },
    doors: {
      id: 'doors', name: 'Doors Sealed', short: 'Doors', critical: false, seconds: 12,
      room: null, fix: null, spots: [],
      warn: 'Doors sealed.',
    },
  };

  /* The order the sabotage menu is drawn in, and the only ones an impostor may
     ask for. Doors are picked by room instead, so they are not in this list. */
  const MENU = ['reactor', 'oxygen', 'lights', 'comms'];

  const REACH = 74;

  /* Which fix point, if any, you are standing at -- for the live sabotage
     only. Standing on the reactor pad when the reactor is fine does nothing,
     and the Use button should not claim otherwise. */
  function fixAt(x, y) {
    const active = NS.world.state.sabotage;
    if (!active) return null;
    const def = SABOTAGES[active.kind];
    if (!def || !def.fix) return null;
    for (let i = 0; i < def.spots.length; i++) {
      if (active.done && active.done[i]) continue;
      const spot = SPOTS[def.spots[i]];
      const w = M.toWorld(spot);
      if (U.dist2(x, y, w.x, w.y) < REACH * REACH) {
        return { kind: active.kind, def, index: i, x: w.x, y: w.y, spot };
      }
    }
    return null;
  }

  /* Every fix point on the map for the live sabotage, so the HUD can point at
     the one you are not standing on. */
  function activeSpots() {
    const active = NS.world.state.sabotage;
    if (!active) return [];
    const def = SABOTAGES[active.kind];
    if (!def) return [];
    return def.spots.map((key, i) => {
      const w = M.toWorld(SPOTS[key]);
      return { x: w.x, y: w.y, index: i, done: !!(active.done && active.done[i]) };
    });
  }

  /* Vision multiplier the lights sabotage applies. Impostors are untouched --
     that asymmetry is the entire point of the sabotage, and a crew that does
     not know about it thinks the impostor got lucky. */
  function visionScale(isImpostor) {
    const active = NS.world.state.sabotage;
    if (!active || active.kind !== 'lights') return 1;
    return isImpostor ? 1 : 0.42;
  }

  const commsDown = () => {
    const a = NS.world.state.sabotage;
    return !!(a && a.kind === 'comms');
  };

  NS.sabotage = { SABOTAGES, MENU, fixAt, activeSpots, visionScale, commsDown, REACH };
})(window.NS);

<script>
/* What the bots know, what they think, and what they are willing to say.

   A bot that votes at random is not an opponent, it is a dice roll wearing a
   hat -- and it makes the meeting, which is the whole game, meaningless. So
   every bot keeps a small memory of what it actually saw, reasons from it, and
   argues out loud.

   Two halves, and they are deliberately asymmetric:

   **The detective.** A crew bot records sightings -- who, where, when -- and
   nothing else. It cannot see through walls and it does not consult the
   host's tables. When a body turns up it reasons over the window around the
   death: who was near, who was unaccounted for, who it can personally vouch
   for. Its confidence is bounded by what it witnessed, so it is beatable by
   anybody who is careful, and unbeatable by anybody who kills in front of it.

   **The liar.** An impostor bot keeps the same record, and uses it to pick a
   claim that will not be contradicted: a room it really was in, before the
   kill. It watches which way the room is leaning and leans the same way. It
   defends itself when named. It will occasionally report its own kill, which
   is the strongest move in the game and the one that most reliably makes a
   class shout.

   Everything a bot says is derived from something it observed. None of it is
   generated, none of it is looked up, and a bot cannot say a room name it was
   never in. That constraint is the whole reason the meetings are worth having:
   the bots can be caught out. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;

  const MEMORY_SECONDS = 100;
  const SIGHT = 330;
  const MURDER_WINDOW = 26;      // seconds before a body that count as "around then"

  const minds = new Map();
  let observeClock = 0;

  function mind(id) {
    if (!minds.has(id)) {
      minds.set(id, {
        id,
        sightings: [],        // { t, who, room }
        rooms: [],            // { t, room } -- where I was
        witnessed: {},        // who -> { kill, vent, at }
        bodies: [],           // { who, room, t, finder }
        accusedBy: {},        // who -> t
        heardClaims: {},      // who -> room
        suspicion: {},
        testimony: [],        // { from, about, kind, t }
        nextSpeak: 0,
        said: 0,
        spokeAbout: {},
      });
    }
    return minds.get(id);
  }

  function reset() {
    minds.clear();
    observeClock = 0;
  }

  const clock = (H) => Math.max(0, (U.now() - H.startedAt) / 1000);

  function trim(list, now) {
    while (list.length && now - list[0].t > MEMORY_SECONDS) list.shift();
  }

  /* ---- looking around ----------------------------------------------------- */

  /* Runs a couple of times a second for every bot, and only records what that
     bot could actually see: in range, and with no wall in the way. */
  function observe(dt, H) {
    if (H.phase !== 'play') return;
    observeClock -= dt;
    if (observeClock > 0) return;
    observeClock = 0.45;

    const now = clock(H);
    const ids = Object.keys(H.players);

    for (const id of ids) {
      const self = H.players[id];
      if (!self || !self.bot || !self.alive) continue;
      const me = NS.world.players.get(id);
      if (!me) continue;
      const my = mind(id);

      const room = M.roomAt(me.x, me.y);
      const last = my.rooms[my.rooms.length - 1];
      if (room && (!last || last.room !== room.name)) my.rooms.push({ t: now, room: room.name });
      trim(my.rooms, now);

      for (const other of ids) {
        if (other === id) continue;
        const them = H.players[other];
        if (!them || !them.alive || them.ghost) continue;
        const at = NS.world.players.get(other);
        if (!at || at.inVent) continue;
        if (H.invisible[other]) continue;
        if (U.dist(me.x, me.y, at.x, at.y) > SIGHT) continue;
        if (!NS.los.clear(me.x, me.y, at.x, at.y)) continue;
        const where = M.roomAt(at.x, at.y);
        my.sightings.push({ t: now, who: other, room: where ? where.name : 'a corridor' });
      }
      trim(my.sightings, now);
      if (my.sightings.length > 90) my.sightings.splice(0, my.sightings.length - 90);
    }
  }

  /* ---- being told things -------------------------------------------------- */

  /* A kill only registers for a bot that could see it happen. This is the one
     piece of certain evidence in the game and it has to be earned. */
  function witnessKill(H, killerId, victimId, x, y) {
    const now = clock(H);
    for (const [id, my] of minds) {
      const p = H.players[id];
      if (!p || !p.alive || id === killerId) continue;
      const me = NS.world.players.get(id);
      if (!me) continue;
      if (U.dist(me.x, me.y, x, y) > SIGHT) continue;
      if (!NS.los.clear(me.x, me.y, x, y)) continue;
      my.witnessed[killerId] = { kill: true, at: now };
    }
  }

  function witnessVent(H, venterId, x, y) {
    const now = clock(H);
    for (const [id, my] of minds) {
      const p = H.players[id];
      if (!p || !p.alive || id === venterId) continue;
      const me = NS.world.players.get(id);
      if (!me) continue;
      if (U.dist(me.x, me.y, x, y) > SIGHT) continue;
      if (!NS.los.clear(me.x, me.y, x, y)) continue;
      const seen = my.witnessed[venterId] || (my.witnessed[venterId] = { at: now });
      seen.vent = true;
      seen.at = now;
    }
  }

  /* Everybody learns a body was found, because the meeting says so. Where and
     when it happened is what they reason over. */
  function noteBody(H, finderId, body) {
    const now = clock(H);
    const room = M.roomAt(body.x, body.y);
    for (const [, my] of minds) {
      my.bodies.push({
        who: body.id, room: room ? room.name : 'a corridor', t: now, finder: finderId,
      });
      if (my.bodies.length > 6) my.bodies.shift();
    }
  }

  /* A bot notices its own name in the chat and treats that as being accused.
     Crude on purpose: matching a name is something a bot can genuinely do,
     and pretending to understand the sentence would be a lie about how it
     works. */
  /* Testimony. A bot that only trusts its own eyes cannot be argued with, and
     three of them saying "I watched Rae do it" while everybody votes for
     somebody else is the meeting failing at the one thing it is for. So a
     spoken claim is delivered to every other mind as evidence -- discounted
     by how much the listener already distrusts the speaker, which is what
     stops one loud liar from steering the room. */
  function receiveClaim(H, fromId, claim) {
    if (!claim || !claim.about) return;
    for (const [id, my] of minds) {
      if (id === fromId) continue;
      const p = H.players[id];
      if (!p || !p.alive || !p.bot) continue;
      my.testimony.push({
        from: fromId, about: claim.about, kind: claim.kind, t: clock(H),
      });
      if (my.testimony.length > 40) my.testimony.shift();
    }
  }

  function hear(H, fromName, text) {
    const lower = String(text || '').toLowerCase();
    for (const [id, my] of minds) {
      const p = H.players[id];
      if (!p || !p.bot) continue;
      if (lower.indexOf(p.name.toLowerCase()) < 0) continue;
      my.accusedBy[fromName] = clock(H);
    }
    /* And everybody notes a room somebody claimed, so a second claim from the
       same person can be checked against it. */
    for (const room of M.ROOMS) {
      if (lower.indexOf(room.name.toLowerCase()) < 0) continue;
      for (const [, my] of minds) my.heardClaims[fromName] = room.name;
      break;
    }
  }

  /* ---- reasoning ---------------------------------------------------------- */

  function withMeAround(my, who, at) {
    return my.sightings.some((s) => s.who === who && Math.abs(s.t - at) < 8);
  }

  function lastSeenBefore(my, who, at) {
    let best = null;
    for (const s of my.sightings) {
      if (s.who !== who || s.t > at) continue;
      if (!best || s.t > best.t) best = s;
    }
    return best;
  }

  /* The suspicion model. Every term is something the bot could know. */
  function weigh(H, id) {
    const my = mind(id);
    const scores = {};
    const alive = Object.keys(H.players).filter((k) =>
      H.players[k].alive && H.players[k].connected && k !== id);
    for (const other of alive) scores[other] = 0;

    const body = my.bodies[my.bodies.length - 1];
    const when = body ? body.t : clock(H);

    for (const other of alive) {
      const saw = my.witnessed[other];
      if (saw && saw.kill) scores[other] += 120;
      if (saw && saw.vent) scores[other] += 75;

      if (body) {
        /* Anyone I saw in the room the body turned up in, shortly before it
           did. This is the ordinary bread of an Among Us meeting. */
        const near = my.sightings.some((s) =>
          s.who === other && s.room === body.room && body.t - s.t < MURDER_WINDOW && s.t <= body.t);
        if (near) scores[other] += 34;

        /* And whoever I never saw at all in that window is unaccounted for --
           weak, but it is what "where were you?" is actually asking. */
        const anywhere = my.sightings.some((s) => s.who === other && Math.abs(s.t - body.t) < MURDER_WINDOW);
        if (!anywhere) scores[other] += 12;

        /* Someone I was standing next to when it happened cannot have done
           it, and a bot should be as sure of that as a person would be. */
        if (withMeAround(my, other, body.t)) scores[other] -= 55;

        if (body.finder === other) scores[other] += 8;   // self-reports are a known move
      }

      /* Somebody who claimed a room I saw them nowhere near. */
      const claim = my.heardClaims[H.players[other].name];
      if (claim) {
        const backing = my.sightings.some((s) => s.who === other && s.room === claim);
        const contradicted = my.sightings.some((s) =>
          s.who === other && s.room !== claim && Math.abs(s.t - when) < 14);
        if (backing) scores[other] -= 20;
        else if (contradicted) scores[other] += 26;
      }

      /* Somebody who spent the round pointing at me. */
      if (my.accusedBy[H.players[other].name]) scores[other] += 10;
    }

    /* What other people said. An eyewitness claim is worth a great deal more
       than a "they were nearby", and both are worth less coming from somebody
       this bot already suspects. */
    for (const claim of my.testimony) {
      if (scores[claim.about] === undefined) continue;
      const speakerTrust = 1 - Math.min(0.8, Math.max(0, (scores[claim.from] || 0) / 160));
      const weight = claim.kind === 'witness' ? 58 : claim.kind === 'accuse' ? 20 : 0;
      scores[claim.about] += weight * speakerTrust;
    }

    /* An impostor knows which of these are safe and steers the rest. */
    if (C.ROLES[H.roles[id] || 'crewmate'].team === 'impostor') {
      for (const other of alive) {
        if (C.ROLES[H.roles[other] || 'crewmate'].team === 'impostor') scores[other] = -999;
      }
      /* Lean the way the room is already leaning. A liar who votes alone is a
         liar who gets voted next. */
      const votes = (H.meeting && H.meeting.votes) || {};
      for (const voter in votes) {
        const target = votes[voter];
        if (scores[target] !== undefined && scores[target] > -900) scores[target] += 30;
      }
      /* And whoever is looking at them. */
      for (const name in my.accusedBy) {
        const accuser = alive.find((k) => H.players[k].name === name);
        if (accuser && scores[accuser] > -900) scores[accuser] += 45;
      }
    }

    my.suspicion = scores;
    return scores;
  }

  function voteFor(H, id) {
    const my = mind(id);
    const scores = weigh(H, id);
    let best = null, bestScore = 0;
    for (const other in scores) {
      if (scores[other] > bestScore) { bestScore = scores[other]; best = other; }
    }
    const impostor = C.ROLES[H.roles[id] || 'crewmate'].team === 'impostor';
    /* A crew bot with nothing on anybody skips, which is the correct play and
       the one that makes the times they do vote mean something. */
    const threshold = impostor ? 18 : 30;
    if (!best || bestScore < threshold) return 'skip';
    void my;
    return best;
  }

  /* ---- talking ------------------------------------------------------------ */

  /* Prefer a phrasing nobody has just used. Three bots landing on the exact
     same sentence in a row is the fastest way to remind everyone they are
     bots. */
  const recent = [];
  function pick(list) {
    const fresh = list.filter((t) => recent.indexOf(t) < 0);
    const from = fresh.length ? fresh : list;
    const choice = from[Math.floor(Math.random() * from.length)];
    recent.push(choice);
    if (recent.length > 9) recent.shift();
    return choice;
  }
  const says = (text, claim) => (text ? { text, claim: claim || null } : null);

  function myRoomAround(my, t) {
    let best = null;
    for (const r of my.rooms) {
      if (r.t > t + 4) continue;
      if (!best || r.t > best.t) best = r;
    }
    return best ? best.room : null;
  }

  function nameOf(H, id) { return H.players[id] ? H.players[id].name : 'someone'; }

  function line(H, id) {
    const my = mind(id);
    const impostor = C.ROLES[H.roles[id] || 'crewmate'].team === 'impostor';
    const body = my.bodies[my.bodies.length - 1];
    const when = body ? body.t : clock(H);
    const scores = my.suspicion && Object.keys(my.suspicion).length ? my.suspicion : weigh(H, id);

    const top = Object.keys(scores).sort((a, b) => scores[b] - scores[a])[0];
    const accusers = Object.keys(my.accusedBy);

    /* 1. Something certain, said first and plainly. */
    for (const who in my.witnessed) {
      if (!H.players[who] || !H.players[who].alive) continue;
      if (my.spokeAbout[who]) continue;
      const saw = my.witnessed[who];
      if (impostor && C.ROLES[H.roles[who] || 'crewmate'].team === 'impostor') continue;
      my.spokeAbout[who] = true;
      if (saw.kill) {
        return says(pick([
          'I watched ' + nameOf(H, who) + ' do it.',
          'It is ' + nameOf(H, who) + '. I saw the kill.',
          nameOf(H, who) + '. I was right there when it happened.',
        ]), { kind: 'witness', about: who });
      }
      if (saw.vent) {
        return says(pick([
          nameOf(H, who) + ' came out of a vent.',
          'I saw ' + nameOf(H, who) + ' vent. That is the game.',
          'Vent. ' + nameOf(H, who) + '. I saw it with my own eyes.',
        ]), { kind: 'witness', about: who });
      }
    }

    /* 2. Being accused gets answered before anything else. */
    if (accusers.length && !my.spokeAbout.defence) {
      my.spokeAbout.defence = true;
      const room = myRoomAround(my, when) || 'the corridor';
      const witness = my.sightings.filter((s) =>
        Math.abs(s.t - when) < 10 && H.players[s.who] && H.players[s.who].alive)[0];
      if (witness) {
        return says(pick([
          'Not me. I was in ' + room + ' with ' + nameOf(H, witness.who) + '.',
          'I was in ' + room + '. ' + nameOf(H, witness.who) + ' was with me, ask them.',
        ]));
      }
      return says(pick([
        'It is not me. I was in ' + room + ' the whole time.',
        'I was doing tasks in ' + room + '.',
        'Why me? I have been in ' + room + '.',
      ]));
    }

    /* 3. The finder says where. */
    if (body && body.finder === id && !my.spokeAbout.report) {
      my.spokeAbout.report = true;
      const near = my.sightings.filter((s) =>
        s.room === body.room && body.t - s.t < MURDER_WINDOW
        && H.players[s.who] && H.players[s.who].alive);
      if (near.length) {
        const suspect = near[near.length - 1].who;
        return says(nameOf(H, body.who) + ' in ' + body.room + '. '
          + nameOf(H, suspect) + ' was there.', { kind: 'accuse', about: suspect });
      }
      return says(pick([
        nameOf(H, body.who) + ' in ' + body.room + '. I saw nobody.',
        'Body in ' + body.room + '. It was cold, I was alone.',
      ]));
    }

    /* 4. An accusation, if the evidence is worth one. */
    if (top && scores[top] >= 30 && !my.spokeAbout['acc' + top]) {
      my.spokeAbout['acc' + top] = true;
      const seen = lastSeenBefore(my, top, when);
      if (seen && body) {
        const options = [
          'I saw ' + nameOf(H, top) + ' in ' + seen.room + ' just before.',
          'Where were you, ' + nameOf(H, top) + '? I saw you in ' + seen.room + '.',
          nameOf(H, top) + ' was in ' + seen.room + ' right before it happened.',
        ];
        /* Only claim two rooms are neighbours when they are two rooms. */
        if (seen.room !== body.room) {
          options.push(nameOf(H, top) + ' was in ' + seen.room + ', right by ' + body.room + '.');
        } else {
          options.push(nameOf(H, top) + ' was in ' + body.room + ' with the body.');
        }
        return says(pick(options), { kind: 'accuse', about: top });
      }
      return says(pick([
        'I have not seen ' + nameOf(H, top) + ' do a single thing.',
        nameOf(H, top) + ' has been nowhere all round.',
      ]), { kind: 'accuse', about: top });
    }

    /* 5. Otherwise, where I was. An impostor picks a room it really was in,
          before the kill -- a lie that cannot be contradicted by anybody who
          was watching, which is the only kind worth telling. */
    if (!my.spokeAbout.alibi) {
      my.spokeAbout.alibi = true;
      const room = impostor
        ? (myRoomAround(my, Math.max(0, when - 20)) || myRoomAround(my, when) || 'Storage')
        : (myRoomAround(my, when) || 'the corridor');
      const withMe = my.sightings.filter((s) =>
        Math.abs(s.t - when) < 10 && H.players[s.who] && H.players[s.who].alive);
      if (withMe.length && !impostor) {
        return says(pick([
          'I was in ' + room + ' with ' + nameOf(H, withMe[0].who) + '.',
          room + '. ' + nameOf(H, withMe[0].who) + ' can back me up.',
        ]));
      }
      return says(pick([
        'I was in ' + room + '.',
        'Tasks in ' + room + ', nothing to report.',
        'I came from ' + room + '.',
      ]));
    }

    /* 6. Filler that still carries information. */
    const others = Object.keys(scores).filter((k) => H.players[k] && H.players[k].alive);
    if (others.length && Math.random() < 0.6) {
      return says(pick([
        'Where was everyone?',
        'Anybody see ' + nameOf(H, others[Math.floor(Math.random() * others.length)]) + '?',
        'Who was with ' + nameOf(H, others[Math.floor(Math.random() * others.length)]) + '?',
        'I have nothing on anyone. Skip?',
      ]));
    }
    return null;
  }

  /* Bots talk on their own clock, spread across the discussion so it reads as
     a conversation rather than a wall of text arriving at once. */
  function speak(dt, H, say) {
    if (!H.meeting) return;
    for (const id of Object.keys(H.players)) {
      const p = H.players[id];
      if (!p || !p.bot || !p.alive) continue;
      const my = mind(id);
      if (my.nextSpeak <= 0 && my.said === 0) my.nextSpeak = 1.5 + Math.random() * 7;
      my.nextSpeak -= dt;
      if (my.nextSpeak > 0) continue;
      if (my.said >= 3) { my.nextSpeak = 999; continue; }
      my.said++;
      my.nextSpeak = 4 + Math.random() * 9;
      const said = line(H, id);
      if (!said) continue;
      say(id, said.text);
      if (said.claim) receiveClaim(H, id, said.claim);
    }
  }

  function meetingOpened(H) {
    recent.length = 0;
    for (const [, my] of minds) {
      my.nextSpeak = 0;
      my.said = 0;
      my.spokeAbout = {};
      my.testimony.length = 0;
    }
  }

  NS.minds = {
    reset, observe, witnessKill, witnessVent, noteBody, hear,
    speak, voteFor, weigh, meetingOpened,
    mindOf: (id) => minds.get(id) || null,
  };
})(window.NS);

</script>
<script>
/* Everything this device believes about the station right now.

   Split by who owns what, because getting that wrong is what makes a
   multiplayer game feel broken:

     - **You own your own position.** You walk locally at full frame rate and
       tell everyone where you ended up. Nothing round-trips before you move,
       so the game feels the same on a slow school wifi as on a wire.
     - **The host owns everything that can be argued about.** Who is alive,
       whose task counted, who is on trial. Those arrive as snapshots and this
       file only ever mirrors them -- it never decides one for itself.

   The seam matters: a client that decided locally that its kill landed would
   show a body that the rest of the room does not have. So a kill here is a
   request, and the body appears when the host says it did. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;

  const BASE_SPEED = 168;        // px per second at speed 1.0
  const GHOST_BONUS = 1.18;

  const world = {
    me: null,
    players: new Map(),          // id -> entity, real and bot alike
    bodies: [],
    state: {
      phase: 'lobby', seq: 0, settings: C.defaults(),
      tasksDone: 0, tasksTotal: 0, sabotage: null, meeting: null, cameras: false,
      ejected: null, winner: null, closedRooms: [],
    },
    myRole: null,
    myTasks: [],
    hostId: null,
    localAlive: true,
    /* Set while a minigame, the map or a meeting is up: you stop walking but
       the world does not stop moving around you. */
    frozen: false,
  };

  function entity(id, opts) {
    return Object.assign({
      id, name: 'Someone', colorIdx: 0, hatIdx: 0,
      x: 0, y: 0, tx: 0, ty: 0, dir: 1, moving: false, bob: 0, walk: 0,
      alive: true, ghost: false, inVent: false, invisible: false,
      shiftIdx: -1, shielded: false, connected: true, bot: false, isMe: false,
      lastSeen: 0, trail: [],
    }, opts || {});
  }

  function reset() {
    world.players.clear();
    world.bodies.length = 0;
    world.me = null;
    world.myRole = null;
    world.myTasks = [];
    world.state.phase = 'lobby';
    world.state.winner = null;
    world.state.sabotage = null;
    world.state.meeting = null;
    world.state.ejected = null;
    M.clearDoors();
  }

  function spawnMe(id, profile) {
    const spot = M.toWorld(M.SPAWN);
    world.me = entity(id, {
      isMe: true,
      name: profile.name,
      colorIdx: profile.colorIdx,
      hatIdx: profile.hatIdx,
      x: spot.x, y: spot.y, tx: spot.x, ty: spot.y,
    });
    world.players.set(id, world.me);
    return world.me;
  }

  /* Everyone stands in a ring around the emergency table at the start of a
     round and after every meeting. Ordering by id rather than by join order
     means every device puts the same person in the same place, so a screenshot
     of the drop matches on all fourteen screens. */
  function placeAtSpawn(ids) {
    const order = ids.slice().sort();
    const centre = M.toWorld(M.SPAWN);
    order.forEach((id, i) => {
      const p = world.players.get(id);
      if (!p) return;
      const a = (i / Math.max(1, order.length)) * Math.PI * 2 - Math.PI / 2;
      const r = M.SPAWN.radius * M.TILE;
      p.x = p.tx = centre.x + Math.cos(a) * r;
      p.y = p.ty = centre.y + Math.sin(a) * r * 0.72;
      p.dir = Math.cos(a) >= 0 ? 1 : -1;
      p.trail.length = 0;
    });
  }

  /* ---- presence: the compact form of a player ---------------------------- */

  function encode(me) {
    return {
      n: me.name, c: me.colorIdx, h: me.hatIdx,
      x: Math.round(me.x), y: Math.round(me.y),
      d: me.dir, m: me.moving ? 1 : 0,
      v: me.inVent ? 1 : 0, i: me.invisible ? 1 : 0,
      s: me.shiftIdx,
    };
  }

  /* Presence arrives from strangers on a public bus. Every field is clamped
     to something drawable here rather than trusted -- an x of NaN would take
     the camera with it, and a name of ten thousand characters would take the
     frame rate. */
  function adopt(id, raw, isMe) {
    if (!raw || typeof raw !== 'object') return null;
    let p = world.players.get(id);
    if (!p) {
      p = entity(id, { isMe: !!isMe });
      const spot = M.toWorld(M.SPAWN);
      p.x = p.tx = spot.x; p.y = p.ty = spot.y;
      world.players.set(id, p);
    }
    if (p.isMe) return p;        // never let the wire move you
    p.name = U.cleanName(raw.n, C.NAME_MAX) || 'Someone';
    p.colorIdx = U.clamp(raw.c | 0, 0, C.COLORS.length - 1);
    p.hatIdx = U.clamp(raw.h | 0, 0, C.HATS.length - 1);
    const nx = Number(raw.x), ny = Number(raw.y);
    if (Number.isFinite(nx) && Number.isFinite(ny)) {
      p.tx = U.clamp(nx, 0, M.pixelWidth);
      p.ty = U.clamp(ny, 0, M.pixelHeight);
    }
    p.dir = raw.d < 0 ? -1 : 1;
    p.moving = !!raw.m;
    p.inVent = !!raw.v;
    p.invisible = !!raw.i;
    p.shiftIdx = Number.isFinite(raw.s) ? U.clamp(raw.s | 0, -1, C.COLORS.length - 1) : -1;
    p.lastSeen = U.now();
    return p;
  }

  /* Bots ride in the host's own presence rather than in the snapshot: the
     snapshot goes out twice a second, which is fine for who is alive and
     terrible for where somebody is standing. Four numbers each, so a full
     lobby of bots costs about the same as one more player. */
  function encodeBots(bots) {
    return bots.map((b) => [Math.round(b.x), Math.round(b.y), b.dir, b.moving ? 1 : 0]);
  }
  function adoptBots(raw) {
    if (!Array.isArray(raw)) return;
    for (let i = 0; i < raw.length; i++) {
      const row = raw[i];
      if (!Array.isArray(row)) continue;
      const p = world.players.get('bot' + i);
      if (!p || p.isMe) continue;
      const nx = Number(row[0]), ny = Number(row[1]);
      if (Number.isFinite(nx) && Number.isFinite(ny)) {
        p.tx = U.clamp(nx, 0, M.pixelWidth);
        p.ty = U.clamp(ny, 0, M.pixelHeight);
      }
      p.dir = row[2] < 0 ? -1 : 1;
      p.moving = !!row[3];
      p.lastSeen = U.now();
    }
  }

  /* ---- walking ----------------------------------------------------------- */

  function speedFor(p) {
    const s = world.state.settings.playerSpeed * BASE_SPEED;
    return p.ghost ? s * GHOST_BONUS : s;
  }

  function canWalk() {
    const st = world.state;
    if (world.frozen) return false;
    if (st.phase === 'meeting' || st.phase === 'end' || st.phase === 'reveal') return false;
    if (!world.me) return false;
    if (world.me.inVent) return false;
    return true;
  }

  function step(dt, input) {
    const me = world.me;
    if (!me) return;

    if (canWalk() && (input.x || input.y)) {
      const len = Math.hypot(input.x, input.y) || 1;
      const speed = speedFor(me) * dt;
      const dx = (input.x / len) * speed;
      const dy = (input.y / len) * speed;
      /* Ghosts walk through the station; that is the whole compensation for
         being dead, and it is what makes finishing tasks as a ghost bearable. */
      if (me.ghost) {
        me.x = U.clamp(me.x + dx, 8, M.pixelWidth - 8);
        me.y = U.clamp(me.y + dy, 8, M.pixelHeight - 8);
      } else {
        const moved = M.move(me.x, me.y, dx, dy);
        me.x = moved.x;
        me.y = moved.y;
      }
      me.moving = true;
      if (dx > 0.02) me.dir = 1;
      else if (dx < -0.02) me.dir = -1;
      if (!me.ghost && !me.inVent) NS.audio.play('step');
    } else {
      me.moving = false;
    }
    me.tx = me.x; me.ty = me.y;

    /* Everyone else is drawn where they were last heard from, eased rather
       than snapped. Fourteen at ten updates a second is a stutter without
       this, and a rubber band with too much of it. */
    const ease = Math.min(1, dt * 15);
    for (const p of world.players.values()) {
      if (p.isMe) continue;
      const far = U.dist2(p.x, p.y, p.tx, p.ty);
      if (far > 240 * 240) { p.x = p.tx; p.y = p.ty; p.trail.length = 0; }  // vented, ejected, or a meeting
      else { p.x += (p.tx - p.x) * ease; p.y += (p.ty - p.y) * ease; }
    }

    /* Footsteps from everybody else, quieter with distance and deliberately
       not blocked by walls. Hearing somebody you cannot see is most of what a
       dark corridor is for, and both sides of the game get to use it. */
    const EARSHOT = 360;
    const now = U.now();
    for (const p of world.players.values()) {
      p.walk += (p.moving ? dt * 7.5 : 0);
      NS.characters.idle(p, dt, now);
      if (p.isMe || !p.moving || p.ghost || p.inVent || !p.connected) continue;
      p.stepClock = (p.stepClock || 0) + dt;
      if (p.stepClock < 0.27) continue;
      p.stepClock = 0;
      const d = U.dist(me.x, me.y, p.x, p.y);
      if (d < EARSHOT) NS.audio.footstep(1 - d / EARSHOT);
    }
  }

  /* ---- what is within reach --------------------------------------------- */

  const USE_RANGE = 62;

  function myTask(sid) {
    return world.myTasks.find((t) => t.sid === sid && !t.done) || null;
  }

  /* The step of a task you are on decides where it wants you next, so a
     two-stop task shows its console only at the stop you owe. */
  function taskSpot(task) {
    const station = NS.rules.stationById[task.sid];
    if (!station) return null;
    const spot = station.steps ? station.steps[Math.min(task.step, station.steps.length - 1)] : station;
    return M.toWorld(spot);
  }

  function nearestVent() {
    if (!world.me) return null;
    let best = null, bestD = USE_RANGE * USE_RANGE;
    NS.map.VENT_GROUPS.forEach((group, gi) => {
      group.forEach((v, vi) => {
        const w = M.toWorld(v);
        const d = U.dist2(world.me.x, world.me.y, w.x, w.y);
        if (d < bestD) { bestD = d; best = { group: gi, index: vi, x: w.x, y: w.y }; }
      });
    });
    return best;
  }

  function nearestBody() {
    if (!world.me) return null;
    let best = null, bestD = (USE_RANGE + 20) * (USE_RANGE + 20);
    for (const b of world.bodies) {
      const d = U.dist2(world.me.x, world.me.y, b.x, b.y);
      if (d < bestD) { bestD = d; best = b; }
    }
    return best;
  }

  function killTarget() {
    const me = world.me;
    if (!me || !world.myRole || !C.ROLES[world.myRole].kill) return null;
    if (!me.alive || me.invisible) return null;
    const range = C.KILL_RANGE[world.state.settings.killRange] || C.KILL_RANGE.Normal;
    let best = null, bestD = range * range;
    for (const p of world.players.values()) {
      if (p.isMe || !p.alive || p.ghost || p.inVent) continue;
      if (world.teamOf(p.id) === 'impostor') continue;
      const d = U.dist2(me.x, me.y, p.x, p.y);
      if (d < bestD && NS.los.clear(me.x, me.y, p.x, p.y)) { bestD = d; best = p; }
    }
    return best;
  }

  world.teamOf = function (id) {
    if (world.state.roles && world.state.roles[id]) return C.ROLES[world.state.roles[id]].team;
    if (id === (world.me && world.me.id)) return C.ROLES[world.myRole || 'crewmate'].team;
    return null;
  };

  /* The one contextual action, resolved every frame. Among Us has a fixed set
     of buttons and greys out the ones that do not apply; the same idea, but
     the Use button also has to say what it is about to do, because on a phone
     there is no hover to explain it. */
  function context() {
    const me = world.me;
    const out = { use: null, report: null, kill: null, vent: null, emergency: null, sabotageFix: null };
    if (!me) return out;
    const st = world.state;
    const playing = st.phase === 'play';
    if (!playing) return out;

    if (!me.inVent) {
      for (const task of world.myTasks) {
        if (task.done) continue;
        const spot = taskSpot(task);
        if (!spot) continue;
        if (U.dist2(me.x, me.y, spot.x, spot.y) < USE_RANGE * USE_RANGE) {
          out.use = { kind: 'task', task, station: NS.rules.stationById[task.sid], x: spot.x, y: spot.y };
          break;
        }
      }
      if (!out.use) {
        for (const console of M.CONSOLES) {
          const w = M.toWorld(console);
          if (U.dist2(me.x, me.y, w.x, w.y) < USE_RANGE * USE_RANGE) {
            out.use = { kind: 'console', console, x: w.x, y: w.y };
            break;
          }
        }
      }
      if (!out.use && !me.ghost) {
        const button = M.toWorld(M.EMERGENCY);
        if (U.dist2(me.x, me.y, button.x, button.y) < (USE_RANGE + 16) * (USE_RANGE + 16)) {
          out.emergency = { x: button.x, y: button.y };
        }
      }
      if (!me.ghost) {
        const fix = NS.sabotage.fixAt(me.x, me.y);
        if (fix) out.sabotageFix = fix;
      }
    }

    if (me.alive && !me.ghost) {
      const canVent = world.myRole && (C.ROLES[world.myRole].kill || C.ROLES[world.myRole].ability === 'vent');
      if (canVent) {
        if (me.inVent) out.vent = { kind: 'exit' };
        else {
          const v = nearestVent();
          if (v) out.vent = Object.assign({ kind: 'enter' }, v);
        }
      }
      if (!me.inVent) {
        out.report = nearestBody();
        out.kill = killTarget();
      }
    }
    return out;
  }

  Object.assign(world, {
    entity, reset, spawnMe, placeAtSpawn, encode, adopt, encodeBots, adoptBots,
    step, context, nearestVent, nearestBody, killTarget, myTask, taskSpot,
    speedFor, canWalk, USE_RANGE, BASE_SPEED,
    alivePlayers() {
      const out = [];
      for (const p of world.players.values()) if (p.alive && p.connected) out.push(p);
      return out;
    },
  });

  NS.world = world;
})(window.NS);

</script>
<script>
/* Ducks.

   Every one is drawn with paths, so a colour, a hat and a walk cycle combine
   freely and the same drawing serves the world, the portraits, the meeting
   grid and the camera feeds. Nothing here is a sprite sheet.

   What makes a duck read as a duck at thirty pixels is not detail, it is the
   silhouette and the walk: a heavy low body, a round head set forward on a
   short neck, a bill that breaks the outline, and a side-to-side waddle that
   nothing else in the game does. The shading is a single radial gradient plus
   a rim light -- volume, not decoration, because a flat fill at this size
   reads as a hole in the floor rather than an animal. */

(function (NS) {
  'use strict';

  const C = NS.config;
  const U = NS.util;

  function rr(ctx, x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  /* The duck fits the space the old body took, so the camera, the name tags
     and the interaction ranges are all still tuned. */
  const BODY_W = 34;
  const BODY_H = 34;
  const HEAD_Y = -31;
  const HEAD_R = 10.5;

  const BILL = '#f0a63c';
  const BILL_DARK = '#c47c1c';
  const FOOT = '#e08a2a';

  /* ---- parts --------------------------------------------------------------
     All drawn facing right, in a space where (0,0) is between the feet and y
     runs negative upward. The caller mirrors for the other direction. */

  function drawFeet(ctx, walk, moving, lift) {
    const swing = moving ? Math.sin(walk) : 0;
    for (let i = 0; i < 2; i++) {
      const side = i ? 1 : -1;
      const phase = moving ? Math.sin(walk + (i ? 0 : Math.PI)) : 0;
      const fx = 1.5 + side * 5.5 + phase * 3.2;
      const fy = -Math.max(0, phase) * 3.4 - (lift || 0);
      ctx.save();
      ctx.translate(fx, fy);
      ctx.fillStyle = i ? FOOT : BILL_DARK;   // the far foot sits in shadow
      ctx.beginPath();
      ctx.moveTo(-1.5, -4);
      ctx.lineTo(6.5, 0.5);
      ctx.lineTo(3.5, 1.5);
      ctx.lineTo(5, 2.6);
      ctx.lineTo(0.5, 2.2);
      ctx.lineTo(-2.5, 3);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    return swing;
  }

  /* A short upturned fan, not a spike. The first version was a long point at
     tail height and every duck looked like it had a beak at both ends. */
  function drawTail(ctx, colour, walk, moving) {
    const wag = moving ? Math.sin(walk * 0.5) * 0.14 : 0;
    ctx.save();
    ctx.translate(-13, -23);
    ctx.rotate(-0.6 + wag);
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.rotate((i - 1) * 0.32);
      ctx.fillStyle = i === 1 ? colour.body : colour.dark;
      ctx.beginPath();
      ctx.moveTo(1, 2.6);
      ctx.quadraticCurveTo(-5, 2.2, -8.5, -1.4);
      ctx.quadraticCurveTo(-5, -3, 1, -2.4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawWing(ctx, colour, walk, moving, flap) {
    const beat = flap ? Math.sin(walk * 2.4) * 0.55 : (moving ? Math.sin(walk) * 0.14 : 0);
    ctx.save();
    ctx.translate(-1, -19);
    ctx.rotate(beat);
    const g = ctx.createLinearGradient(0, -8, 0, 9);
    g.addColorStop(0, colour.rim);
    g.addColorStop(0.42, colour.body);
    g.addColorStop(1, colour.dark);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(6, -7);
    ctx.quadraticCurveTo(11, 0, 3, 8.5);
    ctx.quadraticCurveTo(-6, 9, -8.5, 1);
    ctx.quadraticCurveTo(-6, -7, 6, -7);
    ctx.closePath();
    ctx.fill();
    /* An edge, so the wing is a thing lying on the body rather than a patch
       of it in a different shade. At thirty pixels this is one dark pixel; on
       the kill cam, where a duck is three hundred pixels tall, it is the
       difference between a wing and a bruise. */
    ctx.strokeStyle = 'rgba(0,0,0,0.24)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
    /* Three feather lines, each with a lit edge under it: a groove reads as
       two feathers meeting, a single dark scratch reads as damage. */
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(4 - i * 3.4, 6.5 - i * 0.6);
      ctx.quadraticCurveTo(-2 - i * 2, 3 - i, -6 - i * 0.8, -1.5);
      ctx.strokeStyle = 'rgba(0,0,0,0.20)';
      ctx.lineWidth = 1.1;
      ctx.stroke();
      ctx.save();
      ctx.translate(0, 1.1);
      ctx.beginPath();
      ctx.moveTo(4 - i * 3.4, 6.5 - i * 0.6);
      ctx.quadraticCurveTo(-2 - i * 2, 3 - i, -6 - i * 0.8, -1.5);
      ctx.strokeStyle = 'rgba(255,255,255,0.11)';
      ctx.lineWidth = 0.9;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawBill(ctx, open) {
    const spread = (open || 0) * 3.4;
    ctx.save();
    ctx.translate(7, HEAD_Y + 2);
    const g = ctx.createLinearGradient(0, -4, 0, 5);
    g.addColorStop(0, '#ffc76b');
    g.addColorStop(1, BILL);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -3.5 - spread * 1.5);
    ctx.quadraticCurveTo(12, -4.5 - spread * 3, 15.5, -1.5 - spread * 3.5);
    ctx.quadraticCurveTo(13, 0.5 - spread * 1.5, 0, 0.5 - spread * 1.2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = BILL_DARK;
    ctx.beginPath();
    ctx.moveTo(0, 0.6 + spread * 1.2);
    ctx.quadraticCurveTo(11, 1.4 + spread * 3, 14, 2.4 + spread * 4);
    ctx.quadraticCurveTo(9, 4.4 + spread * 3, 0, 3.6 + spread * 1.4);
    ctx.closePath();
    ctx.fill();
    /* One nostril. It is two pixels and it is the difference between a beak
       and an orange wedge. */
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(5.5, -1.6 - spread, 1.1, 0.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawEye(ctx, blink, look) {
    const x = 4.4, y = HEAD_Y - 2.2;
    if (blink > 0.5) {
      ctx.strokeStyle = '#1a1f2c';
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - 2.6, y);
      ctx.quadraticCurveTo(x, y + 1.6, x + 2.6, y);
      ctx.stroke();
      return;
    }
    ctx.fillStyle = '#fdfefe';
    ctx.beginPath();
    ctx.ellipse(x, y, 3.4, 3.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#12161f';
    ctx.beginPath();
    ctx.ellipse(x + 0.9 + (look || 0), y + 0.3, 2, 2.3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.ellipse(x + 0.2 + (look || 0), y - 1, 0.9, 1, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function bodyGradient(ctx, colour) {
    const g = ctx.createRadialGradient(-3, -25, 2, 0, -15, 24);
    g.addColorStop(0, colour.rim);
    g.addColorStop(0.4, colour.body);
    g.addColorStop(1, colour.dark);
    return g;
  }

  /* ---- hats ---------------------------------------------------------------
     Drawn with the crown of the head at the origin. A duck's head is smaller
     than the old body's, so everything sits tighter. */

  const HAT_ART = {
    none() {},
    hardhat(ctx) {
      ctx.fillStyle = '#f2b134';
      ctx.beginPath(); ctx.ellipse(0, 1, 12, 4, 0, Math.PI, 0); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, 1, 9, 8.5, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#d1941f';
      ctx.fillRect(-1.3, -7.5, 2.6, 8.5);
    },
    beanie(ctx) {
      ctx.fillStyle = '#c0523f';
      ctx.beginPath(); ctx.ellipse(0, 1, 9.5, 9, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#e8e2d4';
      rr(ctx, -10, -1, 20, 4.4, 2.2); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -10, 3.4, 0, Math.PI * 2); ctx.fill();
    },
    headset(ctx) {
      ctx.strokeStyle = '#2b3348'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 2, 9.5, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
      ctx.fillStyle = '#39435c';
      rr(ctx, -11.5, 0, 5, 8.5, 2.5); ctx.fill();
      rr(ctx, 6.5, 0, 5, 8.5, 2.5); ctx.fill();
      ctx.fillStyle = '#34e0b8';
      ctx.beginPath(); ctx.arc(9, 10, 1.9, 0, Math.PI * 2); ctx.fill();
    },
    antenna(ctx) {
      ctx.strokeStyle = '#8d97ad'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 2); ctx.quadraticCurveTo(3.5, -7, 1, -14); ctx.stroke();
      ctx.fillStyle = '#ff3f5b';
      ctx.beginPath(); ctx.arc(1, -16, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,63,91,0.32)';
      ctx.beginPath(); ctx.arc(1, -16, 5.8, 0, Math.PI * 2); ctx.fill();
    },
    crown(ctx) {
      ctx.fillStyle = '#f0c04a';
      ctx.beginPath();
      ctx.moveTo(-9, 2); ctx.lineTo(-9, -6); ctx.lineTo(-4.5, -1.5); ctx.lineTo(0, -8.5);
      ctx.lineTo(4.5, -1.5); ctx.lineTo(9, -6); ctx.lineTo(9, 2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff3f5b';
      ctx.beginPath(); ctx.arc(0, -0.5, 1.7, 0, Math.PI * 2); ctx.fill();
    },
    flower(ctx) {
      ctx.strokeStyle = '#4ca85c'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(-5, 3); ctx.quadraticCurveTo(-7.5, -3, -6, -7.5); ctx.stroke();
      ctx.fillStyle = '#f18fb0';
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.ellipse(-6 + Math.cos(a) * 3.4, -8.5 + Math.sin(a) * 3.4, 2.9, 2.9, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#f0c04a';
      ctx.beginPath(); ctx.arc(-6, -8.5, 2.2, 0, Math.PI * 2); ctx.fill();
    },
    cap(ctx) {
      ctx.fillStyle = '#3d6fe0';
      ctx.beginPath(); ctx.ellipse(0, 2, 9.5, 8, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#2b52ab';
      rr(ctx, -14.5, -1, 7, 4, 2); ctx.fill();
      ctx.fillStyle = '#e8e2d4';
      ctx.beginPath(); ctx.arc(1.5, -5, 1.7, 0, Math.PI * 2); ctx.fill();
    },
    halo(ctx) {
      ctx.strokeStyle = '#ffd77a'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.ellipse(0, -9, 9, 3, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,215,122,0.3)'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.ellipse(0, -9, 9, 3, 0, 0, Math.PI * 2); ctx.stroke();
    },
    cone(ctx) {
      ctx.fillStyle = '#ff7a3d';
      ctx.beginPath(); ctx.moveTo(-7.5, 2); ctx.lineTo(0, -15); ctx.lineTo(7.5, 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8e2d4';
      ctx.beginPath();
      ctx.moveTo(-5.2, -4); ctx.lineTo(-3.7, -7.5); ctx.lineTo(3.7, -7.5); ctx.lineTo(5.2, -4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#d1541f';
      rr(ctx, -9.5, 0, 19, 3.4, 1.4); ctx.fill();
    },
    plant(ctx) {
      ctx.fillStyle = '#a3603c';
      ctx.beginPath(); ctx.moveTo(-6.5, 3); ctx.lineTo(-5, -5); ctx.lineTo(5, -5); ctx.lineTo(6.5, 3);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#4ca85c';
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.ellipse(i * 4.2, -10.5, 3, 6.5, i * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    },
    band(ctx) {
      ctx.fillStyle = '#ff3f5b';
      rr(ctx, -10.5, -1, 21, 4.6, 2); ctx.fill();
      ctx.strokeStyle = '#ff3f5b'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-9.5, 2); ctx.quadraticCurveTo(-15, 4.5, -13, 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-9.5, 3); ctx.quadraticCurveTo(-17, 7.5, -11, 12); ctx.stroke();
    },
  };

  function drawHat(ctx, hatIdx, dir) {
    const hat = C.HATS[hatIdx];
    if (!hat || hat.id === 'none') return;
    const art = HAT_ART[hat.id];
    if (!art) return;
    ctx.save();
    ctx.scale(dir, 1);
    art(ctx);
    ctx.restore();
  }

  /* ---- colourblind marks -------------------------------------------------- */

  const SYMBOL_ART = {
    circle(ctx, r) { ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); },
    square(ctx, r) { ctx.fillRect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7); },
    triangle(ctx, r) {
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.92, r * 0.72);
      ctx.lineTo(-r * 0.92, r * 0.72); ctx.closePath(); ctx.fill();
    },
    diamond(ctx, r) {
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r);
      ctx.lineTo(-r, 0); ctx.closePath(); ctx.fill();
    },
    star(ctx, r) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
        const rad = i % 2 ? r * 0.45 : r;
        if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
        else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath(); ctx.fill();
    },
    cross(ctx, r) {
      ctx.fillRect(-r * 0.32, -r, r * 0.64, r * 2);
      ctx.fillRect(-r, -r * 0.32, r * 2, r * 0.64);
    },
    chevron(ctx, r) {
      ctx.beginPath(); ctx.moveTo(-r, r * 0.2); ctx.lineTo(0, -r * 0.7); ctx.lineTo(r, r * 0.2);
      ctx.lineTo(r, r * 0.85); ctx.lineTo(0, -r * 0.05); ctx.lineTo(-r, r * 0.85);
      ctx.closePath(); ctx.fill();
    },
    ring(ctx, r) {
      ctx.beginPath(); ctx.arc(0, 0, r * 0.82, 0, Math.PI * 2);
      ctx.arc(0, 0, r * 0.42, 0, Math.PI * 2, true);
      ctx.fill('evenodd');
    },
    bar(ctx, r) { ctx.fillRect(-r, -r * 0.34, r * 2, r * 0.68); },
    dots(ctx, r) {
      ctx.beginPath(); ctx.arc(-r * 0.5, 0, r * 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.5, 0, r * 0.42, 0, Math.PI * 2); ctx.fill();
    },
    hexagon(ctx, r) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill();
    },
    drop(ctx, r) {
      ctx.beginPath(); ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(r, 0, 0, r); ctx.quadraticCurveTo(-r, 0, 0, -r);
      ctx.fill();
    },
    arrow(ctx, r) {
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.9, r * 0.1);
      ctx.lineTo(r * 0.34, r * 0.1); ctx.lineTo(r * 0.34, r);
      ctx.lineTo(-r * 0.34, r); ctx.lineTo(-r * 0.34, r * 0.1);
      ctx.lineTo(-r * 0.9, r * 0.1); ctx.closePath(); ctx.fill();
    },
    wave(ctx, r) {
      ctx.lineWidth = r * 0.44;
      ctx.lineCap = 'round';
      ctx.strokeStyle = ctx.fillStyle;
      ctx.beginPath();
      ctx.moveTo(-r, r * 0.3);
      ctx.quadraticCurveTo(-r * 0.35, -r * 0.9, 0, r * 0.1);
      ctx.quadraticCurveTo(r * 0.35, r * 0.95, r, -r * 0.2);
      ctx.stroke();
    },
  };

  let showSymbols = false;
  function setSymbols(on) { showSymbols = !!on; }

  function drawSymbol(ctx, colorIdx, size) {
    const art = SYMBOL_ART[C.SYMBOLS[colorIdx % C.SYMBOLS.length]];
    if (!art) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(5,7,13,0.75)';
    ctx.lineWidth = size * 0.55;
    ctx.lineJoin = 'round';
    ctx.fillStyle = 'rgba(5,7,13,0.75)';
    art(ctx, size * 1.12);
    ctx.fillStyle = '#f2f6fb';
    art(ctx, size);
    ctx.restore();
  }

  /* ---- the whole duck ----------------------------------------------------- */

  function drawPlayer(ctx, p, opts) {
    const o = opts || {};
    const colour = C.COLORS[p.shiftIdx >= 0 ? p.shiftIdx : p.colorIdx] || C.COLORS[0];
    const scale = o.scale || 1;
    const ghost = p.ghost;
    const alpha = o.alpha == null ? 1 : o.alpha;
    if (alpha <= 0.02) return;

    const walk = p.walk || 0;
    const moving = !!p.moving;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha * (ghost ? 0.68 : (p.invisible ? 0.16 : 1));

    if (!ghost) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(1, 1, 15, 4.6, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    /* The waddle. Everything below rocks around a point between the feet,
       which is what a duck does and what nothing else on the station does --
