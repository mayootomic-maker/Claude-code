      const a = Math.atan2(s.y - cy, s.x - cx);
      const rx = Math.min(cssW / 2 - margin, cssH / 2 - margin);
      const px = cx + Math.cos(a) * rx;
      const py = cy + Math.sin(a) * rx;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(a);
      ctx.fillStyle = '#ff3f5b';
      ctx.beginPath();
      ctx.moveTo(12, 0); ctx.lineTo(-8, -9); ctx.lineTo(-8, 9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  /* Draw straight onto the finished frame in screen space. The cinematics use
     it, and nothing else should: anything that belongs in the world belongs in
     drawScene where the darkness can reach it. */
  function drawOverlay(fn) {
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fn(ctx, cssW, cssH);
  }

  NS.render = {
    attach, resize, drawScene, follow, centreOn, worldToScreen, shake, flash, ventOpened, drawOverlay,
    visionRadius,
    get scale() { return scale; },
    get width() { return cssW; },
    get height() { return cssH; },
    camera,
  };
})(window.NS);

</script>
<script>
/* The one device that decides.

   Somebody has to be right about whether that kill landed, and it cannot be
   the person who threw it. So one player -- whoever opened the lobby -- runs
   this, and every other device asks it for permission and mirrors what comes
   back. The host is also a player with a game to play, so nothing here is
   allowed to be expensive: it runs inside the same frame loop as the
   renderer, on somebody's phone.

   Positions are the deliberate exception. Clients own their own and the host
   reads them out of the same world mirror everybody else has, roughly a tenth
   of a second stale, which is why kill range is checked with a margin. The
   alternative is a server that rewinds time to validate a hit, and that is a
   very long way to go to stop a fourteen-year-old standing slightly too far
   away from somebody they were going to kill anyway. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;
  const R = NS.rules;
  const SAB = NS.sabotage;

  const SNAPSHOT_EVERY = 480;    // ms between full snapshots when nothing changed
  const KILL_GRACE = 1.45;       // how much further than the setting a kill may land
  const EJECT_SECONDS = 5.5;
  const REVEAL_SECONDS = 5;

  const H = {
    active: false, seq: 0, phase: 'lobby',
    settings: C.defaults(),
    players: {}, roles: {}, tasks: {},
    bodies: [], sabotage: null, meeting: null, ejected: null, winner: null,
    killCooldown: {}, abilityCooldown: {}, abilityUsed: {},
    emergenciesUsed: {}, emergencyCooldown: 0, sabotageCooldown: 0,
    shields: {}, invisible: {}, shifted: {}, watching: new Set(),
    closedRooms: {}, revealLeft: 0, ejectLeft: 0, log: [], startedAt: 0,
    lastSnapshot: 0, dirty: true, seed: 1,
  };

  let send = function () {};
  let onLocal = function () {};

  /* ---- lifecycle --------------------------------------------------------- */

  function begin(opts) {
    H.active = true;
    send = opts.send;
    onLocal = opts.onLocal || function () {};
    H.settings = C.sanitise(opts.settings);
    H.phase = 'lobby';
    H.players = {};
    H.seq = 0;
    reset();
    H.dirty = true;
  }

  function reset() {
    H.roles = {}; H.tasks = {}; H.bodies = []; H.sabotage = null;
    H.meeting = null; H.ejected = null; H.winner = null;
    H.killCooldown = {}; H.abilityCooldown = {}; H.abilityUsed = {};
    H.emergenciesUsed = {}; H.emergencyCooldown = 0; H.sabotageCooldown = 0;
    H.shields = {}; H.invisible = {}; H.shifted = {}; H.watching = new Set();
    H.closedRooms = {}; H.log = []; H.startedAt = 0;
    if (NS.minds) NS.minds.reset();
    M.clearDoors();
  }

  function stop() { H.active = false; }

  /* People outrank bots for a colour. A bot holding the shade somebody wants
     would otherwise block the round with a message about a clash the player
     cannot do anything about. */
  function freeBotColour(wanted, botId) {
    const taken = {};
    for (const id of list()) if (id !== botId) taken[H.players[id].colorIdx] = true;
    for (let i = 0; i < C.COLORS.length; i++) if (!taken[i]) return i;
    return wanted;
  }

  function yieldColour(wanted, claimant) {
    for (const id of list()) {
      const other = H.players[id];
      if (id === claimant || !other.bot || other.colorIdx !== wanted) continue;
      other.colorIdx = freeBotColour(wanted, id);
      H.dirty = true;
    }
  }

  /* Two people called Sam is a meeting nobody can hold: half the argument is
     about which Sam. The second one keeps their name with a number on it, and
     their own device tells them so rather than leaving them to notice. */
  function uniqueName(wanted, id) {
    const clean = U.cleanName(wanted, C.NAME_MAX) || 'Someone';
    const taken = (name) => list().some((other) =>
      other !== id && H.players[other].name.toLowerCase() === name.toLowerCase());
    if (!taken(clean)) return clean;
    for (let n = 2; n <= 20; n++) {
      const suffix = ' ' + n;
      const candidate = clean.slice(0, C.NAME_MAX - suffix.length) + suffix;
      if (!taken(candidate)) return candidate;
    }
    return clean;
  }

  function addPlayer(id, info) {
    const existing = H.players[id];
    if (existing) {
      existing.connected = true;
      if (info) {
        if (info.n) existing.name = uniqueName(info.n, id);
        if (Number.isFinite(info.c)) {
          existing.colorIdx = U.clamp(info.c | 0, 0, C.COLORS.length - 1);
          if (!existing.bot) yieldColour(existing.colorIdx, id);
        }
        if (Number.isFinite(info.h)) existing.hatIdx = U.clamp(info.h | 0, 0, C.HATS.length - 1);
        if (info.k) existing.key = String(info.k).slice(0, 200);
      }
      H.dirty = true;
      return existing;
    }
    if (Object.keys(H.players).length >= C.MAX_PLAYERS) return null;
    /* Arriving mid-round used to be a closed door -- the code was right and
       the round was under way, so nothing happened and the join screen sat
       there. Now you come in as a spectator: you can walk the station, watch,
       and talk to the other ghosts, and the next round deals you in. Being
       able to do nothing is a fine outcome; being told nothing is not. */
    const midRound = H.phase !== 'lobby';
    const p = {
      id,
      name: uniqueName(info && info.n, id),
      colorIdx: Number.isFinite(info && info.c) ? U.clamp(info.c | 0, 0, C.COLORS.length - 1) : 0,
      hatIdx: Number.isFinite(info && info.h) ? U.clamp(info.h | 0, 0, C.HATS.length - 1) : 0,
      key: info && info.k ? String(info.k).slice(0, 200) : null,
      alive: !midRound, ghost: midRound, spectator: midRound,
      bot: !!(info && info.bot), connected: true, ready: false,
    };
    if (midRound) {
      /* A crew role with no tasks: counted by nothing, and safe to look up. */
      H.roles[id] = 'crewmate';
      H.tasks[id] = [];
    }
    H.players[id] = p;
    H.dirty = true;
    return p;
  }

  function dropPlayer(id) {
    const p = H.players[id];
    if (!p) return;
    if (H.phase === 'lobby') delete H.players[id];
    else {
      /* Mid-round, a disconnect is a death: the body count has to keep adding
         up or the crew is chasing somebody who is not there. */
      p.connected = false;
      p.alive = false;
      p.ghost = true;
    }
    H.dirty = true;
    checkWin();
  }

  const list = () => Object.keys(H.players);
  const livingIds = () => list().filter((id) => H.players[id].alive && H.players[id].connected);

  /* ---- starting a round --------------------------------------------------- */

  function canStart() {
    const n = list().filter((id) => H.players[id].connected).length;
    if (n < C.MIN_PLAYERS) return 'Needs ' + C.MIN_PLAYERS + ' players. There are ' + n + '.';
    const taken = {};
    for (const id of list()) {
      const c = H.players[id].colorIdx;
      if (taken[c]) return 'Two players picked the same colour.';
      taken[c] = true;
    }
    return null;
  }

  /* The thumb on the scale, and the exact width of it.

     Two complaints that sound like the same complaint are not: the shuffle was
     measured over sixty thousand deals at every player count and is fair to
     four decimal places, but "fair" at nine players means impostor one round
     in nine, and a person practising alone against eight bots reads eight
     crewmate rounds in a row as a broken game rather than as arithmetic. So
     the lobby has a dial for it, and it is honoured here and only here: one
     human in the lobby, everybody else a bot. The moment a second real person
     joins there is somebody it would be unfair to, and it stops applying --
     without a message, because the setting already says so.

     Rotate is the default and is not a coin flip: it leaves the deal alone
     until you have been on the crew's side twice running, then puts you on the
     other one. The streak is kept on this device, so it survives a reload. */
  function soloSeat() {
    const humans = list().filter((id) => H.players[id].connected && !H.players[id].bot);
    return humans.length === 1 ? humans[0] : null;
  }

  function rolePreference(seat) {
    if (!seat) return null;
    const mode = H.settings.soloRole;
    if (mode === 'Impostor') return { id: seat, team: 'impostor' };
    if (mode === 'Crewmate') return { id: seat, team: 'crew' };
    if (mode !== 'Rotate') return null;
    const streak = U.store.get('streak', null);
    if (!streak || streak.n < 2) return null;
    return { id: seat, team: streak.team === 'impostor' ? 'crew' : 'impostor' };
  }

  function recordStreak(seat) {
    if (!seat) return;
    const team = C.ROLES[H.roles[seat] || 'crewmate'].team;
    const streak = U.store.get('streak', null);
    U.store.set('streak', streak && streak.team === team
      ? { team, n: streak.n + 1 }
      : { team, n: 1 });
  }

  function start() {
    if (H.phase !== 'lobby') return;
    const problem = canStart();
    if (problem) { onLocal({ t: 'refused', why: problem }); return; }

    reset();
    H.seed = (Math.random() * 0x7fffffff) | 0;
    const rand = U.mulberry32(H.seed);
    const ids = list().filter((id) => H.players[id].connected);
    for (const id of ids) {
      H.players[id].alive = true;
      H.players[id].ghost = false;
      H.players[id].spectator = false;
    }
    const seat = soloSeat();
    H.roles = R.dealRoles(ids, H.settings, rand, rolePreference(seat));
    recordStreak(seat);
    H.tasks = R.dealTasks(ids, H.settings, rand);
    for (const id of ids) H.killCooldown[id] = H.settings.killCooldown + 5;

    H.startedAt = U.now();
    H.phase = 'reveal';
    H.revealLeft = REVEAL_SECONDS;
    H.dirty = true;
    deliverRoles();
    snapshot(true);
  }

  /* Each player's role goes out sealed to them alone -- see net/crypto.js for
     why that is worth doing on a broadcast bus. Bots are told nothing because
     they are the host; their roles are already in H.roles. */
  function deliverRoles() {
    for (const id of list()) {
      const p = H.players[id];
      if (!p.connected || p.bot) continue;
      /* Impostors are told about each other here and nowhere else. It has to
         travel inside the sealed payload: a teammate list in the snapshot
         would be a list of impostors sitting on every device in the room. */
      const mates = C.ROLES[H.roles[id]].team === 'impostor'
        ? list().filter((other) => other !== id
            && C.ROLES[H.roles[other] || 'crewmate'].team === 'impostor')
        : [];
      const payload = { role: H.roles[id], tasks: H.tasks[id], mates };
      NS.secrets.sealTo(p.key, payload).then((sealed) => {
        if (sealed) send('sys', { t: 'R', to: id, s: sealed });
        else send('sys', { t: 'R', to: id, plain: payload, clear: true });
      });
    }
  }

  /* ---- incoming ----------------------------------------------------------- */

  function handle(from, msg) {
    if (!H.active || !msg || typeof msg !== 'object') return;
    const fn = ACTIONS[msg.t];
    if (fn) fn(from, msg);
  }

  const ACTIONS = {
    hello(from, msg) { addPlayer(from, msg); },

    profile(from, msg) {
      const p = H.players[from];
      if (!p || H.phase !== 'lobby') return;
      if (msg.n) p.name = uniqueName(msg.n, from);
      if (Number.isFinite(msg.c)) {
        const wanted = U.clamp(msg.c | 0, 0, C.COLORS.length - 1);
        yieldColour(wanted, from);
        const clash = list().some((id) => id !== from && H.players[id].colorIdx === wanted);
        if (!clash) p.colorIdx = wanted;
      }
      if (Number.isFinite(msg.h)) p.hatIdx = U.clamp(msg.h | 0, 0, C.HATS.length - 1);
      if (msg.k) p.key = String(msg.k).slice(0, 200);
      H.dirty = true;
    },

    ready(from, msg) {
      const p = H.players[from];
      if (!p) return;
      p.ready = !!msg.v;
      H.dirty = true;
    },

    task(from, msg) {
      if (H.phase !== 'play') return;
      const p = H.players[from];
      if (!p || !p.connected) return;
      if (p.ghost && !H.settings.ghostsDoTasks) return;
      const mine = H.tasks[from];
      if (!mine) return;
      const task = mine.find((t) => t.sid === msg.sid && !t.done);
      if (!task) return;
      /* Only the step you are on, and only from where that step happens. A
         client that lost a message would otherwise be able to skip one. */
      if ((msg.step | 0) !== task.step) return;
      const station = R.stationById[task.sid];
      const spot = station.steps ? station.steps[task.step] : station;
      const w = M.toWorld(spot);
      const at = NS.world.players.get(from);
      if (at && !p.bot && U.dist(at.x, at.y, w.x, w.y) > NS.world.USE_RANGE * 2.2) return;

      task.step++;
      if (task.step >= task.steps) task.done = true;
      H.dirty = true;
      /* Only the crew get the animation. A visual task is a task somebody can
         stand and watch you finish, which is worth nothing if the person
         faking it can play the same animation. */
      if (station.visual && H.settings.visualTasks
          && C.ROLES[H.roles[from] || 'crewmate'].team === 'crew') {
        send('sys', { t: 'E', e: 'visual', by: from, sid: task.sid });
      }
      checkWin();
    },

    kill(from, msg) {
      if (H.phase !== 'play') return;
      const killer = H.players[from];
      const victim = H.players[msg.target];
      if (!killer || !victim || !killer.alive || !victim.alive || victim.ghost) return;
      if (!C.ROLES[H.roles[from] || 'crewmate'].kill) return;
      if ((H.killCooldown[from] || 0) > 0) return;
      if (H.invisible[msg.target] || H.invisible[from]) return;
      if (C.ROLES[H.roles[msg.target] || 'crewmate'].team === 'impostor') return;

      const a = NS.world.players.get(from);
      const b = NS.world.players.get(msg.target);
      if (!a || !b) return;
      const range = (C.KILL_RANGE[H.settings.killRange] || C.KILL_RANGE.Normal) * KILL_GRACE;
      if (U.dist(a.x, a.y, b.x, b.y) > range) return;

      H.killCooldown[from] = H.settings.killCooldown;

      if (H.shields[msg.target]) {
        /* The shield is spent, both of them are told, and nobody else is.
           A medic who could see every failed attempt would be a camera. */
        delete H.shields[msg.target];
        send('sys', { t: 'E', e: 'shielded', by: from, target: msg.target, x: b.x, y: b.y });
        H.dirty = true;
        return;
      }
      die(msg.target, from, b.x, b.y, a.x < b.x ? 1 : -1);
    },

    shoot(from) {
      if (H.phase !== 'play') return;
      const sheriff = H.players[from];
      if (!sheriff || !sheriff.alive || H.roles[from] !== 'sheriff') return;
      if ((H.abilityCooldown[from] || 0) > 0) return;
      const a = NS.world.players.get(from);
      if (!a) return;
      const range = C.KILL_RANGE.Long;
      let target = null, best = range * range;
      for (const id of livingIds()) {
        if (id === from) continue;
        const b = NS.world.players.get(id);
        if (!b || H.invisible[id]) continue;
        const d = U.dist2(a.x, a.y, b.x, b.y);
        if (d < best && NS.los.clear(a.x, a.y, b.x, b.y)) { best = d; target = id; }
      }
      if (!target) return;
      H.abilityCooldown[from] = H.settings.killCooldown + 10;
      const hit = NS.world.players.get(target);
      send('sys', { t: 'E', e: 'shot', by: from, target, x: hit.x, y: hit.y });
      /* Shooting a crewmate kills the sheriff instead. It is the only way the
         role is survivable to be around: a sheriff who could fire freely
         would just be a second impostor for the crew to be afraid of. */
      if (C.ROLES[H.roles[target] || 'crewmate'].team === 'impostor') die(target, from, hit.x, hit.y, 0);
      else die(from, from, a.x, a.y, 0);
    },

    shield(from, msg) {
      if (H.phase !== 'play') return;
      if (H.roles[from] !== 'medic' || H.abilityUsed[from]) return;
      const target = H.players[msg.target];
      if (!target || !target.alive) return;
      H.abilityUsed[from] = true;
      H.shields[msg.target] = from;
      H.dirty = true;
      send('sys', { t: 'E', e: 'shield', by: from, target: msg.target });
    },

    ability(from, msg) {
      if (H.phase !== 'play') return;
      const role = H.roles[from];
      const p = H.players[from];
      if (!p || !p.alive || (H.abilityCooldown[from] || 0) > 0) return;
      if (msg.k === 'vanish' && role === 'phantom') {
        H.invisible[from] = 8;
        H.abilityCooldown[from] = 35;
        send('sys', { t: 'E', e: 'vanish', by: from, on: 1 });
      } else if (msg.k === 'shift' && role === 'shapeshifter') {
        const target = H.players[msg.target];
        if (!target || !target.alive) return;
        H.shifted[from] = { as: msg.target, left: 22 };
        H.abilityCooldown[from] = 30;
        send('sys', { t: 'E', e: 'shift', by: from, as: msg.target });
      } else return;
      H.dirty = true;
    },

    vent(from, msg) {
      if (H.phase !== 'play') return;
      const p = H.players[from];
      const role = C.ROLES[H.roles[from] || 'crewmate'];
      if (!p || !p.alive || !(role.kill || role.ability === 'vent')) return;
      const group = M.VENT_GROUPS[msg.g];
      const spot = group && group[msg.i];
      if (spot && NS.minds) {
        const w = M.toWorld(spot);
        NS.minds.witnessVent(H, from, w.x, w.y);
      }
      send('sys', { t: 'E', e: 'vent', by: from, a: msg.a, g: msg.g, i: msg.i });
    },

    report(from, msg) {
      if (H.phase !== 'play') return;
      const p = H.players[from];
      if (!p || !p.alive) return;
      const body = H.bodies.find((b) => b.id === msg.body);
      if (!body) return;
      const at = NS.world.players.get(from);
      if (at && !p.bot && U.dist(at.x, at.y, body.x, body.y) > 140) return;
      openMeeting('body', from, body.id);
    },

    emergency(from) {
      if (H.phase !== 'play') return;
      const p = H.players[from];
      if (!p || !p.alive) return;
      if (H.emergencyCooldown > 0) return;
      if ((H.emergenciesUsed[from] || 0) >= H.settings.emergencies) return;
      if (H.sabotage && SAB.SABOTAGES[H.sabotage.kind].critical) return;
      H.emergenciesUsed[from] = (H.emergenciesUsed[from] || 0) + 1;
      openMeeting('emergency', from, null);
    },

    sabotage(from, msg) {
      if (H.phase !== 'play') return;
      if (!C.ROLES[H.roles[from] || 'crewmate'].kill) return;
      if (H.sabotageCooldown > 0) return;
      if (msg.k === 'doors') {
        const room = M.roomById[msg.room];
        if (!room || M.SEALABLE.indexOf(msg.room) < 0) return;
        if (H.closedRooms[msg.room]) return;
        H.closedRooms[msg.room] = SAB.SABOTAGES.doors.seconds;
        M.sealRoom(msg.room, true);
        H.sabotageCooldown = 10;
        send('sys', { t: 'E', e: 'doors', room: msg.room });
        H.dirty = true;
        return;
      }
      if (H.sabotage) return;
      const def = SAB.SABOTAGES[msg.k];
      if (!def || SAB.MENU.indexOf(msg.k) < 0) return;
      H.sabotage = { kind: msg.k, remaining: def.seconds, done: def.spots.map(() => false), holds: {} };
      record('sabotage', { name: def.name });
      H.sabotageCooldown = 25;
      send('sys', { t: 'E', e: 'sabotage', k: msg.k });
      H.dirty = true;
    },

    fix(from, msg) {
      if (!H.sabotage || H.phase !== 'play') return;
      const def = SAB.SABOTAGES[H.sabotage.kind];
      const i = msg.i | 0;
      if (i < 0 || i >= def.spots.length) return;
      if (def.fix === 'hold') {
        /* Both pads, at the same time. Held is a timestamp that decays, so
           letting go registers even if the "released" message never arrives. */
        H.sabotage.holds[i] = msg.on ? { by: from, at: 1.1 } : null;
      } else {
        H.sabotage.done[i] = true;
      }
      H.dirty = true;
      settleSabotage();
    },

    /* Somebody at the cameras makes every camera on the station blink. It is
       the only reason watching them is fair, so it is authoritative rather
       than drawn locally by the watcher. */
    watching(from, msg) {
      const p = H.players[from];
      if (!p || !p.alive) { H.watching.delete(from); return; }
      if (msg.on) H.watching.add(from); else H.watching.delete(from);
      H.dirty = true;
    },

    vote(from, msg) {
      if (H.phase !== 'meeting' || !H.meeting || H.meeting.stage !== 'vote') return;
      const p = H.players[from];
      if (!p || !p.alive || H.meeting.votes[from] !== undefined) return;
      if (msg.s) {
        NS.secrets.openFrom(p.key, msg.s).then((plain) => {
          if (plain && H.meeting && H.meeting.votes[from] === undefined) {
            recordVote(from, plain.target);
          }
        });
      } else {
        recordVote(from, msg.target);
      }
    },
  };

  function recordVote(from, target) {
    if (!H.meeting || H.meeting.stage !== 'vote') return;
    const valid = target === 'skip' || (H.players[target] && H.players[target].alive);
    H.meeting.votes[from] = valid ? target : 'skip';
    H.dirty = true;
    send('sys', { t: 'E', e: 'voted', by: from });
    const waiting = livingIds().filter((id) => H.meeting.votes[id] === undefined);
    if (!waiting.length) H.meeting.time = Math.min(H.meeting.time, 1.2);
  }

  /* ---- death, meetings, endings ------------------------------------------- */

  /* A short account of the round, kept so the end screen can show what
     actually happened. Everybody spends the last ten minutes arguing from
     fragments; this is the only moment anyone gets to see the whole thing, and
     it is worth more than another leaderboard. Capped, because a long round
     with bots is a lot of lines and this rides in a snapshot. */
  function record(kind, data) {
    if (H.log.length >= 40) return;
    H.log.push(Object.assign({
      k: kind,
      t: Math.max(0, Math.round((U.now() - H.startedAt) / 1000)),
    }, data));
  }

  function roomNameAt(x, y) {
    const room = M.roomAt(x, y);
    return room ? room.name : 'a corridor';
  }

  function die(id, byId, x, y, facing) {
    const p = H.players[id];
    if (!p || !p.alive) return;
    p.alive = false;
    p.ghost = true;
    H.bodies.push({ id, x, y, colorIdx: p.colorIdx, hatIdx: p.hatIdx, by: byId, facing: facing || 0 });
    const killer = H.players[byId];
    record('kill', {
      by: killer ? killer.name : null,
      who: p.name,
      where: roomNameAt(x, y),
      self: byId === id,
    });
    delete H.invisible[id];
    delete H.shifted[id];
    if (NS.minds) NS.minds.witnessKill(H, byId, id, x, y);
    send('sys', { t: 'E', e: 'kill', by: byId, target: id, x, y });
    H.dirty = true;
    checkWin();
  }

  function openMeeting(reason, by, bodyId) {
    if (NS.minds) {
      const found = bodyId && H.bodies.find((b) => b.id === bodyId);
      if (found) NS.minds.noteBody(H, by, found);
    }
    H.sabotage = null;
    for (const roomId in H.closedRooms) M.sealRoom(roomId, false);
    H.closedRooms = {};
    H.bodies = [];
    H.invisible = {};
    H.shifted = {};
    H.phase = 'meeting';
    H.watching.clear();
    H.emergencyCooldown = H.settings.emergencyCooldown;
    H.meeting = {
      reason, by, bodyId,
      stage: H.settings.discussionTime > 0 ? 'discuss' : 'vote',
      time: H.settings.discussionTime > 0 ? H.settings.discussionTime : H.settings.votingTime,
      votes: {},
    };
    if (NS.minds) NS.minds.meetingOpened(H);
    record('meeting', {
      by: H.players[by] ? H.players[by].name : null,
      reason,
      who: bodyId && H.players[bodyId] ? H.players[bodyId].name : null,
    });
    send('sys', { t: 'E', e: 'meeting', reason, by, body: bodyId });
    H.dirty = true;
  }

  function tallyVotes() {
    const counts = {};
    for (const voter in H.meeting.votes) {
      const target = H.meeting.votes[voter];
      counts[target] = (counts[target] || 0) + 1;
    }
    let top = null, topCount = 0, tied = false;
    for (const key in counts) {
      if (counts[key] > topCount) { top = key; topCount = counts[key]; tied = false; }
      else if (counts[key] === topCount) tied = true;
    }
    const ejectedId = (!top || tied || top === 'skip') ? null : top;
    const wasTie = tied && top !== null;

    H.ejected = {
      id: ejectedId,
      name: ejectedId ? H.players[ejectedId].name : null,
      colorIdx: ejectedId ? H.players[ejectedId].colorIdx : 0,
      hatIdx: ejectedId ? H.players[ejectedId].hatIdx : 0,
      impostor: ejectedId ? C.ROLES[H.roles[ejectedId] || 'crewmate'].team === 'impostor' : false,
      role: ejectedId ? H.roles[ejectedId] : null,
      tie: wasTie,
      skipped: top === 'skip',
      votes: Object.keys(H.meeting.votes).map((v) => [v, H.meeting.votes[v]]),
      remaining: 0,
    };

    if (ejectedId) {
      const p = H.players[ejectedId];
      p.alive = false;
      p.ghost = true;
      if (H.roles[ejectedId] === 'jester') {
        H.ejected.remaining = 0;
        H.phase = 'eject';
        H.ejectLeft = EJECT_SECONDS;
        H.winner = { team: 'jester', reason: H.players[ejectedId].name + ' wanted exactly this.', by: ejectedId };
        H.meeting = null;
        H.dirty = true;
        return;
      }
    }
    H.ejected.remaining = list().filter((id) =>
      H.players[id].alive && H.players[id].connected
      && C.ROLES[H.roles[id] || 'crewmate'].team === 'impostor').length;

    record('eject', {
      who: ejectedId ? H.players[ejectedId].name : null,
      impostor: H.ejected.impostor,
      tie: wasTie,
    });

    H.phase = 'eject';
    H.ejectLeft = EJECT_SECONDS;
    H.meeting = null;
    H.dirty = true;
    checkWin();
  }

  function checkWin() {
    if (H.winner || H.phase === 'lobby') return;
    const found = R.winner({ players: H.players, roles: H.roles, tasks: H.tasks });
    if (found) H.winner = found;
  }

  function finish() {
    H.phase = 'end';
    H.meeting = null;
    H.sabotage = null;
    for (const roomId in H.closedRooms) M.sealRoom(roomId, false);
    H.closedRooms = {};
    H.dirty = true;
    snapshot(true);
  }

  function settleSabotage() {
    const active = H.sabotage;
    if (!active) return;
    const def = SAB.SABOTAGES[active.kind];
    let fixed = false;
    if (def.fix === 'hold') {
      fixed = def.spots.every((_, i) => active.holds[i] && active.holds[i].at > 0);
    } else if (def.spots.length) {
      fixed = active.done.every(Boolean);
    }
    if (fixed) {
      H.sabotage = null;
      H.sabotageCooldown = Math.min(H.sabotageCooldown, 12);
      send('sys', { t: 'E', e: 'fixed', k: def.id });
      H.dirty = true;
    }
  }

  /* ---- the clock ---------------------------------------------------------- */

  function tick(dt) {
    if (!H.active) return;

    for (const id in H.killCooldown) if (H.killCooldown[id] > 0) H.killCooldown[id] -= dt;
    for (const id in H.abilityCooldown) if (H.abilityCooldown[id] > 0) H.abilityCooldown[id] -= dt;
    if (H.emergencyCooldown > 0) H.emergencyCooldown -= dt;
    if (H.sabotageCooldown > 0) H.sabotageCooldown -= dt;

    for (const id of Array.from(H.watching)) {
      const watcher = H.players[id];
      if (!watcher || !watcher.alive || !watcher.connected) { H.watching.delete(id); H.dirty = true; }
    }
    for (const id in H.invisible) {
      H.invisible[id] -= dt;
      if (H.invisible[id] <= 0) { delete H.invisible[id]; H.dirty = true; send('sys', { t: 'E', e: 'vanish', by: id, on: 0 }); }
    }
    for (const id in H.shifted) {
      H.shifted[id].left -= dt;
      if (H.shifted[id].left <= 0) { delete H.shifted[id]; H.dirty = true; send('sys', { t: 'E', e: 'shift', by: id, as: null }); }
    }
    for (const roomId in H.closedRooms) {
      H.closedRooms[roomId] -= dt;
      if (H.closedRooms[roomId] <= 0) {
        delete H.closedRooms[roomId];
        M.sealRoom(roomId, false);
        H.dirty = true;
      }
    }

    if (H.phase === 'reveal') {
      H.revealLeft -= dt;
      if (H.revealLeft <= 0) {
        H.phase = 'play';
        H.dirty = true;
        snapshot(true);
      }
    } else if (H.phase === 'play') {
      if (H.sabotage) {
        const def = SAB.SABOTAGES[H.sabotage.kind];
        for (const i in H.sabotage.holds) {
          const hold = H.sabotage.holds[i];
          if (hold) { hold.at -= dt; if (hold.at <= 0) H.sabotage.holds[i] = null; }
        }
        settleSabotage();
        if (H.sabotage && def.critical) {
          H.sabotage.remaining -= dt;
          if (H.sabotage.remaining <= 0) {
            H.winner = { team: 'impostor', reason: def.lose };
          }
        }
      }
      /* Timers above get the real elapsed time so a throttled background tab
         does not slow the round down. Bots get a capped one, because moving
         them a whole second in one step teleports them through walls. */
      if (NS.minds) NS.minds.observe(dt, H);
      if (NS.bots) NS.bots.step(Math.min(dt, 0.1), H);
      if (H.winner) finish();
    } else if (H.phase === 'meeting' && H.meeting) {
      H.meeting.time -= dt;
      if (H.meeting.time <= 0) {
        if (H.meeting.stage === 'discuss') {
          H.meeting.stage = 'vote';
          H.meeting.time = H.settings.votingTime;
          H.dirty = true;
        } else {
          tallyVotes();
        }
      }
      if (NS.bots) NS.bots.meeting(dt, H);
      /* The bots argue. Their lines go out on the ordinary chat channel,
         attributed to the bot rather than to the host's own player. */
      if (NS.minds) {
        NS.minds.speak(dt, H, (botId, text) => {
          send('chat', { t: 'msg', text, as: botId });
        });
      }
    } else if (H.phase === 'eject') {
      H.ejectLeft -= dt;
      if (H.ejectLeft <= 0) {
        if (H.winner) finish();
        else {
          H.phase = 'play';
          H.ejected = null;
          for (const id of livingIds()) H.killCooldown[id] = Math.max(H.killCooldown[id] || 0, 10);
          H.dirty = true;
          snapshot(true);
        }
      }
    }

    const now = U.now();
    if (H.dirty || now - H.lastSnapshot > SNAPSHOT_EVERY) snapshot();
  }

  /* ---- the snapshot ------------------------------------------------------- */

  function snapshot(force) {
    H.lastSnapshot = U.now();
    H.dirty = false;
    H.seq++;
    const totals = R.taskTotals(H.tasks, H.roles);
    const players = list().map((id) => {
      const p = H.players[id];
      let flags = 0;
      if (p.alive) flags |= 1;
      if (p.ghost) flags |= 2;
      if (p.bot) flags |= 4;
      if (!p.connected) flags |= 8;
      if (p.ready) flags |= 16;
      if (H.shields[id]) flags |= 32;
      return [id, p.name, p.colorIdx, p.hatIdx, flags];
    });

    const msg = {
      t: 'S', q: H.seq, ph: H.phase, st: H.settings, pl: players,
      td: totals.done, tt: totals.total,
      sb: H.sabotage ? {
        k: H.sabotage.kind,
        r: Math.max(0, Math.round(H.sabotage.remaining * 10) / 10),
        d: H.sabotage.done,
        h: Object.keys(H.sabotage.holds).filter((i) => H.sabotage.holds[i]).map(Number),
      } : null,
      cd: Object.keys(H.closedRooms),
      bo: H.bodies.map((b) => [b.id, Math.round(b.x), Math.round(b.y), b.colorIdx, b.hatIdx, b.facing]),
      iv: Object.keys(H.invisible),
      cw: H.watching.size ? 1 : 0,
      sh: Object.keys(H.shifted).map((id) => [id, H.shifted[id].as]),
      mt: H.meeting ? {
        r: H.meeting.reason, by: H.meeting.by, bd: H.meeting.bodyId,
        s: H.meeting.stage, t: Math.max(0, Math.round(H.meeting.time * 10) / 10),
        vd: Object.keys(H.meeting.votes),
      } : null,
      ej: H.ejected,
      wn: H.winner ? {
        tm: H.winner.team, rs: H.winner.reason,
        rl: list().map((id) => [id, H.roles[id] || 'crewmate']),
        lg: H.log,
      } : null,
      rv: H.phase === 'reveal' ? Math.max(0, Math.round(H.revealLeft * 10) / 10) : 0,
    };
    send('sys', msg);
    if (force) H.dirty = false;
  }

  /* What the host's own client needs that never goes on the wire: cooldowns
     are per player and only ever shown to that player, so they ride the local
     path instead of thirteen other people's snapshots. */
  function localExtras(id) {
    return {
      kill: Math.max(0, H.killCooldown[id] || 0),
      ability: Math.max(0, H.abilityCooldown[id] || 0),
      abilityUsed: !!H.abilityUsed[id],
      emergencies: H.settings.emergencies - (H.emergenciesUsed[id] || 0),
      emergencyCooldown: Math.max(0, H.emergencyCooldown),
      sabotageCooldown: Math.max(0, H.sabotageCooldown),
    };
  }

  NS.host = {
    H, begin, stop, start, tick, handle, addPlayer, dropPlayer, snapshot,
    canStart, localExtras, die, list, livingIds,
    setSettings(s) { H.settings = C.sanitise(s); H.dirty = true; },
    get phase() { return H.phase; },
  };
})(window.NS);

</script>
<script>
/* Somebody to play against when there is nobody to play against.

   These exist for two reasons and neither is a demo. One player opening the
   page should get a game rather than an empty station, and a class of nine
   who want three impostors should be able to have them. So bots are real
   participants: they are in the host's player table, they are dealt roles
   from the same shuffle, they can be voted out, and they can win.

   They are not clever and are not trying to be. A bot walks to its tasks,
   stands at them for as long as the task would take a person, and reports a
   body it can actually see. An impostor bot kills when it is alone with
   somebody, which is the one behaviour that makes the game work -- a bot that
   killed in front of witnesses would be found instantly and a bot that never
   killed would never be found at all. What they cannot do is lie in the
   meeting, and the game does not pretend otherwise: their votes are visibly
   simple, and the lobby says these are practice bots. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;
  const R = NS.rules;

  const NAMES = ['Ada', 'Bo', 'Cass', 'Dev', 'Eli', 'Fern', 'Gus', 'Hana', 'Ike',
                 'Jo', 'Kit', 'Lex', 'Mo', 'Nia', 'Ozz', 'Pim', 'Rae', 'Sol', 'Tam', 'Vic'];

  const brains = new Map();

  function forget(id, host) {
    NS.world.players.delete(id);
    brains.delete(id);
    if (host && host.H.players[id]) delete host.H.players[id];
  }

  function clear(host) {
    for (const id of Array.from(brains.keys())) forget(id, host);
  }

  /* Adding and removing rather than rebuilding.

     Re-rolling every bot each time somebody pressed + meant a bot that was
     Fern a moment ago was now Ada, while the host's player table still had the
     old name on the old id -- and the deduplicator, doing its job, handed
     somebody "Fern 2". Existing bots keep who they are; only the difference is
     made. */
  function fill(count, host) {
    for (const id of Array.from(brains.keys())) {
      if (Number(id.slice(3)) >= count) forget(id, host);
    }

    const takenNames = {};
    const takenColors = {};
    for (const id of Object.keys(host.H.players)) {
      takenNames[host.H.players[id].name.toLowerCase()] = true;
      takenColors[host.H.players[id].colorIdx] = true;
    }
    const names = NAMES.filter((n) => !takenNames[n.toLowerCase()]);
    const colors = C.COLORS.map((_, i) => i).filter((i) => !takenColors[i]);
    const rand = Math.random;

    for (let i = 0; i < count; i++) {
      const id = 'bot' + i;
      if (brains.has(id)) continue;
      if (!names.length || !colors.length) break;
      const name = names.splice(Math.floor(rand() * names.length), 1)[0];
      const colorIdx = colors.splice(Math.floor(rand() * colors.length), 1)[0];
      host.addPlayer(id, { n: name, c: colorIdx, h: Math.floor(rand() * C.HATS.length), bot: true });
      const spot = M.toWorld(M.SPAWN);
      const entity = NS.world.entity(id, {
        name, colorIdx, hatIdx: host.H.players[id].hatIdx, bot: true,
        x: spot.x, y: spot.y, tx: spot.x, ty: spot.y,
      });
      NS.world.players.set(id, entity);
      brains.set(id, {
        id, entity, path: null, step: 0, goal: null,
        busy: 0, think: rand() * 1.5, votes: -1, hold: 0, ventCool: 8 + rand() * 20,
      });
    }
    return brains.size;
  }

  const entities = () => Array.from(brains.values()).map((b) => b.entity);

  /* ---- moving ------------------------------------------------------------- */

  function repath(brain, x, y) {
    const found = M.path(brain.entity.x, brain.entity.y, x, y);
    brain.path = found;
    brain.step = 0;
    brain.goal = { x, y };
  }

  /* Can a body of this width walk that line, or only a ray?

     This is the difference between a bot that crosses the station and a bot
     that stands in a doorway for the rest of the round. String-pulling used a
     single line-of-sight ray, and a ray has no width: it slips past a corner
     that eleven pixels of duck cannot. The bot would then push diagonally into
     the wall, move zero pixels, throw the path away, plan the identical path,
     take the identical shortcut, and wedge again -- forever, at a fixed step
     of a fixed path, which is exactly what the sabotage traces showed. Three
     of the crew frozen in a corridor is why the reactor melted down in a third
     of all rounds and why the tasks never finished.

     So the shortcut is tested along both flanks of the body as well as its
     centre. Slightly inside the radius, because the wall-slide in map.move
     already gives back a pixel or two at the edges. */
  function roomToWalk(e, tx, ty) {
    const dx = tx - e.x, dy = ty - e.y;
    const len = Math.hypot(dx, dy);
    if (len < 1) return true;
    const px = (-dy / len) * (M.RADIUS - 2), py = (dx / len) * (M.RADIUS - 2);
    return NS.los.clear(e.x, e.y, tx, ty)
        && NS.los.clear(e.x + px, e.y + py, tx + px, ty + py)
        && NS.los.clear(e.x - px, e.y - py, tx - px, ty - py);
  }

  /* String-pulling: rather than walk the tile centres one by one, look ahead
     for the furthest waypoint still in a straight line and head for that. Grid
     paths without it read as a bot, which for once is the thing to avoid. */
  function advance(brain, dt, speed) {
    const e = brain.entity;
    if (!brain.path || brain.step >= brain.path.length) { e.moving = false; return true; }
    let target = brain.path[brain.step];
    for (let i = Math.min(brain.path.length - 1, brain.step + 10); i > brain.step; i--) {
      if (roomToWalk(e, brain.path[i].x, brain.path[i].y)) { brain.step = i; target = brain.path[i]; break; }
    }
    const dx = target.x - e.x, dy = target.y - e.y;
    const len = Math.hypot(dx, dy);
    if (len < 9) { brain.step++; return brain.step >= brain.path.length; }
    const move = Math.min(len, speed * dt);
    const moved = M.move(e.x, e.y, (dx / len) * move, (dy / len) * move);
    if (Math.abs(moved.x - e.x) < 0.01 && Math.abs(moved.y - e.y) < 0.01) {
      /* Wedged anyway. Throwing the path away is not enough on its own -- the
         next plan starts from the same pixel and can wedge in the same place.
         A 32px corridor leaves a body of radius 11 five pixels of play either
         side, so a bot that entered off-centre has nowhere to push; stepping
         back towards the middle of the tile it is standing in gives it the
         room to try again. */
      brain.path = null;
      const cx = (Math.floor(e.x / M.TILE) + 0.5) * M.TILE;
      const cy = (Math.floor(e.y / M.TILE) + 0.5) * M.TILE;
      const back = M.move(e.x, e.y, U.clamp(cx - e.x, -5, 5), U.clamp(cy - e.y, -5, 5));
      e.x = back.x; e.y = back.y;
      e.tx = e.x; e.ty = e.y;
      return true;
    }
    e.x = moved.x; e.y = moved.y;
    if (dx > 1) e.dir = 1; else if (dx < -1) e.dir = -1;
    e.moving = true;
    e.tx = e.x; e.ty = e.y;
    return false;
  }

  /* ---- deciding ----------------------------------------------------------- */

  function alone(brain, host, exceptId) {
    const e = brain.entity;
    for (const id of host.livingIds()) {
      if (id === brain.id || id === exceptId) continue;
      const other = NS.world.players.get(id);
      if (!other) continue;
      if (U.dist2(e.x, e.y, other.x, other.y) < 420 * 420 && NS.los.clear(e.x, e.y, other.x, other.y)) return false;
    }
    return true;
  }

  /* The nearest job they still owe, not the first one on the list. Dealing the
     list in order sent every bot down the same corridor at the same moment and
     parked seven of them in Storage, which reads as a bug even though each one
     was behaving correctly on its own. */
  function nextTaskSpot(brain, host) {
    const mine = host.H.tasks[brain.id];
    if (!mine) return null;
    const e = brain.entity;
    let best = null, bestD = Infinity;
    for (const task of mine) {
      if (task.done) continue;
      const station = R.stationById[task.sid];
      if (!station) continue;
      const spot = station.steps ? station.steps[task.step] : station;
      const world = M.toWorld(spot);
      const d = U.dist2(e.x, e.y, world.x, world.y);
      if (d < bestD) { bestD = d; best = { task, world }; }
    }
    return best;
  }

  /* Who is going to which pad.

     A meltdown needs a person at each end at the same moment, so this has to
     be a decision made across the whole crew rather than by each bot on its
     own. It used to be: pad = order % 2. That covers both ends only while the
     living crew happens to contain both parities, and by the second sabotage
     of a round it often does not -- three survivors with even indices all
     walked to the left pad, stood on it together, and watched the reactor
     blow. Measured over a hundred rounds, a third of them ended that way.

     So it is assigned instead, once per tick for everybody at once: each pad
     claims the nearest crewmate who has not been claimed yet, and only then do
     the leftovers pick a pad. Pads a human is already standing on are struck
     off first, which is how a bot knows to go and cover the other one rather
     than crowd the one that is already handled. */
  function assignFixes(H) {
    const active = H.sabotage;
    if (!active) return null;
    const def = NS.sabotage.SABOTAGES[active.kind];
    if (!def || !def.fix || !def.spots.length) return null;

    const spots = [];
    for (let i = 0; i < def.spots.length; i++) {
      if (def.fix === 'hold') {
        if (active.holds && active.holds[i] && active.holds[i].at > 0
            && !brains.has(active.holds[i].by)) continue;
      } else if (active.done && active.done[i]) continue;
      const w = M.toWorld(M.SABOTAGE_SPOTS[def.spots[i]]);
      spots.push({ index: i, x: w.x, y: w.y });
    }
    if (!spots.length) return null;

    const crew = [];
    for (const brain of brains.values()) {
      const p = H.players[brain.id];
      if (!p || !p.alive) continue;
      if (C.ROLES[H.roles[brain.id] || 'crewmate'].team === 'impostor') continue;
      crew.push(brain);
    }
    if (!crew.length) return null;

    const out = new Map();
    const taken = new Set();
    for (const spot of spots) {
      let pick = null, bestD = Infinity;
      for (const brain of crew) {
        if (taken.has(brain.id)) continue;
        const d = U.dist2(brain.entity.x, brain.entity.y, spot.x, spot.y);
        if (d < bestD) { bestD = d; pick = brain; }
      }
      if (!pick) break;
      taken.add(pick.id);
      out.set(pick.id, spot);
    }
    for (const brain of crew) {
      if (out.has(brain.id)) continue;
      let pick = spots[0], bestD = Infinity;
      for (const spot of spots) {
        const d = U.dist2(brain.entity.x, brain.entity.y, spot.x, spot.y);
        if (d < bestD) { bestD = d; pick = spot; }
      }
      out.set(brain.id, pick);
    }
    return { def, spots: out };
  }

  function sabotageTarget(brain, plan) {
    if (!plan) return null;
    const spot = plan.spots.get(brain.id);
    if (!spot) return null;
    return { index: spot.index, x: spot.x, y: spot.y, fix: plan.def.fix, critical: plan.def.critical };
  }

  function wander(brain) {
    const room = NS.util.pick(M.ROOMS, Math.random);
    repath(brain, room.cx + (Math.random() - 0.5) * 80, room.cy + (Math.random() - 0.5) * 80);
  }

  function step(dt, H) {
    const host = NS.host;
    if (H.phase !== 'play') {
      for (const brain of brains.values()) brain.entity.moving = false;
      return;
    }
    const speed = H.settings.playerSpeed * NS.world.BASE_SPEED * 0.94;
    const plan = assignFixes(H);

    for (const brain of brains.values()) {
      const p = H.players[brain.id];
      if (!p) continue;
      const e = brain.entity;
      e.alive = p.alive;
      e.ghost = p.ghost;
      if (!p.alive) { e.moving = false; continue; }

      if (brain.busy > 0) {
        brain.busy -= dt;
        e.moving = false;
        if (brain.busy <= 0 && brain.pending) {
          host.handle(brain.id, brain.pending);
          brain.pending = null;
        }
        continue;
      }

      const role = C.ROLES[H.roles[brain.id] || 'crewmate'];

      /* A body in the open gets reported. Crew only -- an impostor bot walking
         past its own work and calling a meeting was the single most obvious
         tell in testing. */
      if (role.team !== 'impostor') {
        for (const body of H.bodies) {
          if (U.dist2(e.x, e.y, body.x, body.y) < 200 * 200 && NS.los.clear(e.x, e.y, body.x, body.y)) {
            repath(brain, body.x, body.y);
            if (U.dist(e.x, e.y, body.x, body.y) < 90) {
              brain.busy = 0.5 + Math.random() * 0.8;
              brain.pending = { t: 'report', body: body.id };
            }
            break;
          }
        }
      }

      /* A broken station comes before a task list. Only the crew care --
         an impostor bot walking across the map to repair its own sabotage was
         the loudest tell in the game. */
      if (role.team !== 'impostor') {
        const fix = sabotageTarget(brain, plan);
        if (fix) {
          const reach = NS.sabotage.REACH * 0.75;
          if (U.dist(e.x, e.y, fix.x, fix.y) < reach) {
            e.moving = false;
            brain.path = null;
            brain.hold -= dt;
            if (brain.hold <= 0) {
              /* A hold decays at the host, so it has to be renewed; a panel is
                 done once, after a pause long enough to look like a person
                 reading it. */
              brain.hold = fix.fix === 'hold' ? 0.5 : 1.6;
              host.handle(brain.id, { t: 'fix', i: fix.index, on: true });
            }
            continue;
          }
          if (!brain.path || !brain.goal || U.dist(brain.goal.x, brain.goal.y, fix.x, fix.y) > 16) {
            repath(brain, fix.x, fix.y);
            brain.hold = fix.fix === 'hold' ? 0 : 1.2;
          }
          advance(brain, dt, speed);
          continue;
        }
      }

      if (role.kill) {
        brain.ventCool -= dt;
        const cooldown = H.killCooldown[brain.id] || 0;
        if (cooldown <= 0) {
          const range = (C.KILL_RANGE[H.settings.killRange] || 108) * 0.9;
          /* Nearest first, and that ordering is the whole point.

             This used to walk host.livingIds(), which is the player table in
             insertion order -- and the person who opened the page is always
             the first row in it. So of every crewmate standing in range, the
             human was the one tested first, every time, in every round. It
             was not that the bots were hunting them; it was that the loop
             asked about them before it asked about anybody else. Two people
             next to a bot with a ready knife should be a coin toss decided by
             which of them is closer, not by who booted the lobby. */
          let target = null, best = range * range;
          for (const id of host.livingIds()) {
            if (id === brain.id) continue;
            if (C.ROLES[H.roles[id] || 'crewmate'].team === 'impostor') continue;
            const other = NS.world.players.get(id);
            if (!other) continue;
            const d = U.dist2(e.x, e.y, other.x, other.y);
            if (d < best && NS.los.clear(e.x, e.y, other.x, other.y) && alone(brain, host, id)) {
              best = d; target = id;
            }
          }
          if (target) {
            host.handle(brain.id, { t: 'kill', target });
            brain.busy = 0.8;
            brain.path = null;
            escape(brain, host);
          }
        }
        /* Sabotage on a timer rather than a plan. It moves the crew around,
           which is most of what sabotage is for. */
        if (!H.sabotage && H.sabotageCooldown <= 0 && Math.random() < dt * 0.05) {
          host.handle(brain.id, { t: 'sabotage', k: U.pick(NS.sabotage.MENU, Math.random) });
        }
      }

      if (!brain.path || brain.step >= (brain.path ? brain.path.length : 0)) {
        /* Impostors walk their fake list too. The host counts nothing for
           them and plays no visual, so the only thing it changes is that they
           are standing where a working crewmate would be standing. */
        const next = nextTaskSpot(brain, host);
        if (next) {
          if (U.dist(e.x, e.y, next.world.x, next.world.y) < 40) {
            /* Standing at the console for as long as it would take a person,
               so watching a bot do a task tells you what watching a player
               doing that task looks like. */
            brain.busy = 2 + Math.random() * 3;
            brain.pending = { t: 'task', sid: next.task.sid, step: next.task.step };
            brain.path = null;
          } else if (!brain.goal || U.dist(brain.goal.x, brain.goal.y, next.world.x, next.world.y) > 12) {
            repath(brain, next.world.x, next.world.y);
          } else wander(brain);
        } else wander(brain);
      }

      advance(brain, dt, speed);
    }
  }

  /* Leaving through the vent is most of what makes an impostor frightening:
     the body is in Electrical and they were in Navigation. Bots do it when
     there is one to hand, because a killer that always walks away down the
     corridor is a killer you can catch by walking the corridor. */
  function escape(brain, host) {
    const e = brain.entity;
    let best = null, bestD = 150 * 150, group = -1, index = -1;
    M.VENT_GROUPS.forEach((vents, gi) => {
      vents.forEach((v, vi) => {
        const w = M.toWorld(v);
        const d = U.dist2(e.x, e.y, w.x, w.y);
        if (d < bestD) { bestD = d; best = w; group = gi; index = vi; }
      });
    });
    if (!best) return;
    const vents = M.VENT_GROUPS[group];
    const exits = vents.map((_, i) => i).filter((i) => i !== index);
    if (!exits.length) return;
    const exit = exits[Math.floor(Math.random() * exits.length)];
    const out = M.toWorld(vents[exit]);
    e.x = e.tx = out.x;
    e.y = e.ty = out.y;
    brain.path = null;
    brain.goal = null;
    host.handle(brain.id, { t: 'vent', a: 'in', g: group, i: index });
    host.handle(brain.id, { t: 'vent', a: 'out', g: group, i: exit });
  }

  /* ---- meetings ----------------------------------------------------------- */

  function meeting(dt, H) {
    if (!H.meeting || H.meeting.stage !== 'vote') return;
    for (const brain of brains.values()) {
      const p = H.players[brain.id];
      if (!p || !p.alive) continue;
      if (H.meeting.votes[brain.id] !== undefined) continue;
      /* Spread across the time that is actually left. Using the lobby's
         voting time meant a shortened vote closed with most of them still
         thinking about it. */
      if (brain.votes < 0) {
        brain.votes = 2 + Math.random() * Math.max(3, Math.min(22, H.meeting.time * 0.55));
      }
      brain.votes -= dt;
      if (brain.votes > 0) continue;
      brain.votes = -1;

      /* The vote comes out of what the bot saw and what it has heard in the
         meeting -- see game/minds.js. It used to be a coin toss, which made
         the argument decorative. */
      const target = NS.minds ? NS.minds.voteFor(H, brain.id) : 'skip';
      NS.host.handle(brain.id, { t: 'vote', target });
    }
    for (const brain of brains.values()) if (H.meeting.votes[brain.id] !== undefined) brain.votes = -1;
  }

  function resetForRound() {
    for (const brain of brains.values()) {
      brain.path = null; brain.goal = null; brain.busy = 0;
      brain.pending = null; brain.votes = -1; brain.hold = 0;
    }
  }

  NS.bots = { fill, clear, step, meeting, entities, resetForRound, count: () => brains.size };
})(window.NS);

</script>
<script>
/* Shared pieces of interface: an avatar that is the real character drawing,
   a toast, and the confirm used before anything you cannot take back. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const el = U.el;

  /* Portraits are the same canvas drawing as the world, not a second set of
     images -- so a hat you picked in the lobby is the hat on your body when
     somebody finds it. */
  function avatar(colorIdx, hatIdx, size, opts) {
    const o = opts || {};
    const canvas = el('canvas', { class: 'avatar' + (o.class ? ' ' + o.class : '') });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate(size / 2, size / 2);
    NS.characters.drawAvatar(ctx, colorIdx, hatIdx, size * 0.94, o);
    return canvas;
  }

  /* Announcements for a screen reader. Toasts are visual and transient; this
     is the same information as text, in order, for somebody who is not looking
     at the station. Deliberately terse -- a live region that narrates every
     footstep is worse than none. */
  let announcer = null;
  function announce(text) {
    if (!announcer) {
      announcer = el('div', {
        class: 'sr-only', role: 'status', 'aria-live': 'polite', 'aria-atomic': 'true',
      });
      document.body.appendChild(announcer);
    }
    /* Same string twice in a row is not re-read by most screen readers, so it
       is cleared first. */
    announcer.textContent = '';
    setTimeout(() => { if (announcer) announcer.textContent = text; }, 60);
  }

  let toastHost = null;
  function toast(text, kind, seconds) {
    if (!toastHost) {
      toastHost = el('div', { class: 'toasts', 'aria-live': 'polite' });
      document.body.appendChild(toastHost);
    }
    const node = el('div', { class: 'toast toast--' + (kind || 'info'), text });
    toastHost.appendChild(node);
    const life = (seconds || 3.4) * 1000;
    setTimeout(() => node.classList.add('is-out'), life - 260);
    setTimeout(() => node.remove(), life);
    return node;
  }

  function confirm(opts) {
    return new Promise((resolve) => {
      const root = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' });
      const box = el('div', { class: 'sheet-box' }, [
        el('h3', { text: opts.title }),
        opts.body ? el('p', { text: opts.body }) : null,
        el('div', { class: 'sheet-row' }, [
          el('button', {
            class: 'btn btn--ghost', type: 'button', text: opts.cancel || 'Back',
            onclick: () => { root.remove(); resolve(false); },
          }),
          el('button', {
            class: 'btn ' + (opts.danger ? 'btn--danger' : 'btn--primary'), type: 'button',
            text: opts.confirm || 'Do it',
            onclick: () => { root.remove(); resolve(true); },
          }),
        ]),
      ]);
      root.appendChild(box);
      root.addEventListener('click', (e) => {
        if (e.target === root) { root.remove(); resolve(false); }
      });
      document.body.appendChild(root);
      box.querySelector('.btn--primary, .btn--danger').focus();
    });
  }

  /* An icon set drawn as inline SVG paths. Emoji would have been quicker and
     would look like a different application on every device it ran on. */
  const ICONS = {
    use: 'M7 3h10l1 5-4 3v4l-4 3v-7L6 8z',
    report: 'M4 3h16v13H8l-4 4z M12 6v5 M12 13v1.6',
    kill: 'M6 4l12 16 M18 4L6 20',
    vent: 'M4 6h16v12H4z M7 9h10 M7 12h10 M7 15h10',
    map: 'M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14 M15 6v14',
    tasks: 'M4 6h16 M4 12h16 M4 18h10',
    gear: 'M4 7h7 M15 7h5 M4 12h11 M19 12h1 M4 17h3 M11 17h9 M13 7v0a2 2 0 104 0 2 2 0 10-4 0z M15 12v0a2 2 0 10-4 0 2 2 0 104 0z M7 17v0a2 2 0 104 0 2 2 0 10-4 0z',
    sabotage: 'M12 2l9 18H3z M12 9v5 M12 17v1.5',
    chat: 'M4 5h16v10H9l-5 4z',
    sound: 'M4 9h4l5-4v14l-5-4H4z M16 9c1.5 1.5 1.5 4.5 0 6',
    mute: 'M4 9h4l5-4v14l-5-4H4z M16 9l6 6 M22 9l-6 6',
    close: 'M6 6l12 12 M18 6L6 18',
    ghost: 'M6 20V10a6 6 0 1112 0v10l-3-2-3 2-3-2z M10 10h.01 M14 10h.01',
    shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
    eye: 'M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6z M12 10a2 2 0 100 4 2 2 0 000-4z',
    heart: 'M12 20s-8-5-8-10a4 4 0 018-1 4 4 0 018 1c0 5-8 10-8 10z',
  };

  function icon(name, size) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('width', size || 22);
    svg.setAttribute('height', size || 22);
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('class', 'icon');
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', ICONS[name] || ICONS.close);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'currentColor');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(path);
    return svg;
  }

  NS.bits = { avatar, toast, confirm, icon, announce, ICONS };
})(window.NS);

</script>
<script>
/* The tasks.

   Twenty-one of them, each with its own mechanic, because the task list is
   the crew's whole job and a list of five reskinned progress bars is how a
   social deduction game turns into a chat room with walking. They also have a
   second job people forget: an impostor standing at a console has to look
   busy for exactly as long as the real thing takes, so every one of these has
   a believable duration and none of them can be finished instantly.

   All of them are drawn on one canvas at a fixed logical size and scaled to
   fit, which is what makes them work identically under a mouse and a thumb.
   Hit targets are sized for a thumb first; a mouse can always hit a big
   target, and the reverse is not true. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const el = U.el;

  const INK = '#cfd9e8';
  const DIM = '#7c8aa3';
  const STEEL = '#2c3648';
  const DEEP = '#0d1320';
  const FLARE = '#ffb03a';
  const VITAL = '#34e0b8';
  const BLOOD = '#ff3f5b';

  const rr = NS.characters.rr;

  /* ---- the frame every task sits in -------------------------------------- */

  let open = null;

  function panel(spec, api) {
    close(true);
    const game = {
      spec, api, state: {}, t: 0, done: false, closing: false,
      pointer: { x: 0, y: 0, down: false, dx: 0, dy: 0 },
    };

    const root = el('div', { class: 'mg', role: 'dialog', 'aria-modal': 'true', 'aria-label': spec.title });
    const box = el('div', { class: 'mg-box' });
    const head = el('header', { class: 'mg-head' }, [
      el('div', { class: 'mg-title' }, [
        el('h2', { text: spec.title }),
        el('p', { text: spec.hint || '' }),
      ]),
      el('button', {
        class: 'mg-close', type: 'button', 'aria-label': 'Leave the task',
        onclick: () => close(),
      }, [el('span', { text: 'Leave' })]),
    ]);
    const stage = el('div', { class: 'mg-stage' });
    const canvas = el('canvas');
    stage.appendChild(canvas);
    const foot = el('div', { class: 'mg-foot' }, [
      el('div', { class: 'mg-step', text: spec.step || '' }),
      el('div', { class: 'mg-bar' }, [el('i')]),
    ]);
    box.appendChild(head);
    box.appendChild(stage);
    box.appendChild(foot);
    root.appendChild(box);
    document.body.appendChild(root);
    document.body.classList.add('in-task');

    game.root = root;
    game.canvas = canvas;
    game.ctx = canvas.getContext('2d');
    game.bar = foot.querySelector('.mg-bar i');
    game.progress = 0;

    const W = spec.w || 460, H = spec.h || 300;
    game.W = W; game.H = H;

    /* The stage is as wide as the panel and as tall as the window can spare.
       Measuring the stage's own height would be circular -- it gets its height
       from this canvas -- which is what left the first build drawing a small
       panel in the middle of a large empty one. */
    function fit() {
      const rect = stage.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const availW = Math.max(220, rect.width || (box.clientWidth - 28));
      const availH = Math.max(200, window.innerHeight - 250);
      const s = Math.min(availW / W, availH / H);
      game.scale = s;
      canvas.style.width = Math.round(W * s) + 'px';
      canvas.style.height = Math.round(H * s) + 'px';
      canvas.width = Math.round(W * s * dpr);
      canvas.height = Math.round(H * s * dpr);
      game.ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
    }
    game.fit = fit;
    fit();
    requestAnimationFrame(fit);
    window.addEventListener('resize', fit);

    function local(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((e.clientX - rect.left) / rect.width) * W,
        y: ((e.clientY - rect.top) / rect.height) * H,
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      const p = local(e);
      game.pointer.x = p.x; game.pointer.y = p.y; game.pointer.down = true;
      if (spec.down) spec.down(game, p.x, p.y);
      NS.audio.play('tap');
    });
    canvas.addEventListener('pointermove', (e) => {
      const p = local(e);
      game.pointer.dx = p.x - game.pointer.x;
      game.pointer.dy = p.y - game.pointer.y;
      game.pointer.x = p.x; game.pointer.y = p.y;
      if (spec.move) spec.move(game, p.x, p.y);
    });
    const release = (e) => {
      if (!game.pointer.down) return;
      game.pointer.down = false;
      const p = local(e);
      if (spec.up) spec.up(game, p.x, p.y);
    };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);

    game.finish = function () {
      if (game.done) return;
      game.done = true;
      game.progress = 1;
      NS.audio.play('taskDone');
      box.classList.add('is-done');
      setTimeout(() => { if (api.onDone) api.onDone(); close(true); }, 620);
    };
    game.fail = function () {
      NS.audio.play('taskFail');
      box.classList.add('is-wrong');
      setTimeout(() => box.classList.remove('is-wrong'), 320);
    };
    game.setProgress = function (v) {
      game.progress = U.clamp(v, 0, 1);
      game.bar.style.transform = 'scaleX(' + game.progress.toFixed(3) + ')';
    };

    if (spec.init) spec.init(game);
    open = game;
    NS.audio.play('taskOpen');

    let last = U.now();
    function frame() {
      if (open !== game) return;
      const now = U.now();
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      game.t += dt;
      if (spec.update && !game.done) spec.update(game, dt);
      game.ctx.clearRect(0, 0, W, H);
      spec.draw(game, game.ctx);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    game.teardown = function () {
      window.removeEventListener('resize', fit);
      document.body.classList.remove('in-task');
      root.remove();
    };
    return game;
  }

  function close(silent) {
    if (!open) return;
    const game = open;
    open = null;
    game.teardown();
    if (!silent && game.api.onClose) game.api.onClose();
  }

  /* ---- shared drawing ---------------------------------------------------- */

  function plate(ctx, x, y, w, h, fill) {
    ctx.fillStyle = fill || DEEP;
    rr(ctx, x, y, w, h, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1.5;
    rr(ctx, x + 0.75, y + 0.75, w - 1.5, h - 1.5, 10);
    ctx.stroke();
  }

  function label(ctx, text, x, y, size, colour, align) {
    ctx.font = '700 ' + (size || 13) + 'px Archivo, system-ui, sans-serif';
    ctx.fillStyle = colour || DIM;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
  }

  function mono(ctx, text, x, y, size, colour, align) {
    ctx.font = '700 ' + (size || 15) + 'px "JetBrains Mono", ui-monospace, monospace';
    ctx.fillStyle = colour || INK;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
  }

  const hit = (x, y, bx, by, bw, bh) => x >= bx && x <= bx + bw && y >= by && y <= by + bh;

  /* ---- the tasks --------------------------------------------------------- */

  const WIRE_COLOURS = ['#e8563f', '#3d6fe0', '#f0a63c', '#f18fb0', '#4ca85c'];

  const GAMES = {

    wiring: {
      title: 'Fix Wiring', hint: 'Drag each wire across to the same colour.',
      w: 460, h: 300,
      init(g) {
        const n = 4;
        const order = U.shuffle([0, 1, 2, 3, 4], Math.random).slice(0, n);
        const right = U.shuffle(order, Math.random);
        g.state = { n, left: order, right, joined: {}, dragging: null, count: 0 };
      },
      down(g, x, y) {
        const s = g.state;
        for (let i = 0; i < s.n; i++) {
          if (s.joined[i] !== undefined) continue;
          if (U.dist(x, y, 92, 58 + i * 62) < 34) { s.dragging = i; return; }
        }
      },
      up(g, x, y) {
        const s = g.state;
        if (s.dragging === null) return;
        for (let k = 0; k < s.n; k++) {
          if (U.dist(x, y, 368, 58 + k * 62) < 38) {
            if (s.right[k] === s.left[s.dragging]) {
              s.joined[s.dragging] = k;
              s.count++;
              NS.audio.play('taskStep');
              g.setProgress(s.count / s.n);
              if (s.count >= s.n) g.finish();
            } else g.fail();
            break;
          }
        }
        s.dragging = null;
      },
      draw(g, ctx) {
        const s = g.state;
        plate(ctx, 12, 12, g.W - 24, g.H - 24, '#151d2c');
        label(ctx, 'PORT', 92, 24, 11, DIM, 'center');
        label(ctx, 'STARBOARD', 368, 24, 11, DIM, 'center');
        for (let i = 0; i < s.n; i++) {
          const y = 58 + i * 62;
          ctx.fillStyle = STEEL;
          rr(ctx, 40, y - 22, 52, 44, 6); ctx.fill();
          rr(ctx, 368, y - 22, 52, 44, 6); ctx.fill();
          ctx.fillStyle = WIRE_COLOURS[s.left[i]];
          rr(ctx, 68, y - 13, 26, 26, 5); ctx.fill();
          ctx.fillStyle = WIRE_COLOURS[s.right[i]];
          rr(ctx, 366, y - 13, 26, 26, 5); ctx.fill();
        }
        ctx.lineCap = 'round';
        ctx.lineWidth = 11;
        for (let i = 0; i < s.n; i++) {
          if (s.joined[i] === undefined) continue;
          ctx.strokeStyle = WIRE_COLOURS[s.left[i]];
          ctx.beginPath();
          ctx.moveTo(92, 58 + i * 62);
          ctx.lineTo(368, 58 + s.joined[i] * 62);
          ctx.stroke();
        }
        if (s.dragging !== null) {
          ctx.strokeStyle = WIRE_COLOURS[s.left[s.dragging]];
          ctx.beginPath();
          ctx.moveTo(92, 58 + s.dragging * 62);
          ctx.lineTo(g.pointer.x, g.pointer.y);
          ctx.stroke();
        }
      },
    },

    swipe: {
      title: 'Swipe Card', hint: 'Drag the card through the reader, steadily.',
      w: 460, h: 300, step: 'Not too fast, not too slow.',
      init(g) { g.state = { cx: 60, held: false, start: 0, startX: 0, verdict: '', flash: 0 }; },
      down(g, x, y) {
        const s = g.state;
        if (hit(x, y, s.cx - 52, 176, 104, 68)) { s.held = true; s.start = g.t; s.startX = x; s.verdict = ''; }
      },
      move(g, x) { if (g.state.held) g.state.cx = U.clamp(x, 40, 430); },
      up(g) {
        const s = g.state;
        if (!s.held) return;
        s.held = false;
        const travelled = s.cx - s.startX;
        const took = g.t - s.start;
        if (travelled < 250) { s.verdict = 'Too short. Take it all the way through.'; s.flash = 1; }
        else if (took < 0.42) { s.verdict = 'Too fast.'; s.flash = 1; }
        else if (took > 1.9) { s.verdict = 'Too slow.'; s.flash = 1; }
        else { g.finish(); return; }
        g.fail();
        s.cx = 60;
      },
      update(g, dt) { if (g.state.flash > 0) g.state.flash -= dt * 2; },
      draw(g, ctx) {
        const s = g.state;
        plate(ctx, 12, 12, g.W - 24, g.H - 24, '#151d2c');
        plate(ctx, 34, 60, g.W - 68, 92, '#0a0f1a');
        ctx.fillStyle = STEEL;
        rr(ctx, 44, 74, g.W - 88, 64, 8); ctx.fill();
        ctx.fillStyle = s.verdict ? BLOOD : VITAL;
        ctx.globalAlpha = s.verdict ? 0.5 + Math.max(0, s.flash) * 0.5 : 0.75;
        rr(ctx, 56, 88, 16, 36, 4); ctx.fill();
        ctx.globalAlpha = 1;
        mono(ctx, s.verdict || 'AURORA-7 CREW ACCESS', 90, 106, 13, s.verdict ? BLOOD : VITAL);
        ctx.fillStyle = '#39435c';
        rr(ctx, 34, 168, g.W - 68, 84, 8); ctx.fill();
        ctx.fillStyle = '#10182a';
        rr(ctx, 40, 174, g.W - 80, 72, 6); ctx.fill();
        /* The card */
        const cg = ctx.createLinearGradient(s.cx - 52, 176, s.cx + 52, 244);
        cg.addColorStop(0, '#e8e2d4'); cg.addColorStop(1, '#b9b2a2');
        ctx.fillStyle = cg;
        rr(ctx, s.cx - 52, 176, 104, 68, 7); ctx.fill();
        ctx.fillStyle = FLARE;
        rr(ctx, s.cx - 42, 188, 26, 20, 3); ctx.fill();
        ctx.fillStyle = 'rgba(20,26,40,0.5)';
        rr(ctx, s.cx - 42, 216, 76, 5, 2); ctx.fill();
        rr(ctx, s.cx - 42, 226, 52, 5, 2); ctx.fill();
      },
    },

    calibrate: {
      title: 'Calibrate Distributor', hint: 'Tap when the marker crosses the green.',
      w: 460, h: 300,
      init(g) { g.state = { round: 0, need: 3, angle: 0, speed: 2.2, target: 0, lock: 0 }; g.state.target = Math.random() * Math.PI * 2; },
      down(g) {
        const s = g.state;
        if (s.lock > 0) return;
        let d = Math.abs(((s.angle - s.target + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
        d = Math.PI - d;
        if (d < 0.28) {
          s.round++;
          NS.audio.play('taskStep');
          g.setProgress(s.round / s.need);
          if (s.round >= s.need) { g.finish(); return; }
          s.speed += 0.7;
          s.target = Math.random() * Math.PI * 2;
          s.lock = 0.35;
        } else { g.fail(); s.speed = Math.max(1.8, s.speed - 0.3); }
      },
      update(g, dt) {
        const s = g.state;
        if (s.lock > 0) s.lock -= dt;
        s.angle = (s.angle + s.speed * dt) % (Math.PI * 2);
      },
      draw(g, ctx) {
        const s = g.state;
        plate(ctx, 12, 12, g.W - 24, g.H - 24, '#151d2c');
        const cx = g.W / 2, cy = g.H / 2 + 6, r = 96;
        ctx.strokeStyle = '#242f45'; ctx.lineWidth = 26;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = VITAL; ctx.lineWidth = 26;
        ctx.beginPath(); ctx.arc(cx, cy, r, s.target - 0.28, s.target + 0.28); ctx.stroke();
        ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(s.angle) * (r - 20), cy + Math.sin(s.angle) * (r - 20));
        ctx.lineTo(cx + Math.cos(s.angle) * (r + 20), cy + Math.sin(s.angle) * (r + 20));
        ctx.stroke();
        ctx.fillStyle = STEEL;
        ctx.beginPath(); ctx.arc(cx, cy, 44, 0, Math.PI * 2); ctx.fill();
        mono(ctx, s.round + ' / ' + s.need, cx, cy, 22, FLARE, 'center');
      },
    },

    shields: {
      title: 'Prime Shields', hint: 'Tap every dark panel.',
      w: 460, h: 300,
      init(g) {
        const cells = [];
        for (let i = 0; i < 7; i++) {
          const a = (i / 6) * Math.PI * 2;
          cells.push({
            x: i === 6 ? 0 : Math.cos(a) * 92, y: i === 6 ? 0 : Math.sin(a) * 82,
            on: Math.random() > 0.55,
          });
        }
        if (cells.every((c) => c.on)) cells[0].on = false;
        g.state = { cells };
      },
      down(g, x, y) {
        const s = g.state;
        const cx = g.W / 2, cy = g.H / 2;
        for (const c of s.cells) {
          if (U.dist(x, y, cx + c.x, cy + c.y) < 42 && !c.on) {
            c.on = true;
            NS.audio.play('taskStep');
            const done = s.cells.filter((k) => k.on).length;
            g.setProgress(done / s.cells.length);
            if (s.cells.every((k) => k.on)) g.finish();
            return;
          }
        }
      },
      draw(g, ctx) {
        plate(ctx, 12, 12, g.W - 24, g.H - 24, '#101827');
        const cx = g.W / 2, cy = g.H / 2;
        for (const c of g.state.cells) {
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
            const vx = cx + c.x + Math.cos(a) * 44, vy = cy + c.y + Math.sin(a) * 44;
            if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
          }
          ctx.closePath();
          ctx.fillStyle = c.on ? 'rgba(77,159,214,0.4)' : 'rgba(30,39,57,0.9)';
          ctx.fill();
          ctx.strokeStyle = c.on ? '#7cc4f0' : '#39435c';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      },
    },

    chart: {
      title: 'Chart Course', hint: 'Drag the ship along the route.',
      w: 460, h: 300,
      init(g) {
        const pts = [];
        let x = 50, y = 150;
        for (let i = 0; i < 6; i++) {
          pts.push({ x, y });
          x += 62 + Math.random() * 12;
          y = 60 + Math.random() * 180;
        }
        g.state = { pts, at: 0, ship: { x: pts[0].x, y: pts[0].y }, dragging: false };
      },
      down(g, x, y) {
        const s = g.state;
        if (U.dist(x, y, s.ship.x, s.ship.y) < 40) s.dragging = true;
      },
      move(g, x, y) {
        const s = g.state;
        if (!s.dragging) return;
        s.ship.x = x; s.ship.y = y;
        const next = s.pts[s.at + 1];
        if (next && U.dist(x, y, next.x, next.y) < 30) {
          s.at++;
          NS.audio.play('taskStep');
          g.setProgress(s.at / (s.pts.length - 1));
          if (s.at >= s.pts.length - 1) { s.dragging = false; g.finish(); }
        }
      },
      up(g) {
        const s = g.state;
        s.dragging = false;
        if (!g.done) { s.ship.x = s.pts[s.at].x; s.ship.y = s.pts[s.at].y; }
      },
      draw(g, ctx) {
        const s = g.state;
        plate(ctx, 12, 12, g.W - 24, g.H - 24, '#0a1120');
        for (let i = 0; i < 40; i++) {
          ctx.fillStyle = 'rgba(160,185,220,0.3)';
          ctx.fillRect(20 + ((i * 97) % 420), 24 + ((i * 53) % 250), 1.4, 1.4);
        }
        ctx.setLineDash([7, 7]);
        ctx.strokeStyle = 'rgba(77,159,214,0.55)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        s.pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.stroke();
        ctx.setLineDash([]);
        s.pts.forEach((p, i) => {
          ctx.fillStyle = i <= s.at ? VITAL : '#39435c';
          ctx.beginPath(); ctx.arc(p.x, p.y, i === s.at + 1 ? 12 : 7, 0, Math.PI * 2); ctx.fill();
        });
        ctx.save();
        ctx.translate(s.ship.x, s.ship.y);
        ctx.fillStyle = FLARE;
        ctx.beginPath();
        ctx.moveTo(14, 0); ctx.lineTo(-10, -9); ctx.lineTo(-6, 0); ctx.lineTo(-10, 9);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      },
    },

    steering: {
      title: 'Stabilise Steering', hint: 'Hold the crosshair on the centre.',
      w: 460, h: 300,
      init(g) { g.state = { x: 0, y: 0, drift: 0, held: 0 }; },
      move(g, x, y) {
        if (!g.pointer.down) return;
        g.state.x = U.clamp((x - g.W / 2) / 110, -1, 1);
        g.state.y = U.clamp((y - g.H / 2) / 96, -1, 1);
      },
      update(g, dt) {
        const s = g.state;
        s.drift += dt;
        if (!g.pointer.down) {
          s.x += Math.sin(s.drift * 1.7) * dt * 0.6;
          s.y += Math.cos(s.drift * 1.3) * dt * 0.6;
          s.x = U.clamp(s.x, -1, 1); s.y = U.clamp(s.y, -1, 1);
        }
        const near = Math.hypot(s.x, s.y) < 0.16;
        s.held = near ? s.held + dt : Math.max(0, s.held - dt * 1.6);
        g.setProgress(s.held / 2.2);
        if (s.held >= 2.2) g.finish();
      },
      draw(g, ctx) {
        const s = g.state;
        plate(ctx, 12, 12, g.W - 24, g.H - 24, '#0a1120');
        const cx = g.W / 2, cy = g.H / 2;
        ctx.strokeStyle = '#243045'; ctx.lineWidth = 2;
        for (let r = 32; r <= 112; r += 40) {
          ctx.beginPath(); ctx.ellipse(cx, cy, r * 1.14, r, 0, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.strokeStyle = Math.hypot(s.x, s.y) < 0.16 ? VITAL : '#39435c';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(cx, cy, 26, 23, 0, 0, Math.PI * 2); ctx.stroke();
        const px = cx + s.x * 110, py = cy + s.y * 96;
        ctx.strokeStyle = Math.hypot(s.x, s.y) < 0.16 ? VITAL : FLARE;
        ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(px - 18, py); ctx.lineTo(px + 18, py);
        ctx.moveTo(px, py - 18); ctx.lineTo(px, py + 18);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI * 2); ctx.stroke();
      },
    },

    filter: {
      title: 'Clean O2 Filter', hint: 'Drag every leaf into the chute.',
      w: 460, h: 300,
      init(g) {
        const bits = [];
        for (let i = 0; i < 7; i++) {
          bits.push({
            x: 70 + Math.random() * 150, y: 70 + Math.random() * 150,
            r: Math.random() * Math.PI, gone: false, size: 14 + Math.random() * 8,
          });
        }
        g.state = { bits, holding: null, cleared: 0 };
      },
      down(g, x, y) {
        for (const b of g.state.bits) {
          if (!b.gone && U.dist(x, y, b.x, b.y) < 26) { g.state.holding = b; return; }
        }
      },
      move(g, x, y) {
        const b = g.state.holding;
        if (b) { b.x = x; b.y = y; }
      },
      up(g, x, y) {
        const s = g.state;
        if (!s.holding) return;
        if (x > 300 && y > 80 && y < 230) {
          s.holding.gone = true;
          s.cleared++;
          NS.audio.play('taskStep');
          g.setProgress(s.cleared / s.bits.length);
          if (s.cleared >= s.bits.length) g.finish();
        }
        s.holding = null;
      },
      draw(g, ctx) {
        const s = g.state;
        plate(ctx, 12, 12, g.W - 24, g.H - 24, '#151d2c');
        ctx.fillStyle = '#101827';
        rr(ctx, 40, 50, 230, 200, 12); ctx.fill();
        ctx.strokeStyle = '#39435c'; ctx.lineWidth = 3;
        rr(ctx, 40, 50, 230, 200, 12); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
        for (let i = 1; i < 8; i++) {
          ctx.beginPath(); ctx.moveTo(40 + i * 28, 50); ctx.lineTo(40 + i * 28, 250); ctx.stroke();
        }
        ctx.fillStyle = '#0a0f1a';
