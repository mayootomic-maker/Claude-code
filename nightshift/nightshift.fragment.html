       you can pick a moving player out of the dark by the rhythm alone. */
    const waddle = moving && !ghost ? Math.sin(walk) * 0.13 : 0;
    const bob = ghost
      ? Math.sin(walk * 0.35 + p.x * 0.01) * 3
      : (moving ? Math.abs(Math.sin(walk)) * -2.2 : 0);
    ctx.translate(0, bob);
    ctx.rotate(waddle);

    if (o.outline) {
      ctx.save();
      ctx.globalAlpha = alpha * 0.6;
      ctx.strokeStyle = o.outline;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(0, -16, 17, 15, 0, 0, Math.PI * 2);
      ctx.moveTo(p.dir * 7 + HEAD_R, HEAD_Y);
      ctx.arc(p.dir * 7, HEAD_Y, HEAD_R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.scale(p.dir < 0 ? -1 : 1, 1);

    if (!ghost) drawFeet(ctx, walk, moving, 0);
    drawTail(ctx, colour, walk, moving);

    if (ghost) {
      /* A tail of scallops instead of a body bottom: the duck is still a duck,
         it just stopped touching the floor. Lit from its own colour rather
         than shaded down -- a ghost drawn with the solid gradient at half
         opacity came out as a brown smudge you could not identify. */
      const gg = ctx.createRadialGradient(-3, -25, 2, 0, -15, 26);
      gg.addColorStop(0, colour.rim);
      gg.addColorStop(0.5, colour.body);
      gg.addColorStop(1, colour.dark);
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.moveTo(-16, -16);
      ctx.quadraticCurveTo(-17, -30, 0, -31);
      ctx.quadraticCurveTo(16, -30, 16, -14);
      ctx.lineTo(16, -3);
      for (let i = 0; i < 3; i++) {
        const x0 = 16 - (i * 32) / 3;
        ctx.quadraticCurveTo(x0 - 32 / 6, 4 + Math.sin(walk * 0.5 + i) * 2.6, x0 - 32 / 3, -3);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = bodyGradient(ctx, colour);
      ctx.beginPath();
      ctx.ellipse(0, -15.5, 16.5, 14.5, -0.06, 0, Math.PI * 2);
      ctx.fill();
      /* Belly: a lighter crescent low and forward, so the light has a
         direction and the body is not a sphere. */
      ctx.globalAlpha *= 0.5;
      ctx.fillStyle = colour.rim;
      ctx.beginPath();
      ctx.ellipse(4, -10, 10, 6.5, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha /= 0.5;
    }

    drawWing(ctx, colour, walk, moving, !!p.flap);

    /* Head, on a neck short enough to keep the silhouette compact. */
    ctx.fillStyle = colour.dark;
    ctx.beginPath();
    ctx.ellipse(4.5, -24, 8, 7.5, 0.25, 0, Math.PI * 2);
    ctx.fill();

    drawBill(ctx, p.quack || 0);

    const hg = ctx.createRadialGradient(4, HEAD_Y - 5, 1, 7, HEAD_Y, HEAD_R + 3);
    hg.addColorStop(0, ghost ? colour.body : colour.rim);
    hg.addColorStop(0.55, ghost ? colour.body : colour.body);
    hg.addColorStop(1, colour.dark);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(7, HEAD_Y, HEAD_R, 0, Math.PI * 2);
    ctx.fill();

    drawEye(ctx, p.blink || 0, p.look || 0);

    /* A rim light along the top, drawn last over head and body so it ties the
       two shapes into one animal. */
    ctx.globalAlpha *= 0.4;
    ctx.strokeStyle = colour.rim;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(7, HEAD_Y, HEAD_R - 0.8, Math.PI * 1.15, Math.PI * 1.75);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, -15.5, 15.5, 13.5, -0.06, Math.PI * 1.15, Math.PI * 1.72);
    ctx.stroke();
    ctx.globalAlpha /= 0.4;

    ctx.restore();

    if (showSymbols && !ghost) {
      ctx.save();
      ctx.translate(0, -13);
      drawSymbol(ctx, p.shiftIdx >= 0 ? p.shiftIdx : p.colorIdx, 5);
      ctx.restore();
    }

    ctx.save();
    ctx.translate(p.dir * 7, HEAD_Y - HEAD_R + 1);
    drawHat(ctx, p.hatIdx, p.dir < 0 ? -1 : 1);
    ctx.restore();

    if (p.shielded) {
      ctx.strokeStyle = 'rgba(52,224,184,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(1, -19, 22, 22, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  /* A dead duck is on its back with its feet in the air. It is the reading
     everyone already has for a dead cartoon bird, it is legible from across a
     dark room, and it is a great deal easier to have in a classroom than a
     body in a pool of blood. */
  function drawBody(ctx, body) {
    const colour = C.COLORS[body.colorIdx] || C.COLORS[0];
    const dir = body.facing < 0 ? -1 : 1;
    ctx.save();
    ctx.translate(body.x, body.y);

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, 5, 24, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();

    /* Loose feathers where it happened. */
    ctx.fillStyle = colour.dark;
    for (let i = 0; i < 5; i++) {
      const a = i * 1.9;
      ctx.save();
      ctx.translate(Math.cos(a) * (18 + i * 2.5), 4 + Math.sin(a) * 6);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(0, 0, 4.6, 1.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.scale(dir, 1);

    /* Head, thrown back and low, with the bill up. Drawn first so the body
       overlaps the neck. */
    ctx.save();
    ctx.translate(-18, -1);
    ctx.rotate(0.5);
    ctx.fillStyle = BILL;
    ctx.beginPath();
    ctx.moveTo(-4, -4.5);
    ctx.quadraticCurveTo(-13, -6.5, -16, -3.5);
    ctx.quadraticCurveTo(-12, -0.5, -4, -1);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = BILL_DARK;
    ctx.beginPath();
    ctx.moveTo(-4, -0.8);
    ctx.quadraticCurveTo(-11, 0.4, -14, -0.6);
    ctx.quadraticCurveTo(-10, 2.2, -4, 2);
    ctx.closePath();
    ctx.fill();
    const hg = ctx.createRadialGradient(-2, -6, 1, 0, -1, 11);
    hg.addColorStop(0, colour.rim);
    hg.addColorStop(1, colour.dark);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(0, 0, 8.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#12161f';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    for (const ox of [-2.5, 3]) {
      ctx.beginPath();
      ctx.moveTo(ox - 2.2, -4); ctx.lineTo(ox + 2.2, 0.4);
      ctx.moveTo(ox + 2.2, -4); ctx.lineTo(ox - 2.2, 0.4);
      ctx.stroke();
    }
    ctx.restore();

    /* Belly up: the light side of the duck facing the ceiling. */
    const g = ctx.createRadialGradient(2, -10, 2, 2, -2, 20);
    g.addColorStop(0, colour.rim);
    g.addColorStop(0.55, colour.body);
    g.addColorStop(1, colour.dark);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(2, -2, 16, 11.5, 0, 0, Math.PI * 2);
    ctx.fill();

    /* Feet, straight up. This is the whole read at a distance. */
    ctx.strokeStyle = BILL_DARK;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let i = 0; i < 2; i++) {
      const fx = -2 + i * 9;
      ctx.beginPath();
      ctx.moveTo(fx, -8);
      ctx.lineTo(fx + (i ? 2.5 : -2), -19);
      ctx.stroke();
      ctx.save();
      ctx.translate(fx + (i ? 2.5 : -2), -19);
      ctx.rotate(i ? 0.3 : -0.3);
      ctx.fillStyle = FOOT;
      ctx.beginPath();
      ctx.moveTo(0, 1.5);
      ctx.lineTo(-4.5, -5.5); ctx.lineTo(-1.5, -4); ctx.lineTo(0, -6.5);
      ctx.lineTo(1.5, -4); ctx.lineTo(4.5, -5.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    /* One wing flopped out to the side. */
    ctx.save();
    ctx.translate(9, 2);
    ctx.rotate(0.9);
    ctx.fillStyle = colour.dark;
    ctx.beginPath();
    ctx.moveTo(5, -6);
    ctx.quadraticCurveTo(10, 0, 2.5, 7.5);
    ctx.quadraticCurveTo(-5, 8, -7.5, 1);
    ctx.quadraticCurveTo(-5, -6, 5, -6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  const AVATAR_TOP = 52;
  const AVATAR_BOTTOM = 8;

  function drawAvatar(ctx, colorIdx, hatIdx, size, opts) {
    const o = opts || {};
    const scale = size / (AVATAR_TOP + AVATAR_BOTTOM);
    ctx.save();
    ctx.translate(0, ((AVATAR_TOP - AVATAR_BOTTOM) / 2) * scale);
    drawPlayer(ctx, {
      x: 0, y: 0, dir: 1, colorIdx, hatIdx, shiftIdx: -1,
      moving: false, walk: 0, ghost: !!o.ghost, alive: !o.ghost,
      blink: 0, quack: o.quack || 0,
    }, { scale, alpha: o.alpha == null ? 1 : o.alpha, outline: o.outline });
    ctx.restore();
  }

  /* Ducks blink, look about and quack. Driven from one place so every duck on
     screen is not doing it in lockstep -- the offset is derived from the id so
     it is stable rather than random every frame. */
  function idle(p, dt, now) {
    if (p.seed === undefined) {
      let h = 0;
      const id = String(p.id || '');
      for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 997;
      p.seed = h / 997;
    }
    const cycle = (now / 1000 + p.seed * 9) % 4.4;
    p.blink = cycle > 4.24 ? 1 : 0;
    p.look = Math.sin(now / 1400 + p.seed * 6) * 0.7;
    if (p.quack > 0) p.quack = Math.max(0, p.quack - dt * 4);
  }

  NS.characters = {
    drawPlayer, drawBody, drawAvatar, drawHat, drawSymbol, setSymbols, idle,
    rr, BODY_W, BODY_H,
  };
})(window.NS);

</script>
<script>
/* Painting Aurora-7, once.

   The map never changes during a round, so it is drawn a single time into an
   offscreen canvas the size of the whole station and blitted from every frame
   after that. Three and a half thousand by two thousand pixels is about thirty
   megabytes: one large allocation at load, against redrawing two and a half
   thousand floor tiles sixty times a second on a phone. Only what actually
   moves -- players, doors, particles, the dark -- is drawn live.

   The room styling is not decoration. Every room has to be recognisable from
   a two-second glimpse at the edge of somebody's light, because that glimpse
   is the entire evidence base of an argument two minutes later. So floors
   differ by wing, each room has one silhouette nothing else has, and the
   labels are set large enough to read at a glance and faint enough to stay
   out of the way. */

(function (NS) {
  'use strict';

  const M = NS.map;
  const T = M.TILE;
  const U = NS.util;
  const rr = NS.characters.rr;

  const HULL = '#1e2941';
  const HULL_EDGE = '#33415c';
  const KEYLINE = '#44546f';

  /* Wings you can tell apart at a glance, which is the whole job: the floor
     under somebody's light is the evidence they are going to give in two
     minutes. The old palette was five shades of the same desaturated navy, and
     under the lamp they all resolved to the same grey -- so every room looked
     like every other room and the map stopped being worth remembering. These
     are still dark enough that an unlit corridor gives nothing away; they just
     have somewhere to go when a light lands on them. */
  const TONES = {
    clean: { floor: '#24384a', accent: '#3ff0d4' },
    plain: { floor: '#262f42', accent: '#9aa6bd' },
    cold:  { floor: '#1e3050', accent: '#5cb2ea' },
    hot:   { floor: '#3a2a2f', accent: '#ffb03a' },
    hall:  { floor: '#1a2334', accent: '#8d97ad' },
  };

  let canvas = null;
  let ctx = null;
  let built = false;

  const px = (t) => t * T;

  /* ---- small parts, reused by the rooms ---------------------------------- */

  function panel(x, y, w, h, fill) {
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    rr(ctx, x - 2, y + 5, w + 4, h, 5); ctx.fill();
    ctx.fillStyle = fill || '#2c3648';
    rr(ctx, x, y, w, h, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    rr(ctx, x + 2, y + 2, w - 4, 4, 2); ctx.fill();
  }

  function screen(x, y, w, h, accent, style) {
    panel(x, y, w, h);
    ctx.fillStyle = '#0d1320';
    rr(ctx, x + 4, y + 4, w - 8, h - 12, 3); ctx.fill();
    ctx.save();
    rr(ctx, x + 4, y + 4, w - 8, h - 12, 3); ctx.clip();
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.8;
    if (style === 'bars') {
      const n = Math.max(3, Math.floor((w - 12) / 11));
      for (let i = 0; i < n; i++) {
        const bh = (h - 20) * (0.25 + ((i * 47) % 13) / 17);
        ctx.fillRect(x + 8 + i * ((w - 16) / n), y + h - 12 - bh, (w - 16) / n - 3, bh);
      }
    } else if (style === 'wave') {
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = accent; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= w - 12; i += 3) {
        const yy = y + (h - 12) / 2 + Math.sin(i * 0.14) * (h - 22) * 0.3;
        if (i === 0) ctx.moveTo(x + 6 + i, yy); else ctx.lineTo(x + 6 + i, yy);
      }
      ctx.stroke();
    } else {
      for (let i = 0; i < 4; i++) {
        const lw = (w - 16) * [0.9, 0.55, 0.75, 0.4][i];
        if (y + 9 + i * 7 > y + h - 14) break;
        ctx.fillRect(x + 8, y + 9 + i * 7, lw, 2.6);
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.1;
    rr(ctx, x + 4, y + 4, w - 8, h - 12, 3); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function crate(x, y, size, tint) {
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    rr(ctx, x - 2, y + 5, size + 4, size, 3); ctx.fill();
    ctx.fillStyle = tint || '#3a4560';
    rr(ctx, x, y, size, size, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.32)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 5, y + size / 2); ctx.lineTo(x + size - 5, y + size / 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(x + 4, y + 4, size - 8, 3);
  }

  function pipe(x, y, len, vertical, tint) {
    ctx.strokeStyle = tint || '#39435c';
    ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(vertical ? x : x + len, vertical ? y + len : y);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(vertical ? x - 2.6 : x, vertical ? y : y - 2.6);
    ctx.lineTo(vertical ? x - 2.6 : x + len, vertical ? y + len : y - 2.6);
    ctx.stroke();
    ctx.fillStyle = '#4a5570';
    const steps = Math.max(1, Math.floor(len / 70));
    for (let i = 1; i <= steps; i++) {
      const cx = vertical ? x : x + (len / (steps + 1)) * i;
      const cy = vertical ? y + (len / (steps + 1)) * i : y;
      rr(ctx, cx - 7.5, cy - 5.5, 15, 11, 2); ctx.fill();
    }
  }

  /* A window onto the outside. The only warm thing in the game is a planet
     nobody on board is going to reach. */
  function viewport(x, y, w, h, rand) {
    ctx.fillStyle = '#05070d';
    rr(ctx, x, y, w, h, 6); ctx.fill();
    ctx.save();
    rr(ctx, x, y, w, h, 6); ctx.clip();
    for (let i = 0; i < w * h / 900; i++) {
      const sx = x + rand() * w, sy = y + rand() * h, r = rand();
      ctx.fillStyle = r > 0.9 ? 'rgba(230,240,255,0.9)' : 'rgba(160,185,220,0.45)';
      ctx.fillRect(sx, sy, r > 0.9 ? 2 : 1.3, r > 0.9 ? 2 : 1.3);
    }
    const g = ctx.createRadialGradient(x + w * 0.78, y + h * 1.25, 8, x + w * 0.78, y + h * 1.25, h * 1.5);
    g.addColorStop(0, 'rgba(255,176,58,0.5)');
    g.addColorStop(0.45, 'rgba(190,90,60,0.28)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x + w * 0.78, y + h * 1.25, h * 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#3a4761'; ctx.lineWidth = 5;
    rr(ctx, x, y, w, h, 6); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1.5;
    rr(ctx, x + 3, y + 3, w - 6, h - 6, 4); ctx.stroke();
  }

  function hazardStripe(x, y, w, h) {
    ctx.save();
    rr(ctx, x, y, w, h, 2); ctx.clip();
    ctx.fillStyle = '#3a3320';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,176,58,0.55)';
    for (let i = -h; i < w; i += 22) {
      ctx.beginPath();
      ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y);
      ctx.lineTo(x + i + h + 11, y); ctx.lineTo(x + i + 11, y + h);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function floorGlyph(cx, cy, r, accent, alpha) {
    ctx.strokeStyle = accent;
    ctx.globalAlpha = alpha == null ? 0.16 : alpha;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.62, 0.4, Math.PI * 1.4); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* ---- the rooms --------------------------------------------------------- */

  /* Each takes the room's pixel rectangle. Everything is positioned from the
     room's own edges so a layout tweak in world/map.js does not leave the
     furniture behind in empty space. */
  const ROOM_ART = {
    reactor(r, rand) {
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      const g = ctx.createRadialGradient(cx, cy, 6, cx, cy, 118);
      g.addColorStop(0, 'rgba(255,176,58,0.5)');
      g.addColorStop(0.5, 'rgba(255,110,50,0.16)');
      g.addColorStop(1, 'rgba(255,110,50,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - 130, cy - 130, 260, 260);
      ctx.fillStyle = '#2c3648';
      ctx.beginPath(); ctx.arc(cx, cy, 62, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a2130';
      ctx.beginPath(); ctx.arc(cx, cy, 52, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffb03a';
      ctx.beginPath(); ctx.arc(cx, cy, 34, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe0a8';
      ctx.beginPath(); ctx.arc(cx, cy, 19, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#3a4761'; ctx.lineWidth = 7;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + 0.4;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * 60, cy + Math.sin(a) * 60);
        ctx.lineTo(cx + Math.cos(a) * 92, cy + Math.sin(a) * 92);
        ctx.stroke();
      }
      pipe(r.x + 22, r.y + 28, r.h - 56, true);
      pipe(r.x + r.w - 22, r.y + 28, r.h - 56, true);
      hazardStripe(r.x + 12, r.y + r.h - 26, r.w - 24, 14);
    },

    upperEngine(r) { engine(r, 1); },
    lowerEngine(r) { engine(r, -1); },

    security(r) {
      const wallY = r.y + 22;
      for (let i = 0; i < 6; i++) {
        screen(r.x + 24 + i * 44, wallY, 38, 34, '#4d9fd6', i % 2 ? 'bars' : 'wave');
      }
      panel(r.x + 24, wallY + 48, 232, 22);
      ctx.fillStyle = '#39435c';
      rr(ctx, r.x + 120, wallY + 78, 44, 40, 8); ctx.fill();
    },

    medbay(r) {
      for (let i = 0; i < 3; i++) {
        const bx = r.x + 26 + i * 74, by = r.y + 32;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        rr(ctx, bx - 2, by + 5, 54, 92, 8); ctx.fill();
        ctx.fillStyle = '#e2e8f2';
        rr(ctx, bx, by, 52, 90, 8); ctx.fill();
        ctx.fillStyle = '#9fb2cc';
        rr(ctx, bx + 6, by + 8, 40, 26, 5); ctx.fill();
        ctx.fillStyle = '#4d9fd6';
        rr(ctx, bx + 6, by + 42, 40, 40, 4); ctx.fill();
      }
      const sx = r.x + r.w / 2 + 40, sy = r.y + r.h - 62;
      floorGlyph(sx, sy, 34, '#37e0c8', 0.3);
      ctx.fillStyle = 'rgba(55,224,200,0.1)';
      ctx.beginPath(); ctx.arc(sx, sy, 30, 0, Math.PI * 2); ctx.fill();
    },

    electrical(r) {
      for (let i = 0; i < 5; i++) {
        screen(r.x + r.w - 56, r.y + 26 + i * 44, 44, 34, '#ffb03a', 'bars');
      }
      ctx.strokeStyle = '#c0523f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        ctx.strokeStyle = ['#c0523f', '#f0a63c', '#4ca85c', '#3d6fe0'][i];
        ctx.beginPath();
        ctx.moveTo(r.x + 20, r.y + 40 + i * 16);
        ctx.bezierCurveTo(r.x + 90, r.y + 20 + i * 30, r.x + 130, r.y + 120, r.x + 76, r.y + r.h - 34);
        ctx.stroke();
      }
      ctx.fillStyle = '#141b2a';
      rr(ctx, r.x + 18, r.y + r.h - 74, 90, 56, 4); ctx.fill();
      ctx.strokeStyle = '#39435c'; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.moveTo(r.x + 22 + i * 15, r.y + r.h - 70); ctx.lineTo(r.x + 22 + i * 15, r.y + r.h - 22);
        ctx.stroke();
      }
      hazardStripe(r.x + 12, r.y + 14, r.w - 24, 12);
    },

    cafeteria(r, rand) {
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      /* The table everyone spawns around, with the button on it. */
      ctx.fillStyle = 'rgba(0,0,0,0.34)';
      ctx.beginPath(); ctx.ellipse(cx, cy + 10, 96, 62, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#37455f';
      ctx.beginPath(); ctx.ellipse(cx, cy, 94, 58, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2b3648';
      ctx.beginPath(); ctx.ellipse(cx, cy - 4, 82, 48, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1c2434';
      ctx.beginPath(); ctx.ellipse(cx, cy - 4, 40, 24, 0, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
        const tx = cx + Math.cos(a) * 200, ty = cy + Math.sin(a) * 128;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.ellipse(tx, ty + 7, 44, 30, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#33405a';
        ctx.beginPath(); ctx.ellipse(tx, ty, 42, 27, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3d4c6b';
        ctx.beginPath(); ctx.ellipse(tx, ty - 3, 34, 21, 0, 0, Math.PI * 2); ctx.fill();
      }
      viewport(r.x + 22, r.y + 16, 128, 58, rand);
      panel(r.x + r.w - 132, r.y + r.h - 58, 108, 40);
    },

    storage(r) {
      const tints = ['#3a4560', '#44507a', '#3f4a5f'];
      for (let i = 0; i < 5; i++) crate(r.x + 26 + (i % 3) * 52, r.y + 34 + Math.floor(i / 3) * 52, 44, tints[i % 3]);
      for (let i = 0; i < 3; i++) crate(r.x + r.w - 82, r.y + 130 + i * 46, 40, tints[(i + 1) % 3]);
      /* Fuel cans, which is where the long task starts. */
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = '#c0523f';
        rr(ctx, r.x + r.w - 76 + i * 22, r.y + 42, 17, 26, 3); ctx.fill();
        ctx.fillStyle = '#8e3a2c';
        rr(ctx, r.x + r.w - 73 + i * 22, r.y + 36, 11, 8, 2); ctx.fill();
      }
      hazardStripe(r.x + 16, r.y + r.h - 40, r.w - 32, 13);
    },

    admin(r) {
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2 + 6;
      ctx.fillStyle = 'rgba(0,0,0,0.32)';
      rr(ctx, cx - 88, cy - 40, 176, 84, 10); ctx.fill();
      ctx.fillStyle = '#33405a';
      rr(ctx, cx - 90, cy - 46, 180, 84, 10); ctx.fill();
      ctx.fillStyle = '#0f1626';
      rr(ctx, cx - 80, cy - 38, 160, 68, 6); ctx.fill();
      /* The station's own floor plan, drawn from the real map. */
      ctx.save();
      rr(ctx, cx - 80, cy - 38, 160, 68, 6); ctx.clip();
      const sx = 150 / M.pixelWidth, sy = 60 / M.pixelHeight;
      ctx.fillStyle = 'rgba(55,224,200,0.5)';
      for (const room of M.ROOMS) {
        ctx.fillRect(cx - 75 + room.x * T * sx, cy - 33 + room.y * T * sy,
                     Math.max(2, room.w * T * sx), Math.max(2, room.h * T * sy));
      }
      ctx.restore();
      screen(r.x + 18, r.y + 22, 46, 36, '#4d9fd6');
    },

    weapons(r, rand) {
      viewport(r.x + 30, r.y + 18, r.w - 60, 62, rand);
      const cx = r.x + r.w / 2, cy = r.y + r.h - 62;
      ctx.fillStyle = '#33405a';
      rr(ctx, cx - 46, cy - 26, 92, 56, 10); ctx.fill();
      ctx.fillStyle = '#1c2434';
      rr(ctx, cx - 34, cy - 18, 68, 34, 6); ctx.fill();
      ctx.fillStyle = '#ff3f5b';
      ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,63,91,0.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI * 2); ctx.stroke();
    },

    o2(r) {
      for (let i = 0; i < 2; i++) {
        const tx = r.x + 32 + i * 64, ty = r.y + 30;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        rr(ctx, tx - 2, ty + 6, 44, 104, 20); ctx.fill();
        ctx.fillStyle = '#2c3648';
        rr(ctx, tx, ty, 42, 102, 20); ctx.fill();
        ctx.fillStyle = 'rgba(55,224,200,0.22)';
        rr(ctx, tx + 7, ty + 12, 28, 80, 14); ctx.fill();
        ctx.fillStyle = '#4ca85c';
        for (let k = 0; k < 5; k++) {
          ctx.beginPath();
          ctx.ellipse(tx + 21 + (k - 2) * 6, ty + 66 - Math.abs(k - 2) * 9, 4.5, 13, (k - 2) * 0.35, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      pipe(r.x + 18, r.y + r.h - 30, r.w - 36, false);
    },

    navigation(r, rand) {
      viewport(r.x + 22, r.y + 20, r.w - 44, 84, rand);
      screen(r.x + 24, r.y + r.h - 74, 74, 46, '#4d9fd6', 'wave');
      screen(r.x + r.w - 98, r.y + r.h - 74, 74, 46, '#37e0c8', 'bars');
      ctx.fillStyle = '#33405a';
      rr(ctx, r.x + r.w / 2 - 26, r.y + r.h - 66, 52, 30, 6); ctx.fill();
    },

    shields(r) {
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2 + 4;
      for (let ring = 0; ring < 7; ring++) {
        const a = (ring / 7) * Math.PI * 2;
        const hx = ring === 6 ? cx : cx + Math.cos(a) * 62;
        const hy = ring === 6 ? cy : cy + Math.sin(a) * 46;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const ha = (i / 6) * Math.PI * 2 + Math.PI / 6;
          const vx = hx + Math.cos(ha) * 26, vy = hy + Math.sin(ha) * 26;
          if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(77,159,214,0.13)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(77,159,214,0.42)';
        ctx.lineWidth = 2.4;
        ctx.stroke();
      }
      panel(r.x + 20, r.y + r.h - 50, 78, 32);
    },

    comms(r) {
      for (let i = 0; i < 4; i++) {
        const bx = r.x + 24 + i * 40;
        panel(bx, r.y + 26, 32, 96);
        ctx.fillStyle = '#37e0c8';
        ctx.globalAlpha = 0.55;
        for (let k = 0; k < 6; k++) ctx.fillRect(bx + 6, r.y + 34 + k * 14, 20 * (0.4 + ((i + k) % 3) / 3), 3);
        ctx.globalAlpha = 1;
      }
      const dx = r.x + r.w - 74, dy = r.y + 54;
      ctx.strokeStyle = '#8d97ad'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(dx, dy, 30, Math.PI * 0.75, Math.PI * 2.25); ctx.stroke();
      ctx.fillStyle = 'rgba(141,151,173,0.16)';
      ctx.beginPath(); ctx.arc(dx, dy, 30, Math.PI * 0.75, Math.PI * 2.25); ctx.fill();
      ctx.strokeStyle = '#8d97ad'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(dx + 4, dy + 34); ctx.stroke();
    },
  };

  function engine(r, facing) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    rr(ctx, r.x + 24, cy - 52 + 6, r.w - 48, 104, 26); ctx.fill();
    ctx.fillStyle = '#2c3648';
    rr(ctx, r.x + 24, cy - 52, r.w - 48, 104, 26); ctx.fill();
    ctx.fillStyle = '#212a3c';
    rr(ctx, r.x + 40, cy - 36, r.w - 80, 72, 18); ctx.fill();
    const g = ctx.createLinearGradient(r.x + 40, 0, r.x + r.w - 40, 0);
    g.addColorStop(0, 'rgba(255,176,58,0.05)');
    g.addColorStop(0.5, 'rgba(255,176,58,0.42)');
    g.addColorStop(1, 'rgba(255,176,58,0.05)');
    ctx.fillStyle = g;
    rr(ctx, r.x + 48, cy - 18, r.w - 96, 36, 12); ctx.fill();
    ctx.strokeStyle = '#39435c'; ctx.lineWidth = 5;
    for (let i = 0; i < 4; i++) {
      const lx = r.x + 46 + i * ((r.w - 92) / 3);
      ctx.beginPath(); ctx.moveTo(lx, cy - 50); ctx.lineTo(lx, cy + 50); ctx.stroke();
    }
    pipe(r.x + 18, cy + facing * 62, r.w - 36, false);
    hazardStripe(r.x + 20, cy - facing * 66, r.w - 40, 12);
  }

  /* ---- fixtures ---------------------------------------------------------- */

  function taskConsole(spot, accent) {
    const w = M.toWorld(spot);
    panel(w.x - 21, w.y - 26, 42, 40);
    ctx.fillStyle = '#0d1320';
    rr(ctx, w.x - 16, w.y - 21, 32, 24, 3); ctx.fill();
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.75;
    ctx.fillRect(w.x - 11, w.y - 16, 22, 3);
    ctx.fillRect(w.x - 11, w.y - 10, 14, 3);
    ctx.fillRect(w.x - 11, w.y - 4, 18, 3);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(w.x, w.y + 16, 22, 7, 0, 0, Math.PI * 2); ctx.fill();
  }

  function ventCover(spot) {
    const w = M.toWorld(spot);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    rr(ctx, w.x - 20, w.y - 12, 40, 30, 4); ctx.fill();
    ctx.fillStyle = '#39435c';
    rr(ctx, w.x - 21, w.y - 15, 42, 30, 4); ctx.fill();
    ctx.fillStyle = '#161d2c';
    rr(ctx, w.x - 16, w.y - 11, 32, 22, 3); ctx.fill();
    ctx.strokeStyle = '#4a5570'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(w.x - 12, w.y - 6 + i * 5); ctx.lineTo(w.x + 12, w.y - 6 + i * 5);
      ctx.stroke();
    }
  }

  /* The housing is drawn for everybody. Its light is drawn live, because
     whether somebody is watching changes and the housing does not. */
  function cameraHousing(camera) {
    const w = M.toWorld(camera);
    const look = M.toWorld(camera.look);
    const a = Math.atan2(look.y - w.y, look.x - w.x);
    ctx.save();
    ctx.translate(w.x, w.y);
    ctx.fillStyle = '#39435c';
    rr(ctx, -9, -14, 18, 16, 4); ctx.fill();
    ctx.rotate(a);
    ctx.fillStyle = '#2c3648';
    rr(ctx, -4, -8, 22, 16, 5); ctx.fill();
    ctx.fillStyle = '#0d1320';
    ctx.beginPath(); ctx.arc(15, 0, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(207,217,232,0.35)';
    ctx.beginPath(); ctx.arc(13.6, -1.6, 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function emergencyButton() {
    const w = M.toWorld(M.EMERGENCY);
    ctx.fillStyle = '#2c3648';
    rr(ctx, w.x - 22, w.y - 18, 44, 34, 8); ctx.fill();
    ctx.fillStyle = '#ff3f5b';
    ctx.beginPath(); ctx.arc(w.x, w.y - 4, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(w.x - 4, w.y - 8, 5, 3.4, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,63,91,0.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(w.x, w.y - 4, 19, 0, Math.PI * 2); ctx.stroke();
  }

  function sabotagePad(spot, accent) {
    const w = M.toWorld(spot);
    ctx.fillStyle = 'rgba(255,176,58,0.1)';
    rr(ctx, w.x - 26, w.y - 18, 52, 36, 6); ctx.fill();
    ctx.strokeStyle = accent; ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.55;
    rr(ctx, w.x - 26, w.y - 18, 52, 36, 6); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.ellipse(w.x, w.y, 12, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* ---- labels ------------------------------------------------------------ */

  /* Letter spacing by hand: ctx.letterSpacing is too new to rely on, and
     these labels are wide-tracked on purpose -- it is what makes them read as
     signage painted on the floor rather than as a caption. */
  function tracked(text, cx, cy, size, spacing, colour, alpha) {
    ctx.font = '800 ' + size + 'px Archivo, "Archivo Black", system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    const widths = [];
    let total = 0;
    for (const ch of text) {
      const w = ctx.measureText(ch).width;
      widths.push(w);
      total += w + spacing;
    }
    total -= spacing;
    let x = cx - total / 2;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = colour;
    let i = 0;
    for (const ch of text) {
      ctx.fillText(ch, x, cy);
      x += widths[i++] + spacing;
    }
    ctx.globalAlpha = 1;
  }

  /* ---- build ------------------------------------------------------------- */

  /* The full-size station is about thirty megabytes of canvas. Most devices
     take it without noticing; a five-year-old phone in a classroom may not,
     and the failure mode is a blank canvas rather than an exception, so it is
     checked rather than trusted. Half scale is a little softer and works
     everywhere -- a slightly soft station beats a black one. */
  let scale = 1;

  function allocate(factor) {
    const c = document.createElement('canvas');
    c.width = Math.round(M.pixelWidth * factor);
    c.height = Math.round(M.pixelHeight * factor);
    const g = c.getContext('2d');
    if (!g || c.width !== Math.round(M.pixelWidth * factor)) return null;
    /* A canvas the device refused comes back sized but unpaintable, so it is
       painted and read back once before anything is built on it. */
    g.fillStyle = '#ff0000';
    g.fillRect(0, 0, 2, 2);
    try {
      const probe = g.getImageData(0, 0, 1, 1).data;
      if (probe[0] < 200) return null;
    } catch (e) {
      return null;                 // tainted or unavailable; treat as refused
    }
    g.clearRect(0, 0, 2, 2);
    return { c, g };
  }

  function build(forceFactor) {
    if (built) return canvas;
    let made = null;
    const factors = forceFactor ? [forceFactor] : [1, 0.6, 0.4];
    for (const factor of factors) {
      try { made = allocate(factor); } catch (e) { made = null; }
      if (made) { scale = factor; break; }
    }
    if (!made) { built = true; canvas = null; return null; }
    canvas = made.c;
    ctx = made.g;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    const rand = U.mulberry32(0x4a1b7);

    ctx.fillStyle = '#05070d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    /* Stars first, so the hull covers the ones that would show through. */
    for (let i = 0; i < 1700; i++) {
      const x = rand() * canvas.width, y = rand() * canvas.height, v = rand();
      ctx.fillStyle = v > 0.94 ? 'rgba(215,228,245,0.85)'
        : v > 0.72 ? 'rgba(150,172,205,0.45)' : 'rgba(110,130,168,0.28)';
      const s = v > 0.94 ? 2 : 1.2;
      ctx.fillRect(x, y, s, s);
    }

    /* Hull: one solid tile around everything walkable. */
    ctx.fillStyle = HULL;
    for (let ty = 0; ty < M.H; ty++) {
      for (let tx = 0; tx < M.W; tx++) {
        if (M.FLOOR[M.at(tx, ty)]) continue;
        let touches = false;
        for (let dy = -1; dy <= 1 && !touches; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if ((!dx && !dy) || tx + dx < 0 || ty + dy < 0 || tx + dx >= M.W || ty + dy >= M.H) continue;
            if (M.FLOOR[M.at(tx + dx, ty + dy)]) { touches = true; break; }
          }
        }
        if (touches) ctx.fillRect(px(tx), px(ty), T, T);
      }
    }

    /* Floors, as plate rather than as paint.

       A flat fill with a one-pixel grid on it is invisible in the dark and,
       the moment a light lands on it, a sheet of grey -- which is what made
       every room look like the same room. Deck plating instead: bolted panels
       four tiles across with a lit top edge and a shadowed bottom one, so the
       floor has a direction and the light has something to catch. All of it is
       baked once into the offscreen station, so the cost is at load and the
       frame loop never sees it. */
    const PLATE = 4;
    for (let ty = 0; ty < M.H; ty++) {
      for (let tx = 0; tx < M.W; tx++) {
        if (!M.FLOOR[M.at(tx, ty)]) continue;
        const room = M.roomAt(px(tx) + T / 2, px(ty) + T / 2);
        const tone = room ? TONES[room.tone] : TONES.hall;
        ctx.fillStyle = tone.floor;
        ctx.fillRect(px(tx), px(ty), T, T);
        /* One shade per plate, not per tile: the variation should read as
           panels that were laid at different times, not as noise. */
        const plate = ((Math.floor(tx / PLATE) * 73856093) ^ (Math.floor(ty / PLATE) * 19349663)) >>> 0;
        const v = (plate % 1000) / 1000;
        if (v > 0.72) { ctx.fillStyle = 'rgba(255,255,255,0.028)'; ctx.fillRect(px(tx), px(ty), T, T); }
        else if (v < 0.24) { ctx.fillStyle = 'rgba(0,0,0,0.13)'; ctx.fillRect(px(tx), px(ty), T, T); }
      }
    }

    /* Plate seams: a dark groove with a lit lip under it. */
    for (let ty = 0; ty < M.H; ty++) {
      for (let tx = 0; tx < M.W; tx++) {
        if (!M.FLOOR[M.at(tx, ty)]) continue;
        const x = px(tx), y = px(ty);
        if (tx % PLATE === 0 && M.FLOOR[M.at(tx - 1, ty)]) {
          ctx.fillStyle = 'rgba(0,0,0,0.30)'; ctx.fillRect(x - 1, y, 2, T);
          ctx.fillStyle = 'rgba(255,255,255,0.055)'; ctx.fillRect(x + 1, y, 1, T);
        }
        if (ty % PLATE === 0 && M.FLOOR[M.at(tx, ty - 1)]) {
          ctx.fillStyle = 'rgba(0,0,0,0.30)'; ctx.fillRect(x, y - 1, T, 2);
          ctx.fillStyle = 'rgba(255,255,255,0.075)'; ctx.fillRect(x, y + 1, T, 1);
        }
        /* A bolt at the plate corners. Four pixels of it, which is nothing
           until a light crosses them. */
        if (tx % PLATE === 0 && ty % PLATE === 0
            && M.FLOOR[M.at(tx - 1, ty)] && M.FLOOR[M.at(tx, ty - 1)]) {
          ctx.fillStyle = 'rgba(255,255,255,0.09)';
          ctx.fillRect(x + 2, y + 2, 2, 2);
          ctx.fillStyle = 'rgba(0,0,0,0.28)';
          ctx.fillRect(x + 2, y + 4, 2, 1);
        }
      }
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.022)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let ty = 0; ty < M.H; ty++) {
      for (let tx = 0; tx < M.W; tx++) {
        if (!M.FLOOR[M.at(tx, ty)]) continue;
        if (M.FLOOR[M.at(tx + 1, ty)]) { ctx.moveTo(px(tx + 1) + 0.5, px(ty)); ctx.lineTo(px(tx + 1) + 0.5, px(ty + 1)); }
        if (M.FLOOR[M.at(tx, ty + 1)]) { ctx.moveTo(px(tx), px(ty + 1) + 0.5); ctx.lineTo(px(tx + 1), px(ty + 1) + 0.5); }
      }
    }
    ctx.stroke();

    /* Strip lights in the ceiling, baked onto the floor beneath them. The
       player's own lamp is the only light that moves, but a station where
       nothing else is lit at all reads as a cave rather than as a building --
       and these are what the three per cent of station that bleeds through the
       dark actually shows you, which is how a room stays recognisable at the
       edge of your circle. */
    for (const room of M.ROOMS) {
      const tone = TONES[room.tone] || TONES.plain;
      const cols = Math.max(1, Math.round(room.w / 7));
      const rows = Math.max(1, Math.round(room.h / 7));
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          const cx = px(room.x + (room.w * (i + 0.5)) / cols);
          const cy = px(room.y + (room.h * (j + 0.5)) / rows);
          const r = px(3.1);
          const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
          g.addColorStop(0, 'rgba(255,246,224,0.075)');
          g.addColorStop(0.45, 'rgba(210,226,255,0.032)');
          g.addColorStop(1, 'rgba(160,190,255,0)');
          ctx.fillStyle = g;
          ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
          ctx.fillStyle = tone.accent;
          ctx.globalAlpha = 0.16;
          rr(ctx, cx - 17, cy - 2.5, 34, 5, 2.5); ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }

    /* Room labels sit under the furniture so a console never has type on it. */
    for (const room of ROOMS_WITH_LABELS()) {
      tracked(room.name.toUpperCase(), room.cx, room.cy, room.w > 12 ? 26 : 19,
              room.w > 12 ? 9 : 6, TONES[room.tone].accent, 0.075);
    }

    for (const room of M.ROOMS) {
      const art = ROOM_ART[room.id];
      if (!art) continue;
      ctx.save();
      art({ x: px(room.x), y: px(room.y), w: px(room.w), h: px(room.h) }, rand);
      ctx.restore();
    }

    /* Wall faces last, over the furniture, so nothing bleeds into a corridor. */
    for (let ty = 0; ty < M.H; ty++) {
      for (let tx = 0; tx < M.W; tx++) {
        if (!M.FLOOR[M.at(tx, ty)]) continue;
        const x = px(tx), y = px(ty);
        if (!M.FLOOR[M.at(tx, ty - 1)]) {
          const g = ctx.createLinearGradient(0, y, 0, y + 14);
          g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(x, y, T, 14);
          ctx.fillStyle = KEYLINE; ctx.fillRect(x, y - 3, T, 4);
        }
        if (!M.FLOOR[M.at(tx, ty + 1)]) {
          const g = ctx.createLinearGradient(0, y + T, 0, y + T - 11);
          g.addColorStop(0, 'rgba(0,0,0,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(x, y + T - 11, T, 11);
          ctx.fillStyle = '#121a28'; ctx.fillRect(x, y + T - 1, T, 4);
        }
        if (!M.FLOOR[M.at(tx - 1, ty)]) {
          const g = ctx.createLinearGradient(x, 0, x + 12, 0);
          g.addColorStop(0, 'rgba(0,0,0,0.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(x, y, 12, T);
          ctx.fillStyle = HULL_EDGE; ctx.fillRect(x - 3, y, 4, T);
        }
        if (!M.FLOOR[M.at(tx + 1, ty)]) {
          const g = ctx.createLinearGradient(x + T, 0, x + T - 12, 0);
          g.addColorStop(0, 'rgba(0,0,0,0.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(x + T - 12, y, 12, T);
          ctx.fillStyle = HULL_EDGE; ctx.fillRect(x + T - 1, y, 4, T);
        }
      }
    }

    for (const station of M.STATIONS) {
      const spots = station.steps || [station];
      for (const spot of spots) taskConsole(spot, TONES[M.roomById[spot.room].tone].accent);
    }
    for (const group of M.VENT_GROUPS) for (const v of group) ventCover(v);
    for (const key in M.SABOTAGE_SPOTS) {
      sabotagePad(M.SABOTAGE_SPOTS[key], key.indexOf('reactor') === 0 ? '#ffb03a' : '#37e0c8');
    }
    emergencyButton();
    for (const camera of M.CAMERAS) cameraHousing(camera);
    for (const console of M.CONSOLES) taskConsole(console, TONES[M.roomById[console.room].tone].accent);

    built = true;
    return canvas;
  }

  function ROOMS_WITH_LABELS() { return M.ROOMS; }

  NS.station = {
    build,
    rebuild(factor) { built = false; canvas = null; scale = 1; return build(factor); },
    get canvas() { return canvas; },
    /* World units per canvas pixel, so anything blitting from it can map a
       world rectangle onto the right source rectangle. */
    get scale() { return scale; },
    TONES,
  };
})(window.NS);

</script>
<script>
/* Dust, sparks, splashes and the words that float up off a finished task.

   One flat pool, no allocation once it is warm, and everything is drawn with
   the same four fields. Effects are the cheapest way to make an action feel
   like it landed -- a vent that puffs is a vent you believe somebody went
   into -- so the budget goes on having them at all rather than on making any
   one of them elaborate. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const MAX = 320;
  const pool = [];
  for (let i = 0; i < MAX; i++) {
    pool.push({ live: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 3, colour: '#fff', kind: 'dot', spin: 0 });
  }
  let cursor = 0;
  const floaters = [];

  function take() {
    for (let i = 0; i < MAX; i++) {
      cursor = (cursor + 1) % MAX;
      if (!pool[cursor].live) return pool[cursor];
    }
    return pool[cursor];
  }

  function spawn(o) {
    const p = take();
    p.live = true;
    p.x = o.x; p.y = o.y;
    p.vx = o.vx || 0; p.vy = o.vy || 0;
    p.max = p.life = o.life || 0.6;
    p.size = o.size || 3;
    p.colour = o.colour || '#cfd9e8';
    p.kind = o.kind || 'dot';
    p.drag = o.drag == null ? 0.9 : o.drag;
    p.gravity = o.gravity || 0;
    p.spin = Math.random() * Math.PI * 2;
    return p;
  }

  const burst = (x, y, n, opts) => {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = (opts.speed || 90) * (0.35 + Math.random() * 0.65);
      spawn({
        x: x + (Math.random() - 0.5) * (opts.spread || 8),
        y: y + (Math.random() - 0.5) * (opts.spread || 8),
        vx: Math.cos(a) * speed, vy: Math.sin(a) * speed * 0.6,
        life: (opts.life || 0.6) * (0.6 + Math.random() * 0.6),
        size: (opts.size || 3) * (0.6 + Math.random() * 0.8),
        colour: opts.colour, kind: opts.kind || 'dot',
        gravity: opts.gravity || 0, drag: opts.drag,
      });
    }
  };

  const FX = {
    vent(x, y) {
      burst(x, y, 14, { colour: '#8d97ad', speed: 130, life: 0.5, size: 5, kind: 'puff' });
      burst(x, y, 6, { colour: '#4a5570', speed: 60, life: 0.75, size: 8, kind: 'puff' });
    },
    kill(x, y) {
      burst(x, y, 18, { colour: '#c0243c', speed: 200, life: 0.65, size: 4, gravity: 260, drag: 0.86 });
      burst(x, y, 8, { colour: '#ff3f5b', speed: 90, life: 0.9, size: 6 });
    },
    shot(x, y) {
      burst(x, y, 12, { colour: '#ffb03a', speed: 240, life: 0.35, size: 3 });
    },
    shield(x, y) {
      burst(x, y, 16, { colour: '#34e0b8', speed: 150, life: 0.7, size: 4 });
    },
    vanish(x, y) {
      burst(x, y, 20, { colour: '#9d8cff', speed: 110, life: 0.8, size: 4, kind: 'puff' });
    },
    task(x, y) {
      burst(x, y - 18, 12, { colour: '#34e0b8', speed: 80, life: 0.8, size: 3, gravity: -60 });
    },
    spark(x, y) {
      burst(x, y, 6, { colour: '#ffb03a', speed: 160, life: 0.4, size: 2.5, gravity: 300 });
    },
    /* Feathers, because it is a duck. They fall slower than debris and drift,
       which is the tell that something soft came apart. */
    feathers(x, y, colorIdx) {
      const colour = (NS.config.COLORS[colorIdx] || NS.config.COLORS[0]);
      burst(x, y - 12, 14, {
        colour: colour.body, speed: 130, life: 1.6, size: 4.5, gravity: 55, drag: 0.9, kind: 'puff',
      });
      burst(x, y - 8, 8, {
        colour: colour.rim, speed: 80, life: 2, size: 3.5, gravity: 35, drag: 0.88, kind: 'puff',
      });
    },
    step(x, y) {
      spawn({ x, y: y + 2, vx: (Math.random() - 0.5) * 18, vy: -6, life: 0.45, size: 4, colour: '#3a4560', kind: 'puff' });
    },
  };

  /* The machine a visual task drives, running where the station is. Its whole
     job is to be witnessed: if you are in the room you can see the shields
     light or the chute blow, and that is the alibi. */
  const visuals = [];
  const VISUAL_ART = {
    asteroids: { colour: '#ffb03a', rings: 3, life: 2.4 },
    shields:   { colour: '#4d9fd6', rings: 5, life: 2.6 },
    filter:    { colour: '#4ca85c', rings: 2, life: 2.4 },
    signal:    { colour: '#37e0c8', rings: 4, life: 2.8 },
    scan:      { colour: '#37e0c8', rings: 3, life: 3.2 },
    chute:     { colour: '#8d97ad', rings: 2, life: 2.4 },
  };

  function visual(kind, x, y) {
    const art = VISUAL_ART[kind] || { colour: '#34e0b8', rings: 3, life: 2.4 };
    visuals.push({ x, y, kind, art, life: art.life, max: art.life });
    if (visuals.length > 6) visuals.shift();
    burst(x, y - 10, 16, { colour: art.colour, speed: 120, life: 1, size: 4, gravity: -30 });
  }

  function drawVisuals(ctx) {
    for (const v of visuals) {
      const t = 1 - v.life / v.max;
      ctx.save();
      ctx.globalAlpha = Math.min(1, v.life * 1.6) * 0.7;
      ctx.strokeStyle = v.art.colour;
      ctx.lineWidth = 3;
      for (let i = 0; i < v.art.rings; i++) {
        const phase = (t * 1.6 + i / v.art.rings) % 1;
        ctx.globalAlpha = Math.min(1, v.life * 1.6) * (1 - phase) * 0.6;
        ctx.beginPath();
        ctx.ellipse(v.x, v.y + 6, 26 + phase * 62, 12 + phase * 28, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = Math.min(1, v.life * 1.6) * 0.32;
      const glow = ctx.createRadialGradient(v.x, v.y, 4, v.x, v.y, 74);
      glow.addColorStop(0, v.art.colour);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(v.x, v.y, 74, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function say(x, y, text, colour) {
    floaters.push({ x, y, text, colour: colour || '#cfd9e8', life: 1.5, max: 1.5 });
    if (floaters.length > 12) floaters.shift();
  }

  function step(dt) {
    for (let i = 0; i < MAX; i++) {
      const p = pool[i];
      if (!p.live) continue;
      p.life -= dt;
      if (p.life <= 0) { p.live = false; continue; }
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const k = Math.pow(p.drag, dt * 60);
      p.vx *= k; p.vy *= k;
    }
    for (let i = visuals.length - 1; i >= 0; i--) {
      visuals[i].life -= dt;
      if (visuals[i].life <= 0) visuals.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt;
      f.y -= dt * 34;
      if (f.life <= 0) floaters.splice(i, 1);
    }
  }

  function draw(ctx) {
    for (let i = 0; i < MAX; i++) {
      const p = pool[i];
      if (!p.live) continue;
      const t = p.life / p.max;
      ctx.globalAlpha = p.kind === 'puff' ? t * 0.55 : t;
      ctx.fillStyle = p.colour;
      if (p.kind === 'puff') {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1.6 - t * 0.7), 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters(ctx) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const f of floaters) {
      const t = f.life / f.max;
      ctx.globalAlpha = Math.min(1, t * 2.2);
      ctx.font = '700 15px Archivo, system-ui, sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(5,7,13,0.85)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.colour;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function clear() {
    for (let i = 0; i < MAX; i++) pool[i].live = false;
    floaters.length = 0;
    visuals.length = 0;
  }

  NS.fx = Object.assign({ spawn, burst, step, draw, drawFloaters, drawVisuals, visual, say, clear }, FX);
})(window.NS);

</script>
<script>
/* The moments the game stops for.

   Three things in a round deserve to interrupt everything: a kill, an
   ejection, and being told who you are. Everywhere else the game should get
   out of the way -- but those three are the beats a table remembers, and
   playing them as a toast in the corner throws them away.

   Each is a short timeline drawn over the finished frame: bars in, a staged
   shot, a hit, bars out. Nothing here reads game state on its own; it is
   handed everything it needs when it starts, so a cinematic can never
   disagree with the round or hold a reference to somebody who has since left.

   All of it is skippable and all of it is short. A dramatic flourish you
   cannot skip is a dramatic flourish you resent by the fourth round. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;

  let calm = false;
  try {
    const q = window.matchMedia('(prefers-reduced-motion: reduce)');
    calm = q.matches;
    if (q.addEventListener) q.addEventListener('change', (e) => { calm = e.matches; });
  } catch (e) { calm = false; }

  let scene = null;

  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const outCubic = (t) => 1 - Math.pow(1 - t, 3);
  const clamp01 = (t) => (t < 0 ? 0 : t > 1 ? 1 : t);
  const span = (t, a, b) => clamp01((t - a) / (b - a));

  function play(kind, data) {
    const spec = SCENES[kind];
    if (!spec) return;
    /* Reduced motion gets the information without the camera work: a still
       frame, held, with the same words on it. */
    scene = {
      kind, spec, t: 0,
      length: calm ? Math.min(spec.length, 1.6) : spec.length,
      calm, data: data || {},
    };
    /* The HUD is DOM and sits above the canvas, so it has to be told to get
       out of the way -- otherwise the task bar and the action buttons float
       over the shot. */
    document.body.classList.add('in-cinema');
    if (spec.enter) spec.enter(scene.data, calm);
  }

  const active = () => !!scene;
  function stop() {
    scene = null;
    document.body.classList.remove('in-cinema');
  }

  function step(dt) {
    if (!scene) return;
    scene.t += dt;
    if (scene.t >= scene.length) {
      const done = scene.spec.done;
      const data = scene.data;
      scene = null;
      document.body.classList.remove('in-cinema');
      if (done) done(data);
    }
  }

  /* Letterbox. The bars are the whole grammar: as soon as they move, everyone
     knows to stop pressing things and watch. */
  function bars(ctx, w, h, amount) {
    const bar = Math.round(h * 0.13 * amount);
    if (bar <= 0) return 0;
    ctx.fillStyle = '#04060b';
    ctx.fillRect(0, 0, w, bar);
    ctx.fillRect(0, h - bar, w, bar);
    /* A hairline on the inside edge. Black bars over a nearly black shot are
       invisible, which wastes the one piece of grammar that tells a room to
       stop pressing buttons and watch. */
    ctx.fillStyle = 'rgba(230,236,246,0.10)';
    ctx.fillRect(0, bar, w, 1);
    ctx.fillRect(0, h - bar - 1, w, 1);
    return bar;
  }

  /* A lit stage rather than a dark room with two ducks in it.

     A cinematic that is only a cut and a caption is a cut and a caption. What
     makes a still of this read as a shot is that the light is doing something:
     a pool under the subjects, a colour on it, and everything at the edge of
     the frame falling away. It is two gradients and it does more for the beat
     than any amount of movement. */
  function stage(ctx, w, h, cx, cy, radius, tint) {
    const pool = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    pool.addColorStop(0, tint.core);
    pool.addColorStop(0.55, tint.mid);
    pool.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = pool;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();

    vignette(ctx, w, h, cx, cy, 0.72);
  }

  function vignette(ctx, w, h, cx, cy, depth) {
    const corner = Math.hypot(w, h) / 2;
    const vig = ctx.createRadialGradient(cx, cy, corner * 0.3, cx, cy, corner);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,' + depth + ')');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);
  }

  /* Radial streaks out of the point of impact. Drawn on the frame rather than
     on the ducks, because the whole shot is what lurches, not the bird. */
  function speedLines(ctx, w, h, cx, cy, amount, colour) {
    if (amount <= 0) return;
    ctx.save();
    ctx.globalAlpha = amount * 0.5;
    ctx.strokeStyle = colour;
    ctx.lineCap = 'round';
    const reach = Math.hypot(w, h) * 0.5;
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * Math.PI * 2 + i * 0.37;
      const from = reach * (0.28 + ((i * 7) % 5) * 0.045);
      const to = from + reach * (0.1 + ((i * 13) % 7) * 0.03) * amount;
      ctx.lineWidth = 1.4 + ((i * 5) % 3);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * from, cy + Math.sin(a) * from);
      ctx.lineTo(cx + Math.cos(a) * to, cy + Math.sin(a) * to);
      ctx.stroke();
    }
    ctx.restore();
  }

  function duck(ctx, colorIdx, hatIdx, scale, opts) {
    NS.characters.drawPlayer(ctx, Object.assign({
      x: 0, y: 0, dir: 1, colorIdx, hatIdx, shiftIdx: -1,
      moving: false, walk: 0, blink: 0, look: 0, quack: 0, ghost: false,
    }, opts || {}), { scale });
  }

  function title(ctx, w, y, text, size, colour, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 ' + size + 'px Archivo, "Archivo Black", system-ui, sans-serif';
    ctx.lineWidth = size * 0.16;
    ctx.strokeStyle = 'rgba(4,6,11,0.85)';
    ctx.strokeText(text, w / 2, y);
    ctx.fillStyle = colour;
    ctx.fillText(text, w / 2, y);
    ctx.restore();
  }

  const SCENES = {

    /* ---- the kill -------------------------------------------------------
       Held on the two of them, close. The lunge is the whole shot: the
       killer crosses the gap in four frames and the victim goes over. */
    kill: {
      length: 2.5,
      enter(data) {
        NS.audio.play('stingerLow');
        NS.audio.play('quackHurt');
      },
      draw(ctx, w, h, s) {
        const t = s.t / s.length;
        const inBars = span(t, 0, 0.1);
        const outBars = 1 - span(t, 0.88, 1);
        const amount = Math.min(inBars, outBars);
        ctx.fillStyle = 'rgba(4,6,11,' + (0.55 + 0.35 * span(t, 0, 0.14)).toFixed(3) + ')';
        ctx.fillRect(0, 0, w, h);

        const cx = w / 2, cy = h / 2 + h * 0.02;
        const scale = Math.min(w, h) / 152 * (s.calm ? 1 : (1 + span(t, 0, 0.5) * 0.22));
        const lunge = s.calm ? 1 : ease(span(t, 0.16, 0.34));
        /* The light goes from cold to arterial across the lunge, so the frame
           has turned by the time the strike lands. */
        const heat = span(t, 0.14, 0.4);
        stage(ctx, w, h, cx, cy + Math.min(w, h) * 0.06, Math.min(w, h) * 0.6, {
          core: 'rgba(' + Math.round(96 + heat * 150) + ',' + Math.round(104 - heat * 62)
            + ',' + Math.round(146 - heat * 70) + ',0.62)',
          mid: 'rgba(' + Math.round(54 + heat * 110) + ',36,' + Math.round(92 - heat * 40) + ',0.24)',
        });
        /* Measured in duck-widths rather than pixels, so the pair are framed
           the same on a phone and a projector -- a fixed pixel gap had them
           overlapping completely on a large screen, where the ducks are drawn
           bigger but the gap was not. */
        const gap = (1.5 - lunge * 0.62) * 34 * scale;

        /* The victim, tipping over once the killer arrives. */
        const fall = ease(span(t, 0.32, 0.62));
        ctx.save();
        ctx.translate(cx + gap * 0.5, cy);
        ctx.rotate(fall * 1.5);
        ctx.translate(0, fall * 16);
        duck(ctx, s.data.victimColour, s.data.victimHat, scale * 0.9, {
          dir: -1, blink: fall > 0.3 ? 1 : 0, quack: fall < 0.3 ? 1 : 0,
        });
        ctx.restore();

        /* The killer, arriving. */
        ctx.save();
        ctx.translate(cx - gap * 0.5, cy);
        const crouch = Math.sin(clamp01(lunge) * Math.PI) * 0.14;
        ctx.rotate(crouch);
        duck(ctx, s.data.killerColour, s.data.killerHat, scale * 0.95, {
          dir: 1, flap: true, walk: s.t * 22, moving: true,
        });
        ctx.restore();

        /* Impact: a hard red wipe, once, with the frame torn around it. */
        const hit = span(t, 0.3, 0.42);
        if (hit > 0 && hit < 1) {
          if (!s.calm) speedLines(ctx, w, h, cx, cy, Math.sin(hit * Math.PI), '#ff8595');
          ctx.save();
          ctx.globalAlpha = Math.sin(hit * Math.PI) * 0.75;
          ctx.fillStyle = '#ff3f5b';
          ctx.fillRect(0, 0, w, h);
          ctx.restore();
        }

        const bar = bars(ctx, w, h, amount);
        const words = span(t, 0.5, 0.62) * (1 - span(t, 0.9, 1));
        if (words > 0 && s.data.line) {
          title(ctx, w, h - bar - h * 0.09, s.data.line, Math.max(20, Math.min(46, w * 0.045)),
            '#ff6b7f', words);
        }
        if (words > 0 && s.data.sub) {
          title(ctx, w, h - bar - h * 0.045, s.data.sub, Math.max(13, Math.min(20, w * 0.02)),
            '#cfd9e8', words * 0.85);
        }
      },
    },

    /* ---- the airlock -----------------------------------------------------
       A long shot of somebody going away from you. The starfield does the
       work: the duck barely moves, everything else does. */
    eject: {
      length: 5.4,
      enter(data) {
        NS.audio.play('airlock');
        if (data.name) NS.bits.announce(data.line || '');
      },
      draw(ctx, w, h, s) {
        const t = s.t / s.length;
        ctx.fillStyle = '#04060b';
        ctx.fillRect(0, 0, w, h);

        /* Stars, streaming past faster than the duck is drifting, which is
           what sells the speed. */
        const drift = s.t * (s.calm ? 20 : 120);
        ctx.fillStyle = '#cfd9e8';
        for (let i = 0; i < 130; i++) {
          const seed = i * 137.5;
          const y = (seed % h);
          const x = ((seed * 3.7 + drift * (0.4 + (i % 5) / 5)) % (w + 80)) - 40;
          const size = i % 9 === 0 ? 2.4 : 1.2;
          ctx.globalAlpha = i % 9 === 0 ? 0.9 : 0.4;
          ctx.fillRect(w - x, y, size, size);
        }
        ctx.globalAlpha = 1;

        const g = ctx.createRadialGradient(w * 0.78, h * 1.1, 10, w * 0.78, h * 1.1, h * 1.1);
        g.addColorStop(0, 'rgba(255,176,58,0.4)');
        g.addColorStop(0.5, 'rgba(190,90,60,0.2)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        if (s.data.name) {
          const cross = span(t, 0.05, 0.78);
          const x = -w * 0.15 + cross * w * 1.3;
          const y = h * 0.44 + Math.sin(s.t * 1.4) * h * 0.05;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(s.calm ? 0.3 : s.t * 1.9);
          duck(ctx, s.data.colorIdx, s.data.hatIdx, Math.min(w, h) / 260, { ghost: false, dir: 1 });
          ctx.restore();
        }

        const bar = bars(ctx, w, h, Math.min(span(t, 0, 0.08), 1 - span(t, 0.92, 1)));
        const words = span(t, 0.3, 0.42);
        title(ctx, w, h * 0.72, s.data.line || '', Math.max(20, Math.min(44, w * 0.042)),
          s.data.impostor ? '#ff6b7f' : '#cfd9e8', words);
        if (s.data.sub) {
          title(ctx, w, h * 0.79, s.data.sub, Math.max(13, Math.min(19, w * 0.019)), '#8d9ab1', words * 0.9);
        }
        void bar;
      },
    },

    /* ---- who you are ----------------------------------------------------- */
    reveal: {
      length: 2.6,
      enter(data) {
        NS.audio.play(data.team === 'impostor' ? 'stingerLow' : 'stingerHigh');
      },
      draw(ctx, w, h, s) {
        const t = s.t / s.length;
        const wash = span(t, 0, 0.12);
        ctx.fillStyle = 'rgba(4,6,11,' + (0.92 * wash).toFixed(3) + ')';
        ctx.fillRect(0, 0, w, h);

        const accent = s.data.team === 'impostor' ? '#ff3f5b'
          : s.data.team === 'jester' ? '#f18fb0' : '#34e0b8';
        const g = ctx.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, Math.max(w, h) * 0.6);
        g.addColorStop(0, accent + '2e');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = wash * (1 - span(t, 0.85, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1;
        vignette(ctx, w, h, w / 2, h * 0.46, 0.6 * wash);

        /* The duck drops in and settles. */
        const drop = s.calm ? 1 : outCubic(span(t, 0.08, 0.42));
        const bounce = Math.sin(span(t, 0.35, 0.6) * Math.PI) * 0.1;
        ctx.save();
        ctx.translate(w / 2, h * 0.44 - (1 - drop) * h * 0.4);
        ctx.scale(1 + bounce, 1 - bounce);
        duck(ctx, s.data.colorIdx, s.data.hatIdx, Math.min(w, h) / 175, {
          dir: 1, quack: span(t, 0.4, 0.55) * (1 - span(t, 0.55, 0.75)),
        });
        ctx.restore();

        const words = span(t, 0.34, 0.5) * (1 - span(t, 0.88, 1));
        title(ctx, w, h * 0.68, (s.data.name || '').toUpperCase(),
          Math.max(30, Math.min(76, w * 0.07)), accent, words);
        if (s.data.sub) {
          title(ctx, w, h * 0.76, s.data.sub, Math.max(13, Math.min(19, w * 0.019)), '#cfd9e8', words * 0.9);
        }
        bars(ctx, w, h, Math.min(span(t, 0, 0.1), 1 - span(t, 0.9, 1)));
      },
    },
  };

  function draw(ctx, w, h, dt) {
    if (!scene) return;
    step(dt);
    if (!scene) return;
    scene.spec.draw(ctx, w, h, scene);
  }

  NS.cinema = { play, draw, active, stop, get calm() { return calm; } };
})(window.NS);

</script>
<script>
/* One frame.

   Order matters more than anything else in this file, because the darkness is
   not an effect painted over a finished picture -- it is what decides who is
   in the picture at all. The station is drawn, then the dark is laid over it,
   and only then are people drawn back in, clipped to what you can actually
   see. Drawing them first and dimming them afterwards would leave a smudge
   where somebody is standing in the next room, and a smudge is enough to win
   an argument you should have lost. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;
  const W = NS.world;

  const BASE_VISION = 215;
  const GROUND = '#05070d';
  /* Not fully opaque: three per cent of the station bleeds through the dark,
     which is enough to keep the walls readable as a memory of the map and far
     too little to make out a person. */
  const DARK_ALPHA = 0.962;
  /* The dark is blue, not black. Cutting a hole in flat black left the lit
     circle looking like a photograph of the floor with a vignette on it --
     technically correct and completely inert. A cold shadow against a warm
     lamp is what makes the same pixels read as a room with a light in it. */
  const DARK_TINT = '6,11,24';

  let canvas = null, ctx = null;
  let dark = null, darkCtx = null;
  let cssW = 0, cssH = 0, dpr = 1;
  let scale = 1;
  const camera = { x: 0, y: 0, shake: 0, flash: 0, flashColour: '#ff3f5b' };

  /* The stylesheet honours prefers-reduced-motion, but a canvas is not styled.
     Screen shake is the one thing in here that can make somebody feel ill, so
     it asks the same question the CSS does. */
  let calm = false;
  try {
    const query = window.matchMedia('(prefers-reduced-motion: reduce)');
    calm = query.matches;
    if (query.addEventListener) query.addEventListener('change', (e) => { calm = e.matches; });
  } catch (e) { calm = false; }

  function attach(node) {
    canvas = node;
    ctx = canvas.getContext('2d');
    dark = document.createElement('canvas');
    darkCtx = dark.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  }

  function resize() {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    cssW = Math.max(1, Math.round(rect.width));
    cssH = Math.max(1, Math.round(rect.height));
    /* Capped at 2: past that the extra pixels are invisible on a phone and
       the fill rate is not. */
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    dark.width = canvas.width;
    dark.height = canvas.height;

    /* How much station fits on screen. Held between 420 and 900 world pixels
       across so a phone is not playing a different game from a laptop: the
       laptop gets a wider view, but the people on it are the same size. */
    const visible = U.clamp(cssW * 0.62, 400, 780);
    scale = cssW / visible;
    const minHeight = 330;
    if (cssH / scale < minHeight) scale = cssH / minHeight;
  }

  function centreOn(x, y, snap) {
    if (snap) { camera.x = x; camera.y = y; return; }
    camera.x = x; camera.y = y;
  }

  function follow(target, dt) {
    if (!target) return;
    const k = Math.min(1, dt * 7);
    camera.x += (target.x - camera.x) * k;
    camera.y += (target.y - camera.y) * k;
  }

  const worldToScreen = (x, y) => ({
    x: (x - camera.x) * scale + cssW / 2,
    y: (y - camera.y) * scale + cssH / 2,
  });

  function visionRadius() {
    const me = W.me;
    if (!me) return BASE_VISION;
    const impostor = W.myRole && C.ROLES[W.myRole].team === 'impostor';
    const setting = impostor ? W.state.settings.impostorVision : W.state.settings.crewVision;
    return BASE_VISION * setting * NS.sabotage.visionScale(impostor);
  }

  function shake(amount) { camera.shake = Math.min(18, camera.shake + amount); }
  function flash(colour, amount) { camera.flash = amount; camera.flashColour = colour; }

  /* ---- pieces ------------------------------------------------------------ */

  /* Vent covers, thrown open for half a second. Without it somebody simply
     stops existing where they were standing, and the one thing a vent has to
     communicate is that this is how they left. */
  const ventFlashes = [];
  function ventOpened(x, y) {
    ventFlashes.push({ x, y, life: 0.55 });
    if (ventFlashes.length > 6) ventFlashes.shift();
  }

  function drawVents(dt) {
    for (let i = ventFlashes.length - 1; i >= 0; i--) {
      const v = ventFlashes[i];
      v.life -= dt;
      if (v.life <= 0) { ventFlashes.splice(i, 1); continue; }
      const t = 1 - v.life / 0.55;
      const lid = Math.sin(Math.min(1, t * 1.6) * Math.PI) * 26;
      ctx.save();
      ctx.translate(v.x, v.y);
      ctx.fillStyle = '#0a0f1a';
      NS.characters.rr(ctx, -16, -11, 32, 22, 3);
      ctx.fill();
      ctx.fillStyle = '#4a5570';
      NS.characters.rr(ctx, -21, -15 - lid, 42, 8, 3);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawDoors(now) {
    const closed = W.state.closedRooms || [];
    if (!closed.length) return;
    const at = W.state.doorAt || {};
    for (const roomId of closed) {
      const doors = M.DOORS[roomId];
      if (!doors) continue;
      /* Slid shut over a quarter of a second rather than appearing: a barrier
         that pops into existence reads as a rendering glitch, and you need to
         see which way it came from to know you have been shut in. */
      const age = at[roomId] ? Math.min(1, (now - at[roomId]) / 260) : 1;
      const slide = 1 - Math.pow(1 - age, 3);
      for (const d of doors) {
        const fullW = d.w * M.TILE, fullH = d.h * M.TILE;
        const horizontal = fullW > fullH;
        const x = d.x * M.TILE + (horizontal ? 0 : (fullW * (1 - slide)) / 2);
        const y = d.y * M.TILE + (horizontal ? (fullH * (1 - slide)) / 2 : 0);
        const w = horizontal ? fullW : fullW * slide;
        const h = horizontal ? fullH * slide : fullH;
        ctx.fillStyle = '#c0523f';
        NS.characters.rr(ctx, x + 1, y + 1, w - 2, h - 2, 4);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        for (let i = 0; i < Math.max(w, h); i += 18) {
          if (w > h) ctx.fillRect(x + i, y, 8, h);
          else ctx.fillRect(x, y + i, w, 8);
        }
        ctx.strokeStyle = '#ffb03a';
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.5 + Math.sin(now * 0.006) * 0.3;
        NS.characters.rr(ctx, x + 1, y + 1, w - 2, h - 2, 4);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  /* A ring under every console you still owe, so a task list is something you
     can follow with your feet rather than something you have to memorise. */
  function drawObjectives(now) {
    if (W.state.phase !== 'play') return;
    if (NS.sabotage.commsDown()) return;
    ctx.save();
    for (const task of W.myTasks) {
      if (task.done) continue;
      const spot = W.taskSpot(task);
      if (!spot) continue;
      const pulse = 0.55 + Math.sin(now * 0.004 + spot.x) * 0.25;
      ctx.strokeStyle = 'rgba(255,176,58,' + pulse.toFixed(3) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(spot.x, spot.y + 14, 26, 11, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,176,58,0.12)';
      ctx.fill();
    }
    const active = W.state.sabotage;
    if (active) {
      for (const spot of NS.sabotage.activeSpots()) {
        if (spot.done) continue;
        ctx.strokeStyle = 'rgba(255,63,91,' + (0.5 + Math.sin(now * 0.008) * 0.3).toFixed(3) + ')';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(spot.x, spot.y + 12, 30, 13, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /* Every camera blinks while anybody is at the console in Security. It is the
     impostor's only warning, and it has to be visible from across a room, so
     it is a hard on/off rather than a fade. */
  function drawCameraLights(now) {
    if (!W.state.cameras) return;
    const on = Math.floor(now / 520) % 2 === 0;
    if (!on) return;
    for (const camera of M.CAMERAS) {
      const w = M.toWorld(camera);
      ctx.fillStyle = '#ff3f5b';
      ctx.beginPath();
      ctx.arc(w.x, w.y - 10, 3.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,63,91,0.3)';
      ctx.beginPath();
      ctx.arc(w.x, w.y - 10, 8.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* The name over somebody's head, at the weight of a caption rather than a
     headline. Heavy black pills in bold white were the loudest thing on the
     screen -- louder than the ducks they belonged to, and with four people in
     a room they stacked into a wall of type. This is smaller, sits on smoked
     glass, and carries the player's colour as a dot and a hairline, so a tag
     half-behind somebody else still tells you whose it is. */
  function nameTag(p, alpha) {
    const label = p.name;
    ctx.font = '600 11.5px Archivo, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const colour = C.COLORS[p.colorIdx] || C.COLORS[0];
    const dot = p.ghost ? '#9d8cff' : colour.body;
    const textW = ctx.measureText(label).width;
    const w = textW + 24;
    const left = p.x - w / 2;
    const y = p.y - NS.characters.BODY_H - 28;

    ctx.globalAlpha = alpha * 0.82;
    ctx.fillStyle = 'rgba(7,11,20,0.66)';
    NS.characters.rr(ctx, left, y - 8.5, w, 17, 8.5);
    ctx.fill();
    ctx.globalAlpha = alpha * 0.4;
    ctx.strokeStyle = dot;
    ctx.lineWidth = 1;
    NS.characters.rr(ctx, left + 0.5, y - 8, w - 1, 16, 8);
    ctx.stroke();

    ctx.globalAlpha = alpha;
    ctx.fillStyle = dot;
    ctx.beginPath();
    ctx.arc(left + 9, y, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = p.ghost ? '#c8bcff' : '#e6ecf6';
    ctx.fillText(label, left + 16, y + 0.5);
    ctx.textAlign = 'center';
    ctx.globalAlpha = 1;
  }

  /* Who is drawn, and how brightly. A body at the very edge of the light
     fades rather than popping, which is the difference between "somebody is
     there" and "somebody appeared". */
  function alphaFor(x, y, radius, meGhost) {
    if (meGhost) return 1;
    const me = W.me;
    if (!me) return 1;
    const d = U.dist(me.x, me.y, x, y);
    if (d > radius) return 0;
    if (!NS.los.clear(me.x, me.y, x, y)) return 0;
    const fade = radius * 0.72;
    return d <= fade ? 1 : 1 - (d - fade) / (radius - fade);
  }

  function drawScene(now, dt) {
    const me = W.me;
    const meGhost = !!(me && me.ghost);
    const radius = visionRadius();
    const station = NS.station.canvas;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, cssW, cssH);

    let shakeX = 0, shakeY = 0;
    if (camera.shake > 0.1 && !calm) {
      shakeX = (Math.random() - 0.5) * camera.shake;
      shakeY = (Math.random() - 0.5) * camera.shake;
    }
    if (camera.shake > 0.1) camera.shake *= Math.pow(0.0016, dt);

    ctx.save();
    ctx.translate(cssW / 2 + shakeX, cssH / 2 + shakeY);
    ctx.scale(scale, scale);
    ctx.translate(-camera.x, -camera.y);

    /* Only the visible slice of the station is blitted. */
    const halfW = cssW / (2 * scale) + 64;
    const halfH = cssH / (2 * scale) + 64;
    const sx = U.clamp(camera.x - halfW, 0, M.pixelWidth);
    const sy = U.clamp(camera.y - halfH, 0, M.pixelHeight);
    const sw = U.clamp(halfW * 2, 1, M.pixelWidth - sx);
    const sh = U.clamp(halfH * 2, 1, M.pixelHeight - sy);
    if (station) {
      const k = NS.station.scale;
      ctx.drawImage(station, sx * k, sy * k, sw * k, sh * k, sx, sy, sw, sh);
    }

    drawObjectives(now);
    drawDoors(now);
    drawCameraLights(now);
    drawVents(dt);
    NS.fx.drawVisuals(ctx);

    /* The lamp. Added rather than merely not-subtracted: the light you carry
       is warm and falls off, so the floor under your feet is bright and
       slightly amber and the far wall is not. Clipped to the same polygon the
       dark uses, so it cannot spill through a wall and quietly light a room
       you are not supposed to be able to see into. Two per cent of a flicker
       on it, which is the difference between a lamp and a stencil. */
    if (!meGhost && me && W.state.phase !== 'lobby') {
      const poly = NS.los.visible(me.x, me.y, radius);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(poly[0], poly[1]);
      for (let i = 1; i < NS.los.RAYS; i++) ctx.lineTo(poly[i * 2], poly[i * 2 + 1]);
      ctx.closePath();
      ctx.clip();
      const flicker = calm ? 1 : 1 + Math.sin(now * 0.0031) * 0.02 + Math.sin(now * 0.0117) * 0.012;
      const warm = ctx.createRadialGradient(me.x, me.y, 4, me.x, me.y, radius * flicker);
      warm.addColorStop(0, 'rgba(255,231,190,0.30)');
      warm.addColorStop(0.24, 'rgba(255,205,143,0.15)');
      warm.addColorStop(0.5, 'rgba(150,175,240,0.05)');
      warm.addColorStop(1, 'rgba(80,120,215,0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = warm;
      ctx.fillRect(me.x - radius, me.y - radius, radius * 2, radius * 2);
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    }

    ctx.restore();

    /* ---- the dark ------------------------------------------------------- */

    if (!meGhost && me && W.state.phase !== 'lobby') {
      darkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      darkCtx.clearRect(0, 0, cssW, cssH);
      darkCtx.fillStyle = 'rgba(' + DARK_TINT + ',' + DARK_ALPHA + ')';
      darkCtx.fillRect(0, 0, cssW, cssH);

      const poly = NS.los.visible(me.x, me.y, radius);
      darkCtx.save();
      darkCtx.translate(cssW / 2 + shakeX, cssH / 2 + shakeY);
      darkCtx.scale(scale, scale);
      darkCtx.translate(-camera.x, -camera.y);
      darkCtx.beginPath();
      darkCtx.moveTo(poly[0], poly[1]);
      for (let i = 1; i < NS.los.RAYS; i++) darkCtx.lineTo(poly[i * 2], poly[i * 2 + 1]);
      darkCtx.closePath();
      darkCtx.clip();
      /* A longer falloff than it used to have. The old one held full
         brightness to seven tenths of the radius and then fell off a cliff,
         which drew a hard disc on the floor and made the light read as a
         cut-out rather than as something you are holding. */
      const g = darkCtx.createRadialGradient(me.x, me.y, radius * 0.12, me.x, me.y, radius);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(0.5, 'rgba(0,0,0,0.985)');
      g.addColorStop(0.78, 'rgba(0,0,0,0.86)');
      g.addColorStop(0.92, 'rgba(0,0,0,0.42)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      darkCtx.globalCompositeOperation = 'destination-out';
      darkCtx.fillStyle = g;
      darkCtx.fillRect(me.x - radius, me.y - radius, radius * 2, radius * 2);
      darkCtx.restore();
      darkCtx.globalCompositeOperation = 'source-over';

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(dark, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    /* ---- people, back on top, clipped to what is lit -------------------- */

    ctx.save();
    ctx.translate(cssW / 2 + shakeX, cssH / 2 + shakeY);
    ctx.scale(scale, scale);
    ctx.translate(-camera.x, -camera.y);

    const drawable = [];
    for (const body of W.bodies) {
      const a = alphaFor(body.x, body.y, radius, meGhost);
      if (a > 0.02) drawable.push({ y: body.y, body, alpha: a });
    }
    const impostorTeam = W.myRole && C.ROLES[W.myRole].team === 'impostor';
    for (const p of W.players.values()) {
      if (p.inVent) continue;
      /* The dead are a room only the dead are in. */
      if (p.ghost && !meGhost && !p.isMe) continue;
      if (p.isMe) { drawable.push({ y: p.y, player: p, alpha: 1 }); continue; }
      if (!p.connected) continue;
      const a = alphaFor(p.x, p.y, radius, meGhost);
      if (a <= 0.02) continue;
      if (p.invisible && !(impostorTeam || meGhost)) continue;
      drawable.push({ y: p.y, player: p, alpha: a });
    }
    drawable.sort((a, b) => a.y - b.y);

    for (const item of drawable) {
      if (item.body) { ctx.globalAlpha = item.alpha; NS.characters.drawBody(ctx, item.body); ctx.globalAlpha = 1; continue; }
      const p = item.player;
      let outline = null;
      if (impostorTeam && !p.isMe && W.state.roles && C.ROLES[W.state.roles[p.id] || 'crewmate'].team === 'impostor') {
        outline = 'rgba(255,63,91,0.85)';
      }
      NS.characters.drawPlayer(ctx, p, { alpha: item.alpha, outline });
    }
    for (const item of drawable) {
      if (item.player && item.alpha > 0.25) nameTag(item.player, item.alpha);
    }

    NS.fx.draw(ctx);
    NS.fx.drawFloaters(ctx);
    ctx.restore();

    if (camera.flash > 0.01) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalAlpha = Math.min(0.85, camera.flash);
      ctx.fillStyle = camera.flashColour;
      ctx.fillRect(0, 0, cssW, cssH);
      ctx.globalAlpha = 1;
      camera.flash *= Math.pow(0.004, dt);
    }

    drawEdgePointers();
  }

  /* Off-screen things you are meant to walk to: a chevron on the edge of the
     screen for the live sabotage. Only for the sabotage -- doing it for every
     task turns the border into a light show and stops meaning anything. */
  function drawEdgePointers() {
    const active = W.state.sabotage;
    if (!active || !W.me || W.me.ghost) return;
    const def = NS.sabotage.SABOTAGES[active.kind];
    if (!def || !def.fix) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const margin = 34;
    for (const spot of NS.sabotage.activeSpots()) {
      if (spot.done) continue;
      const s = worldToScreen(spot.x, spot.y);
      if (s.x > margin && s.x < cssW - margin && s.y > margin && s.y < cssH - margin) continue;
      const cx = cssW / 2, cy = cssH / 2;
