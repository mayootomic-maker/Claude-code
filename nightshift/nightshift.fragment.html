    showAdmin, showCameras, showVitals, openConsole, showOptions, showGhostChat,
    setCooldown, forceCooldown, setEmergencies, setAbilitySpent, closeOverlay,
    cooldown,
    get stick() { return nodes.stick; },
  };
})(window.NS);

</script>
<script>
/* Walking, from a keyboard or a thumb.

   The stick is not drawn in a fixed corner waiting to be found. It appears
   under the thumb wherever the thumb lands in the left half of the screen and
   follows it from there, which is the difference between a control you have
   to look at and one you can use while watching the game. The right half is
   left alone for the action buttons, and a touch that starts on a button is
   never a stick.

   Keys are WASD or the arrows, with the same actions on the keyboard as on
   the buttons so a laptop is not a second-class way to play. */

(function (NS) {
  'use strict';

  const U = NS.util;

  const keys = Object.create(null);
  const vector = { x: 0, y: 0 };
  const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
  const MAX = 54;

  let node = null;
  let onAction = function () {};
  let enabled = true;

  const KEY_MOVE = {
    KeyW: [0, -1], ArrowUp: [0, -1],
    KeyS: [0, 1], ArrowDown: [0, 1],
    KeyA: [-1, 0], ArrowLeft: [-1, 0],
    KeyD: [1, 0], ArrowRight: [1, 0],
  };
  const KEY_ACTION = {
    KeyE: 'use', Space: 'use', Enter: 'use',
    KeyR: 'report', KeyQ: 'kill', KeyV: 'vent',
    KeyF: 'ability', KeyZ: 'sabotage', KeyM: 'map', KeyT: 'tasks',
  };

  function init(opts) {
    node = opts.stick;
    onAction = opts.onAction || function () {};

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const target = e.target;
      /* Never eat a key somebody is typing into the chat box. */
      if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) return;
      if (KEY_MOVE[e.code]) { keys[e.code] = true; e.preventDefault(); return; }
      const action = KEY_ACTION[e.code];
      if (action) {
        e.preventDefault();
        if (enabled) onAction(action);
      }
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

    const surface = opts.surface || document.body;
    surface.addEventListener('pointerdown', (e) => {
      if (!enabled || stick.active) return;
      if (e.pointerType === 'mouse') return;
      /* Anything with its own job -- a button, the HUD, an open panel --
         handles its own touches. */
      if (e.target.closest('button, .sheet, .mg, .meeting, .screen, input, a')) return;
      if (e.clientX > window.innerWidth * 0.58) return;
      stick.active = true;
      stick.id = e.pointerId;
      stick.ox = e.clientX;
      stick.oy = e.clientY;
      stick.x = 0; stick.y = 0;
      place();
      node.hidden = false;
      surface.setPointerCapture(e.pointerId);
    });
    surface.addEventListener('pointermove', (e) => {
      if (!stick.active || e.pointerId !== stick.id) return;
      const dx = e.clientX - stick.ox;
      const dy = e.clientY - stick.oy;
      const len = Math.hypot(dx, dy);
      const clamped = Math.min(len, MAX);
      const a = Math.atan2(dy, dx);
      stick.x = len < 1 ? 0 : Math.cos(a) * clamped;
      stick.y = len < 1 ? 0 : Math.sin(a) * clamped;
      place();
    });
    const drop = (e) => {
      if (!stick.active || (e.pointerId != null && e.pointerId !== stick.id)) return;
      stick.active = false;
      stick.id = null;
      stick.x = 0; stick.y = 0;
      node.hidden = true;
    };
    surface.addEventListener('pointerup', drop);
    surface.addEventListener('pointercancel', drop);
  }

  function place() {
    if (!node) return;
    node.style.left = stick.ox + 'px';
    node.style.top = stick.oy + 'px';
    node.querySelector('.stick-knob').style.transform =
      'translate(' + (stick.x - 50) + '%, ' + (stick.y - 50) + '%)';
  }

  /* One vector, whichever way it was asked for. Keyboard input is normalised
     the same way the stick is, so diagonals are not faster. */
  function read() {
    let x = 0, y = 0;
    for (const code in KEY_MOVE) {
      if (!keys[code]) continue;
      x += KEY_MOVE[code][0];
      y += KEY_MOVE[code][1];
    }
    if (stick.active && (stick.x || stick.y)) {
      const len = Math.hypot(stick.x, stick.y);
      const dead = 9;
      if (len > dead) {
        const power = Math.min(1, (len - dead) / (MAX - dead));
        x = (stick.x / len) * power;
        y = (stick.y / len) * power;
      } else { x = 0; y = 0; }
    }
    vector.x = U.clamp(x, -1, 1);
    vector.y = U.clamp(y, -1, 1);
    return vector;
  }

  function setEnabled(v) {
    enabled = !!v;
    if (!enabled) {
      stick.active = false;
      stick.x = stick.y = 0;
      for (const k in keys) keys[k] = false;
      if (node) node.hidden = true;
    }
  }

  NS.input = { init, read, setEnabled, get vector() { return vector; } };
})(window.NS);

</script>
<script>
/* The screens either side of a round: the way in, the lobby, and the way it
   ended.

   The way in is the part that decides whether a class actually plays. Three
   buttons, no account, no install, and a four-letter code somebody reads out
   loud. Practice against bots is first on the list rather than hidden at the
   bottom, because the person opening this link is on their own and one player
   staring at an empty lobby is how a game gets closed. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;
  const W = NS.world;
  const el = U.el;

  let hooks = {};
  let current = null;
  let backdrop = null;
  let backdropStop = null;
  let browser = null;

  const profile = {
    name: U.cleanName(U.store.get('name', ''), C.NAME_MAX),
    colorIdx: U.clamp(U.store.get('colour', Math.floor(Math.random() * C.COLORS.length)) | 0, 0, C.COLORS.length - 1),
    hatIdx: U.clamp(U.store.get('hat', 0) | 0, 0, C.HATS.length - 1),
  };

  function saveProfile() {
    U.store.set('name', profile.name);
    U.store.set('colour', profile.colorIdx);
    U.store.set('hat', profile.hatIdx);
  }

  function init(opts) { hooks = opts; }

  /* ---- the station, drifting behind everything --------------------------- */

  /* The title sits over the real map, panned slowly. It costs one blit a
     frame and it means the first thing anybody sees is the place they are
     about to be in, rather than a logo on a gradient. */
  function startBackdrop(host) {
    const canvas = el('canvas', { class: 'backdrop', 'aria-hidden': 'true' });
    host.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let t = 0;
    let running = true;
    function frame() {
      if (!running) return;
      const rect = host.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      if (canvas.width !== Math.round(rect.width * dpr) || canvas.height !== Math.round(rect.height * dpr)) {
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#05070d';
      ctx.fillRect(0, 0, rect.width, rect.height);
      const station = NS.station.canvas;
      if (station) {
        t += 0.00022;
        const scale = Math.max(rect.width / 1500, 0.55);
        const px = (Math.sin(t) * 0.5 + 0.5) * Math.max(0, M.pixelWidth - rect.width / scale);
        const py = (Math.cos(t * 0.7) * 0.5 + 0.5) * Math.max(0, M.pixelHeight - rect.height / scale);
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.scale(scale, scale);
        const k = NS.station.scale;
        ctx.drawImage(station,
          px * k, py * k, (rect.width / scale) * k, (rect.height / scale) * k,
          0, 0, rect.width / scale, rect.height / scale);
        ctx.restore();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    return () => { running = false; canvas.remove(); };
  }

  /* ---- shared chrome ----------------------------------------------------- */

  function screen(name) {
    hideAll();
    const root = el('section', { class: 'screen screen--' + name });
    document.body.appendChild(root);
    current = root;
    return root;
  }

  function hideAll() {
    if (browser) { browser.stop(); browser = null; }
    if (backdropStop) { backdropStop(); backdropStop = null; }
    if (current) { current.remove(); current = null; }
  }

  /* The character you are about to be, with the pickers under it. Changing a
     colour redraws the same drawing the world uses, so what you choose here
     is exactly what everybody sees out there. */
  function dresser(onChange) {
    const wrap = el('div', { class: 'dresser' });
    const stageBox = el('div', { class: 'dresser-stage' });
    function repaint() {
      stageBox.textContent = '';
      stageBox.appendChild(NS.bits.avatar(profile.colorIdx, profile.hatIdx, 168));
    }
    repaint();

    const colours = el('div', { class: 'swatches', role: 'group', 'aria-label': 'Colour' });
    C.COLORS.forEach((colour, i) => {
      const btn = el('button', {
        class: 'swatch', type: 'button', 'aria-label': colour.name, title: colour.name,
        'aria-pressed': String(i === profile.colorIdx),
        onclick: () => {
          profile.colorIdx = i;
          saveProfile();
          U.$$('.swatch', colours).forEach((n, k) => n.setAttribute('aria-pressed', String(k === i)));
          repaint();
          NS.audio.play('click');
          if (onChange) onChange();
        },
      });
      btn.style.setProperty('--swatch', colour.body);
      colours.appendChild(btn);
    });

    const hats = el('div', { class: 'hats', role: 'group', 'aria-label': 'Hat' });
    C.HATS.forEach((hat, i) => {
      const btn = el('button', {
        class: 'hat-btn', type: 'button', title: hat.name, 'aria-label': hat.name,
        'aria-pressed': String(i === profile.hatIdx),
        onclick: () => {
          profile.hatIdx = i;
          saveProfile();
          U.$$('.hat-btn', hats).forEach((n, k) => n.setAttribute('aria-pressed', String(k === i)));
          repaint();
          NS.audio.play('click');
          if (onChange) onChange();
        },
      });
      btn.appendChild(NS.bits.avatar(profile.colorIdx, i, 44, { class: 'hat-preview' }));
      hats.appendChild(btn);
    });

    wrap.appendChild(stageBox);
    wrap.appendChild(colours);
    wrap.appendChild(el('p', { class: 'dresser-label', text: 'Hat' }));
    wrap.appendChild(hats);
    wrap.__repaint = repaint;
    return wrap;
  }

  /* ---- title ------------------------------------------------------------- */

  function showTitle(message) {
    const root = screen('title');
    backdropStop = startBackdrop(root);

    const nameInput = el('input', {
      class: 'field', type: 'text', maxlength: String(C.NAME_MAX),
      placeholder: 'Your name', value: profile.name, 'aria-label': 'Your name',
      autocomplete: 'nickname', autocapitalize: 'words',
      oninput: (e) => { profile.name = U.cleanName(e.target.value, C.NAME_MAX); saveProfile(); },
    });

    const codeInput = el('input', {
      class: 'field field--code', type: 'text', maxlength: '4',
      placeholder: 'CODE', 'aria-label': 'Room code',
      autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false',
      oninput: (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); },
    });

    function needName() {
      if (profile.name) return false;
      nameInput.focus();
      nameInput.classList.add('is-wrong');
      setTimeout(() => nameInput.classList.remove('is-wrong'), 500);
      NS.bits.toast('Put a name in first, so people know who you are.', 'warn');
      return true;
    }

    const online = NS.link.roomAvailable() || NS.link.mqttAvailable();

    const actions = el('div', { class: 'title-actions' }, [
      el('button', {
        class: 'btn btn--primary btn--big', type: 'button',
        onclick: () => { if (!needName()) hooks.onHost(profile); },
        disabled: !online,
      }, [el('strong', { text: 'Start a game' }), el('span', { text: 'You get a code to read out' })]),
      el('div', { class: 'join-row' }, [
        codeInput,
        el('button', {
          class: 'btn btn--ghost', type: 'button', text: 'Join',
          disabled: !online,
          onclick: () => {
            if (needName()) return;
            const code = codeInput.value.trim().toUpperCase();
            if (code.length !== 4) {
              codeInput.classList.add('is-wrong');
              setTimeout(() => codeInput.classList.remove('is-wrong'), 500);
              NS.bits.toast('A code is four characters.', 'warn');
              return;
            }
            hooks.onJoin(profile, code);
          },
        }),
      ]),
      el('button', {
        class: 'btn btn--quiet', type: 'button',
        onclick: () => { if (!needName()) hooks.onSolo(profile); },
      }, [el('strong', { text: 'Practice with bots' }), el('span', { text: 'On your own, right now' })]),
    ]);

    /* Games you can walk into. Reading a code out still works and always
       will, but four letters across a noisy room is four letters mis-heard,
       and a list you can tap is the difference between starting in ten
       seconds and starting in two minutes. */
    const lobbyList = el('div', { class: 'open-lobbies', hidden: true });
    const lobbyStatus = el('p', { class: 'open-status', text: '' });

    function renderLobbies(list) {
      lobbyList.textContent = '';
      if (!list || !list.length) {
        lobbyList.hidden = true;
        lobbyStatus.textContent = 'No games open right now. Start one, or type a code.';
        return;
      }
      lobbyList.hidden = false;
      lobbyStatus.textContent = '';
      for (const lobby of list.slice(0, 6)) {
        lobbyList.appendChild(el('button', {
          class: 'open-lobby', type: 'button',
          onclick: () => { if (!needName()) hooks.onJoin(profile, lobby.code); },
        }, [
          el('strong', { class: 'open-code', text: lobby.code }),
          el('span', { class: 'open-host', text: lobby.host + "'s game" }),
          el('span', { class: 'open-count', text: lobby.players + (lobby.players === 1 ? ' player' : ' players') }),
        ]));
      }
    }

    const mode = NS.link.preferred();
    if (online && mode !== 'local') {
      lobbyStatus.textContent = 'Looking for games...';
      browser = NS.link.browse({
        mode,
        onList: renderLobbies,
        onStatus: (text) => { if (text) lobbyStatus.textContent = text; },
        onError: (text) => { lobbyStatus.textContent = text; lobbyList.hidden = true; },
      });
    }

    const left = el('div', { class: 'title-left' }, [
      el('p', { class: 'eyebrow', text: 'Aurora-7 research station' }),
      el('h1', { class: 'wordmark' }, [
        el('span', { text: 'NIGHT' }), el('em', { text: 'SHIFT' }),
      ]),
      el('p', { class: 'tagline', text: 'Fourteen people, a station that is falling apart, and at least one of them wants it to.' }),
      el('div', { class: 'field-row' }, [nameInput]),
      actions,
      mode === 'local' ? null : el('div', { class: 'open-wrap' }, [
        el('p', { class: 'open-title', text: 'Games open now' }),
        lobbyList,
        lobbyStatus,
      ]),
      el('p', { class: 'title-note', text: transportNote() }),
      el('button', { class: 'link-btn', type: 'button', text: 'How it works', onclick: showHelp }),
    ]);

    root.appendChild(el('div', { class: 'title-grid' }, [left, dresser()]));
    if (message) NS.bits.toast(message, 'warn', 6);
  }

  function transportNote() {
    if (location.hash === '#local') {
      return 'Same-computer mode: this page talks to its own other tabs and nothing else. '
        + 'Open it twice, host in one and join in the other. Drop the #local off the address '
        + 'to play with other devices.';
    }
    if (NS.link.roomAvailable()) {
      return 'Everyone opens this same link and types the code. It works for people signed in to '
        + 'the same organisation as whoever published it; anyone else should use the downloadable file.';
    }
    if (NS.link.mqttAvailable()) {
      return 'Everyone opens this same file and types the code. It goes over a free public message '
        + 'broker, so there is nothing to install and no account -- and nothing on it is private.';
    }
    return 'This browser cannot open a connection, so only practice mode will work.';
  }

  function showHelp() {
    const root = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' });
    const box = el('div', { class: 'sheet-box sheet-box--wide' });
    box.appendChild(el('header', { class: 'sheet-head' }, [
      el('h3', { text: 'How it works' }),
      el('button', { class: 'tool', type: 'button', 'aria-label': 'Close', onclick: () => root.remove() },
        [NS.bits.icon('close', 20)]),
    ]));
    const body = el('div', { class: 'prose' });
    [
      ['The crew', 'Everyone gets a list of jobs around the station. Finish all of them and the crew wins. '
        + 'Your jobs are marked with a ring on the floor and listed under Tasks.'],
      ['The impostors', 'One to three of you are lying. You can kill, climb through the vents, and break '
        + 'the station to move people around. You have a fake task list to stand at.'],
      ['Meetings', 'Find a body and report it, or press the button in the Cafeteria. Everyone argues in '
        + 'the chat, then votes. The most voted is thrown out of the airlock.'],
      ['Being dead', 'You keep playing. Ghosts walk through walls, finish the tasks that still count, '
        + 'and can read everything -- but the living cannot hear you.'],
      ['Controls', 'WASD or the arrows to walk, E to use, Q to kill, R to report, F for your role ability, '
        + 'M for the map. On a phone, touch the left half to walk and use the buttons on the right.'],
    ].forEach(([title, text]) => {
      body.appendChild(el('h4', { text: title }));
      body.appendChild(el('p', { text }));
    });
    /* Built from the role table rather than written out, so a role that is
       added, renamed or reworded can never quietly disagree with the page that
       explains it. */
    body.appendChild(el('h4', { text: 'The roles' }));
    body.appendChild(el('p', {
      text: 'Which of these turn up is set in the lobby. Every one of them is off or on '
        + 'with a chance, so a class can build the game it wants.',
    }));
    const roles = el('div', { class: 'help-roles' });
    for (const key of ['crewmate'].concat(C.CREW_ROLES, ['impostor'], C.IMPOSTOR_ROLES, ['jester'])) {
      const def = C.ROLES[key];
      if (!def) continue;
      roles.appendChild(el('div', { class: 'help-role' }, [
        el('div', { class: 'help-role-head' }, [
          el('strong', { text: def.name }),
          el('span', {
            class: 'role-team role-team--' + def.team,
            text: def.team === 'impostor' ? 'Impostor' : def.team === 'jester' ? 'Neutral' : 'Crew',
          }),
        ]),
        el('p', { text: def.blurb }),
      ]));
    }
    body.appendChild(roles);

    box.appendChild(body);
    root.appendChild(box);
    root.addEventListener('click', (e) => { if (e.target === root) root.remove(); });
    document.body.appendChild(root);
  }

  /* ---- lobby ------------------------------------------------------------- */

  let lobbyNodes = null;

  function showLobby(info) {
    const root = screen('lobby');
    backdropStop = startBackdrop(root);

    const code = el('button', {
      class: 'code', type: 'button', title: 'Copy the code',
      onclick: () => {
        const text = info.code;
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(
          () => NS.bits.toast('Code copied.', 'good'),
          () => NS.bits.toast('Copy did not work -- read it out instead.', 'warn'));
        else NS.bits.toast('Read it out: ' + text, 'info');
      },
    }, [el('span', { class: 'code-label', text: 'Room code' }), el('strong', { text: info.code })]);

    const roster = el('div', { class: 'roster' });
    const status = el('p', { class: 'lobby-status', text: '' });
    const settingsHost = el('div', { class: 'settings' });

    const startBtn = el('button', {
      class: 'btn btn--primary btn--big', type: 'button', text: 'Start the round',
      onclick: () => hooks.onStart(),
    });
    const readyBtn = el('button', {
      class: 'btn btn--primary btn--big', type: 'button', text: 'Ready',
      onclick: () => hooks.onReady(),
    });
    const botRow = el('div', { class: 'bot-row' }, [
      el('span', { class: 'bot-label', text: 'Practice bots' }),
      el('button', { class: 'btn btn--ghost btn--tight', type: 'button', text: '-', 'aria-label': 'One fewer bot', onclick: () => hooks.onBots(-1) }),
      el('strong', { class: 'bot-count', text: '0' }),
      el('button', { class: 'btn btn--ghost btn--tight', type: 'button', text: '+', 'aria-label': 'One more bot', onclick: () => hooks.onBots(1) }),
    ]);
    const playAs = el('div', { class: 'play-as', hidden: true });

    const leave = el('div', { class: 'lobby-links' }, [
      el('button', { class: 'link-btn', type: 'button', text: 'How it works', onclick: showHelp }),
      el('button', { class: 'link-btn', type: 'button', text: 'Leave', onclick: () => hooks.onLeave() }),
    ]);

    const panel = el('div', { class: 'lobby-panel' }, [
      code,
      el('p', { class: 'lobby-hint', text: 'Everyone opens the same page and types this in.' }),
      status,
      botRow,
      playAs,
      el('div', { class: 'lobby-buttons' }, [startBtn, readyBtn]),
      leave,
    ]);

    root.appendChild(el('div', { class: 'lobby-grid' }, [
      el('div', { class: 'lobby-left' }, [
        el('h2', { class: 'lobby-title', text: 'Lobby' }),
        roster,
      ]),
      panel,
      el('div', { class: 'lobby-settings' }, [
        el('h3', { text: 'Settings' }),
        settingsHost,
      ]),
    ]));

    lobbyNodes = { roster, status, settingsHost, startBtn, readyBtn, botRow, playAs, code };
    rosterSignature = '';
    return lobbyNodes;
  }

  let rosterSignature = '';

  function updateLobby(info) {
    if (!lobbyNodes) return;
    const { roster, status, startBtn, readyBtn, botRow, playAs } = lobbyNodes;
    const players = info.players || [];

    /* The roster is redrawn only when it actually changed. This runs several
       times a second so the start button can never be left stale, and
       rebuilding fourteen canvas portraits at that rate would flicker. */
    const signature = players.map((p) =>
      p.name + p.colorIdx + p.hatIdx + (p.ready ? 'r' : '') + (p.bot ? 'b' : '') + (p.isHost ? 'h' : '')
    ).join('|');
    if (signature !== rosterSignature) {
      rosterSignature = signature;
      renderRoster(roster, players);
    }

    const real = players.filter((p) => !p.bot).length;
    status.textContent = players.length + ' in the lobby'
      + (players.length - real > 0 ? ' (' + (players.length - real) + ' bots)' : '')
      + (info.connection ? ' - ' + info.connection : '');

    startBtn.hidden = !info.isHost;
    readyBtn.hidden = !!info.isHost;
    botRow.hidden = !info.isHost;
    botRow.querySelector('.bot-count').textContent = String(info.bots || 0);
    /* Shown only when it is true: you, alone, against bots. With a second
       person in the lobby the host ignores it, so offering it would be a
       control that lies. */
    playAs.hidden = !(info.isHost && real === 1 && (info.bots || 0) > 0);
    if (info.isHost) {
      startBtn.disabled = !!info.blocked;
      startBtn.textContent = info.blocked || 'Start the round';
    } else {
      readyBtn.classList.toggle('is-on', !!info.ready);
      readyBtn.textContent = info.ready ? 'Ready' : 'Ready up';
    }
  }

  function renderRoster(roster, players) {
    roster.textContent = '';
    for (const p of players) {
      const card = el('div', { class: 'roster-card' + (p.ready ? ' is-ready' : '') + (p.bot ? ' is-bot' : '') });
      card.appendChild(NS.bits.avatar(p.colorIdx, p.hatIdx, 76));
      card.appendChild(el('strong', { text: p.name }));
      card.appendChild(el('span', { class: 'roster-tag', text: p.isHost ? 'Host' : (p.bot ? 'Bot' : (p.ready ? 'Ready' : '')) }));
      roster.appendChild(card);
    }
    for (let i = players.length; i < C.MAX_PLAYERS; i++) {
      roster.appendChild(el('div', { class: 'roster-card is-empty' }, [el('span', { text: '' })]));
    }
  }

  /* The one dial that is not in the settings list: which side to practise on.

     It sits with the bot counter because that is what it belongs to, and it
     shows the streak it is acting on when it is set to rotate -- a dial that
     silently decides to give you the impostor on the third round is worse than
     no dial, because you cannot tell whether it did anything. */
  function buildPlayAs(settings, isHost, onChange) {
    if (!lobbyNodes || !lobbyNodes.playAs) return;
    const spec = C.SETTINGS.find((s) => s.key === 'soloRole');
    const node = lobbyNodes.playAs;
    node.textContent = '';
    if (!spec) return;
    node.appendChild(el('span', { class: 'bot-label', text: spec.name }));
    const segments = el('div', { class: 'segments' });
    for (const option of spec.options) {
      segments.appendChild(el('button', {
        class: 'segment' + (option === settings[spec.key] ? ' is-on' : ''),
        type: 'button', text: option, disabled: !isHost,
        onclick: () => onChange(spec.key, option),
      }));
    }
    node.appendChild(segments);
    if (settings[spec.key] === 'Rotate') {
      const streak = U.store.get('streak', null);
      node.appendChild(el('p', {
        class: 'setting-hint',
        text: streak && streak.n >= 2
          ? 'Impostor next: ' + streak.n + ' rounds on the ' + streak.team + ' side.'
          : 'Never the same side three rounds running.',
      }));
    }
  }

  /* Settings are generated from the table in core/config.js, so a new dial
     appears here, travels to the guests and is clamped on arrival without
     anybody editing this file. */
  function buildSettings(settings, isHost, onChange) {
    if (!lobbyNodes) return;
    const host = lobbyNodes.settingsHost;
    host.textContent = '';
    for (const spec of C.SETTINGS) {
      /* Practice-only dials are not in this list. They travel and are clamped
         with everything else, but a class of fourteen setting up a game should
         not have to read past a control that does nothing for them -- it goes
         in the practice card instead, next to the bot counter, which is the
         only place somebody playing alone is looking. */
      if (spec.practice) continue;
      const row = el('div', { class: 'setting' });
      row.appendChild(el('label', { class: 'setting-name', text: spec.name }));
      const value = settings[spec.key];
      let control;
      if (spec.kind === 'bool') {
        control = el('button', {
          class: 'toggle' + (value ? ' is-on' : ''), type: 'button',
          role: 'switch', 'aria-checked': String(!!value),
          text: value ? 'On' : 'Off',
          onclick: () => onChange(spec.key, !settings[spec.key]),
        });
      } else if (spec.kind === 'choice') {
        control = el('div', { class: 'segments' });
        for (const option of spec.options) {
          control.appendChild(el('button', {
            class: 'segment' + (option === value ? ' is-on' : ''), type: 'button', text: option,
            onclick: () => onChange(spec.key, option),
          }));
        }
      } else {
        const out = el('output', { class: 'setting-value', text: value + (spec.unit || '') });
        control = el('div', { class: 'slider-row' }, [
          el('input', {
            class: 'slider', type: 'range',
            min: String(spec.min), max: String(spec.max),
            step: String(spec.step || 1), value: String(value),
            'aria-label': spec.name,
            oninput: (e) => {
              out.textContent = e.target.value + (spec.unit || '');
              onChange(spec.key, Number(e.target.value));
            },
          }),
          out,
        ]);
      }
      row.appendChild(control);
      if (spec.hint) row.appendChild(el('p', { class: 'setting-hint', text: spec.hint }));
      if (!isHost) row.classList.add('is-locked');
      U.$$('button, input', row).forEach((n) => { n.disabled = !isHost; });
      host.appendChild(row);
    }

    buildPlayAs(settings, isHost, onChange);

    const roles = el('div', { class: 'roles' });
    roles.appendChild(el('h4', { text: 'Roles' }));
    roles.appendChild(el('p', { class: 'setting-hint', text: 'The chance each one turns up in a round. Off means never.' }));
    for (const key of C.ROLE_SETTINGS) {
      const def = C.ROLES[key];
      const chance = settings.roles[key] || 0;
      const out = el('output', { class: 'setting-value', text: chance ? chance + '%' : 'Off' });
      const row = el('div', { class: 'setting setting--role' }, [
        el('div', { class: 'role-head' }, [
          el('strong', { text: def.name }),
          el('span', { class: 'role-team role-team--' + def.team, text: def.team === 'impostor' ? 'Impostor' : def.team === 'jester' ? 'Neutral' : 'Crew' }),
        ]),
        el('p', { class: 'setting-hint', text: def.blurb }),
        el('div', { class: 'slider-row' }, [
          el('input', {
            class: 'slider', type: 'range', min: '0', max: '100', step: '5', value: String(chance),
            'aria-label': def.name + ' chance',
            oninput: (e) => {
              out.textContent = Number(e.target.value) ? e.target.value + '%' : 'Off';
              onChange('role:' + key, Number(e.target.value));
            },
          }),
          out,
        ]),
      ]);
      if (!isHost) U.$$('input', row).forEach((n) => { n.disabled = true; });
      roles.appendChild(row);
    }
    host.appendChild(roles);
  }

  /* ---- the end ----------------------------------------------------------- */

  function showEnd(result, players, isHost) {
    const root = screen('end');
    backdropStop = startBackdrop(root);
    root.dataset.team = result.team;

    const title = result.team === 'crew' ? 'Crew wins'
      : result.team === 'impostor' ? 'Impostors win' : 'The jester wins';

    const grid = el('div', { class: 'end-roles' });
    for (const p of players) {
      const def = C.ROLES[p.role] || C.ROLES.crewmate;
      grid.appendChild(el('div', { class: 'end-card end-card--' + def.team }, [
        NS.bits.avatar(p.colorIdx, p.hatIdx, 68, { ghost: !p.alive }),
        el('strong', { text: p.name }),
        el('span', { class: 'end-role', text: def.name }),
      ]));
    }

    root.appendChild(el('div', { class: 'end-inner' }, [
      el('p', { class: 'eyebrow', text: 'Round over' }),
      el('h1', { class: 'end-title', text: title }),
      el('p', { class: 'end-reason', text: result.reason }),
      grid,
      recap(result.log),
      el('div', { class: 'end-buttons' }, [
        isHost
          ? el('button', { class: 'btn btn--primary btn--big', type: 'button', text: 'Back to the lobby', onclick: () => hooks.onPlayAgain() })
          : el('p', { class: 'end-wait', text: 'Waiting for the host to start another.' }),
        el('button', { class: 'link-btn', type: 'button', text: 'Leave', onclick: () => hooks.onLeave() }),
      ]),
    ]));
    NS.audio.play(result.team === 'crew' ? 'win' : 'lose');
  }

  /* What actually happened, in order. Everybody spent the round arguing from
     two-second glimpses; this is the only moment anyone sees the whole thing,
     and watching a class read it is most of the fun of losing. */
  /* Always m:ss in the timeline. `clock` drops the minutes under sixty
     seconds, which is right on a countdown and wrong in a column where "15"
     sits above "1:05". */
  const stamp = (seconds) => Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');

  function recap(log) {
    if (!log || !log.length) return null;
    const list = el('ol', { class: 'recap' });
    for (const entry of log) {
      let text = '';
      if (entry.k === 'kill') {
        text = entry.self
          ? entry.who + ' shot the wrong person and died for it, in ' + entry.where
          : (entry.by ? entry.by + ' killed ' + entry.who + ' in ' + entry.where
            : entry.who + ' died in ' + entry.where);
      } else if (entry.k === 'meeting') {
        text = entry.reason === 'body'
          ? (entry.by || 'Somebody') + ' reported ' + (entry.who || 'a body')
          : (entry.by || 'Somebody') + ' called an emergency meeting';
      } else if (entry.k === 'eject') {
        text = entry.who
          ? entry.who + ' was thrown out - ' + (entry.impostor ? 'an impostor' : 'not an impostor')
          : (entry.tie ? 'The vote tied. Nobody went out' : 'The crew skipped');
      } else if (entry.k === 'sabotage') {
        text = entry.name;
      }
      if (!text) continue;
      list.appendChild(el('li', { class: 'recap-row recap-row--' + entry.k }, [
        el('span', { class: 'recap-time', text: stamp(entry.t) }),
        el('span', { class: 'recap-text', text }),
      ]));
    }
    if (!list.children.length) return null;
    return el('details', { class: 'recap-wrap' }, [
      el('summary', { text: 'What happened' }),
      list,
    ]);
  }

  NS.screens = {
    init, showTitle, showLobby, updateLobby, buildSettings, showEnd, hideAll, showHelp,
    profile,
    get current() { return current; },
  };
})(window.NS);

</script>
<script>
/* Wiring.

   Everything above this file is a piece that does one thing and knows nothing
   about the others: the map does not know about the network, the renderer
   does not know the rules, the host does not know what a button is. This is
   where they are joined, which makes it the only file where a change can
   break something far away -- so the seams are named rather than implied.

   Three of them matter. Presence carries where people are and is allowed to
   be slightly wrong. Snapshots carry what is true and overwrite anything this
   device believed. Events carry what just happened, once, and are the only
   thing allowed to make a noise. */

(function (NS) {
  'use strict';

  const U = NS.util;
  const C = NS.config;
  const M = NS.map;
  const W = NS.world;

  const session = {
    link: null, mode: 'solo', code: '', isHost: false,
    myId: null, hostId: null, ready: false, botCount: 3,
    /* Kept between rounds and between days: a teacher who tuned fourteen
       dials once should not do it again next lesson. */
    connection: '', settings: C.sanitise(U.store.get('settings', null)), inGame: false,
  };

  let canvas = null;
  let pendingRole = null;
  let pendingRoleSince = 0;
  let lastPhase = 'lobby';
  let toldSpectating = false;

  const send = (kind, data) => { if (session.link) session.link.send(kind, data); };

  /* ---- boot -------------------------------------------------------------- */

  function boot() {
    canvas = U.$('#stage');
    NS.render.attach(canvas);
    NS.characters.setSymbols(U.store.get('symbols', false));
    NS.secrets.init();
    NS.hud.init({ send, onLeave: leaveToTitle });
    NS.input.init({ stick: NS.hud.stick, onAction: keyAction, surface: document.body });
    NS.meeting.init({ send });
    NS.screens.init({
      onHost: hostGame, onJoin: joinGame, onSolo: soloGame,
      onStart: startRound, onReady: toggleReady, onBots: changeBots,
      onLeave: leaveToTitle, onPlayAgain: backToLobby,
    });
    NS.screens.showTitle();

    /* The station is a thirty megabyte draw. It waits for the fonts so the
       room signage is set in the right face, and for a painted frame so the
       title is on screen before the main thread is busy for a moment. */
    const build = () => requestAnimationFrame(() => { NS.station.build(); });
    if (document.fonts && document.fonts.ready) {
      const timeout = new Promise((r) => setTimeout(r, 1500));
      Promise.race([document.fonts.ready, timeout]).then(build);
    } else build();

    requestAnimationFrame(frame);
    setInterval(beat, 60);
    /* Captured, so the gate opens before the button handler that wants to make
       a noise runs -- otherwise the very first click is silent. */
    const open = () => { NS.audio.unlock(); mood = ''; };
    window.addEventListener('pointerdown', open, { once: true, capture: true });
    window.addEventListener('keydown', open, { once: true, capture: true });
  }

  function keyAction(action) {
    if (NS.minigames.isOpen()) return;
    if (action === 'map') return NS.hud.showMap(false);
    if (action === 'tasks') return NS.hud.showTasks();
    const button = U.$('#act-' + action);
    if (button && !button.hidden && !button.disabled) button.click();
  }

  /* ---- sessions ---------------------------------------------------------- */

  function openLink(mode, code, asHost) {
    closeLink();
    session.mode = mode;
    session.code = code;
    session.isHost = asHost;
    session.ready = asHost;
    session.connection = '';
    W.reset();
    NS.bots.clear(NS.host);
    NS.meeting.clear();
    lastPhase = 'lobby';

    session.link = NS.link.open({
      mode, code,
      onStatus(text) { session.connection = text; refreshLobby(); },
      onReady() {
        session.myId = session.link.id;
        W.spawnMe(session.myId, NS.screens.profile);
        if (asHost) {
          session.hostId = session.myId;
          NS.host.begin({ send, settings: session.settings });
          NS.host.addPlayer(session.myId, {
            n: NS.screens.profile.name, c: NS.screens.profile.colorIdx,
            h: NS.screens.profile.hatIdx, k: NS.secrets.publicKey,
          });
          if (mode === 'solo') NS.bots.fill(session.botCount, NS.host);
        } else {
          heardFromHost = U.now();
          send('act', {
            t: 'hello', n: NS.screens.profile.name, c: NS.screens.profile.colorIdx,
            h: NS.screens.profile.hatIdx, k: NS.secrets.publicKey,
          });
        }
        showLobby();
      },
      onError(text) {
        NS.bits.toast(text, 'bad', 8);
        if (!session.link || !session.link.ready) leaveToTitle(text);
      },
      onMessage,
      onPeers() { refreshLobby(); },
    });
  }

  function closeLink() {
    if (session.link) {
      if (session.isHost) { try { session.link.announce(null); } catch (e) {} }
      session.link.close();
      session.link = null;
    }
    NS.host.stop();
    session.isHost = false;
    session.hostId = null;
    session.inGame = false;
  }

  /* `#local` puts the game on a BroadcastChannel between tabs of this browser:
     two people on one laptop, and the only way to try the join flow before a
     class without a second device. Otherwise the artifact room where there is
     one, and a public broker everywhere else. */
  const hostGame = () => openLink(NS.link.preferred(), U.roomCode(4), true);
  const joinGame = (profile, code) => openLink(NS.link.preferred(), code, false);
  const soloGame = () => openLink('solo', 'SOLO', true);

  function leaveToTitle(why) {
    closeLink();
    NS.minigames.close(true);
    NS.hud.closeOverlay();
    NS.hud.hideRole();
    NS.hud.hideEject();
    NS.meeting.hide();
    W.reset();
    NS.bots.clear(NS.host);
    NS.fx.clear();
    NS.screens.showTitle(typeof why === 'string' ? why : null);
  }

  /* Two people in the same colour is a game where nobody can say who they saw,
     and everybody shares a browser profile often enough -- two tabs, a shared
     laptop, a saved default -- that it happens on the first try.

     Resolved by a rule rather than by asking: the lower peer id keeps the
     colour and everybody else moves. That is decided the same way on every
     device, so exactly one of a clashing pair moves and the two do not swap
     back and forth. It runs on a timer rather than once on arrival, because
     the person you clash with may not have arrived yet. */
  let clashCheck = 0;
  let lobbyTick = 0;
  function avoidColourClash() {
    if (!session.link || W.state.phase !== 'lobby') return;
    const taken = {};
    for (const peer of session.link.peers()) {
      if (peer.isMe || !peer.presence) continue;
      if (peer.id < session.myId) taken[peer.presence.c] = true;
    }
    const mine = NS.screens.profile.colorIdx;
    if (!taken[mine]) return;
    /* Anything anyone here is wearing is off the table, not just the colours
       of the people who outrank us -- otherwise we move onto a third person. */
    for (const peer of session.link.peers()) {
      if (peer.isMe || !peer.presence) continue;
      taken[peer.presence.c] = true;
    }
    for (let i = 0; i < C.COLORS.length; i++) {
      if (taken[i]) continue;
      NS.screens.profile.colorIdx = i;
      if (W.me) W.me.colorIdx = i;
      U.store.set('colour', i);
      send('act', { t: 'profile', c: i });
      NS.bits.toast('Somebody already had that colour. You are ' + C.COLORS[i].name + '.', 'info', 5);
      return;
    }
    NS.bits.toast('Every colour is taken.', 'warn', 5);
  }

  /* ---- lobby ------------------------------------------------------------- */

  function showLobby() {
    session.inGame = false;
    NS.screens.showLobby({ code: session.code });
    NS.screens.buildSettings(session.settings, session.isHost, changeSetting);
    refreshLobby();
  }

  function changeSetting(key, value) {
    if (!session.isHost) return;
    if (key.indexOf('role:') === 0) session.settings.roles[key.slice(5)] = value;
    else session.settings[key] = value;
    session.settings = C.sanitise(session.settings);
    U.store.set('settings', session.settings);
    NS.host.setSettings(session.settings);
    /* A toggle and a segmented choice carry their state in the markup, so the
       panel has to be rebuilt for the change to be visible -- without this,
       pressing Long set the kill range to Long and left Normal lit, which
       reads as a button that does not work. Sliders are left alone on purpose:
       they carry their value in the element being dragged, and rebuilding
       mid-drag would take the thumb out from under your finger. */
    const spec = C.SETTINGS.find((s) => s.key === key);
    if (spec && (spec.kind === 'bool' || spec.kind === 'choice')) {
      NS.screens.buildSettings(session.settings, session.isHost, changeSetting);
    }
    refreshLobby();
  }

  function changeBots(delta) {
    if (!session.isHost) return;
    const room = C.MAX_PLAYERS - NS.host.list().filter((id) => !NS.host.H.players[id].bot).length;
    session.botCount = U.clamp(session.botCount + delta, 0, Math.max(0, room));
    NS.bots.fill(session.botCount, NS.host);
    refreshLobby();
  }

  function toggleReady() {
    session.ready = !session.ready;
    send('act', { t: 'ready', v: session.ready });
    refreshLobby();
  }

  function refreshLobby() {
    if (session.inGame || !NS.screens.current || !NS.screens.current.classList.contains('screen--lobby')) return;
    const players = [];
    for (const p of W.players.values()) {
      if (!p.connected) continue;
      players.push({
        name: p.name, colorIdx: p.colorIdx, hatIdx: p.hatIdx, bot: p.bot,
        ready: p.ready, isHost: p.id === session.hostId,
      });
    }
    players.sort((a, b) => (b.isHost ? 1 : 0) - (a.isHost ? 1 : 0));
    NS.screens.updateLobby({
      code: session.code, isHost: session.isHost, players,
      bots: NS.bots.count(), ready: session.ready,
      connection: session.connection,
      blocked: session.isHost ? NS.host.canStart() : null,
    });
  }

  function startRound() {
    if (!session.isHost) return;
    NS.audio.wake();
    NS.host.start();
  }

  function backToLobby() {
    if (!session.isHost) return;
    NS.host.H.phase = 'lobby';
    NS.host.H.winner = null;
    NS.host.H.ejected = null;
    NS.host.H.bodies = [];
    for (const id of NS.host.list()) {
      NS.host.H.players[id].alive = true;
      NS.host.H.players[id].ghost = false;
      NS.host.H.players[id].spectator = false;
      NS.host.H.players[id].ready = false;
    }
    NS.bots.resetForRound();
    NS.host.snapshot(true);
  }

  /* ---- incoming ---------------------------------------------------------- */

  function onMessage(msg) {
    if (!msg) return;
    if (msg.kind === 'act') {
      if (session.isHost) NS.host.handle(msg.from, msg.data);
      return;
    }
    if (msg.kind === 'sys') {
      /* Only the host speaks on this channel. Before the first snapshot the
         host is whoever sent one, and after that nobody else can. */
      if (!session.hostId) session.hostId = msg.from;
      if (msg.from !== session.hostId) return;
      heardFromHost = U.now();
      applySys(msg.data);
      return;
    }
    if (msg.kind === 'chat') onChat(msg.from, msg.data);
  }

  /* ---- when the host goes away ------------------------------------------- */

  /* One device decides everything, which means one device can take the game
     with it. Before this the rest of the room simply froze: no snapshots, no
     message, a countdown that had stopped and nothing to press. Silence is the
     one answer a game is never allowed to give.

     In the lobby it is recoverable and nobody should have to re-enter a code,
     so the remaining player with the lowest id picks the game up. Mid-round it
     is not recoverable -- a new host would know nobody's role, because roles
     are sealed to devices rather than stored anywhere -- so the round ends and
     says so. */
  const HOST_SILENCE = 9000;
  let heardFromHost = 0;

  function watchHost() {
    if (session.isHost || !session.link || !session.link.ready) return;
    if (!heardFromHost) return;
    if (U.now() - heardFromHost < HOST_SILENCE) return;

    const peers = session.link.peers();
    const stillHere = peers.some((p) => p.id === session.hostId);
    heardFromHost = U.now();          // do not fire again while we sort it out

    if (stillHere) {
      NS.bits.toast('The host has gone quiet. Still trying.', 'warn', 5);
      return;
    }
    if (W.state.phase !== 'lobby' && W.state.phase !== 'end') {
      NS.bits.toast('The host closed the game, so the round ended.', 'bad', 9);
    }
    takeOverLobby(peers);
  }

  /* The lowest id wins, decided identically on every device, so exactly one of
     them picks the lobby up and the others follow it without being told. */
  function takeOverLobby(peers) {
    const ids = peers.map((p) => p.id).filter(Boolean).sort();
    const heir = ids[0];
    session.hostId = null;
    heardFromHost = 0;
    W.myRole = null;
    W.myTasks = [];
    W.state.roles = {};
    W.bodies = [];
    W.state.phase = 'lobby';
    W.state.winner = null;
    W.state.meeting = null;
    W.state.sabotage = null;
    NS.minigames.close(true);
    NS.hud.closeOverlay();
    NS.hud.hideRole();
    NS.hud.hideEject();
    NS.meeting.hide();
    NS.input.setEnabled(true);

    if (heir !== session.myId) { session.inGame = false; showLobby(); return; }

    session.isHost = true;
    session.hostId = session.myId;
    session.ready = true;
    session.inGame = false;
    NS.host.begin({ send, settings: session.settings });
    NS.host.addPlayer(session.myId, {
      n: NS.screens.profile.name, c: NS.screens.profile.colorIdx,
      h: NS.screens.profile.hatIdx, k: NS.secrets.publicKey,
    });
    for (const peer of peers) {
      if (peer.isMe || !peer.presence) continue;
      NS.host.addPlayer(peer.id, {
        n: peer.presence.n, c: peer.presence.c, h: peer.presence.h, k: peer.presence.k,
      });
    }
    NS.bits.toast('You are the host now.', 'info', 6);
    showLobby();
  }

  function applySys(data) {
    if (!data || typeof data !== 'object') return;
    if (data.t === 'S') return applySnapshot(data);
    if (data.t === 'R') return takeRole(data);
    if (data.t === 'E') return onEvent(data);
  }

  function takeRole(data) {
    if (data.to !== session.myId) return;
    if (data.plain) return setRole(data.plain, !!data.clear);
    pendingRole = data;
    pendingRoleSince = U.now();
    tryPendingRole();
  }

  function tryPendingRole() {
    if (!pendingRole) return;
    if (!W.hostKey) {
      if (U.now() - pendingRoleSince > 6000) {
        pendingRole = null;
        NS.bits.toast('Your role did not arrive. Ask the host to restart the round.', 'bad', 8);
      }
      return;
    }
    const message = pendingRole;
    pendingRole = null;
    NS.secrets.openFrom(W.hostKey, message.s).then((payload) => {
      if (payload) setRole(payload, false);
      else NS.bits.toast('Your role could not be unsealed. Ask the host to restart the round.', 'bad', 8);
    });
  }

  function setRole(payload, wasClear) {
    W.myRole = payload.role || 'crewmate';
    W.myTasks = Array.isArray(payload.tasks) ? payload.tasks : [];
    W.state.roles = W.state.roles || {};
    W.state.roles[session.myId] = W.myRole;
    for (const id of (payload.mates || [])) W.state.roles[id] = 'impostor';
    NS.hud.setAbilitySpent(false);
    const def = C.ROLES[W.myRole];
    NS.bits.announce('You are the ' + def.name + '. ' + def.blurb);
    if (W.state.phase === 'reveal') showRoleCard();
    if (wasClear) {
      NS.bits.toast('This browser cannot encrypt, so roles were sent in the clear on this round.', 'warn', 7);
    }
  }

  function showRoleCard() {
    const mates = (Object.keys(W.state.roles || {}))
      .filter((id) => id !== session.myId && W.state.roles[id] === 'impostor')
      .map((id) => W.players.get(id))
      .filter(Boolean);
    const def = C.ROLES[W.myRole] || C.ROLES.crewmate;
    /* The sting first, then the card with the detail on it. Two beats: one to
       feel, one to read. */
    NS.cinema.play('reveal', {
      team: def.team, name: def.name, sub: def.blurb,
      colorIdx: W.me ? W.me.colorIdx : 0, hatIdx: W.me ? W.me.hatIdx : 0,
    });
    setTimeout(() => {
      if (W.state.phase === 'reveal' || W.state.phase === 'play') {
        NS.hud.showRole(W.myRole, def.team === 'impostor' ? mates : []);
      }
    }, NS.cinema.calm ? 900 : 2100);
  }

  function applySnapshot(s) {
    const st = W.state;
    st.seq = s.q | 0;
    st.settings = C.sanitise(s.st);
    if (!session.isHost) session.settings = st.settings;
    st.tasksDone = s.td | 0;
    st.tasksTotal = s.tt | 0;

    const seen = Object.create(null);
    for (const row of (s.pl || [])) {
      if (!Array.isArray(row)) continue;
      const id = String(row[0]);
      seen[id] = true;
      let p = W.players.get(id);
      if (!p) {
        p = W.entity(id, { isMe: id === session.myId });
        const spot = M.toWorld(M.SPAWN);
        p.x = p.tx = spot.x; p.y = p.ty = spot.y;
        W.players.set(id, p);
        if (p.isMe) W.me = p;
      }
      if (!p.isMe) {
        p.name = U.cleanName(row[1], C.NAME_MAX) || 'Someone';
        p.colorIdx = U.clamp(row[2] | 0, 0, C.COLORS.length - 1);
        p.hatIdx = U.clamp(row[3] | 0, 0, C.HATS.length - 1);
      } else if (row[1] && row[1] !== p.name) {
        /* The host renames you if somebody already had that name. Better to
           be told once than to spend a meeting being confused for them. */
        const was = p.name;
        p.name = U.cleanName(row[1], C.NAME_MAX) || p.name;
        NS.screens.profile.name = p.name;
        if (was && was !== p.name) {
          NS.bits.toast('Somebody was already called ' + was + '. You are ' + p.name + '.', 'info', 6);
        }
      }
      const flags = row[4] | 0;
      p.alive = !!(flags & 1);
      p.ghost = !!(flags & 2);
      p.bot = !!(flags & 4);
      p.connected = !(flags & 8);
      p.ready = !!(flags & 16);
      p.shielded = !!(flags & 32);
    }
    for (const [id, p] of Array.from(W.players)) {
      if (!seen[id] && !p.isMe) W.players.delete(id);
    }

    W.bodies = (s.bo || []).map((b) => ({
      id: String(b[0]), x: Number(b[1]) || 0, y: Number(b[2]) || 0,
      colorIdx: U.clamp(b[3] | 0, 0, C.COLORS.length - 1),
      hatIdx: U.clamp(b[4] | 0, 0, C.HATS.length - 1),
      facing: b[5] | 0,
    }));

    const invisible = s.iv || [];
    const shifted = new Map((s.sh || []).map((row) => [row[0], row[1]]));
    for (const p of W.players.values()) {
      p.invisible = invisible.indexOf(p.id) >= 0;
      const as = shifted.get(p.id);
      const other = as ? W.players.get(as) : null;
      p.shiftIdx = other ? other.colorIdx : -1;
    }

    st.sabotage = s.sb ? {
      kind: s.sb.k, remaining: Number(s.sb.r) || 0,
      done: s.sb.d || [], holds: s.sb.h || [],
    } : null;

    applyDoors(s.cd || []);
    st.cameras = !!s.cw;

    st.meeting = s.mt ? {
      reason: s.mt.r, by: s.mt.by, bodyId: s.mt.bd, stage: s.mt.s,
      time: Number(s.mt.t) || 0, voted: s.mt.vd || [],
    } : null;
    st.ejected = s.ej || null;
    st.winner = s.wn ? { team: s.wn.tm, reason: s.wn.rs, roles: s.wn.rl || [], log: s.wn.lg || [] } : null;
    if (st.winner) {
      st.roles = st.roles || {};
      for (const row of st.winner.roles) st.roles[row[0]] = row[1];
    }

    const phase = s.ph;
    if (phase !== st.phase) {
      const from = st.phase;
      st.phase = phase;
      onPhase(from, phase);
    }

    /* Arrived in the middle of somebody else's round. Say so once, rather
       than dropping them into a station where every button is greyed out. */
    if (!toldSpectating && !session.isHost && phase !== 'lobby' && phase !== 'end'
        && !W.myRole && W.me && W.me.ghost) {
      toldSpectating = true;
      session.inGame = true;
      NS.screens.hideAll();
      NS.input.setEnabled(true);
      NS.bits.toast('This round had already started, so you are watching it. '
        + 'You will be dealt in when the next one begins.', 'info', 9);
    }
    if (phase === 'lobby') toldSpectating = false;
  }

  function applyDoors(list) {
    const wanted = {};
    for (const id of list) wanted[id] = true;
    const current = W.state.closedRooms || [];
    const at = W.state.doorAt || (W.state.doorAt = {});
    for (const id of current) if (!wanted[id]) { M.sealRoom(id, false); delete at[id]; }
    for (const id of list) {
      if (current.indexOf(id) >= 0) continue;
      M.sealRoom(id, true);
      at[id] = U.now();
    }
    W.state.closedRooms = list.slice();
  }

  function onPhase(from, to) {
    NS.minigames.close(true);
    NS.hud.closeOverlay();

    if (to === 'reveal') {
      session.inGame = true;
      NS.screens.hideAll();
      NS.fx.clear();
      W.placeAtSpawn(Array.from(W.players.keys()));
      NS.render.centreOn(W.me.x, W.me.y, true);
      NS.hud.forceCooldown('kill', W.state.settings.killCooldown + 5);
      NS.hud.forceCooldown('ability', 20);
      NS.hud.forceCooldown('sabotage', 15);
      NS.hud.setEmergencies(W.state.settings.emergencies);
      NS.meeting.clear();
      if (W.myRole) showRoleCard();
      return;
    }
    if (from === 'reveal' && to === 'play') { NS.hud.hideRole(); return; }
    if (to === 'meeting') {
      NS.hud.hideRole();
      NS.hud.hideEject();
      W.placeAtSpawn(Array.from(W.players.keys()));
      NS.render.centreOn(W.me.x, W.me.y, true);
      NS.input.setEnabled(false);
      NS.meeting.show(W.state);
      return;
    }
    if (to === 'eject') {
      NS.meeting.hide();
      NS.input.setEnabled(false);
      const out = W.state.ejected;
      if (out) {
        NS.cinema.play('eject', {
          name: out.name, colorIdx: out.colorIdx, hatIdx: out.hatIdx,
          impostor: out.impostor,
          line: out.id
            ? (out.name + (W.state.settings.confirmEjects
              ? (out.impostor ? ' was an impostor.' : ' was not an impostor.') : ' was ejected.'))
            : (out.tie ? 'The vote tied.' : 'The crew skipped.'),
          sub: out.id && W.state.settings.confirmEjects
            ? (out.remaining === 1 ? '1 impostor remains.' : out.remaining + ' impostors remain.')
            : 'Nobody went out of the airlock.',
        });
        /* The tally panel comes up as the airlock finishes, so the drama and
           the evidence do not fight for the same seconds. */
        setTimeout(() => {
          if (W.state.phase === 'eject') NS.hud.showEject(out);
        }, NS.cinema.calm ? 1200 : 3400);
        NS.bits.announce(out.id
          ? (out.name + ' was ejected'
            + (W.state.settings.confirmEjects ? (out.impostor ? ', and was an impostor.' : ', and was not an impostor.') : '.'))
          : (out.tie ? 'The vote tied. Nobody was ejected.' : 'The crew skipped. Nobody was ejected.'));
      }
      return;
    }
    if (to === 'play') {
      NS.hud.hideEject();
      NS.meeting.hide();
      NS.input.setEnabled(true);
      W.placeAtSpawn(Array.from(W.players.keys()));
      NS.render.centreOn(W.me.x, W.me.y, true);
      if (from === 'eject') NS.hud.setCooldown('kill', 10);
      return;
    }
    if (to === 'end') {
      NS.hud.hideEject();
      NS.meeting.hide();
      NS.input.setEnabled(true);
      session.inGame = false;
      const players = [];
      for (const p of W.players.values()) {
        if (!p.connected) continue;
        players.push({
          name: p.name, colorIdx: p.colorIdx, hatIdx: p.hatIdx,
          alive: p.alive, role: (W.state.roles || {})[p.id] || 'crewmate',
        });
      }
      const result = W.state.winner || { team: 'crew', reason: '' };
      NS.bits.announce((result.team === 'crew' ? 'The crew wins. '
        : result.team === 'impostor' ? 'The impostors win. ' : 'The jester wins. ') + (result.reason || ''));
      NS.screens.showEnd(result, players, session.isHost);
      return;
    }
    if (to === 'lobby') {
      session.inGame = false;
      NS.input.setEnabled(true);
      W.myRole = null;
      W.myTasks = [];
      W.state.roles = {};
      W.bodies = [];
      session.ready = session.isHost;
      showLobby();
    }
  }

  /* ---- events ------------------------------------------------------------ */

  function seen(x, y) {
    if (!W.me) return false;
    if (W.me.ghost) return true;
    return U.dist(W.me.x, W.me.y, x, y) < NS.render.visionRadius() * 1.1
      && NS.los.clear(W.me.x, W.me.y, x, y);
  }

  function onEvent(e) {
    const me = session.myId;
    switch (e.e) {
      case 'kill': {
        const victim = W.players.get(e.target);
        const killer = W.players.get(e.by);
        if (e.by === me) NS.hud.forceCooldown('kill', W.state.settings.killCooldown);
        NS.fx.kill(e.x, e.y);
        NS.fx.feathers(e.x, e.y, victim ? victim.colorIdx : 0);
        if (victim) { victim.alive = false; victim.ghost = true; }

        /* The kill cam runs for the two people it happened to, and for anyone
           who was close enough to watch. Everybody else gets the noise and the
           shake, because a cinematic for an event you did not witness would be
           telling you something you should have had to see. */
        const mine = e.target === me || e.by === me;
        if ((mine || seen(e.x, e.y)) && killer && victim) {
          NS.render.shake(mine ? 16 : 8);
          NS.cinema.play('kill', {
            killerColour: killer.colorIdx, killerHat: killer.hatIdx,
            victimColour: victim.colorIdx, victimHat: victim.hatIdx,
            line: e.target === me ? 'YOU ARE DEAD'
              : e.by === me ? victim.name.toUpperCase() : victim.name.toUpperCase(),
            sub: e.target === me
              ? 'Finish your tasks. Talk to the other ghosts. Nobody living can hear you.'
              : e.by === me ? 'Get out of the room.' : 'You saw the whole thing.',
          });
          if (e.target === me) {
            NS.bits.announce('You were killed. You are a ghost now; you can still finish tasks.');
          }
        } else {
          NS.audio.play('kill');
        }
        break;
      }
      case 'shielded':
        NS.fx.shield(e.x, e.y);
        if (e.target === me) {
          NS.audio.play('shield');
          NS.bits.toast('Something hit your shield. It is gone now.', 'warn', 6);
        } else if (seen(e.x, e.y)) NS.audio.play('shield');
        if (e.by === me) NS.bits.toast('They were shielded.', 'warn', 5);
        break;
      case 'shield':
        if (e.by === me) { NS.hud.setAbilitySpent(true); NS.bits.toast('Shield placed.', 'good'); }
        if (e.target === me) NS.bits.toast('A medic is protecting you.', 'good', 6);
        break;
      case 'shot':
        NS.fx.shot(e.x, e.y);
        if (seen(e.x, e.y)) { NS.audio.play('shoot'); NS.render.shake(6); }
        if (e.by === me) NS.hud.forceCooldown('ability', W.state.settings.killCooldown + 10);
        break;
      case 'vanish': {
        const who = W.players.get(e.by);
        if (who && seen(who.x, who.y)) NS.fx.vanish(who.x, who.y);
        if (e.by === me) {
          if (e.on) { NS.audio.play('vanish'); NS.hud.forceCooldown('ability', 35); }
        }
        break;
      }
      case 'shift':
        if (e.by === me && e.as) { NS.audio.play('shift'); NS.hud.forceCooldown('ability', 30); }
        break;
      case 'vent': {
        const group = M.VENT_GROUPS[e.g];
        const spot = group && group[e.i];
        if (spot) {
          const w = M.toWorld(spot);
          if (seen(w.x, w.y)) {
            NS.fx.vent(w.x, w.y);
            NS.render.ventOpened(w.x, w.y);
            NS.audio.play('vent');
          }
        }
        break;
      }
      case 'meeting': {
        NS.audio.play(e.reason === 'body' ? 'report' : 'alarm');
        NS.render.flash('#3a2a05', 0.5);
        const caller = W.players.get(e.by);
        NS.bits.announce(e.reason === 'body'
          ? ((caller ? caller.name : 'Somebody') + ' reported a body. Meeting.')
          : ((caller ? caller.name : 'Somebody') + ' called an emergency meeting.'));
        break;
      }
      case 'sabotage': {
        const def = NS.sabotage.SABOTAGES[e.k];
        if (def) NS.bits.announce(def.name + '. ' + def.warn);
        NS.audio.play(e.k === 'lights' ? 'lightsOut' : 'sabotage');
        NS.render.shake(def && def.critical ? 10 : 5);
        /* No toast: the banner across the top says this already and stays
           until it is fixed. Two copies of the same sentence is noise. */
        if (e.by === me) NS.hud.forceCooldown('sabotage', 25);
        break;
      }
      case 'doors':
        NS.audio.play('door');
        if (e.by === me) NS.hud.forceCooldown('sabotage', 10);
        break;
      case 'fixed':
        NS.audio.play('fixed');
        NS.bits.toast('Fixed.', 'good');
        break;
      case 'visual': {
        const station = NS.rules.stationById[e.sid];
        if (!station) break;
        const spot = M.toWorld(station.steps ? station.steps[station.steps.length - 1] : station);
        if (!seen(spot.x, spot.y)) break;
        NS.fx.visual(station.kind, spot.x, spot.y);
        NS.fx.say(spot.x, spot.y - 54, station.name, '#34e0b8');
        NS.audio.play('taskDone');
        break;
      }
      case 'voted':
        if (e.by !== me) NS.audio.play('vote');
        break;
      default: break;
    }
  }

  /* Limited on the way in rather than on the way out: the sender is the last
     party that can be trusted to hold back, and one person leaning on a key
     should not be able to push a meeting off everybody's screen. */
  const chatClock = new Map();
  const CHAT_GAP = 700;

  function onChat(from, data) {
    if (!data || typeof data !== 'object' || data.t !== 'msg') return;
    const now = U.now();
    const key = (data && data.as) ? from + ':' + data.as : from;
    if (now - (chatClock.get(key) || 0) < CHAT_GAP) return;
    chatClock.set(key, now);
    const text = U.cleanName(data.text, C.CHAT_MAX);
    if (!text) return;
    /* The host speaks for the bots, so a message may name which one it is
       from. Only the host may do that, and only for an actual bot. */
    let speaker = from;
    if (data.as && from === session.hostId) {
      const claimed = W.players.get(data.as);
      if (claimed && claimed.bot) speaker = data.as;
    }
    const who = W.players.get(speaker);
    if (!who) return;
    const senderDead = !who.alive || who.ghost;
    const iAmDead = W.me && (!W.me.alive || W.me.ghost);
    /* The dead talk among themselves. Filtering here rather than at the
       sender is deliberate: the sender cannot be trusted to leave you out. */
    if (senderDead && !iAmDead) return;
    if (!senderDead && W.state.phase !== 'meeting' && !iAmDead) return;
    NS.meeting.onChat({
      name: who.name, colorIdx: who.colorIdx, ghost: senderDead, text,
    });
    /* Bots notice their own name going past. */
    if (session.isHost && NS.minds && !who.bot) NS.minds.hear(NS.host.H, who.name, text);
  }

  /* ---- two loops, and why ------------------------------------------------ */

  /* Drawing runs on requestAnimationFrame, which is right: it matches the
     screen and stops when nothing is on screen to match.

     The game does NOT run there, and this was found the hard way. A browser
     stops animation frames in a tab that is not visible, so with the whole
     game on that clock the host glancing at another tab froze the round for
     everybody -- and, worse, stopped their presence going out, so after five
     seconds thirteen other devices decided the host had left. In a classroom
     that is not an edge case; it is what happens the first time somebody gets
     a message.

     So anything that has to keep happening -- the authoritative tick, presence,
     hearing other people -- runs on an interval instead. A hidden tab throttles
     that to about once a second rather than stopping it, which is slow but
     alive, and it catches up the moment the tab is looked at again. */

  let lastBeat = U.now();
  let lastFrame = U.now();

  function beat() {
    const now = U.now();
    const dt = Math.min(1.5, (now - lastBeat) / 1000);
    lastBeat = now;

    syncPeers();
    tryPendingRole();

    clashCheck -= dt;
    if (clashCheck <= 0) { clashCheck = 1.2; avoidColourClash(); }

    /* The lobby is redrawn on a timer rather than only when somebody joins.
       Whether the round can start depends on colours that resolve themselves a
       second after everybody has arrived, and a start button left disabled by
       a state that has since cleared is the worst kind of bug: the game looks
       broken and there is nothing to click to find out why. */
    lobbyTick -= dt;
    if (lobbyTick <= 0) { lobbyTick = 0.25; refreshLobby(); }

    watchHost();
    roomTone();

    /* A host puts its lobby on the shared list while it is waiting. The link
       throttles this; calling it every beat is how it stays current when
       somebody joins or leaves. */
    if (session.isHost && session.link && W.state.phase === 'lobby' && session.mode !== 'solo') {
      session.link.announce({
        host: NS.screens.profile.name,
        players: NS.host.list().filter((id) => NS.host.H.players[id].connected).length,
      });
    }

    publishPresence();
    if (session.isHost) NS.host.tick(dt);

    /* Countdowns run locally between snapshots. The host still owns them --
       the next snapshot corrects any drift -- but a timer that only moved
       twice a second would look broken. */
    const st = W.state;
    if (st.meeting && st.meeting.time > 0) st.meeting.time = Math.max(0, st.meeting.time - dt);
    if (st.sabotage && st.sabotage.remaining > 0) {
      const def = NS.sabotage.SABOTAGES[st.sabotage.kind];
      if (def && def.critical) st.sabotage.remaining = Math.max(0, st.sabotage.remaining - dt);
    }
  }

  function frame() {
    const now = U.now();
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    const input = NS.input.read();
    if (NS.cinema.active()) { input.x = 0; input.y = 0; }
    W.step(dt, input);
    NS.fx.step(dt);

    if (session.inGame && W.me) {
      NS.render.follow(W.me, dt);
      NS.render.drawScene(now, dt);
    }
    if (NS.cinema.active()) {
      NS.render.drawOverlay((ctx, w, h) => NS.cinema.draw(ctx, w, h, dt));
    }
    NS.hud.update(dt);
    NS.meeting.update();

    requestAnimationFrame(frame);
  }

  function syncPeers() {
    if (!session.link) return;
    const peers = session.link.peers();
    for (const peer of peers) {
      const presence = peer.presence || {};
      if (peer.isMe) {
        if (peer.id && peer.id !== session.myId) rekeyMe(peer.id);
        if (session.isHost) {
          NS.host.addPlayer(peer.id, {
            n: NS.screens.profile.name, c: NS.screens.profile.colorIdx,
            h: NS.screens.profile.hatIdx, k: NS.secrets.publicKey,
          });
        }
        continue;
      }
      if (presence.H) {
        session.hostId = peer.id;
        W.hostKey = presence.k || W.hostKey;
        if (presence.B) W.adoptBots(presence.B);
      }
      W.adopt(peer.id, presence, false);
      const p = W.players.get(peer.id);
      if (p) p.ready = !!presence.R;
      if (session.isHost) {
        NS.host.addPlayer(peer.id, { n: presence.n, c: presence.c, h: presence.h, k: presence.k });
      }
    }
    if (session.isHost) {
      const here = Object.create(null);
      for (const peer of peers) here[peer.id] = true;
      for (const id of NS.host.list()) {
        if (here[id] || NS.host.H.players[id].bot) continue;
        NS.host.dropPlayer(id);
      }
    }
    if (session.myId && session.hostId === session.myId) W.hostKey = NS.secrets.publicKey;
  }

  /* Snapshots key every player by the id the transport gave them, so if this
     device's id ever changes the local entity has to move with it -- otherwise
     the next snapshot creates a second copy of you and the one you are walking
     around in belongs to nobody. */
  function rekeyMe(id) {
    const old = session.myId;
    session.myId = id;
    if (!W.me) return;
    if (old) W.players.delete(old);
    W.me.id = id;
    W.players.set(id, W.me);
    if (session.isHost) {
      session.hostId = id;
      if (old && NS.host.H.players[old]) delete NS.host.H.players[old];
    }
  }

  /* The station's own sound, set from what is happening rather than from a
     playlist. Changed only when the mood changes -- retargeting an oscillator
     sixteen times a second is audible as a stutter. */
  let mood = '';
  function roomTone() {
    if (!NS.audio.unlocked) return;
    const st = W.state;
    let next = 'station';
    if (!session.link) next = 'off';
    else if (st.phase === 'meeting' || st.phase === 'eject' || st.phase === 'end') next = 'off';
    else if (st.sabotage && st.sabotage.kind === 'lights') next = 'dark';
    else if (st.sabotage && NS.sabotage.SABOTAGES[st.sabotage.kind].critical) next = 'alarm';
    if (next === mood) return;
    mood = next;
    NS.audio.ambience(next);
  }

  function publishPresence() {
    if (!session.link || !W.me) return;
    const patch = W.encode(W.me);
    if (NS.secrets.publicKey) patch.k = NS.secrets.publicKey;
    patch.R = session.ready ? 1 : 0;
    if (session.isHost) {
      patch.H = 1;
      const bots = NS.bots.entities();
      if (bots.length) patch.B = W.encodeBots(bots);
    }
    session.link.presence(patch);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  NS.session = session;
})(window.NS);

</script>
