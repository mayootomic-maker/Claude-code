name: Build Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      make_release:
        description: "Attach the build to a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[full,dev]"
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Download voice models for the integration tests
        run: |
          python -m ravc voices --install ru_RU-dmitri-medium de_DE-thorsten-medium

      - name: Run integration tests against the real voice models
        shell: pwsh
        run: |
          # LOCALAPPDATA has to be read from the runner's environment here.
          # As ${{ env.LOCALAPPDATA }} it resolves to the *workflow* env,
          # which is empty, and the tests then silently skipped.
          $env:RAVC_TEST_MODELS_DIR = "$env:LOCALAPPDATA\AccentVoiceChanger\voices"
          Write-Host "Voice models in: $env:RAVC_TEST_MODELS_DIR"
          Get-ChildItem $env:RAVC_TEST_MODELS_DIR
          $env:RAVC_REQUIRE_MODELS = "1"
          python -m pytest tests/test_integration.py -q -rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The 1.1.0 Windows crash got through because the window had only
      # ever been opened under Xvfb on Linux. Open it on Windows.
      - name: Smoke-test the window on Windows
        env:
          RAVC_CONFIG_DIR: ${{ runner.temp }}\ravc-config
          RAVC_LOG_DIR: ${{ runner.temp }}\ravc-logs
        run: python packaging/gui_smoke.py

      - name: Regenerate the icon
        run: python assets/make_icon.py

      - name: Read the version
        id: version
        shell: bash
        run: |
          v=$(python -c "import sys; sys.path.insert(0,'src'); import ravc; print(ravc.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/ravc.spec

      - name: Smoke-test the built executable
        shell: bash
        run: |
          set -euo pipefail
          ./dist/AccentVoiceChanger/ravc.exe --version
          ./dist/AccentVoiceChanger/ravc.exe say --dry-run -l ru "packaging works"
          ./dist/AccentVoiceChanger/ravc.exe say --dry-run -l de "packaging works"
          ./dist/AccentVoiceChanger/ravc.exe presets
          ./dist/AccentVoiceChanger/ravc.exe say --dry-run -c "CS:GO teammate" "comms check"

      - name: Create the portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/AccentVoiceChanger/*" `
            -DestinationPath "dist/AccentVoiceChanger-${{ steps.version.outputs.version }}-portable-win64.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          # Note the braces: $env:ProgramFiles(x86) parses as $env:ProgramFiles
          # followed by the literal "(x86)", which resolves to a path that does
          # not exist. ${env:ProgramFiles(x86)} is the whole variable name.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw "ISCC.exe not found. Tried: $($candidates -join '; ')" }
          Write-Host "Using $iscc"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: List artifacts
        shell: bash
        run: ls -lh dist/*.exe dist/*.zip

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: AccentVoiceChanger-Setup-${{ steps.version.outputs.version }}
          path: dist/AccentVoiceChanger-Setup-*.exe
          if-no-files-found: error

      - name: Upload the portable build
        uses: actions/upload-artifact@v4
        with:
          name: AccentVoiceChanger-portable-${{ steps.version.outputs.version }}
          path: dist/*-portable-win64.zip
          if-no-files-found: error

      # The session that builds this cannot push tags, so a release is asked
      # for with a "[release]" marker in the commit message instead; the
      # action's own token creates the tag.
      - name: Attach to a release
        if: >
          startsWith(github.ref, 'refs/tags/v') || inputs.make_release
          || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Accent Voice Changer ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/AccentVoiceChanger-Setup-*.exe
            dist/*-portable-win64.zip
          body: |
            **Accent Voice Changer ${{ steps.version.outputs.version }}** — speak English with a Russian or German accent.

            - `AccentVoiceChanger-Setup-*.exe` — Windows installer (recommended)
            - `*-portable-win64.zip` — unzip and run, no installation

            After installing, open the app and download one voice model from
            the **Models** tab. To be heard in Discord, Zoom, OBS or a game,
            also install the free [VB-CABLE](https://vb-audio.com/Cable/).
