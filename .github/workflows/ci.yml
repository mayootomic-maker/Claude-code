name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: App — typecheck, tests, bundle budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The budget is only real if something fails when it is breached.
      - run: npm run budget

  worker:
    name: Worker — typecheck and OJP parser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No lockfile is committed for the worker, so this is an install rather
      # than a clean install.
      - run: npm install
      - run: npm run typecheck
      # Runs against responses captured from the live OJP API; no key needed.
      - run: npm test

  e2e:
    name: End-to-end in a real browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Built against the local fixture server: it can force cancellations and
      # missing realtime, which live data cannot be made to produce on demand.
      - run: npm run build:e2e
      - run: node e2e/stub-server.mjs &
      - run: node e2e/drive.mjs
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/e2e/shots/
          retention-days: 7
