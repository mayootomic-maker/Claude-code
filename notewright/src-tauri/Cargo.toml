[package]
name = "notewright"
version = "0.1.0"
description = "A trap beat maker whose songs are plain text"
authors = ["Notewright contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "notewright_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
