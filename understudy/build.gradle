plugins {
    // Loom publishes three plugin ids and they are not interchangeable.
    // 'fabric-loom' is the legacy one (LoomGradlePlugin), which always takes the
    // obfuscated path and so demands a mappings dependency; that is what failed
    // here with "Configuration 'mappings' has no dependencies".
    // 'net.fabricmc.fabric-loom' is LoomNoRemapGradlePlugin, which sets
    // disableObfuscation and skips mapping setup entirely — correct for 26.x,
    // and what Fabric's own 26.2 example mod uses.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings declaration, deliberately. Minecraft 26.x ships unobfuscated:
    // Mojang's manifest carries no client_mappings for 26.1 through 26.2, Fabric's
    // intermediary for 26.2 is the 0.0.0 placeholder, and Yarn has zero 26.x
    // entries. There is nothing left to map, so asking loom for any mapping set
    // fails outright. Fabric's own example mod for 26.2 declares none either.
    // Plain implementation, not modImplementation. Loom only creates the
    // remap configurations when obfuscation is on (LoomConfigurations guards
    // createRemapConfigurations behind it), and there is nothing to remap when
    // the game ships under its real names.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency', project.minecraft_dependency
    filesMatching('fabric.mod.json') {
        // The declared game dependency comes from gradle.properties, so the jar
        // can never claim compatibility with a version it was not built against
        // — which is exactly the failure that made this mod refuse to load.
        expand 'version': project.version,
               'minecraft_dependency': project.minecraft_dependency
    }
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 26.2 runs on Java 25 and loom refuses to set up the game with
    // anything older, so the mod is compiled to match rather than to the 21
    // this was originally written against.
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}

// The compile classpath is the thing that decides whether a Fabric API class
// resolves, and a "cannot find symbol" says nothing about why it was absent.
// The failure diagnostic in CI reads this.
tasks.register('printCompileClasspath') {
    def cp = configurations.named('compileClasspath')
    doLast { cp.get().files.collect { it.name }.sort().each { println it } }
}
