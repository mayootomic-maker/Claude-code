# Pinned after asking Fabric's own metadata service what exists, rather than
# guessing — see the "versions" step in the workflow, which prints the current
# answers on every build so a stale pin is visible instead of mysterious.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft moved to a year-based version scheme; 26.2 is a real version and
# 1.21.4 is a year behind it. The workflow resolves the matching yarn,
# fabric-api and loom for whatever is set here and prints what it chose, so a
# version bump is one line rather than four guesses.
minecraft_version=26.2
minecraft_dependency=>=26.2 <27
loader_version=RESOLVED_BY_CI
fabric_version=RESOLVED_BY_CI
loom_version=RESOLVED_BY_CI

mod_version=0.1.0
maven_group=dev.understudy
archives_base_name=understudy
